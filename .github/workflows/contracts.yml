name: contracts

on:
  push:
    paths: ["src/**", "cli/**", "install/**", "tests/**", "tools/**", "pyproject.toml", "uv.lock", ".python-version", ".github/workflows/contracts.yml",
            "plugins/**", "dist/**", ".claude-plugin/**", ".agents/**", "package.json", "INSTALLATION.md", "LICENSE*", "NOTICE"]
  pull_request:
    paths: ["src/**", "cli/**", "install/**", "tests/**", "tools/**", "pyproject.toml", "uv.lock", ".python-version", ".github/workflows/contracts.yml",
            "plugins/**", "dist/**", ".claude-plugin/**", ".agents/**", "package.json", "INSTALLATION.md", "LICENSE*", "NOTICE"]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # Python comes from .python-version
      - name: Install the CLI and test dependencies from the lock
        run: uv sync --locked
      - name: Contracts, plan and rights checks, derived values
        run: uv run pytest -q -m "not browser and not cjk"
      - name: Generated outputs match src/ and install/harnesses.yaml
        run: uv run python tools/build/build.py --check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install the CLI and test dependencies from the lock
        run: uv sync --locked
      - name: Install Chromium headless shell
        run: uv run playwright install --with-deps chromium-headless-shell
      - name: Render and behavior checks in Chromium
        run: uv run pytest -q -m browser -n auto

  cjk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install optional CJK analyzers from the lock
        run: uv sync --locked --extra cjk
      - name: CJK morphological checks
        run: uv run --no-sync pytest -q -m cjk
