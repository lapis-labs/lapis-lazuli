name: contracts

on:
  push:
    paths: ["src/**", "cli/**", "install/**", "tests/**", "tools/**", "pyproject.toml", "uv.lock", ".python-version", ".github/workflows/contracts.yml",
            "plugins/**", "dist/**", ".claude-plugin/**", ".agents/**", "package.json", "INSTALLATION.md", "LICENSE*", "NOTICE"]
  pull_request:
    paths: ["src/**", "cli/**", "install/**", "tests/**", "tools/**", "pyproject.toml", "uv.lock", ".python-version", ".github/workflows/contracts.yml",
            "plugins/**", "dist/**", ".claude-plugin/**", ".agents/**", "package.json", "INSTALLATION.md", "LICENSE*", "NOTICE"]

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check; tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0; Python comes from .python-version
      - name: Install the CLI and test dependencies from the lock
        run: uv sync --locked
      - name: Contracts, plan and rights checks, derived values
        run: uv run pytest -q -m "not browser and not cjk" -n auto
      - name: Generated outputs match src/ and install/harnesses.yaml
        run: uv run python tools/build/build.py --check

  browser:
    # Four runners, each with its fixed part of the browser tests (--shard, tests/conftest.py).
    name: browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
      - name: Install the CLI and test dependencies from the lock
        run: uv sync --locked
      - name: Install Chromium headless shell
        run: uv run playwright install --with-deps chromium-headless-shell
      - name: Render and behavior checks in Chromium
        run: uv run pytest -q -m browser -n auto --shard ${{ matrix.shard }}/4

  cjk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
      - name: Install optional CJK analyzers from the lock
        run: uv sync --locked --extra cjk
      # Everything but the browser tests, with the analyzers installed (the browser part sets the run time
      # of the browser job, and does not grow here).
      - name: Non-browser tests with the CJK analyzers
        run: uv run --no-sync pytest -q -m "not browser" -n auto
