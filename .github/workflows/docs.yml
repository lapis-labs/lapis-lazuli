name: docs

# Documents changed on their own. The contracts workflow's path filter leaves most of them out on
# purpose (its jobs render fixtures in Chromium), so this one runs only the text checks: no browsers,
# no extras.
on:
  push:
    paths: ["README*.md", "CHANGELOG.md", "SECURITY.md", "AGENTS.md", "NOTICE", "LICENSE*", "INSTALLATION.md",
            ".github/workflows/docs.yml"]
  pull_request:
    paths: ["README*.md", "CHANGELOG.md", "SECURITY.md", "AGENTS.md", "NOTICE", "LICENSE*", "INSTALLATION.md",
            ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # Python comes from .python-version
      - name: Install the CLI and test dependencies from the lock
        run: uv sync --locked
      - name: Links resolve, and the READMEs show the harness status from install/harnesses.yaml
        run: uv run --no-sync pytest -q tests/test_docs_links.py tests/test_harness_status_docs.py
      - name: INSTALLATION.md and the license copies match the sources
        run: uv run --no-sync python tools/build/build.py --check
