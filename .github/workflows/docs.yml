name: docs

# Documents changed on their own. The contracts workflow's path filter leaves most of them out on
# purpose (its jobs render fixtures in Chromium), so this one runs only the text checks: no browsers,
# no extras.
on:
  push:
    paths: ["README*.md", "CHANGELOG.md", "SECURITY.md", "AGENTS.md", "NOTICE", "LICENSE*", "INSTALLATION.md",
            "docs/**", "install/OUTPUTS.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["README*.md", "CHANGELOG.md", "SECURITY.md", "AGENTS.md", "NOTICE", "LICENSE*", "INSTALLATION.md",
            "docs/**", "install/OUTPUTS.md", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0; Python comes from .python-version
      - name: Install the CLI and test dependencies from the lock
        run: uv sync --locked
      - name: Links resolve, the READMEs show the harness status and the current plan check output, and eval wording states methods only
        run: uv run --no-sync pytest -q tests/test_docs_links.py tests/test_harness_status_docs.py tests/test_readme_front.py tests/test_eval_wording.py
      - name: INSTALLATION.md and the license copies match the sources
        run: uv run --no-sync python tools/build/build.py --check
