# Pre-show review record, independent of the release gate. Written by the maker; its evidence is the CLI's and the critic's.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/lapis-labs/lapis-lazuli/schemas/draft.v1.json
title: LapisLazuli draft presentation and review
# v1 holds only what `draft check` can verify against files: the shown page, its captures and lint report, the
# maker's disposition of each finding, scoped behavior evidence, and the critic's report. It carries no summary,
# walkthrough, claim map, or critic attestation: the critic's walkthroughs, requirement states, and facts come from
# its report (`slop/finding.schema.yaml`), built on `lapis-design critic packet`, and the owner block is the summary.
type: object
additionalProperties: false
required: [version, task, pages]
properties:
  version: {const: 1}
  task: {type: string, pattern: '^[a-z0-9][a-z0-9-]+$'}
  pages:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [url, render_task, sources, direction, area, widths, behavior_changed]
      properties:
        url: {type: string, minLength: 3}
        render_task: {type: string, minLength: 2}
        sources: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        direction: {enum: [new, iteration]}
        area: {type: string, minLength: 3}
        widths: {type: array, minItems: 1, uniqueItems: true, items: {enum: [320, 390, 768, 1440]}}
        behavior_changed: {type: boolean}
        review:
          type: object
          additionalProperties: false
          required: [extracts, lint, handled]
          properties:
            extracts: {type: array, minItems: 1, items: {type: string}}
            lint: {type: string, minLength: 1}
            behavior:
              type: object
              required: [refs, observed]
              properties:
                refs: {type: array, minItems: 1, items: {type: string}}
                observed: {type: string, minLength: 8}
            critic:                                    # required for a new direction; its report names the packet it judged
              type: object
              additionalProperties: false
              required: [report]
              properties:
                report: {type: string, minLength: 1}
            handled:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [report, finding, disposition, reason, refs]
                properties:
                  report: {type: string}
                  finding: {type: integer, minimum: 0}
                  disposition: {enum: [fixed, justified-keep, unresolved]}
                  reason: {type: string, minLength: 8}   # for the owner; the critic never sees it
                  refs: {type: array, minItems: 1, items: {type: string}}
