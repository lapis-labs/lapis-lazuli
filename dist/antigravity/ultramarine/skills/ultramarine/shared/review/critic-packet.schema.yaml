# Critic packet: the fixed inputs one critic report is judged against; written by `lapis-design critic packet`, never by hand.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/lapis-labs/lapis-lazuli/schemas/critic-packet.v0.json
title: LapisLazuli critic packet
# `.lapis/critic/<task>.packet.json` (or the `--out` path under `.lapis/critic/`), deterministic JSON: sorted keys,
# no timestamps, no maker reasons. A critic report counts only for the packet whose bytes hash to its
# `target.packet.sha256`; `lapis-design critic packet` rebuilds the packet from `args` and the project to check that.
type: object
additionalProperties: false
required: [version, task, args, requirements, plan, direction, inputs, findings, changes, disputes]
properties:
  version: { const: 0 }
  task: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,63}$" }
  args:                                            # what the packet was built from, as project-relative paths
    type: object
    additionalProperties: false
    required: [extracts, lint]
    properties:
      extracts: { type: array, minItems: 1, items: { type: string, minLength: 1 } }   # render extracts, in the order given
      lint: { type: string, minLength: 1 }         # the lint report
      session: { type: string, minLength: 1 }      # the behavior session, when one was given
  requirements:                                    # the owner's rows, as the CLI copied them (requirements/schema.yaml)
    type: object
    additionalProperties: false
    required: [sha256, rows, owner_decisions]
    properties:
      sha256: { oneOf: [{ $ref: "#/$defs/digest" }, { type: "null" }] }   # of `rows` and `owner_decisions` as listed here; null with no record
      rows:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, text]
          properties:
            id: { $ref: "#/$defs/row_id" }
            section: { type: string }
            text: { type: string, minLength: 1 }
      owner_decisions:                             # an owner's `drop` or `narrow` of a row, with the owner's words
        type: array
        items:
          type: object
          additionalProperties: false
          required: [row, decision, quote]
          properties:
            row: { $ref: "#/$defs/row_id" }
            decision: { enum: [drop, narrow] }
            quote: { type: string }
  plan:                                            # the plan's design fields; no maker reason, evidence, or concept
    type: object
    additionalProperties: false
    properties:
      brief: { type: object }
      world_materials: { type: array, items: { type: string } }
      layout:
        type: object
        additionalProperties: false
        properties:
          phone_task: { type: object }
          sections: { type: array, items: { type: object } }
          signature: { type: string }
          procedure:
            type: object
            additionalProperties: false
            properties:
              priority: { type: array, items: { type: string } }
      tokens:
        type: object
        additionalProperties: false
        properties:
          type:
            type: object
            additionalProperties: false
            properties:
              roles: { type: array }
              scale: { type: object }                  # base_px and ratio, the steps a font-size dispute is judged against
          color: { type: object, additionalProperties: false, properties: { roles: { type: array } } }
          space:                                       # the steps a spacing dispute is judged against
            type: object
            additionalProperties: false
            properties:
              base_px: { type: number }
              scale: { type: array, items: { type: number } }
          shape:                                       # the radius steps a radius dispute is judged against; the maker's `rule` and each contour's `reason` stay out
            type: object
            additionalProperties: false
            properties:
              radius: { type: object }
              media_contours: { type: array, items: { type: object } }
      content:
        type: object
        additionalProperties: false
        properties:
          voice: { type: object }
          key_copy: { type: array, items: { type: object } }
      flows:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, kind, goal, start, done]
          properties:
            id: { type: string }
            kind: { type: string }
            goal: { type: string }
            start: { type: string }
            done: { type: object }
      references:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [source, kind, take, leave]
          properties:
            source: { type: string }
            kind: { type: string }
            take: { type: array, items: { type: string } }
            leave: { type: array, items: { type: string } }
            profile: { type: string }
      explorations:                                # without `runner_up_lost` and `reason`
        type: array
        items:
          type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision: { type: string }
            covers: { type: array, items: { type: string } }
            candidates:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, source]
                properties:
                  name: { type: string }
                  source: { type: string }
                  artifact: { type: string }
            compared_on: { type: array, items: { type: string } }
            comparisons: { type: array, items: { type: object } }
            chosen: { type: string }
            fixed_by: { type: string }
      defaults:                                    # a keep as the plan names it, with the rule's own case text instead of the maker's reason
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, decision]
          properties:
            id: { type: string }
            decision: { enum: [keep, reject] }
            keep_when: { type: string }
            case_when: { type: string }            # `when` of that `keep_when` case in slop/rules.yaml
  direction:                                       # the direction conversation resolved for the critic: ids, option texts, who chose, the pick; no maker reason
    type: object
    additionalProperties: false
    required: [items, pick, contact]
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, label, state, by, choice, options]
          properties:
            id: { type: string }                   # S1, K2, O1, G1, or C2.G1
            label: { type: string }
            state: { enum: [open, narrowed, decided, delegated] }
            by: { enum: [owner, assumed, null] }
            choice: { type: [array, "null"], items: { type: string } }   # option ids, keep, drop, all, other
            options:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
                  does: { type: string }
      pick:
        type: [object, "null"]
        additionalProperties: false
        required: [candidate, by, card, captures]
        properties:
          candidate: { type: string }
          by: { enum: [owner, assumed] }
          card: { type: object }                   # the picked rough's card.yaml (diverge/card.schema.yaml)
          captures: { type: array, items: { type: string } }   # project-relative screenshots of the picked rough
      contact: { type: [string, "null"] }          # the contact sheet of the sealed roughs
  inputs:                                          # every file the critic may read, with its digest; nothing else is an input
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, path, sha256]
      properties:
        kind:
          enum: [extract, screenshot, lint, session, requirement-source, product, design, context, taste,
                 references-record, reference-capture, reference-profile, exploration, direction-contact,
                 direction-capture]
        path: { type: string, minLength: 1 }       # relative to the project root, with `/`
        sha256: { $ref: "#/$defs/digest" }
  findings:                                        # the lint report's findings by index, without their `fix` text or waivers
    type: array
    items:
      type: object
      additionalProperties: false
      required: [index, rule_id, layer, observed, status]
      properties:
        index: { type: integer, minimum: 0 }
        rule_id: { type: string }
        layer: { type: string }
        observed: { type: string }
        location: { type: object }
        status: { type: string }
  changes:                                         # change-log rows (integrity/schema.yaml) that were reactive, touched an open finding, or came after the slice
    type: array
    items:
      type: object
      additionalProperties: false
      required: [seq, kind, pointer, before, after, related_open, reactive, after_slice]
      properties:
        seq: { type: integer, minimum: 0 }
        kind: { type: string }
        pointer: { type: string }
        before: {}                                 # without any `reason`, `evidence`, or `runner_up_lost` key
        after: {}
        related_open: { type: array, items: { type: string } }
        reactive: { type: boolean }
        after_slice: { type: boolean }
  disputes:                                        # `.lapis/disputes/<task>.yaml` (review/disputes.schema.yaml) without the maker's reason and refs
    type: array
    items:
      type: object
      additionalProperties: false
      required: [index, report, rule_id, observed]
      properties:
        index: { type: integer, minimum: 0 }
        report: { type: string }
        rule_id: { type: string }
        location: { type: object }
        observed: { type: string }
$defs:
  digest: { type: string, pattern: "^[0-9a-f]{64}$" }
  row_id: { type: string, pattern: "^R[0-9a-f]{6,8}$" }
