# LapisLazuli diverge brief schema — v0
# Location: .lapis/diverge/<task>/brief.yaml. The one brief every rough worker receives. The maker writes it once, after
# `diverge start` and before any rough is made: it states the opening's job, what each core object does there and later, and
# which contradictions in the instructions (the brief record, the direction answers, this task's own wording) it resolved,
# so that no worker has to resolve them again on its own and no two roughs inherit the same hidden contradiction.
# `lapis-design diverge contract` checks it once, before the roughs fan out, and prints the `brief_sha256` each card names;
# `diverge check` reads the cards against it. The contract is the one place the hierarchy, the copy, and the phone are
# decided for every rough: the opening carries identity and the primary action (the hero), the process the page is about
# comes in a later scene, `key_copy` is the one headline and action every rough opens with and is read by the meta-text rule
# (`copy.meta-text`), and `phone` says how the 390 first view is composed on its own. Provenance (real, illustrative, synthetic) is named once, where
# it informs an example (`labels`), never as a tag repeated on each element of the page.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/lapis-labs/lapis-lazuli/schemas/diverge-brief.v0.json
title: LapisLazuli diverge brief
type: object
additionalProperties: false
required: [version, opening, objects, key_copy, phone, resolved]
properties:
  version: {const: 0}
  opening:
    type: object
    additionalProperties: false
    required: [job, carries]
    properties:
      job: {type: string, minLength: 20}                 # what the first view is for, in a sentence
      carries:
        type: array
        minItems: 2
        uniqueItems: true
        items: {enum: [identity, claim, decisive-object, primary-action]}
  objects:                                               # one row per core object of the direction conversation
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, first_view, later]
      properties:
        id: {type: string, pattern: "^O[1-4]$"}
        first_view: {enum: [required, allowed, later]}   # every rough shows it / the hierarchy draw decides / no rough does
        later: {type: string, minLength: 12}             # the role and scene it has after the first view
        demanded_by: {type: string, pattern: "^[A-Z][1-9][0-9]*$"}   # the owner's answer (item id) that requires it in the first view
  key_copy:                                              # the copy every rough opens with; the shape of the plan's `content.key_copy`
    type: array
    minItems: 2
    items:
      type: object
      additionalProperties: false
      required: [slot, text]
      properties:
        slot: {enum: [headline, subhead, cta, nav, empty-state, error, other]}   # `headline` and `cta` are required: the identity and the primary action
        text: {type: string, minLength: 1}                # written in the target locale, as the visitor reads it
        locale: {type: string}
  phone:                                                 # the 390 first view is its own composition, not the desktop one stacked
    type: object
    additionalProperties: false
    required: [composition]
    properties:
      composition: {type: string, minLength: 20}         # what the phone opening holds and what it trims or moves after the content it supports
  resolved:                                              # contradictions found in the instructions and how this brief settles each; may be empty
    type: array
    items:
      type: object
      additionalProperties: false
      required: [conflict, as]
      properties:
        conflict: {type: string, minLength: 12}
        as: {type: string, minLength: 12}
  labels: {type: string, minLength: 12}              # where a real / illustrative / synthetic distinction informs an example, said once
