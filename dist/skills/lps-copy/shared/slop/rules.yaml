# LapisLazuli rules — v0 (names-and-alternatives view)
# Generated by tools/build/build.py from src/shared/slop/rules.yaml; edit the source, not this file.
version: 0
as_of: 2026-09
rules:
- id: system.font-outside-contract
  why: A font family outside the design contract gives one region an unrelated typographic voice
  better: Use the contract family for that role, or record a proposed design change with the reason
  keep_when:
  - id: proposed-change
    when: the change is recorded as a proposed design change
    evidence:
    - plan: proposed_design_changes
      present: true
- id: system.literal-color
  why: Literal colors outside semantic tokens drift into near-duplicate grays and accents
  better: Use the semantic token for the role, or add a token when the value repeats with a real role
  keep_when:
  - id: content-color
    when: data or content colors that come from the content itself, such as a product swatch
    evidence:
    - plan: tokens.color.roles[*].role
      has:
      - data
      - content
- id: system.off-scale-value
  why: One-off radius, size, or spacing values make equivalent components drift without a role or optical
    reason; authored media contours are not repeated control radii
  better: Use the component scale for the same role and condition; keep deliberate media contours in separate
    --media-contour-* tokens with their slot and reason, never enlarge the control scale to absorb them
  keep_when:
  - id: optical-correction
    when: a documented optical correction, such as balancing an icon inside a round button
    evidence: none
- id: system.bypassed-primitive
  why: A component that bypasses the adopted primitives or theme API behaves and styles its states differently
    from its peers
  better: Build on the adopted primitive and theme API; extend the primitive when it lacks a needed state
  keep_when:
  - id: recorded-primitive-gap
    when: the primitive cannot express a documented requirement and the gap is recorded
    evidence: none
- id: plan.uncompared-decision
  why: A decision made without a second candidate is the first answer that came to mind, and for most
    pages that is the default for that kind of page
  better: Record each open decision with candidates, sources, matched observations, the chosen one and
    why the runner-up lost; type covers the actual role and script; rendered layout and direction record
    implemented artifacts and captures that change grouping or boundaries rather than only order; motion
    records both implementations and playback of the same interaction; palette records artifacts and roles
    or token_file with matched captures; fixed_by preserves decisions the brief or contract truly fixes
- id: type.serif-luxury-display
  why: A high-contrast or italic serif display stands in for premium without any tie to the subject
  better: Choose display type from the product's material, voice, and content; compare a subject-earned
    serif, sans, and mixed route
  keep_when:
  - id: specified-face
    when: the brand or contract specifies the face
    evidence:
    - design
    - brief
  - id: editorial-reading
    when: publishing or editorial subjects where the reading sequence earns it
    evidence:
    - brief
    - plan: brief.product_frame
      has:
      - content-editorial-docs
    - plan: direction.read.surface_mode
      has:
      - read
- id: type.headline-emphasis-formula
  why: A headline that sets its closing phrase in italic or in a second typeface - a line, a break, then
    the emphasized phrase - is the formula that generated pages share, so the emphasis comes from the
    type switch and not from the words
  better: Write one headline whose words carry the emphasis and set it in one voice; change type inside
    a heading only for a phrase the reader should hear differently, such as a title, a quotation, or a
    term
  keep_when:
  - id: term-or-title-in-heading
    when: the set-apart phrase is a title, a quotation, a foreign term, or a name that is set that way
      wherever it appears
    evidence: none
  - id: publication-headline-style
    when: the publication's own headline style sets this device and the design contract or the brief names
      it
    evidence:
    - design
    - brief
- id: type.eyebrow-kicker
  why: A plain label above the first-view headline delays its proposition even once; repeated tracked
    labels or index markers also impose a section cadence without adding information
  better: Remove the label unless it adds category, scope, dates, or authoritative state absent from the
    heading; let the title carry the proposition
  keep_when:
  - id: real-category
    when: the label adds a real category or scope absent from the heading, such as an exhibition type
      and dates, rather than a topic echo or slogan
    evidence: none
  - id: ordered-process
    when: the marker numbers a real ordered process
    evidence: none
  - id: current-state
    when: the label adds authoritative live or current state absent from the heading
    evidence: none
- id: type.heading-badge
  why: A badge chip or status strip above a headline delays the message and can imply a state that does
    not exist
  better: Keep a real current status beside the object it describes; otherwise omit it
  keep_when:
  - id: current-state
    when: the badge reflects authoritative current state
    evidence: none
  - id: filter-or-state-chip
    when: the chip filters content or identifies authoritative current state
    evidence: none
  - id: real-category
    when: the chip adds a real category, scope, or dates absent from the heading
    evidence: none
- id: type.icon-tile-heading
  why: Every section opens with the same stacked icon tile, heading, and paragraph, so the icon only duplicates
    the label
  better: Use icons for recognition or actions; let content differences shape each section
  keep_when:
  - id: recognition-icon
    when: icons that users need to recognize a category or action
    evidence: none
- id: type.oversized-icon-tile
  why: Each item of a group opens with an icon in a tile set larger than the heading beside it, so the
    decoration outweighs the point it introduces and every point looks alike
  better: Set the icon at the text's scale beside the heading, or drop it; keep an icon where readers
    need it to recognize a category or an action, and let the heading and the content carry the rank
  keep_when:
  - id: icon-is-the-content
    when: the icons are what the group shows, such as a symbol set offered for choice or a legend
    evidence: none
- id: type.oversized-display
  why: Headline scale grows past the content and viewport need, crowding the task or wrapping awkwardly
  better: Balance title, evidence, and action for the surface; do not force every opening into one viewport
  keep_when:
  - id: title-is-content
    when: an immersive or campaign opening where the title is the content
    evidence:
    - brief
    - plan: direction.read.surface_mode
      has:
      - experience
- id: type.negative-tracking
  why: Tracking tighter than the face tolerates makes letterforms collide and word shapes collapse
  better: Respect the face's spacing; tighten only display sizes where the letterforms survive
  keep_when:
  - id: tight-display-face
    when: a display face designed for tight setting at that size
    evidence: none
- id: type.body-tracking
  why: Positive tracking on paragraphs stripes the text and tires the reader
  better: Keep body tracking near the face's default
  keep_when:
  - id: contract-tracking
    when: the design contract sets the body tracking and the plan cites it
    evidence:
    - design
  - id: measured-correction
    when: the face's metrics are measured to need open spacing at that size
    evidence: none
- id: type.tight-leading
  why: Body leading near 1 makes ascenders and descenders collide and lines hard to track
  better: Set leading for size, measure, script, and content
  keep_when:
  - id: single-line-text
    when: body-role text that never wraps, such as one-line table cells, so no two lines can collide
    evidence: none
  - id: contract-leading
    when: the design contract sets the leading and the plan cites it
    evidence:
    - design
- id: type.long-measure
  why: Paragraphs that run past a comfortable measure make readers lose the next line
  better: Constrain the prose measure; give data its own grid
  keep_when:
  - id: data-grid
    when: tables and data rows, which follow their own grid
    evidence: none
- id: type.flat-hierarchy
  why: Title, label, and body share size, weight, and color, so the scan order is flat despite semantic
    headings
  better: Separate adjacent roles by changing one lever at a time - size, weight, contrast, or space
  keep_when:
  - id: contract-scale
    when: the design contract fixes the type scale and the plan cites it
    evidence:
    - design
  - id: non-size-levers
    when: the roles are separated by weight, contrast, or space instead of size, and the plan names the
      lever for each pair of roles
    evidence: none
- id: type.overused-neutral-grotesque
  why: A featureless low-contrast, high-x-height grotesque carries every role with no distinction between
    product, editorial, and data voices
  better: Pair type by role; keep the face only when the contract or platform specifies it, or when it
    won a recorded comparison on this surface's own copy
  keep_when:
  - id: specified-face
    when: the contract or platform specifies the face
    evidence:
    - design
    - brief
    - plan: brief.platform
      has:
      - ios
      - android
      - desktop
  - id: role-variation
    when: a one-family system with deliberate role variation
    evidence: none
  - id: won-comparison
    when: the face won a side-by-side comparison on this surface's own copy for each role and script where
      it is kept, recorded in explorations
    evidence:
    - exploration
- id: type.single-neutral-sans
  why: One family, usually a neutral sans, carries every role with no variation in width, optical size,
    or weight, so consistency turns into monotony
  better: Vary optical size, width, or weight by role, or add a deliberate companion face
  keep_when:
  - id: role-variation
    when: a one-family system that varies width, optical size, or weight by role
    evidence: none
  - id: platform-body-readability
    when: body readability on the target platform favors one family
    evidence:
    - exploration
  - id: specified-family
    when: the contract specifies one family
    evidence:
    - design
- id: type.caps-prose
  why: All-caps prose and decorative micro-labels assert importance without adding hierarchy or meaning
  better: Reserve capitals for brief, readable labels whose role or brand earns them
  keep_when:
  - id: established-label
    when: short labels whose role is established
    evidence: none
  - id: brand-wordmark
    when: brand wordmarks
    evidence:
    - design
    - brief
- id: type.tiny-ui-text
  why: Miniaturized interface text signals sophistication at the cost of legibility
  better: Use readable sizes and reduce density structurally instead
  keep_when:
  - id: legal-metadata
    when: legal or metadata text that has a readable alternative
    evidence: none
- id: type.costume-monospace
  why: Monospace is worn as a technical costume on prose and headings instead of marking code, identifiers,
    or aligned values
  better: Use monospace for semantic code, identifiers, or aligned numbers
  keep_when:
  - id: code-product
    when: developer products where the text is code
    evidence:
    - brief
    - plan: brief.product_frame
      has:
      - developer-tools
  - id: monospaced-brand-face
    when: a brand face that happens to be monospaced
    evidence:
    - design
    - brief
- id: type.font-fallback
  why: Text renders in a fallback font instead of the requested one, mixing sizes and color between scripts
  better: Lock a face that covers every script in the locales, or pair a companion with matched metrics
  keep_when:
  - id: locked-companion
    when: the rendered face is the companion or fallback that the fonts lock records for that script
    evidence: none
  - id: user-content-scripts
    when: user-generated text in scripts the planned locales do not cover, left to the platform's fallback
    evidence: none
- id: type.synthetic-style
  why: The browser synthesizes bold or italic that the font does not have, distorting the letterforms
  better: Load the real weight or style, or choose a face that has it
- id: type.ko.body-negative-tracking
  why: Negative tracking applied to Korean body text out of habit crowds the syllable blocks
  better: Keep Hangul body tracking at the face's default unless a measured face needs a small correction
  keep_when:
  - id: measured-correction
    when: the face's metrics are measured to need it at that size
    evidence: none
- id: type.ko.keep-all-missing
  why: Korean body text breaks inside words because word-break keep-all is missing
  better: Set word-break keep-all on Korean text blocks and allow overflow-wrap for long tokens
- id: color.palette-swap-only
  why: A palette or primary-color swap is the only change to a starter surface, so color is asked to distinguish
    default type, composition, and components
  better: Derive color roles from the subject, then resolve type, composition, imagery, and states on
    their own terms
  keep_when:
  - id: recolor-task
    when: the task is only a recolor of an approved system
    evidence:
    - design
    - brief
- id: color.violet-blue-gradient
  why: A violet-to-blue gradient supplies the whole mood of an otherwise unchanged composition
  better: Derive color roles from the subject and let a gradient appear only where it encodes something,
    such as a spectrum
  keep_when:
  - id: brand-gradient
    when: an approved brand gradient
    evidence:
    - design
    - brief
  - id: light-is-subject
    when: generative media, or light as the subject
    evidence:
    - brief
- id: color.gradient-headline
  why: Gradient text or an accent-colored word or closing phrase is the headline's main emphasis, a color
    effect where the words should carry it, and the color means nothing the reader can name
  better: Write a precise title; use a solid role color or image emphasis only when it clarifies meaning
  keep_when:
  - id: encoded-state
    when: the colored word encodes a real category or state
    evidence: none
- id: color.hero-halo
  why: A radial halo or soft spotlight behind the hero fills space and simulates depth without meaning
    or a material model
  better: Recompose around content or use subject-specific imagery; keep one consistent light and surface
    model
  keep_when:
  - id: light-is-subject
    when: light itself is the subject, such as a lighting or display product
    evidence:
    - brief
- id: color.neon-glow
  why: Bright outer glow on dark surfaces is a technical costume that blurs hierarchy and boundaries
  better: Build a functional dark palette with semantic roles; mark focus and state with borders and contrast
  keep_when:
  - id: emitted-light
    when: nightlife, gaming, or display subjects where emitted light is the material
    evidence:
    - brief
    - plan: brief.product_frame
      has:
      - games-entertainment
- id: color.gray-on-color
  why: A neutral gray text token placed on a saturated surface looks muddy and often fails contrast
  better: Use an on-color role tuned to the surface hue and test it on the actual surface
  keep_when:
  - id: contract-pair
    when: the design contract defines this text color on this surface and the plan cites it
    evidence:
    - design
- id: color.warm-editorial
  why: Warm cream, a clay or brass accent, and serif display arrive together as a category-generic premium
    package
  better: Earn warmth through the subject's materials, imagery, and brand evidence; resolve type and accent
    separately
  keep_when:
  - id: subject-material
    when: food, publishing, craft, or material products whose type, imagery, grid, and copy come from
      the subject
    evidence:
    - material
    - brief
- id: color.cream-base
  why: A warm cream field reads as quiet premium by default; alone it is weak, together with a clay accent
    and serif display it is a package
  better: Choose the field from the subject's paper, material, or imagery, and check it against the content
    colors
  keep_when:
  - id: paper-material
    when: the subject's material is paper or unbleached stock
    evidence:
    - material
    - brief
  - id: brand-field
    when: an approved brand field
    evidence:
    - design
    - brief
- id: color.terracotta-accent
  why: An earthy accent used regardless of the subject, where one fashionable hue substitutes for identity
  better: Ground the accent in the subject's world_materials, or choose again from the plan's color relations
  keep_when:
  - id: brand-color
    when: an approved brand color
    evidence:
    - design
    - brief
  - id: clay-subject
    when: the subject itself is terracotta or clay
    evidence:
    - material
    - brief
- id: color.sage-soft-field
  why: A sage or forest green accent on a soft tinted field is the calm, trustworthy palette that care
    and safety subjects get by category, and generated pages now hand it to subjects that have nothing
    green in them - software, transit, shops, wellness - so green has become a default family, chosen
    for the feeling it gives and not from the subject's own colors
  better: Take the field and the accent from the subject's own materials and content colors, and give
    the accent the one role the page needs it for
  keep_when:
  - id: brand-color
    when: an approved brand color
    evidence:
    - design
    - brief
  - id: green-subject
    when: the subject itself is plants, land, herbs, or leaf, so green is its material
    evidence:
    - material
    - brief
- id: color.violet-indigo-accent
  why: An indigo or violet accent on white borrows technical credibility from the software category instead
    of from the product
  better: Derive the accent from the product's own output or materials, and keep status colors separate
    from the brand accent
  keep_when:
  - id: brand-color
    when: an approved brand color
    evidence:
    - design
    - brief
  - id: content-derived
    when: the accent is a color of the content itself, such as a product, a data series, or a photograph
    evidence:
    - material
    - brief
- id: color.acid-on-black
  why: A near-black field with an acid yellow-green accent stands in for youth and energy whatever the
    subject is
  better: Choose the field and the accent from the subject's own material, and use the accent for the
    one action or state it marks
  keep_when:
  - id: brand-color
    when: an approved brand color
    evidence:
    - design
    - brief
  - id: genre-native
    when: the subject's genre owns the pairing, such as a club night, a music release, or a game
    evidence:
    - brief
    - plan: brief.product_frame
      has:
      - games-entertainment
- id: color.teal-accent
  why: A teal accent on a light field signals health, water, or finance by category rather than by the
    subject's own colors
  better: Take the accent from the subject's materials, and let a status color keep its own hue
  keep_when:
  - id: brand-color
    when: an approved brand color
    evidence:
    - design
    - brief
  - id: water-subject
    when: the subject's material is water, glass, or a clinical surface that is itself teal
    evidence:
    - material
    - brief
- id: color.pale-template-family
  why: A high-key pale field and one dominant muted action family can keep the category's landing structure
    unchanged while the accent hue rotates; silence from a cream detector does not show a subject-specific
    choice
  better: Trace fixed and open roles to product, photo, brand, material or data inputs; compare different
    input relations on the same real screen and record candidate artifacts/values and matched captures
    before keeping the family
  keep_when:
  - id: palette-provenance
    when: the palette won a matched real-screen comparison from different traced inputs, and the critic
      can inspect the artifacts, roles and captures
    evidence:
    - palette
  - id: fixed-palette
    when: the brief or approved design contract fixes the palette, including a house style
    evidence:
    - design
    - brief
- id: color.competing-accents
  why: Several unrelated accent hues compete, so action, focus, status, data, and ornament become ambiguous
  better: Allocate each accent to a role and check its area and repetition; there is no universal accent
    count
  keep_when:
  - id: categorical-data
    when: categorical data palettes
    evidence:
    - plan: tokens.color.data_scales
      has:
      - categorical
  - id: planned-multi-hue
    when: a multi-hue relation chosen in the plan
    evidence:
    - plan: tokens.color.relations
      has:
      - multi-hue
- id: color.mixed-neutrals
  why: Neutrals of different temperatures make components look assembled from different kits
  better: Use one neutral family, or deliberate warm and cool zones with a reason
  keep_when:
  - id: temperature-zones
    when: deliberate temperature zones recorded in the plan
    evidence:
    - plan: tokens.color.relations
      has:
      - temperature-contrast
- id: color.pure-endpoints
  why: Pure black and white used by habit flatten material relationships
  better: Choose endpoints deliberately while keeping the required contrast
  keep_when:
  - id: high-contrast-theme
    when: high-contrast themes
    evidence:
    - plan: tokens.color.themes
      has:
      - high-contrast
  - id: eink-or-print
    when: e-ink or print targets
    evidence:
    - brief
    - plan: output_condition
      present: true
  - id: brand-pair
    when: an approved brand pair
    evidence:
    - design
    - brief
- id: color.inverted-dark-theme
  why: The light palette is inverted literally for dark mode, so elevation, images, focus, and status
    colors look wrong
  better: Define dark-theme roles separately, with lighter surfaces for elevation and re-tuned status
    and focus colors
  keep_when:
  - id: contract-two-color-swap
    when: the design contract defines the dark theme as a deliberate swap of a two-color palette, with
      focus, status, and image treatment set separately
    evidence:
    - design
- id: color.text-contrast
  why: Text contrast below the applicable requirement, measured on the actual surface in every theme
  better: Adjust the text or surface role until both themes meet the requirement on the worst backdrop
    state
  keep_when:
  - id: disabled-or-decoration
    when: disabled controls and pure decoration are outside this requirement
- id: color.dark-luminous
  why: A dark field, violet-to-blue gradients, glow, glass cards, and buzzword copy arrive together as
    a technical-mood package
  better: Build a functional dark palette with semantic roles and let the product's real output supply
    any ambient color
  keep_when:
  - id: generative-media
    when: generative media
    evidence:
    - brief
  - id: light-subject
    when: light or spectral subjects
    evidence:
    - brief
  - id: brand-materials
    when: an established brand that uses these materials
    evidence:
    - design
    - brief
- id: surface.glass-everywhere
  why: Translucent glass on most panels stops communicating layering and weakens backdrop contrast
  better: Reserve transparency for real overlays and depth
  keep_when:
  - id: platform-material
    when: platform materials that the platform itself applies
    evidence:
    - plan: brief.platform
      has:
      - ios
      - android
      - desktop
  - id: overlay-on-content
    when: overlays above live content
    evidence: none
- id: surface.uniform-large-radius
  why: One large or pill radius on every container erases shape hierarchy
  better: Assign radii by component role and platform
  keep_when:
  - id: platform-convention
    when: a platform convention
    evidence:
    - design
    - plan: brief.platform
      has:
      - ios
      - android
      - desktop
  - id: contract-shape-language
    when: a brand shape language recorded in the contract
    evidence:
    - design
- id: surface.side-accent-border
  why: A colored side border on rounded cards speaks a selected-state language without any state
  better: Show actual selection or hierarchy, or remove the border
  keep_when:
  - id: real-selection-or-status
    when: the border marks real selection, status, or a callout type
    evidence: none
- id: surface.depth-cue-conflict
  why: Borders and shadows disagree in color, direction, or depth with the rest of the surface model
  better: Align boundary and elevation roles to one shared light and depth model
  keep_when:
  - id: distinct-overlay-roles
    when: a fine border plus soft shadow on an overlay, where both roles are distinct
    evidence: none
- id: surface.decorative-grid-texture
  why: A decorative grid or crosshair background adds a designed texture with no product meaning
  better: Derive texture from the subject, or remove it
  keep_when:
  - id: grid-is-subject
    when: the grid is the subject, such as a drafting, mapping, or measurement product
    evidence:
    - brief
- id: surface.hard-offset-shadow
  why: Thick outlines with hard offset shadows on every card replace one package with another over an
    unchanged structure
  better: Keep hard edges only where a direct graphic voice is earned, and resolve the structure first
  keep_when:
  - id: graphic-voice
    when: games, creator commerce, or a brand with an established direct graphic voice
    evidence:
    - design
    - brief
    - plan: brief.product_frame
      has:
      - games-entertainment
- id: surface.hard-edge-graphic
  why: Offset shadows, costume monospace, capitals, and oversized grotesque arrive together as a hard-edge
    package
  better: Resolve structure, type roles, and palette from the subject before choosing a graphic voice
  keep_when:
  - id: graphic-voice
    when: games, creator commerce, culture, or independent tools with an established direct voice
    evidence:
    - design
    - brief
    - plan: brief.product_frame
      has:
      - games-entertainment
- id: layout.hero-before-priority
  why: A centered or split hero shell was chosen before the proposition, evidence, action, and imagery
    were ranked
  better: Rank the opening's content first, then choose the conventional or unusual composition that expresses
    that order
  keep_when:
  - id: priority-calls-for-shell
    when: the ranked content genuinely calls for the conventional shell
    evidence: none
- id: layout.split-hero
  why: The first screen is divided in two, a column with the large heading, a short paragraph, and the
    buttons beside a column with an image, drawing, or product mock - the composition generated pages
    open with whatever the subject, so changing the subject changes a noun and nothing else
  better: Derive the opening from the content's own relation and the visitor's genre/task questions; keep
    a working split when that relationship is visible in the capture, and cut stock copy, eyebrows and
    icon rows before dismantling it
  keep_when:
  - id: won-comparison
    when: the split won a rendered comparison against an opening built from the same content without it
    evidence:
    - composition
  - id: contract-fixes-opening
    when: the design contract or the brief fixes a two-column opening and the plan says so
    evidence:
    - design
    - brief
  - id: evidentiary-capture
    when: the second column is a real capture of the subject itself - the product at work, the artwork,
      the object on sale - recorded in the asset ledger as evidence
    evidence:
    - asset:
        kind:
        - photo
        - screenshot
        - video
        role:
        - evidentiary
  - id: task-in-opening
    when: the second column is the interface the visitor came to use, such as a booking panel or a search,
      and the first column says what it is for
    evidence: none
  - id: record-beside-claim
    when: the second column is one record of the subject's real state, such as a restore point with its
      time, shown beside the claim it supports, and the plan's relationships between its contents name
      that pair
    evidence:
    - plan: layout.procedure.relationships
      present: true
- id: layout.equal-siblings
  why: Feature or pricing cards get equal size and emphasis despite unequal content, flattening priority
    and recommendation
  better: Let comparison needs, reading method and content importance set count, span, order and emphasis;
    peers can need one long demonstration plus two short records while numerical comparison rows stay
    aligned
  keep_when:
  - id: peer-comparison
    when: a genuine peer comparison of equal items
    evidence: none
- id: layout.pricing-trio-recommendation
  why: Three offerings with the middle one set apart as the pick arrive together, so the count and the
    recommendation come from the template instead of from the plans and who each fits
  better: Show the plans that exist, put the difference that decides between them first, and set one apart
    only for a reason the buyer can check
  keep_when:
  - id: recommendation-has-a-reason
    when: the brief or the source names the recommended plan and why it fits, and the card says so
    evidence:
    - brief
    - source
- id: layout.nested-cards
  why: Containers stack border on border without distinct ownership or behavior, obscuring relationships
  better: Group with space, rules, or one meaningful surface
  keep_when:
  - id: inner-role-surface
    when: an inner surface with its own role, such as a chart plot area inside a data card
    evidence: none
- id: layout.template-section-sequence
  why: Section order follows a category landing template, or unrelated sections repeat identical spans,
    instead of following the questions the reader brings
  better: Keep a standard genre or SaaS sequence when sections answer the reader's actual evaluation questions;
    record reader-question-order with those questions and phone/wide capture references in the reason,
    then remove stock phrasing and icons before changing the earned structure
  keep_when:
  - id: reader-question-order
    when: the reader's questions genuinely follow that order, and the capture preserves their hierarchy
      through the whole page; familiarity alone is not a defect
    evidence: none
- id: layout.reassurance-landing
  why: The landing page carries the category's reassurance set - its section order, a recommended middle
    plan, floating status panels, comfort wording, stacked trial terms, paired slogan headings, and a
    calm palette - so another subject would get the same page
  better: Rank what this subject's visitor must decide and prove, then give each of those its own structure,
    wording, and color from the subject's materials
  keep_when:
  - id: reader-question-order
    when: the reader's questions genuinely follow that order and each member that hit is kept on its own
      case
    evidence: none
- id: layout.bento-filler
  why: A bento cell exists only to complete the grid shape, so empty modules advertise the template
  better: Give one cell to each meaningful item and vary weight by importance
  keep_when:
  - id: data-cells
    when: cells of a calendar, matrix, seat map, or heatmap, where an empty cell is a real value
    evidence: none
- id: layout.zigzag
  why: Image and text rows alternate by rule without a narrative reason, making distinct ideas look equivalent
  better: Consolidate related content or choose a structure that reflects each relationship
  keep_when:
  - id: sequence-narrative
    when: a step-by-step narrative where alternation tracks the sequence
    evidence: none
- id: layout.decorative-numbering
  why: Numbers on non-sequential sections imply progress, sequence, or record identity that does not exist
  better: Number only real steps, ranked items, or records; otherwise use descriptive headings
  keep_when:
  - id: ordered-process
    when: a real ordered process
    evidence: none
  - id: ranked-items
    when: ranked items
    evidence: none
  - id: record-identifiers
    when: record identifiers
    evidence: none
- id: layout.heading-proximity
  why: The space above a heading is no larger than the space below it, so the heading attaches to the
    previous section
  better: Give headings more space above than below
  keep_when:
  - id: repeating-rows
    when: repeating heading rows, such as an accordion or definition list, that keep one even gap by design
    evidence: none
- id: layout.monotonous-spacing
  why: The same gap at every hierarchy level makes siblings, groups, and sections hard to tell apart
  better: Order spacing as inside a group, then between siblings, then between groups, then between sections
  keep_when:
  - id: contract-spacing
    when: the design contract fixes the spacing step for each level and the page follows it
    evidence:
    - design
  - id: single-level-surface
    when: a surface with one level of grouping, such as a log, a feed, or a plain table, so there are
      no groups or sections to tell apart
    evidence: none
- id: type.hidden-heading-break
  why: Hiding a heading's line break at a breakpoint removes the only separation between two words
  better: Put a space before the br or use a span with an explicit space; compare the visible heading
    at phone and desktop widths
  keep_when:
  - id: word-internal-break
    when: the break intentionally falls inside one word and hiding it restores that same word, verified
      in a phone capture
    evidence: none
- id: layout.primary-action-reach
  why: A next-step action separated from the last required selection by more than half a screen makes
    the visitor search or scroll after finishing the choice
  better: Keep the continuation on the selection's screen, by ordering the step or using an appropriate
    sticky action; record selections and the forward control in the flow's reach link, not a CTA on every
    first view
- id: layout.primary-task-first-view
  why: A work screen can expose its controls yet put the first useful task result below the first phone
    view behind duplicate context, citywide summaries or promotion
  better: Record layout.phone_task and perform that decision on the phone capture; bring its first useful
    result forward, preserving necessary context and selection-adjacent continuation, not a CTA on every
    first view or a lower card ratio
- id: layout.compact-overflow
  why: Fixed columns overflow at compact width, so text or controls clip, overlap, or force page scrolling
  better: Let columns collapse or reflow at compact widths; scroll only regions whose content needs two
    dimensions
  keep_when:
  - id: scrolling-region
    when: data tables, maps, and diagrams that scroll inside their own region
- id: layout.crowded-hero
  why: A logo wall, metrics, and extra copy packed into the hero bury the proposition and the action
  better: Keep the opening to proposition and action; place real proof immediately after
  keep_when:
  - id: brief-fixed-opening
    when: the brief fixes what the opening must carry, such as an event's date and place, and the plan
      lists those items
    evidence:
    - brief
- id: layout.edge-flush
  why: Cards touch the viewport or scroller edge without a safe inset, so content feels clipped and targets
    become awkward
  better: Add an intentional inset and a visible scroll affordance
  keep_when:
  - id: full-bleed-media
    when: full-bleed media that is meant to run to the edge
    evidence: none
- id: layout.split-heading
  why: A heading sits in one column and its explanation in another, splitting a dependent reading path
  better: Keep a dependent heading and intro in one reading path
  keep_when:
  - id: aligned-side-heading
    when: a side heading aligned to the first line of its text, with the heading before the text in reading
      order
    evidence: none
- id: layout.decorative-opening-stack
  why: A decorative opening stack pushes necessary context or the primary action out of reach
  better: Remove the unearned stack; keep deliberate long-form or immersive openings without enforcing
    a universal fold
  keep_when:
  - id: immersive-opening
    when: a deliberate immersive or long-form opening
    evidence:
    - brief
    - plan: direction.read.surface_mode
      has:
      - experience
- id: layout.unearned-empty-opening
  why: The first screen is a short column on the left with the heading, a few lines, and a button, and
    nothing in the rest of it, so the opening says little and the space beside it stands for nothing the
    visitor needs
  better: Pull the real content the page is about into the first view - the record, list, search, booking,
    comparison, or work - and recompose the opening's width, height, and order around it; deleting the
    object that stood beside the column, centering the column, or drawing a stand-in for the empty side
    is not a repair
  keep_when:
  - id: contract-fixes-opening
    when: the design contract or the brief fixes a left-aligned opening with this much open space, and
      the plan says so
    evidence:
    - design
    - brief
  - id: poster-opening
    when: the subject's own composition is the point, such as an exhibition, a venue, or a release, the
      brief asks for that poster-like opening, and the capture shows the space doing that work
    evidence:
    - brief
  - id: typographic-opening
    when: 'type carries the width: the heading is set large enough to fill the opening and the capture
      shows it does'
    evidence: none
- id: layout.wrapped-navigation
  why: Navigation wraps to two lines at common desktop widths, consuming the opening and destabilizing
    scanning
  better: Prioritize the items or change the navigation model
  keep_when:
  - id: footer-link-groups
    when: footer or sitemap link groups, which sit at the end of the page rather than in the opening
    evidence: none
- id: layout.repeated-section-shape
  why: Consecutive sections are each a heading over a row of cards, so the sections differ in words and
    color and not in structure, and the layout barely responds to what each section holds
  better: Give each section the structure its content relation needs - a table, a sequence, a comparison,
    one large item with notes, running text - and cut or merge sections that only repeat a shape
  keep_when:
  - id: parallel-sets
    when: the sections hold parallel sets, such as the same facts for each of several products or places,
      where the repeated structure is what makes them comparable
    evidence: none
- id: layout.flat-section-rhythm
  why: Every section sits on one background and most neighbours share one shape, so nothing marks where
    the content changes and a long page reads as one slab with no rank
  better: Change the ground where the content changes - a band of another tone, a different density, a
    section given more room - and let sections that belong to one reading share a ground; contrast marks
    a real change of content, it is not decoration
  keep_when:
  - id: continuous-reading
    when: the page is one continuous text or one record, such as an article, a document, or a form, and
      a change of ground would cut the reading
    evidence: none
  - id: space-and-structure-carry-rhythm
    when: the contract fixes one field for the page and the rhythm comes from space, scale, and structure
      that the capture shows
    evidence:
    - design
- id: layout.metric-tile-opening
  why: A row of tiles, each a big number over a small label, opens the page, so totals that would fit
    any product take the first view and say nothing about what to decide or do
  better: Open with what the reader must decide or act on - the exception, the next arrival, what is late
    or full - and show a number only when a decision hangs on it, with its limit or its change beside
    it; keep totals nobody acts on out of the first view
  keep_when:
  - id: decision-numbers
    when: each number is what the reader decides by in this task, such as a threshold, a queue length,
      or a balance, and its limit or change is beside it
    evidence:
    - brief
    - source
  - id: numbers-are-the-subject
    when: the numbers are the subject, such as a result, a scoreboard, or a report
    evidence:
    - brief
- id: layout.compact-desktop-navigation
  why: At phone width the desktop navigation is still there - a rail of icons takes a column from every
    screen, or a bar of items runs past the edge, wraps inside an item, or crowds one row - so the phone
    page is the desktop composition squeezed and not a layout made for the width
  better: Compose the phone navigation on its own - a few destinations in one place the thumb reaches,
    the current place named at the top, the rest reachable from the content - and keep the rail and the
    wide bar for the widths that have room for them
  keep_when:
  - id: tool-rail-by-design
    when: the surface is a tool whose phone use is a persistent rail, such as a map, an editor, or a chat
      client, and the brief or the contract says so
    evidence:
    - brief
    - design
- id: layout.compact-object-opening
  why: The first phone view is the heading and then an image or drawing that fills a third of the screen,
    the object that stood beside the heading on the desktop pushed below it, so the page gets longer and
    the first view shows the least informative part
  better: Design the phone opening as its own composition - the proposition, the one thing to do, and
    a trimmed or cropped object only if it carries information - and move the object after the content
    it supports or drop it at this width; do not stack the desktop columns
  keep_when:
  - id: object-is-the-content
    when: the image or drawing is the subject itself, such as the artwork, the object on sale, or the
      product at work, and the phone view is meant to show it
    evidence:
    - brief
    - asset:
        kind:
        - photo
        - screenshot
        - video
        role:
        - evidentiary
  - id: opening-composed-for-phone
    when: the phone opening was composed on purpose with the object at that size, and the plan's layout
      names it
    evidence:
    - plan: layout.procedure.reading_order
      present: true
- id: layout.compact-empty-length
  why: Much of the phone page is bands a quarter of the screen tall or more with nothing in them to read
    or press - the desktop's pictures and gaps stacked one under another - so the page is long for what
    it says
  better: Fit the phone page to its content - crop or drop the objects that only fill a column on the
    desktop, bring related content closer, and let a long page be long because of what it holds
  keep_when:
  - id: images-are-the-content
    when: the page is a gallery, a portfolio, or an exhibition whose images are the content the phone
      reader came for
    evidence:
    - brief
- id: layout.occluded-text
  why: A decorative layer covers text, hiding content
  better: Reorder the layers or reserve space for the text
  keep_when:
  - id: legible-overlap
    when: display type that a layer overlaps partly while every word stays legible
- id: layout.card-everything
  why: Cards become the whole page structure, so every item is equal and enclosed
  better: Use rows, groups, sections, or bare content where they express the relation better
  keep_when:
  - id: independent-objects
    when: collections of independent, comparable objects
    evidence: none
- id: layout.shrunk-desktop
  why: The compact layout is the desktop composition shrunk, treating responsive behavior as scale
  better: Define content order, collapse, and density for each section at each width
  keep_when:
  - id: fixed-canvas
    when: a fixed-canvas surface, such as a map, diagram, slide, or spreadsheet, whose layout is the canvas
      itself
    evidence:
    - brief
- id: layout.symmetry-excess
  why: Nearly everything centers on one axis, so the layout expresses no priority through placement
  better: Place content by reading order and weight; keep symmetry where the content is genuinely balanced
  keep_when:
  - id: ceremonial-surface
    when: ceremonial, poster-like, or single-message surfaces
    evidence:
    - brief
- id: layout.missing-signature
  why: No element unique to this subject and task is planned or rendered, so the surface could belong
    to any product
  better: Name one signature element drawn from world_materials in the plan and build it
  keep_when:
  - id: repair-scope
    when: a repair plan (mode repair) whose scope leaves the visual identity untouched
    evidence:
    - plan: mode
      has:
      - repair
- id: layout.unanchored-lever
  why: A lever that names no material of this subject (clean, modern, bold type, more whitespace) would
    fit any product, so the direction stays a default
  better: Write each lever as one sentence - the lever, what visibly changes, and the world material it
    comes from, named as world_materials writes it
  keep_when:
  - id: form-fixed-by-contract-or-brief
    when: the contract or the brief fixes the form and the plan says so
    evidence:
    - design
    - brief
- id: layout.typical-composition
  why: The composition sits close to the current defaults corpus across sequence, archetypes, symmetry,
    and density
  better: Revisit the content ranking and signature; change the structure where the content relation differs
  keep_when:
  - id: content-fixed-structure
    when: the content has a structure of its own, such as a form, a legal text, a changelog, or a data
      table
    evidence: none
  - id: form-fixed-by-contract-or-brief
    when: the contract or the brief fixes the composition and the plan says so
    evidence:
    - design
    - brief
- id: component.emoji-icons
  why: Emoji or Unicode glyphs serve as product icons, so weight and style vary by operating system
  better: Use one maintained icon family and label icon-only buttons
  keep_when:
  - id: emoji-content
    when: user-generated content, reactions, or a brand voice built on emoji
    evidence:
    - brief
- id: component.hand-drawn-icons
  why: Hand-authored SVG paths for standard actions reinvent tested geometry and drift from the library
    icons beside them
  better: Use the project icon family for standard actions; draw custom icons only for subject-specific
    concepts
  keep_when:
  - id: uncovered-concept
    when: custom icons for concepts the family does not cover, drawn on the family's grid and stroke
    evidence:
    - asset:
        kind:
        - icon-set
        origin:
        - own
        - commissioned
- id: component.mixed-icon-families
  why: Two or more icon families on one surface disagree in stroke, fill, optical size, and grid
  better: Normalize to one family, weight, grid, and alignment
  keep_when:
  - id: brand-marks
    when: third-party brand marks beside the interface family, which cannot be redrawn in its style
    evidence:
    - asset:
        kind:
        - mark
  - id: content-glyph-set
    when: a glyph set that is content rather than interface chrome, such as country flags or file-type
      badges
    evidence: none
- id: component.fake-app-window
  why: Decorative divs mimic an app window or data, replacing real product evidence with a facsimile
  better: Use a real capture or a clearly labeled illustrative slot
  keep_when:
  - id: labeled-illustration
    when: a labeled illustration where no product exists yet
    evidence:
    - brief
- id: component.floating-chips
  why: Short status, file, and proof panels float over the edge of the opening's main object, so small
    reassurances decorate it instead of one real state sitting beside what it describes
  better: Show one coherent demonstration with each state beside the object it belongs to, or leave the
    panels out
  keep_when:
  - id: annotated-diagram
    when: labeled callouts that explain parts of the object, each pointing at the part it names
    evidence: none
  - id: captured-state
    when: the panels are live or captured state of a working product shown in the opening
    evidence: none
- id: component.generic-spinner
  why: One spinner for every wait ignores duration and layout and gives no sense of structure or preserved
    task
  better: Choose by wait - a delayed indicator, skeleton, progress, or inline status
  keep_when:
  - id: handoff-wait
    when: a hand-off wait with no progress to report and no content structure to preview, such as an external
      payment or sign-in redirect, with text that names what is happening
    evidence: none
- id: component.library-default-theme
  why: The component library's starter styling has become the brand even though its behavior is sound
  better: Keep the useful primitives, then define type, color roles, radius, spacing, states, and composition
    from the product
  keep_when:
  - id: adopted-library-system
    when: internal tools where the library's system is the adopted contract
    evidence:
    - design
    - brief
- id: component.unlabeled-input
  why: An input has no programmatic label, or its placeholder is the only label and disappears once the
    user types
  better: Associate a visible label with each field, with helper and error text linked to it
- id: component.unnamed-icon-button
  why: An icon-only control has no accessible name, so its action is undiscoverable with assistive technology
  better: Give the control a visible or programmatic name that states the action
- id: component.small-target
  why: A pointer target is smaller than 24 by 24 CSS px and has too little clear space around it, so it
    is easy to miss or to hit a neighbor
  better: Make targets at least 24 px, or keep clear space around small ones; touch-first surfaces are
    easier at 44 px
  keep_when:
  - id: inline-link
    when: links inside a sentence
  - id: browser-default-size
    when: controls left at the size the browser gives them
  - id: equivalent-full-size-control
    when: a control whose function a full-size control on the same page also offers
  - id: size-carries-information
    when: targets whose size carries information, such as map pins at their true positions
- id: ux.routine-modal
  why: A modal handles routine navigation or a long task, interrupting context without a protected-focus
    need
  better: Use a page, sheet, inline edit, or disclosure as the task requires
  keep_when:
  - id: destructive-confirmation
    when: confirmation of a destructive action
    evidence: none
  - id: blocking-short-task
    when: a short task that must block the rest of the screen
    evidence: none
- id: ux.dead-control
  why: An element that looks interactive does nothing, or a runtime error or cosmetic result stands in
    for the promised state or data outcome
  better: Exercise the consequential path and make the control produce the state or data it promises
  keep_when:
  - id: prototype-scope
    when: a local prototype whose stated scope excludes the backend, where the control says so
- id: ux.missing-states
  why: A polished resting frame hides missing states that the task can reach - empty, loading, error,
    offline, success, or recovery
  better: Design and exercise every relevant state, including recovery
  keep_when:
  - id: unreachable-state
    when: states the surface cannot reach, such as offline on a static page
- id: ux.preselected-option
  why: An optional extra, a consent, or a costlier plan is already selected, so doing nothing becomes
    agreement
  better: Start optional choices unselected and let the user opt in; show plans side by side without a
    default pick
  keep_when:
  - id: free-reversible-default
    when: a free, reversible default that is neither a consent nor a charge, such as standard delivery
- id: ux.drip-pricing
  why: Required fees, shipping, or taxes first appear, or the price rises or loses a discount, after the
    price the user compared, so the price shown is not the price paid
  better: Show the total the user must pay where the price first appears, or name each required charge
    there as still to be calculated, and keep it unless the user changes something
  keep_when:
  - id: pending-input-charge
    when: a charge that depends on input given later, such as a delivery address, named as pending where
      the price first appears
- id: ux.sneak-into-basket
  why: An item or service enters the cart without the user adding it
  better: Add only what the user chose; offer extras as separate choices that start unselected
- id: ux.hidden-subscription
  why: A recurring charge's renewal price, cadence, trial end, or way to cancel is missing or out of view
    when the user commits
  better: Put the renewal price, cadence, trial end date, and how to cancel next to the commit control,
    readable without expanding anything
- id: ux.obstructed-exit
  why: Leaving takes far more effort than joining, or cannot be finished - repeated offers, a required
    call or chat, a hidden final action, or reauthentication the join did not need
  better: Keep a direct, visible exit in the channel the user joined through; beyond joining's effort,
    allow one consequence review and one confirmation, offer at most one alternative that does not block,
    and end with a receipt
- id: ux.false-hierarchy
  why: The option that serves the business far outweighs the refusal - a large filled button against small,
    faint, or unstyled text
  better: Give accepting and declining comparable size, contrast, and styling, and let the labels explain
    the difference
  keep_when:
  - id: no-favored-side
    when: choices without a business-favored side, such as confirming the user's own action
- id: ux.asymmetric-decline
  why: Accepting takes one action while declining is missing or takes more, such as a settings page of
    switches to turn off
  better: Offer the refusal on the same layer as the acceptance, completed in as few actions
- id: ux.nagging
  why: A request the user declined comes back during the same visit, pressing them to change the answer
  better: Respect the refusal and let the user change it later from a stable place such as settings
- id: ux.false-urgency
  why: A countdown restarts on reload or runs out with no consequence, or a stock count, a viewer count,
    or a purchase notice has no source or changes with no cause, inventing pressure to decide
  better: Show only real deadlines, stock, and activity with their basis, such as the closing time or
    when the count was updated, or show none
- id: ux.forced-action
  why: The flow demands something the goal does not need - an account, an optional consent, a permission,
    a share, an app install, or a survey - before the user can continue
  better: Ask only for what the task needs; offer a guest path and make optional steps skippable
  keep_when:
  - id: listed-prerequisite
    when: prerequisites the plan flow lists under requires with a reason, such as an account for a service
      that keeps the user's data
- id: ux.confirmshaming
  why: The refusal is worded to shame, guilt, or frighten the user into accepting
  better: Name the plain outcome of declining, such as not now or continue without the discount
- id: ux.back-trap
  why: Browser Back does not leave the page because the page adds history entries or reopens a sheet to
    hold the user
  better: Let Back leave the page; one Back may first close an overlay the user opened
- id: ux.keyboard-trap
  why: Keyboard focus enters a region and cannot leave it with Tab, Shift+Tab, or Escape, so the rest
    of the page is out of reach
  better: Let focus move on with standard keys; contain focus only inside an open modal that Escape or
    a close control dismisses
- id: ux.keyboard-inoperable
  why: A control that works with a pointer cannot be reached or activated from the keyboard
  better: Keep controls in the tab order and make Enter and Space do what a click does
- id: ux.focus-order
  why: Tab order jumps backward or across the layout, so keyboard users lose their place
  better: Order the DOM in visual reading order and avoid positive tabindex
- id: ux.no-bypass
  why: Every page opens with the same run of navigation stops and offers no way past it, so keyboard and
    screen reader users walk the whole block on each page
  better: Mark the primary content with a main landmark, start it with a heading, and add a skip link
    as the first stop
- id: ux.skip-link-missing
  why: Sighted keyboard users tab through a long repeated header on every page, or a skip link is present
    but leaves focus where it was
  better: Make the first stop a skip link that becomes visible on focus and moves focus into the main
    content
  keep_when:
  - id: short-header
    when: a short header whose few stops are the page's main task
    evidence: none
- id: ux.focus-obscured
  why: The focused control is entirely hidden behind a sticky header, a banner, or a fixed bar
  better: Reserve room with scroll padding or move fixed content so focused elements stay in view
- id: ux.dialog-focus
  why: A dialog opens without taking focus, lets focus slip behind it, cannot be closed with Escape or
    a visible control, drops focus when it closes, or starts a destructive confirmation on the destructive
    button
  better: Move focus into the dialog, keep it there while a modal is open, close on Escape and a visible
    control, return focus to the control that opened it, and start confirmations on the safe choice
- id: ux.unexpected-context-change
  why: Focusing a control or changing a value navigates, submits, or opens a window without the user asking
  better: Change context only on an explicit action such as a button, or say beforehand what the change
    will do
- id: ux.timeout-without-warning
  why: A session or hold expires without warning or a simple way to extend it, and entered work can be
    lost
  better: Warn before the limit with at least 20 seconds to extend in one action, or remove the limit
  keep_when:
  - id: essential-limit
    when: limits that are essential or tied to a real-time event, such as an auction closing
- id: ux.gesture-only
  why: Reordering, sliding, swiping, or zooming works only with a drag or a multi-finger gesture
  better: Offer a single-tap alternative such as move buttons, a menu, or a value input, alongside keyboard
    support
  keep_when:
  - id: gesture-is-task
    when: gestures that are the task itself, such as freehand drawing
- id: ux.hover-content
  why: Content that appears on hover cannot be reached with keyboard focus, dismissed without moving the
    pointer, or hovered without disappearing
  better: Reveal the same content on focus, close it with Escape, and keep it open while the pointer is
    over it
- id: ux.status-not-announced
  why: A result such as an added item, a saved change, or a new result count appears on screen but reaches
    neither a live region nor focus
  better: Put status text in a polite live region, and move focus only when the user must act on the result
- id: ux.input-error-unidentified
  why: After a failed submit the error shows only as a color or icon, is not tied to its field, or is
    neither announced nor focused
  better: Describe each error in text next to its field, link it programmatically, and move focus to the
    first error or a summary
- id: ux.redundant-entry
  why: A later step asks again for information the user already gave, without prefilling it or offering
    to reuse it
  better: Carry values forward within the flow, or offer a same-as option
  keep_when:
  - id: security-reentry
    when: re-entry that protects security, such as confirming a new password
  - id: expired-information
    when: information that is no longer valid, such as an expired code
- id: ux.inaccessible-auth
  why: Signing in needs a puzzle, a transcription, or a memory test with no alternative, or blocks pasting
    into password and code fields
  better: Allow paste and password managers, and offer a way to sign in without a cognitive test
- id: ux.autoplay-audio
  why: Sound plays by itself with no way to pause or mute it, drowning out screen readers and startling
    people
  better: Start media muted or on request, with pause and volume controls
- id: ux.no-review-before-commit
  why: A purchase or other binding commitment is made in one action, with no step that shows the total
    and the choices and lets the user change them, and no way to undo it
  better: Show a review with the total, items, and terms and a way to edit them before the commit, or
    let the user cancel it afterward
  keep_when:
  - id: no-money-or-legal-effect
    when: commitments with no money or legal effect, such as saving a draft
- id: ux.duplicate-submit
  why: Two quick activations, a retry after an unknown outcome, or an automatic resend creates a second
    order, charge, or record
  better: Show a pending state that blocks repeats, send an idempotency key, and check an unknown outcome
    before offering a retry
- id: ux.false-status
  why: The page says done while the change failed or its outcome is unknown, or says failed when the change
    may already have happened
  better: Report only what the backend confirmed; name an unknown outcome and check its status before
    offering a repeat
- id: ux.lost-input
  why: Values the user entered disappear after a validation error, a failed request, Back, or signing
    in again
  better: Keep entered values through errors and navigation within the flow; clear only secrets, and say
    why
  keep_when:
  - id: cleared-secret
    when: a secret or single-use value, such as a password, card number, or one-time code, is cleared
      on purpose and the form says why
    evidence: none
- id: ux.destructive-without-undo
  why: A destructive action runs with neither a confirmation that names what is lost nor a working undo,
    or its undo does not bring the object back
  better: Confirm irreversible actions with the object's name and consequence, or act at once with an
    undo that restores it
  keep_when:
  - id: one-step-recreate
    when: removing something the user can recreate in one step, such as a search filter
- id: ux.dead-end
  why: A step offers no way forward or back other than the browser, including an error with no recovery
    action
  better: Give every state a next action - retry, edit, go back, or get help - and keep the user's place
  keep_when:
  - id: host-owns-navigation
    when: the surface runs inside a host that owns navigation, such as an embedded widget or webview,
      and brief.platform lists embedded
    evidence:
    - plan: brief.platform
      has:
      - embedded
  - id: kiosk-auto-reset
    when: a kiosk or signage screen that returns to its start by itself after a visible countdown
    evidence:
    - brief
    - plan: brief.platform
      has:
      - embedded
- id: ux.permission-on-load
  why: The browser asks for notifications, location, or the camera before the user has done anything that
    needs it, so the request has no context and a refusal sticks
  better: Ask when a feature needs the permission, from a user action, after saying why
  keep_when:
  - id: permission-is-job
    when: a page whose one job needs the permission at once, such as a scanner the user opened
    evidence:
    - brief
- id: ux.entry-interruption
  why: A modal or sheet interrupts before the user has done anything - on load, on a timer, on scroll,
    or on the way out - to ask for something the page's job does not need
  better: Place the offer inline where it is relevant, or ask after the user shows interest
  keep_when:
  - id: equal-ease-decision
    when: a decision required before content can be shown, with accepting and declining equally easy
    evidence: none
- id: ux.lost-context-on-return
  why: Coming back with Back or after signing in loses filters, the page, the scroll position, or the
    linked destination, so the user starts over
  better: Keep list state in the URL or history, restore the scroll position, and return to the requested
    destination after sign-in
  keep_when:
  - id: live-feed
    when: a live feed whose order changes, so a restored position would land on other items
    evidence: none
  - id: cleared-for-security
    when: state cleared on purpose for security, such as when a session ends on a shared device, with
      the page saying so
    evidence: none
- id: ux.excess-steps
  why: A flow takes more steps than its plan allows, or splits a short form into one-field screens
  better: Group related fields into steps that each settle a decision, and cut steps that decide nothing
  keep_when:
  - id: boundary-step
    when: one-field steps at a branch, a verification boundary, or a save-and-resume point
    evidence: none
- id: ux.premature-validation
  why: Errors appear while the user is still typing, or on untouched fields as the page loads
  better: Validate on blur or submit, and clear an error as soon as the value becomes valid
  keep_when:
  - id: helpful-live-feedback
    when: live feedback that helps while typing, such as password strength or characters remaining
    evidence: none
- id: ux.disabled-submit-unexplained
  why: The submit control stays disabled with no visible reason, so the user cannot tell what is missing
  better: Keep submit enabled and explain errors on submit, or show next to it what is still needed
  keep_when:
  - id: request-in-flight
    when: the control is disabled only while its own request is in flight and shows a pending state
    evidence: none
- id: ux.scroll-hijack
  why: The page takes over scrolling - snapping between sections, changing how far a scroll moves, or
    holding it while an animation plays - so users lose control of their position
  better: Keep native scrolling and tie effects to scroll position without changing the distance moved
  keep_when:
  - id: entered-presentation-mode
    when: a full-screen presentation mode the user entered on purpose
    evidence: none
- id: ux.subscription-trap
  why: Hidden renewal terms, a preselected plan or extra, a hard exit, and repeated asks work together
    to keep people paying
  better: Fix the members together - disclose terms at the commit, start choices unselected, and make
    leaving as direct as joining
- id: ux.pressure-selling
  why: Interruptions, invented urgency, lopsided choices, shaming refusals, and repeated asks stack up
    to push a decision
  better: Remove the pressure devices and let the offer stand on its facts
- id: ux.consent-steering
  why: Preselected consents, lopsided buttons, a buried refusal, early permission prompts, and repeated
    asks together steer people into agreeing
  better: Ask once, at the moment it matters, with an unselected choice and a refusal as easy as acceptance
- id: motion.pulse-without-status
  why: An infinitely pulsing status dot performs liveness without any changing status
  better: Use a stable status or real progress
  keep_when:
  - id: live-status
    when: the dot reflects live status that changes
    evidence: none
  - id: loading-skeleton
    when: a skeleton placeholder while loading
    evidence: none
- id: motion.decorative-cursor
  why: A decorative blinking cursor mimics typing or generation indefinitely
  better: Show the actual input state, or remove it
  keep_when:
  - id: text-input-focus
    when: a real text input with focus
    evidence: none
- id: motion.uncontrolled-marquee
  why: Content auto-scrolls without a way to pause, stop, or hide it, moving before it can be read
  better: Use static overflow or a controlled carousel with a pause control
- id: motion.bounce-default
  why: Bounce or elastic easing as the global default applies personality indiscriminately and slows tasks
  better: Match easing to direct manipulation, platform, and tone; keep overshoot for moments that earn
    it
  keep_when:
  - id: playful-brand-motion
    when: playful subjects where overshoot is the brand's motion voice
    evidence:
    - design
    - brief
  - id: drag-release
    when: release after a physical drag
    evidence: none
- id: motion.layout-property-animation
  why: Routine state changes animate width, height, or position, shifting neighboring content and causing
    jank
  better: Animate transform and opacity, or use a layout animation tool built for the change
  keep_when:
  - id: measured-layout-animation
    when: a purposeful layout animation handled by a tool that measures and transforms
    evidence: none
- id: motion.hover-zoom-everything
  why: Every image scales or shifts on hover, making the gallery restless and moving crops and alignment
  better: Use hover to reveal actionable information, or keep images still
  keep_when:
  - id: inspection-zoom
    when: hover zoom that lets a visitor inspect detail on one or two product or artwork images, not a
      transform across a gallery
    evidence: none
- id: motion.transition-all
  why: Transitioning all properties animates unintended properties and makes interaction inconsistent
  better: Name the properties and durations to animate
- id: motion.reduced-motion-missing
  why: Nonessential motion has no reduced-motion branch, so motion-sensitive users cannot avoid it
  better: Under reduced motion, remove spatial motion and keep state feedback
- id: motion.ambient-loops
  why: Infinite decorative micro-loops compete with the task for attention
  better: Keep only motion earned by state, expression, or subject, with reading and reduced-motion control
    preserved
  keep_when:
  - id: planned-expressive-motion
    when: expressive or subject-driven motion recorded in the plan's motion dial
    evidence:
    - plan: direction.dials.motion
      min: 7
- id: motion.scroll-gated-content
  why: Scroll animation gates reading, leaving content hidden or delayed until the animation runs
  better: Keep content available at rest and enhance progressively
  keep_when:
  - id: story-with-static-fallback
    when: a scroll-driven story whose content is complete and readable with animation off, shown by the
      reduced-motion capture
    evidence: none
- id: copy.dash-cadence
  why: Frequent dashes in labels, calls to action, or every paragraph give unrelated messages one cadence
    and hide whether the relation is cause, contrast, or aside
  better: Use sentence structure and punctuation that state the relation; keep a dash where the relation
    is clear and matches the voice
  keep_when:
  - id: approved-copy
    when: approved copy
    evidence:
    - brief
  - id: exact-quotation
    when: exact quotations
    evidence:
    - source
  - id: notation
    when: notation
    evidence: none
  - id: genuine-interruption
    when: a genuine interruption
    evidence: none
- id: copy.buzzwords
  why: Sales words and lexical markers claim improvement, seamlessness, or scale without an observable
    difference, so the claim fits any product
  better: Name the user action, the handoff removed, or the verifiable capability
  keep_when:
  - id: governed-term
    when: a governed technical meaning, such as robust error handling
    evidence:
    - source
  - id: brand-voice-with-proof
    when: an established brand voice paired with specific proof nearby
    evidence:
    - design
    - brief
- id: copy.contrast-frame
  why: A negative setup that corrects no belief exists only to enlarge the positive claim that follows
  better: Write one direct proposition with the supported capability
  keep_when:
  - id: scope-or-misconception
    when: the contrast carries scope or corrects a real misconception
    evidence: none
  - id: quoted-or-governed
    when: quoted or governed language
    evidence:
    - source
    - brief
- id: copy.staging
  why: The text announces a point before making it, or closes by praising what it just said
  better: State the point
  keep_when:
  - id: safety-staging
    when: staging that establishes safety
    evidence: none
  - id: narrative-voice
    when: narrative voice
    evidence: none
- id: copy.forced-triad
  why: Ideas are padded into threes, or synonyms pose as separate benefits for symmetry
  better: List the actual parts or actions, however many there are
  keep_when:
  - id: true-triad
    when: a complete set that truly has three parts
    evidence: none
- id: copy.uniform-rhythm
  why: Sentence length barely varies, openings or endings repeat, or headings are built as short sentence
    pairs, so the rhythm follows a rule instead of the content
  better: Merge repeated structures, name the one fact each heading carries, and let sentence shape follow
    the content
  keep_when:
  - id: deliberate-anaphora
    when: deliberate anaphora in a speech, quotation, or campaign
    evidence: none
  - id: approved-headline
    when: the brief or approved copy fixes the headline wording
    evidence:
    - brief
    - source
  - id: distinct-facts
    when: each short sentence of a heading states a separate fact, and the pairing is not the cadence
      of the whole page
    evidence: none
- id: copy.generative-metaphor
  why: Imported metaphor families unrelated to the subject stand in for plain statements
  better: State the literal proposition first; keep only imagery drawn from the subject's world_materials
  keep_when:
  - id: metaphor-is-argument
    when: the metaphor is the argument itself
    evidence: none
  - id: world-material-imagery
    when: imagery taken from world_materials
    evidence:
    - material
- id: copy.empty-significance
  why: An ordinary detail is labeled pivotal, transformative, or historic without support
  better: Keep the capability and remove the unsupported significance
  keep_when:
  - id: supported-significance
    when: significance the source supports, such as a stated date, dependency, or cited result
    evidence:
    - source
- id: copy.borrowed-authority
  why: Vague attribution or borrowed authority asserts support that the copy cannot show
  better: Cite supplied, attributable evidence or state the relation the source defines; remove an unsupported
    authority claim, and never invent a relation
  keep_when:
  - id: undefined-source-relation
    when: the source does not define the relation; keep the vague wording or ask rather than invent one
    evidence: none
- id: copy.intensifier-hedging
  why: Intensifiers and stacked hedges replace a precise claim with degree words
  better: State the claim at the strength the evidence supports
  keep_when:
  - id: exact-quotation
    when: exact quotations
    evidence:
    - source
  - id: required-qualifier
    when: qualifiers that a regulation, a medical label, or a legal notice requires
    evidence:
    - source
    - brief
  - id: calibrated-to-source
    when: hedges that state the strength the source supports, such as a forecast range or a study's stated
      uncertainty
    evidence:
    - source
- id: copy.closing-formula
  why: A stock closing formula ends the text with an outlook or summary that adds nothing
  better: End on the last fact or the next action
  keep_when:
  - id: exact-quotation
    when: exact quotations
    evidence:
    - source
  - id: genre-sign-off
    when: a sign-off that the text's genre requires, such as the close of a letter or an email
    evidence: none
- id: copy.formatting-residue
  why: Formatting follows a rule - bold-labeled bullets, emoji markers, restating headings - instead of
    the structure readers use
  better: Format only the relationships the content has
  keep_when:
  - id: consistent-reference-format
    when: scan-oriented reference pages that use consistent formatting
    evidence: none
- id: copy.translationese
  why: Constructions carried over from English, such as double passives and heavy postpositional phrases,
    make the text read as translated
  better: Write directly in the target language, using particles and endings to show the relations
  keep_when:
  - id: quoted-or-governed
    when: quoted or governed language
    evidence:
    - source
    - brief
- id: copy.register-mix
  why: Honorific or formality registers mix on one surface
  better: Set the register per surface in the plan and keep it
  keep_when:
  - id: quoted-speech
    when: quoted speech
    evidence:
    - source
  - id: fixed-legal-register
    when: legal text with a fixed register
    evidence:
    - source
    - brief
- id: copy.name-swap
  why: The key copy stays true when the product name is swapped for another product, so it says nothing
    specific
  better: Rewrite around a fact, material, or action that only this product has
  keep_when:
  - id: fixed-function-text
    when: text whose wording its function or the law fixes, such as terms, a privacy notice, or a standard
      system message
    evidence:
    - source
    - brief
- id: copy.vague-cta
  why: Vague or duplicate action labels leave the outcome unclear at the decision point
  better: Name the outcome of the action in the label
  keep_when:
  - id: step-title-states-outcome
    when: a multi-step flow where the step title states the outcome
    evidence:
    - plan: flows[*].max_steps
      min: 2
- id: copy.fabricated-proof
  why: Invented metrics, customers, quotes, logos, or credits are presented as real evidence
  better: Use real, permissioned proof, clearly labeled sample data, or structurally neutral placeholders
  keep_when:
  - id: disclosed-sample-data
    when: sample or demo data disclosed once where the data is presented
- id: copy.error-without-recovery
  why: An error message apologizes or jokes without naming the problem and a route forward
  better: Say what happened, what it affects, and what the user can do next
  keep_when:
  - id: cause-withheld-for-security
    when: the cause is withheld on purpose so the message does not reveal whether an account or item exists,
      and a way forward is still offered
    evidence: none
- id: copy.meta-text
  why: Copy tells the visitor how the page was made instead of serving the subject - a demo or fictional-data
    notice in the opening, in a heading, or repeated past the one the brief asks for; change-log narration;
    the page describing itself; developer and test notes; an apology for a part nobody built - or addresses
    the builder, the prompt, or QA, or repeats what the hierarchy already says
  better: Show the subject and the visitor's task, and leave out how the page was made, that it is a demo,
    and what changed. When the brief requires a notice that the data is fictional, state it once, short,
    in the footer or a small persistent label, never in the hero, a heading, or beside each section; move
    implementation and test notes to the developer handoff
  keep_when:
  - id: qualified-disclosure
    when: a consequential disclosure - simulation, non-delivery, privacy, persistence, consent, eligibility,
      recovery, safety, or legal - that the visitor needs at the decision it qualifies, said once there
      and not again elsewhere
    evidence: none
  - id: compatibility-label
    when: a version, build, or environment label where compatibility or availability depends on it
    evidence: none
- id: copy.separator-join
  why: The same label, separator, and dependent tail recur across unrelated content, flattening a title
    and its qualifier into peers
  better: Diagnose each side's role, then express the relation with grammar, hierarchy, or clear field
    syntax while keeping every fact; do not mass-replace separators or force every repair into a two-line
    heading
  keep_when:
  - id: label-value-syntax
    when: clear label-value syntax
    evidence: none
  - id: conventional-title-punctuation
    when: conventional title and subtitle punctuation whose relation is already clear
    evidence: none
  - id: peer-metadata
    when: genuine peer metadata and enumerations
    evidence: none
  - id: notation-or-code
    when: notation and code
    evidence: none
  - id: exact-quotation
    when: exact quotations
    evidence:
    - source
  - id: governed-name
    when: governed names and approved official copy
    evidence:
    - source
    - brief
- id: copy.decorative-metadata
  why: A middle-dot strip gains prominence without changing a task; when short items echo the page's heading
    vocabulary rather than a decision record, it repeats the topic as ornament
  better: Remove topic echoes; keep route, date, direction, units, artist, year, material, dimensions,
    chart scope, source, and byline records beside the object they qualify
  keep_when:
  - id: decision-metadata
    when: real metadata the user filters or decides by
    evidence: none
- id: copy.placeholder-content
  why: Placeholder names and companies hide edge cases and the product's voice
  better: Use representative, clearly synthetic content matched to the domain, including long and local
    names
  keep_when:
  - id: reserved-example-values
    when: values reserved for examples, such as example.com or 555 phone numbers, in documentation or
      code samples
    evidence: none
- id: copy.typical-phrasing
  why: The copy sits close to the current defaults corpus in phrasing and construction
  better: Rewrite around the subject's facts and materials rather than substituting synonyms
  keep_when:
  - id: fixed-by-convention
    when: wording that a legal, platform, or interface convention fixes, such as terms, system dialogs,
      or standard control labels
    evidence:
    - source
    - brief
  - id: approved-copy
    when: approved copy
    evidence:
    - brief
- id: copy.stock-reassurance
  why: Comfort wording recurs through the headings and lines of the page, promising a feeling where the
    page could say what is kept, when, and how it comes back
  better: Name what is protected or done, the moment it happens, and the way back; let the feeling follow
    from that outcome
  keep_when:
  - id: outcome-named-beside
    when: the same sentence or the next one names the concrete outcome the comfort rests on
    evidence: none
  - id: approved-wording
    when: the brief or approved copy fixes the wording
    evidence:
    - brief
    - source
  - id: exact-quotation
    when: an exact quotation of a real customer or document
    evidence:
    - source
- id: copy.template-offer-terms
  why: Trial, card, and cancellation terms stack under the calls to action as a set whether or not the
    business set them, so the template invents commercial terms
  better: State the terms the business has, once, beside the action they qualify, and leave out the ones
    it does not have
  keep_when:
  - id: terms-given
    when: the brief or the business's published terms give these terms
    evidence:
    - brief
    - source
- id: imagery.css-illustration
  why: CSS primitives assemble a pseudo-illustration from generic shapes that stand in for the subject
  better: Art-direct imagery from real objects, processes, or data
  keep_when:
  - id: brand-geometry
    when: abstract geometry that is the brand's established visual language
    evidence:
    - design
    - brief
- id: imagery.jagged-clip
  why: A jagged decorative clip path on unrelated photos competes with the image subject
  better: Choose crop and contour from the content
  keep_when:
  - id: content-contour
    when: a clip that follows the outline of the image's own subject, such as a product silhouette or
      a map region
    evidence: none
  - id: contract-shape-language
    when: a brand shape language recorded in the contract
    evidence:
    - design
- id: imagery.buried-raster
  why: A heavy gradient or overlay buries the main image to rescue text contrast
  better: Show the image with legible contrast by placing text off it, or remove the image
  keep_when:
  - id: decorative-backdrop
    when: a decorative backdrop with empty alt text, which carries nothing the page needs
    evidence:
    - asset:
        role:
        - decorative
- id: imagery.missing-content-image
  why: A content image is broken or an unresolved placeholder, or meaningful image information has no
    text alternative
  better: Use owned assets or labeled local placeholders and give meaningful images a text alternative
  keep_when:
  - id: empty-alt-decoration
    when: decorative images with an empty alt attribute
- id: imagery.generic-stock
  why: A generic stock scene supplies category cliche instead of evidence about the product
  better: Commission or select context-specific, permissioned imagery
  keep_when:
  - id: supplied-asset
    when: an image the client or brief supplied, recorded in the asset ledger with its origin
    evidence:
    - asset:
        origin:
        - own
        - commissioned
- id: code.mobile-100vh
  why: A full-height shell sized with the static viewport height is clipped by mobile browser chrome
  better: Use dynamic viewport units and test on the target
  keep_when:
  - id: dvh-fallback
    when: 100vh is only the fallback declared before a dynamic-viewport value for the same property
    evidence: none
  - id: no-mobile-browser
    when: the brief lists no web platform, such as a desktop app or an embedded kiosk, so no mobile browser
      chrome resizes the viewport
    evidence:
    - plan: brief.platform
      lacks:
      - web
- id: code.focus-outline-removed
  why: The focus outline is removed without a replacement, so keyboard focus is invisible
  better: Provide a visible focus-visible style with enough contrast
- id: code.clickable-non-interactive
  why: A clickable div or span lacks the name, role, state, and keyboard behavior of a real control
  better: Use a native button or link
- id: code.image-dimensions
  why: Images without intrinsic dimensions shift content as they load
  better: Supply width and height or an aspect ratio
  keep_when:
  - id: css-reserved-box
    when: the box is reserved by a CSS aspect-ratio or fixed size that the source query cannot see, and
      the render shows no layout shift
    evidence: none
- id: code.locale-time-rendering
  why: Hard-coded dates, numbers, or locale strings go stale or wrong by locale, and time-dependent output
    differs between server and client
  better: Format with locale-aware APIs, stabilize the initial value, then update safely on the client
  keep_when:
  - id: content-literal
    when: a date or number that is part of the written content, such as a publication date or a historical
      year
    evidence: none
  - id: fixed-format-by-spec
    when: a format that the brief or a standard fixes, such as ISO 8601 timestamps in a log view
    evidence:
    - brief
    - source
- id: code.continuous-value-in-state
  why: Continuous pointer or scroll values stored in component state cause re-render loops and stutter
  better: Use motion values, refs, CSS, or platform APIs for continuous values
  keep_when:
  - id: frame-throttled
    when: the setter runs at most once per frame through requestAnimationFrame or a throttle
    evidence: none
  - id: value-is-displayed
    when: the value is rendered as text or structure that refs and CSS cannot update, such as a slider's
      numeric readout
    evidence: none
- id: code.animation-package-mismatch
  why: Animation imports do not match the installed package or API, or several animation packages are
    mixed
  better: Verify the project dependency and its supported import; keep one animation stack
  keep_when:
  - id: matching-import-path
    when: either import path is fine when it matches the installed package
    evidence: none
- id: code.unvirtualized-list
  why: A large list renders every item in a scrolling data surface, stalling and consuming memory
  better: Virtualize when the measured volume requires it
  keep_when:
  - id: measured-within-budget
    when: the full list was measured on the target device and stays within a performance budget that the
      brief states
    evidence:
    - brief
  - id: needs-full-dom
    when: the full list must stay in the page for find-in-page, print, or assistive technology, and its
      count is bounded by the source
    evidence: none
- id: reference.brand-asset-reuse
  why: Logos, illustrations, or copy from a reference-only source are reused as they are
  better: Take relations from the reference and leave its assets, identity, and copy behind
- id: reference.clone-risk
  why: Layout structure, palette roles, type fingerprint, and copy are all close to one reference at once
  better: Keep the relations named in the plan's take list and change the rest; borrowing one dimension
    is structure, not cloning
  keep_when:
  - id: licensed-reference
    when: the reference is owned or licensed for this use
    evidence:
    - plan: references[*].rights
      has:
      - own
      - licensed
- id: rights.no-provenance
  why: A shipped image, video, icon set, or font has no provenance record, so nobody can show where it
    came from or what its license allows
  better: Record the asset with its source, license, and intended use, or replace it with one you can
    record
- id: rights.license-unknown
  why: An asset or font ships under a license that stayed unknown after it was looked for, from an unknown
    origin, or without a record of where its license document is kept
  better: Ask the user, or replace the asset or font with one whose license you can read from the rights
    holder or provider and record where it is kept
- id: rights.license-unresearched
  why: A font ships under a license nobody has looked for, so "unknown" only means it was not read, and
    the lock holds no record of any search
  better: Research the license before deciding (the font's own records, the foundry's page, the terms
    of whatever installed it) and record what you find; ship only a font whose license the research verified
- id: rights.license-hint-only
  why: The recorded license comes from a catalog badge or embedded file metadata, which point to a license
    but do not grant one
  better: Read the license for the exact item from the rights holder or provider and record that
- id: rights.use-outside-license
  why: 'The recorded use goes beyond the license: commercial use under a non-commercial license, non-editorial
    use under an editorial-only license, an edited work whose license forbids derivatives, a platform
    the license does not cover, a generator input the license excludes, or font files shipped from a synced,
    system, or unknown copy'
  better: Keep the asset where its license allows, obtain a license for this use, ship files from a channel
    that grants it, or replace the asset
- id: rights.license-expired
  why: The license, approval, or relationship behind an asset has ended and the asset still ships
  better: Renew the right, or remove the asset and ship its recorded replacement
- id: rights.attribution-missing
  why: A license that requires credit has no recorded credit text or placement
  better: Record the credit in the form the license asks for and show it where the record says
- id: rights.notice-missing
  why: Distributed fonts, icons, or other licensed files ship without the license and copyright notices
    their license requires, or the recorded notice file holds something other than the license text
  better: Ship the license text and copyright notice with the files, in a licenses folder or an about
    screen; a visible credit does not replace them
- id: rights.reserved-font-name
  why: A subset or converted open font keeps a name its license reserves for the original release
  better: Rename the modified font's internal names, ship the unmodified release, or obtain written permission
    from the rights holder
- id: rights.unverified-mark
  why: Another party's logo or mark appears without confirmed authorization, or implies a customer, partner,
    or press relationship that nobody confirmed
  better: Confirm the relationship and use the owner's approved asset and guidelines, or name the other
    party in plain text
  keep_when:
  - id: plain-reference-allowed
    when: a compatibility or integration reference whose owner's guidance allows plain reference, recorded
      as not-needed
- id: rights.generated-as-evidence
  why: Generated media stands in for a real product, person, place, or result that the page presents as
    real
  better: Use a real photograph or recording as evidence, or make the generated image plainly illustrative
    and change its role
- id: rights.generated-from-reference
  why: Reference-only material went into a generator, so the output can carry expression from a source
    the project may only study
  better: Generate again from own or licensed inputs and a description of the qualities to carry over
- id: rights.generated-unreviewed
  why: Generated media ships without a check for stray marks, watermarks, recognizable people, copied-looking
    characters, or broken text
  better: Review each generated asset for those problems and record the review in the ledger
- id: rights.release-missing
  why: A photo or video in commercial or promotional use may show people or private property whose release
    status is open
  better: Record obtained releases, or record that nothing needing one is depicted; otherwise replace
    the media
- id: rights.unapproved-mark-symbol
  why: A registered or trademark sign appears without brand guidance that sets it for that mark
  better: Drop the sign, or follow the owner's approved guidance and record the symbol with the mark
