# LapisLazuli rules — v0 (names-and-alternatives view)
# Generated by tools/build/build.py from src/shared/slop/rules.yaml; edit the source, not this file.
version: 0
as_of: 2026-09
rules:
- id: system.font-outside-contract
  why: A font family outside the design contract gives one region an unrelated typographic voice
  better: Use the contract family for that role, or record a proposed design change with the reason
  keep_when:
  - the change is recorded as a proposed design change
- id: system.literal-color
  why: Literal colors outside semantic tokens drift into near-duplicate grays and accents
  better: Use the semantic token for the role, or add a token when the value repeats with a real role
  keep_when:
  - data or content colors that come from the content itself, such as a product swatch
- id: system.off-scale-value
  why: One-off radius, size, or spacing values make equivalent components drift without a role or optical
    reason
  better: Use the scale step for the same role and condition; document an optical correction when one
    is needed
  keep_when:
  - a documented optical correction, such as balancing an icon inside a round button
- id: system.bypassed-primitive
  why: A component that bypasses the adopted primitives or theme API behaves and styles its states differently
    from its peers
  better: Build on the adopted primitive and theme API; extend the primitive when it lacks a needed state
  keep_when:
  - the primitive cannot express a documented requirement and the gap is recorded
- id: type.serif-luxury-display
  why: A high-contrast or italic serif display stands in for premium without any tie to the subject
  better: Choose display type from the product's material, voice, and content; compare a subject-earned
    serif, sans, and mixed route
  keep_when:
  - the brand or contract specifies the face
  - publishing or editorial subjects where the reading sequence earns it
- id: type.eyebrow-kicker
  why: A small tracked uppercase label or index marker repeats before most headings without adding category,
    scope, state, or sequence
  better: Remove it; when context is needed, write a specific label and let the title carry the proposition
  keep_when:
  - the label names a real category or scope that differs between sections
  - the marker numbers a real ordered process
- id: type.heading-badge
  why: A badge chip or status strip above a headline delays the message and can imply a state that does
    not exist
  better: Keep a real current status beside the object it describes; otherwise omit it
  keep_when:
  - the badge reflects authoritative current state
  - the chip filters content or identifies authoritative current state
- id: type.icon-tile-heading
  why: Every section opens with the same stacked icon tile, heading, and paragraph, so the icon only duplicates
    the label
  better: Use icons for recognition or actions; let content differences shape each section
  keep_when:
  - icons that users need to recognize a category or action
- id: type.oversized-display
  why: Headline scale grows past the content and viewport need, crowding the task or wrapping awkwardly
  better: Balance title, evidence, and action for the surface; do not force every opening into one viewport
  keep_when:
  - an immersive or campaign opening where the title is the content
- id: type.negative-tracking
  why: Tracking tighter than the face tolerates makes letterforms collide and word shapes collapse
  better: Respect the face's spacing; tighten only display sizes where the letterforms survive
  keep_when:
  - a display face designed for tight setting at that size
- id: type.body-tracking
  why: Positive tracking on paragraphs stripes the text and tires the reader
  better: Keep body tracking near the face's default
- id: type.tight-leading
  why: Body leading near 1 makes ascenders and descenders collide and lines hard to track
  better: Set leading for size, measure, script, and content
- id: type.long-measure
  why: Paragraphs that run past a comfortable measure make readers lose the next line
  better: Constrain the prose measure; give data its own grid
  keep_when:
  - tables and data rows, which follow their own grid
- id: type.flat-hierarchy
  why: Title, label, and body share size, weight, and color, so the scan order is flat despite semantic
    headings
  better: Separate adjacent roles by changing one lever at a time - size, weight, contrast, or space
- id: type.overused-neutral-grotesque
  why: A featureless low-contrast, high-x-height grotesque carries every role with no distinction between
    product, editorial, and data voices
  better: Pair type by role, or record a keep decision when body readability or the contract justifies
    it
  keep_when:
  - the contract or platform specifies the face
  - a one-family system with deliberate role variation
- id: type.single-neutral-sans
  why: One family, usually a neutral sans, carries every role with no variation in width, optical size,
    or weight, so consistency turns into monotony
  better: Vary optical size, width, or weight by role, or add a deliberate companion face
  keep_when:
  - a one-family system that varies width, optical size, or weight by role
  - body readability on the target platform favors one family
  - the contract specifies one family
- id: type.caps-prose
  why: All-caps prose and decorative micro-labels assert importance without adding hierarchy or meaning
  better: Reserve capitals for brief, readable labels whose role or brand earns them
  keep_when:
  - short labels whose role is established
  - brand wordmarks
- id: type.tiny-ui-text
  why: Miniaturized interface text signals sophistication at the cost of legibility
  better: Use readable sizes and reduce density structurally instead
  keep_when:
  - legal or metadata text that has a readable alternative
- id: type.costume-monospace
  why: Monospace is worn as a technical costume on prose and headings instead of marking code, identifiers,
    or aligned values
  better: Use monospace for semantic code, identifiers, or aligned numbers
  keep_when:
  - developer products where the text is code
  - a brand face that happens to be monospaced
- id: type.font-fallback
  why: Text renders in a fallback font instead of the requested one, mixing sizes and color between scripts
  better: Lock a face that covers every script in the locales, or pair a companion with matched metrics
- id: type.synthetic-style
  why: The browser synthesizes bold or italic that the font does not have, distorting the letterforms
  better: Load the real weight or style, or choose a face that has it
- id: type.ko.body-negative-tracking
  why: Negative tracking applied to Korean body text out of habit crowds the syllable blocks
  better: Keep Hangul body tracking at the face's default unless a measured face needs a small correction
  keep_when:
  - the face's metrics are measured to need it at that size
- id: type.ko.keep-all-missing
  why: Korean body text breaks inside words because word-break keep-all is missing
  better: Set word-break keep-all on Korean text blocks and allow overflow-wrap for long tokens
- id: color.palette-swap-only
  why: A palette or primary-color swap is the only change to a starter surface, so color is asked to distinguish
    default type, composition, and components
  better: Derive color roles from the subject, then resolve type, composition, imagery, and states on
    their own terms
  keep_when:
  - the task is only a recolor of an approved system
- id: color.violet-blue-gradient
  why: A violet-to-blue gradient supplies the whole mood of an otherwise unchanged composition
  better: Derive color roles from the subject and let a gradient appear only where it encodes something,
    such as a spectrum
  keep_when:
  - an approved brand gradient
  - generative media, or light as the subject
- id: color.gradient-headline
  why: Gradient text or one accent-colored word is the headline's main emphasis, substituting a color
    effect for title craft
  better: Write a precise title; use a solid role color or image emphasis only when it clarifies meaning
  keep_when:
  - the colored word encodes a real category or state
- id: color.hero-halo
  why: A radial halo or soft spotlight behind the hero fills space and simulates depth without meaning
    or a material model
  better: Recompose around content or use subject-specific imagery; keep one consistent light and surface
    model
  keep_when:
  - light itself is the subject, such as a lighting or display product
- id: color.neon-glow
  why: Bright outer glow on dark surfaces is a technical costume that blurs hierarchy and boundaries
  better: Build a functional dark palette with semantic roles; mark focus and state with borders and contrast
  keep_when:
  - nightlife, gaming, or display subjects where emitted light is the material
- id: color.gray-on-color
  why: A neutral gray text token placed on a saturated surface looks muddy and often fails contrast
  better: Use an on-color role tuned to the surface hue and test it on the actual surface
- id: color.warm-editorial
  why: Warm cream, a clay or brass accent, and serif display arrive together as a category-generic premium
    package
  better: Earn warmth through the subject's materials, imagery, and brand evidence; resolve type and accent
    separately
  keep_when:
  - food, publishing, craft, or material products whose type, imagery, grid, and copy come from the subject
- id: color.cream-base
  why: A warm cream field reads as quiet premium by default; alone it is weak, together with a clay accent
    and serif display it is a package
  better: Choose the field from the subject's paper, material, or imagery, and check it against the content
    colors
  keep_when:
  - the subject's material is paper or unbleached stock
  - an approved brand field
- id: color.terracotta-accent
  why: An earthy accent used regardless of the subject, where one fashionable hue substitutes for identity
  better: Ground the accent in the subject's world_materials, or choose again from the plan's color relations
  keep_when:
  - an approved brand color
  - the subject itself is terracotta or clay
- id: color.competing-accents
  why: Several unrelated accent hues compete, so action, focus, status, data, and ornament become ambiguous
  better: Allocate each accent to a role and check its area and repetition; there is no universal accent
    count
  keep_when:
  - categorical data palettes
  - a multi-hue relation chosen in the plan
- id: color.mixed-neutrals
  why: Neutrals of different temperatures make components look assembled from different kits
  better: Use one neutral family, or deliberate warm and cool zones with a reason
  keep_when:
  - deliberate temperature zones recorded in the plan
- id: color.pure-endpoints
  why: Pure black and white used by habit flatten material relationships
  better: Choose endpoints deliberately while keeping the required contrast
  keep_when:
  - high-contrast themes
  - e-ink or print targets
  - an approved brand pair
- id: color.inverted-dark-theme
  why: The light palette is inverted literally for dark mode, so elevation, images, focus, and status
    colors look wrong
  better: Define dark-theme roles separately, with lighter surfaces for elevation and re-tuned status
    and focus colors
- id: color.text-contrast
  why: Text contrast below the applicable requirement, measured on the actual surface in every theme
  better: Adjust the text or surface role until both themes meet the requirement on the worst backdrop
    state
  keep_when:
  - disabled controls and pure decoration are outside this requirement
- id: color.dark-luminous
  why: A dark field, violet-to-blue gradients, glow, glass cards, and buzzword copy arrive together as
    a technical-mood package
  better: Build a functional dark palette with semantic roles and let the product's real output supply
    any ambient color
  keep_when:
  - generative media
  - light or spectral subjects
  - an established brand that uses these materials
- id: surface.glass-everywhere
  why: Translucent glass on most panels stops communicating layering and weakens backdrop contrast
  better: Reserve transparency for real overlays and depth
  keep_when:
  - platform materials that the platform itself applies
  - overlays above live content
- id: surface.uniform-large-radius
  why: One large or pill radius on every container erases shape hierarchy
  better: Assign radii by component role and platform
  keep_when:
  - a platform convention
  - a brand shape language recorded in the contract
- id: surface.side-accent-border
  why: A colored side border on rounded cards speaks a selected-state language without any state
  better: Show actual selection or hierarchy, or remove the border
  keep_when:
  - the border marks real selection, status, or a callout type
- id: surface.depth-cue-conflict
  why: Borders and shadows disagree in color, direction, or depth with the rest of the surface model
  better: Align boundary and elevation roles to one shared light and depth model
  keep_when:
  - a fine border plus soft shadow on an overlay, where both roles are distinct
- id: surface.decorative-grid-texture
  why: A decorative grid or crosshair background adds a designed texture with no product meaning
  better: Derive texture from the subject, or remove it
  keep_when:
  - the grid is the subject, such as a drafting, mapping, or measurement product
- id: surface.hard-offset-shadow
  why: Thick outlines with hard offset shadows on every card replace one package with another over an
    unchanged structure
  better: Keep hard edges only where a direct graphic voice is earned, and resolve the structure first
  keep_when:
  - games, creator commerce, or a brand with an established direct graphic voice
- id: surface.hard-edge-graphic
  why: Offset shadows, costume monospace, capitals, and oversized grotesque arrive together as a hard-edge
    package
  better: Resolve structure, type roles, and palette from the subject before choosing a graphic voice
  keep_when:
  - games, creator commerce, culture, or independent tools with an established direct voice
- id: layout.hero-before-priority
  why: A centered or split hero shell was chosen before the proposition, evidence, action, and imagery
    were ranked
  better: Rank the opening's content first, then choose the conventional or unusual composition that expresses
    that order
  keep_when:
  - the ranked content genuinely calls for the conventional shell
- id: layout.equal-siblings
  why: Feature or pricing cards get equal size and emphasis despite unequal content, flattening priority
    and recommendation
  better: Let comparison needs and content importance set count, span, order, and emphasis
  keep_when:
  - a genuine peer comparison of equal items
- id: layout.nested-cards
  why: Containers stack border on border without distinct ownership or behavior, obscuring relationships
  better: Group with space, rules, or one meaningful surface
  keep_when:
  - an inner surface with its own role, such as a chart plot area inside a data card
- id: layout.template-section-sequence
  why: Section order follows a category landing template, or unrelated sections repeat identical spans,
    instead of following the questions the reader brings
  better: Order sections by the reader's evaluation or task sequence, and vary structure when the content
    relation changes
  keep_when:
  - the reader's questions genuinely follow that order
- id: layout.bento-filler
  why: A bento cell exists only to complete the grid shape, so empty modules advertise the template
  better: Give one cell to each meaningful item and vary weight by importance
- id: layout.zigzag
  why: Image and text rows alternate by rule without a narrative reason, making distinct ideas look equivalent
  better: Consolidate related content or choose a structure that reflects each relationship
  keep_when:
  - a step-by-step narrative where alternation tracks the sequence
- id: layout.decorative-numbering
  why: Numbers on non-sequential sections imply progress, sequence, or record identity that does not exist
  better: Number only real steps, ranked items, or records; otherwise use descriptive headings
  keep_when:
  - a real ordered process
  - ranked items
  - record identifiers
- id: layout.heading-proximity
  why: The space above a heading is no larger than the space below it, so the heading attaches to the
    previous section
  better: Give headings more space above than below
- id: layout.monotonous-spacing
  why: The same gap at every hierarchy level makes siblings, groups, and sections hard to tell apart
  better: Order spacing as inside a group, then between siblings, then between groups, then between sections
- id: layout.compact-overflow
  why: Fixed columns overflow at compact width, so text or controls clip, overlap, or force page scrolling
  better: Let columns collapse or reflow at compact widths; scroll only regions whose content needs two
    dimensions
  keep_when:
  - data tables, maps, and diagrams that scroll inside their own region
- id: layout.crowded-hero
  why: A logo wall, metrics, and extra copy packed into the hero bury the proposition and the action
  better: Keep the opening to proposition and action; place real proof immediately after
- id: layout.edge-flush
  why: Cards touch the viewport or scroller edge without a safe inset, so content feels clipped and targets
    become awkward
  better: Add an intentional inset and a visible scroll affordance
  keep_when:
  - full-bleed media that is meant to run to the edge
- id: layout.split-heading
  why: A heading sits in one column and its explanation in another, splitting a dependent reading path
  better: Keep a dependent heading and intro in one reading path
- id: layout.decorative-opening-stack
  why: A decorative opening stack pushes necessary context or the primary action out of reach
  better: Remove the unearned stack; keep deliberate long-form or immersive openings without enforcing
    a universal fold
  keep_when:
  - a deliberate immersive or long-form opening
- id: layout.wrapped-navigation
  why: Navigation wraps to two lines at common desktop widths, consuming the opening and destabilizing
    scanning
  better: Prioritize the items or change the navigation model
- id: layout.occluded-text
  why: A decorative layer covers text, hiding content
  better: Reorder the layers or reserve space for the text
  keep_when:
  - display type that a layer overlaps partly while every word stays legible
- id: layout.card-everything
  why: Cards become the whole page structure, so every item is equal and enclosed
  better: Use rows, groups, sections, or bare content where they express the relation better
  keep_when:
  - collections of independent, comparable objects
- id: layout.shrunk-desktop
  why: The compact layout is the desktop composition shrunk, treating responsive behavior as scale
  better: Define content order, collapse, and density for each section at each width
- id: layout.symmetry-excess
  why: Nearly everything centers on one axis, so the layout expresses no priority through placement
  better: Place content by reading order and weight; keep symmetry where the content is genuinely balanced
  keep_when:
  - ceremonial, poster-like, or single-message surfaces
- id: layout.missing-signature
  why: No element unique to this subject and task is planned or rendered, so the surface could belong
    to any product
  better: Name one signature element drawn from world_materials in the plan and build it
- id: layout.typical-composition
  why: The composition sits close to the current defaults corpus across sequence, archetypes, symmetry,
    and density
  better: Revisit the content ranking and signature; change the structure where the content relation differs
- id: component.emoji-icons
  why: Emoji or Unicode glyphs serve as product icons, so weight and style vary by operating system
  better: Use one maintained icon family and label icon-only buttons
  keep_when:
  - user-generated content, reactions, or a brand voice built on emoji
- id: component.hand-drawn-icons
  why: Hand-authored SVG paths for standard actions reinvent tested geometry and drift from the library
    icons beside them
  better: Use the project icon family for standard actions; draw custom icons only for subject-specific
    concepts
  keep_when:
  - custom icons for concepts the family does not cover, drawn on the family's grid and stroke
- id: component.mixed-icon-families
  why: Two or more icon families on one surface disagree in stroke, fill, optical size, and grid
  better: Normalize to one family, weight, grid, and alignment
- id: component.fake-app-window
  why: Decorative divs mimic an app window or data, replacing real product evidence with a facsimile
  better: Use a real capture or a clearly labeled illustrative slot
  keep_when:
  - a labeled illustration where no product exists yet
- id: component.generic-spinner
  why: One spinner for every wait ignores duration and layout and gives no sense of structure or preserved
    task
  better: Choose by wait - a delayed indicator, skeleton, progress, or inline status
- id: component.library-default-theme
  why: The component library's starter styling has become the brand even though its behavior is sound
  better: Keep the useful primitives, then define type, color roles, radius, spacing, states, and composition
    from the product
  keep_when:
  - internal tools where the library's system is the adopted contract
- id: component.unlabeled-input
  why: An input has no programmatic label, or its placeholder is the only label and disappears once the
    user types
  better: Associate a visible label with each field, with helper and error text linked to it
- id: component.unnamed-icon-button
  why: An icon-only control has no accessible name, so its action is undiscoverable with assistive technology
  better: Give the control a visible or programmatic name that states the action
- id: component.small-target
  why: A pointer target is smaller than 24 by 24 CSS px and has too little clear space around it, so it
    is easy to miss or to hit a neighbor
  better: Make targets at least 24 px, or keep clear space around small ones; touch-first surfaces are
    easier at 44 px
  keep_when:
  - links inside a sentence
  - controls left at the size the browser gives them
  - a control whose function a full-size control on the same page also offers
  - targets whose size carries information, such as map pins at their true positions
- id: ux.routine-modal
  why: A modal handles routine navigation or a long task, interrupting context without a protected-focus
    need
  better: Use a page, sheet, inline edit, or disclosure as the task requires
  keep_when:
  - confirmation of a destructive action
  - a short task that must block the rest of the screen
- id: ux.dead-control
  why: An element that looks interactive does nothing, or a runtime error or cosmetic result stands in
    for the promised state or data outcome
  better: Exercise the consequential path and make the control produce the state or data it promises
  keep_when:
  - a local prototype whose stated scope excludes the backend, where the control says so
- id: ux.missing-states
  why: A polished resting frame hides missing states that the task can reach - empty, loading, error,
    offline, success, or recovery
  better: Design and exercise every relevant state, including recovery
  keep_when:
  - states the surface cannot reach, such as offline on a static page
- id: ux.preselected-option
  why: An optional extra, a consent, or a costlier plan is already selected, so doing nothing becomes
    agreement
  better: Start optional choices unselected and let the user opt in; show plans side by side without a
    default pick
  keep_when:
  - a free, reversible default that is neither a consent nor a charge, such as standard delivery
- id: ux.drip-pricing
  why: Required fees, shipping, or taxes first appear, or the price rises or loses a discount, after the
    price the user compared, so the price shown is not the price paid
  better: Show the total the user must pay where the price first appears, or name each required charge
    there as still to be calculated, and keep it unless the user changes something
  keep_when:
  - a charge that depends on input given later, such as a delivery address, named as pending where the
    price first appears
- id: ux.sneak-into-basket
  why: An item or service enters the cart without the user adding it
  better: Add only what the user chose; offer extras as separate choices that start unselected
- id: ux.hidden-subscription
  why: A recurring charge's renewal price, cadence, trial end, or way to cancel is missing or out of view
    when the user commits
  better: Put the renewal price, cadence, trial end date, and how to cancel next to the commit control,
    readable without expanding anything
- id: ux.obstructed-exit
  why: Leaving takes far more effort than joining, or cannot be finished - repeated offers, a required
    call or chat, a hidden final action, or reauthentication the join did not need
  better: Keep a direct, visible exit in the channel the user joined through; beyond joining's effort,
    allow one consequence review and one confirmation, offer at most one alternative that does not block,
    and end with a receipt
- id: ux.false-hierarchy
  why: The option that serves the business far outweighs the refusal - a large filled button against small,
    faint, or unstyled text
  better: Give accepting and declining comparable size, contrast, and styling, and let the labels explain
    the difference
  keep_when:
  - choices without a business-favored side, such as confirming the user's own action
- id: ux.asymmetric-decline
  why: Accepting takes one action while declining is missing or takes more, such as a settings page of
    switches to turn off
  better: Offer the refusal on the same layer as the acceptance, completed in as few actions
- id: ux.nagging
  why: A request the user declined comes back during the same visit, pressing them to change the answer
  better: Respect the refusal and let the user change it later from a stable place such as settings
- id: ux.false-urgency
  why: A countdown restarts on reload or runs out with no consequence, or a stock count, a viewer count,
    or a purchase notice has no source or changes with no cause, inventing pressure to decide
  better: Show only real deadlines, stock, and activity with their basis, such as the closing time or
    when the count was updated, or show none
- id: ux.forced-action
  why: The flow demands something the goal does not need - an account, an optional consent, a permission,
    a share, an app install, or a survey - before the user can continue
  better: Ask only for what the task needs; offer a guest path and make optional steps skippable
  keep_when:
  - prerequisites the plan flow lists under requires with a reason, such as an account for a service that
    keeps the user's data
- id: ux.confirmshaming
  why: The refusal is worded to shame, guilt, or frighten the user into accepting
  better: Name the plain outcome of declining, such as not now or continue without the discount
- id: ux.back-trap
  why: Browser Back does not leave the page because the page adds history entries or reopens a sheet to
    hold the user
  better: Let Back leave the page; one Back may first close an overlay the user opened
- id: ux.keyboard-trap
  why: Keyboard focus enters a region and cannot leave it with Tab, Shift+Tab, or Escape, so the rest
    of the page is out of reach
  better: Let focus move on with standard keys; contain focus only inside an open modal that Escape or
    a close control dismisses
- id: ux.keyboard-inoperable
  why: A control that works with a pointer cannot be reached or activated from the keyboard
  better: Keep controls in the tab order and make Enter and Space do what a click does
- id: ux.focus-order
  why: Tab order jumps backward or across the layout, so keyboard users lose their place
  better: Order the DOM in visual reading order and avoid positive tabindex
- id: ux.no-bypass
  why: Every page opens with the same run of navigation stops and offers no way past it, so keyboard and
    screen reader users walk the whole block on each page
  better: Mark the primary content with a main landmark, start it with a heading, and add a skip link
    as the first stop
- id: ux.skip-link-missing
  why: Sighted keyboard users tab through a long repeated header on every page, or a skip link is present
    but leaves focus where it was
  better: Make the first stop a skip link that becomes visible on focus and moves focus into the main
    content
  keep_when:
  - a short header whose few stops are the page's main task
- id: ux.focus-obscured
  why: The focused control is entirely hidden behind a sticky header, a banner, or a fixed bar
  better: Reserve room with scroll padding or move fixed content so focused elements stay in view
- id: ux.dialog-focus
  why: A dialog opens without taking focus, lets focus slip behind it, cannot be closed with Escape or
    a visible control, drops focus when it closes, or starts a destructive confirmation on the destructive
    button
  better: Move focus into the dialog, keep it there while a modal is open, close on Escape and a visible
    control, return focus to the control that opened it, and start confirmations on the safe choice
- id: ux.unexpected-context-change
  why: Focusing a control or changing a value navigates, submits, or opens a window without the user asking
  better: Change context only on an explicit action such as a button, or say beforehand what the change
    will do
- id: ux.timeout-without-warning
  why: A session or hold expires without warning or a simple way to extend it, and entered work can be
    lost
  better: Warn before the limit with at least 20 seconds to extend in one action, or remove the limit
  keep_when:
  - limits that are essential or tied to a real-time event, such as an auction closing
- id: ux.gesture-only
  why: Reordering, sliding, swiping, or zooming works only with a drag or a multi-finger gesture
  better: Offer a single-tap alternative such as move buttons, a menu, or a value input, alongside keyboard
    support
  keep_when:
  - gestures that are the task itself, such as freehand drawing
- id: ux.hover-content
  why: Content that appears on hover cannot be reached with keyboard focus, dismissed without moving the
    pointer, or hovered without disappearing
  better: Reveal the same content on focus, close it with Escape, and keep it open while the pointer is
    over it
- id: ux.status-not-announced
  why: A result such as an added item, a saved change, or a new result count appears on screen but reaches
    neither a live region nor focus
  better: Put status text in a polite live region, and move focus only when the user must act on the result
- id: ux.input-error-unidentified
  why: After a failed submit the error shows only as a color or icon, is not tied to its field, or is
    neither announced nor focused
  better: Describe each error in text next to its field, link it programmatically, and move focus to the
    first error or a summary
- id: ux.redundant-entry
  why: A later step asks again for information the user already gave, without prefilling it or offering
    to reuse it
  better: Carry values forward within the flow, or offer a same-as option
  keep_when:
  - re-entry that protects security, such as confirming a new password
  - information that is no longer valid, such as an expired code
- id: ux.inaccessible-auth
  why: Signing in needs a puzzle, a transcription, or a memory test with no alternative, or blocks pasting
    into password and code fields
  better: Allow paste and password managers, and offer a way to sign in without a cognitive test
- id: ux.autoplay-audio
  why: Sound plays by itself with no way to pause or mute it, drowning out screen readers and startling
    people
  better: Start media muted or on request, with pause and volume controls
- id: ux.no-review-before-commit
  why: A purchase or other binding commitment is made in one action, with no step that shows the total
    and the choices and lets the user change them, and no way to undo it
  better: Show a review with the total, items, and terms and a way to edit them before the commit, or
    let the user cancel it afterward
  keep_when:
  - commitments with no money or legal effect, such as saving a draft
- id: ux.duplicate-submit
  why: Two quick activations, a retry after an unknown outcome, or an automatic resend creates a second
    order, charge, or record
  better: Show a pending state that blocks repeats, send an idempotency key, and check an unknown outcome
    before offering a retry
- id: ux.false-status
  why: The page says done while the change failed or its outcome is unknown, or says failed when the change
    may already have happened
  better: Report only what the backend confirmed; name an unknown outcome and check its status before
    offering a repeat
- id: ux.lost-input
  why: Values the user entered disappear after a validation error, a failed request, Back, or signing
    in again
  better: Keep entered values through errors and navigation within the flow; clear only secrets, and say
    why
- id: ux.destructive-without-undo
  why: A destructive action runs with neither a confirmation that names what is lost nor a working undo,
    or its undo does not bring the object back
  better: Confirm irreversible actions with the object's name and consequence, or act at once with an
    undo that restores it
  keep_when:
  - removing something the user can recreate in one step, such as a search filter
- id: ux.dead-end
  why: A step offers no way forward or back other than the browser, including an error with no recovery
    action
  better: Give every state a next action - retry, edit, go back, or get help - and keep the user's place
- id: ux.permission-on-load
  why: The browser asks for notifications, location, or the camera before the user has done anything that
    needs it, so the request has no context and a refusal sticks
  better: Ask when a feature needs the permission, from a user action, after saying why
  keep_when:
  - a page whose one job needs the permission at once, such as a scanner the user opened
- id: ux.entry-interruption
  why: A modal or sheet interrupts before the user has done anything - on load, on a timer, on scroll,
    or on the way out - to ask for something the page's job does not need
  better: Place the offer inline where it is relevant, or ask after the user shows interest
  keep_when:
  - a decision required before content can be shown, with accepting and declining equally easy
- id: ux.lost-context-on-return
  why: Coming back with Back or after signing in loses filters, the page, the scroll position, or the
    linked destination, so the user starts over
  better: Keep list state in the URL or history, restore the scroll position, and return to the requested
    destination after sign-in
- id: ux.excess-steps
  why: A flow takes more steps than its plan allows, or splits a short form into one-field screens
  better: Group related fields into steps that each settle a decision, and cut steps that decide nothing
  keep_when:
  - one-field steps at a branch, a verification boundary, or a save-and-resume point
- id: ux.premature-validation
  why: Errors appear while the user is still typing, or on untouched fields as the page loads
  better: Validate on blur or submit, and clear an error as soon as the value becomes valid
  keep_when:
  - live feedback that helps while typing, such as password strength or characters remaining
- id: ux.disabled-submit-unexplained
  why: The submit control stays disabled with no visible reason, so the user cannot tell what is missing
  better: Keep submit enabled and explain errors on submit, or show next to it what is still needed
- id: ux.scroll-hijack
  why: The page takes over scrolling - snapping between sections, changing how far a scroll moves, or
    holding it while an animation plays - so users lose control of their position
  better: Keep native scrolling and tie effects to scroll position without changing the distance moved
  keep_when:
  - a full-screen presentation mode the user entered on purpose
- id: ux.subscription-trap
  why: Hidden renewal terms, a preselected plan or extra, a hard exit, and repeated asks work together
    to keep people paying
  better: Fix the members together - disclose terms at the commit, start choices unselected, and make
    leaving as direct as joining
- id: ux.pressure-selling
  why: Interruptions, invented urgency, lopsided choices, shaming refusals, and repeated asks stack up
    to push a decision
  better: Remove the pressure devices and let the offer stand on its facts
- id: ux.consent-steering
  why: Preselected consents, lopsided buttons, a buried refusal, early permission prompts, and repeated
    asks together steer people into agreeing
  better: Ask once, at the moment it matters, with an unselected choice and a refusal as easy as acceptance
- id: motion.pulse-without-status
  why: An infinitely pulsing status dot performs liveness without any changing status
  better: Use a stable status or real progress
  keep_when:
  - the dot reflects live status that changes
  - a skeleton placeholder while loading
- id: motion.decorative-cursor
  why: A decorative blinking cursor mimics typing or generation indefinitely
  better: Show the actual input state, or remove it
  keep_when:
  - a real text input with focus
- id: motion.uncontrolled-marquee
  why: Content auto-scrolls without a way to pause, stop, or hide it, moving before it can be read
  better: Use static overflow or a controlled carousel with a pause control
- id: motion.bounce-default
  why: Bounce or elastic easing as the global default applies personality indiscriminately and slows tasks
  better: Match easing to direct manipulation, platform, and tone; keep overshoot for moments that earn
    it
  keep_when:
  - playful subjects where overshoot is the brand's motion voice
  - release after a physical drag
- id: motion.layout-property-animation
  why: Routine state changes animate width, height, or position, shifting neighboring content and causing
    jank
  better: Animate transform and opacity, or use a layout animation tool built for the change
  keep_when:
  - a purposeful layout animation handled by a tool that measures and transforms
- id: motion.hover-zoom-everything
  why: Every image scales or shifts on hover, making the gallery restless and moving crops and alignment
  better: Use hover to reveal actionable information, or keep images still
- id: motion.transition-all
  why: Transitioning all properties animates unintended properties and makes interaction inconsistent
  better: Name the properties and durations to animate
- id: motion.reduced-motion-missing
  why: Nonessential motion has no reduced-motion branch, so motion-sensitive users cannot avoid it
  better: Under reduced motion, remove spatial motion and keep state feedback
- id: motion.ambient-loops
  why: Infinite decorative micro-loops compete with the task for attention
  better: Keep only motion earned by state, expression, or subject, with reading and reduced-motion control
    preserved
  keep_when:
  - expressive or subject-driven motion recorded in the plan's motion dial
- id: motion.scroll-gated-content
  why: Scroll animation gates reading, leaving content hidden or delayed until the animation runs
  better: Keep content available at rest and enhance progressively
- id: copy.dash-cadence
  why: Frequent dashes in labels, calls to action, or every paragraph give unrelated messages one cadence
    and hide whether the relation is cause, contrast, or aside
  better: Use sentence structure and punctuation that state the relation; keep a dash where the relation
    is clear and matches the voice
  keep_when:
  - approved copy
  - exact quotations
  - notation
  - a genuine interruption
- id: copy.buzzwords
  why: Sales words and lexical markers claim improvement, seamlessness, or scale without an observable
    difference, so the claim fits any product
  better: Name the user action, the handoff removed, or the verifiable capability
  keep_when:
  - a governed technical meaning, such as robust error handling
  - an established brand voice paired with specific proof nearby
- id: copy.contrast-frame
  why: A negative setup that corrects no belief exists only to enlarge the positive claim that follows
  better: Write one direct proposition with the supported capability
  keep_when:
  - the contrast carries scope or corrects a real misconception
  - quoted or governed language
- id: copy.staging
  why: The text announces a point before making it, or closes by praising what it just said
  better: State the point
  keep_when:
  - staging that establishes safety
  - narrative voice
- id: copy.forced-triad
  why: Ideas are padded into threes, or synonyms pose as separate benefits for symmetry
  better: List the actual parts or actions, however many there are
  keep_when:
  - a complete set that truly has three parts
- id: copy.uniform-rhythm
  why: Sentence length barely varies and openings or endings repeat, so the rhythm follows a rule instead
    of the content
  better: Merge repeated structures and let sentence shape follow the content
  keep_when:
  - deliberate anaphora in a speech, quotation, or campaign
- id: copy.generative-metaphor
  why: Imported metaphor families unrelated to the subject stand in for plain statements
  better: State the literal proposition first; keep only imagery drawn from the subject's world_materials
  keep_when:
  - the metaphor is the argument itself
  - imagery taken from world_materials
- id: copy.empty-significance
  why: An ordinary detail is labeled pivotal, transformative, or historic without support
  better: Keep the capability and remove the unsupported significance
  keep_when:
  - significance the source supports, such as a stated date, dependency, or cited result
- id: copy.borrowed-authority
  why: Vague attribution or borrowed authority asserts support that the copy cannot show
  better: Cite supplied, attributable evidence or state the relation the source defines; remove an unsupported
    authority claim, and never invent a relation
  keep_when:
  - the source does not define the relation; keep the vague wording or ask rather than invent one
- id: copy.intensifier-hedging
  why: Intensifiers and stacked hedges replace a precise claim with degree words
  better: State the claim at the strength the evidence supports
- id: copy.closing-formula
  why: A stock closing formula ends the text with an outlook or summary that adds nothing
  better: End on the last fact or the next action
- id: copy.formatting-residue
  why: Formatting follows a rule - bold-labeled bullets, emoji markers, restating headings - instead of
    the structure readers use
  better: Format only the relationships the content has
  keep_when:
  - scan-oriented reference pages that use consistent formatting
- id: copy.translationese
  why: Constructions carried over from English, such as double passives and heavy postpositional phrases,
    make the text read as translated
  better: Write directly in the target language, using particles and endings to show the relations
- id: copy.register-mix
  why: Honorific or formality registers mix on one surface
  better: Set the register per surface in the plan and keep it
  keep_when:
  - quoted speech
  - legal text with a fixed register
- id: copy.name-swap
  why: The key copy stays true when the product name is swapped for another product, so it says nothing
    specific
  better: Rewrite around a fact, material, or action that only this product has
- id: copy.vague-cta
  why: Vague or duplicate action labels leave the outcome unclear at the decision point
  better: Name the outcome of the action in the label
  keep_when:
  - a multi-step flow where the step title states the outcome
- id: copy.fabricated-proof
  why: Invented metrics, customers, quotes, logos, or credits are presented as real evidence
  better: Use real, permissioned proof, clearly labeled sample data, or structurally neutral placeholders
  keep_when:
  - sample or demo data disclosed once where the data is presented
- id: copy.error-without-recovery
  why: An error message apologizes or jokes without naming the problem and a route forward
  better: Say what happened, what it affects, and what the user can do next
- id: copy.meta-text
  why: Copy addresses the builder, the prompt, or QA instead of the user, or repeats what the hierarchy
    already says
  better: Keep one decision-relevant message; move implementation and test notes to the developer handoff
  keep_when:
  - a consequential disclosure - simulation, non-delivery, privacy, persistence, consent, eligibility,
    recovery, safety, or legal - placed once at the decision it qualifies
  - a version, build, or environment label where compatibility or availability depends on it
- id: copy.separator-join
  why: The same label, separator, and dependent tail recur across unrelated content, flattening a title
    and its qualifier into peers
  better: Diagnose each side's role, then express the relation with grammar, hierarchy, or clear field
    syntax while keeping every fact; do not mass-replace separators or force every repair into a two-line
    heading
  keep_when:
  - clear label-value syntax
  - conventional title and subtitle punctuation whose relation is already clear
  - genuine peer metadata and enumerations
  - notation and code
  - exact quotations
  - governed names and approved official copy
- id: copy.decorative-metadata
  why: A middle-dot metadata strip or an ambient locale, weather, demo, or status strip gains prominence
    without changing any task
  better: Keep real filters and consequential state beside the object they affect; remove or consolidate
    ornamental strips
  keep_when:
  - real metadata the user filters or decides by
- id: copy.placeholder-content
  why: Placeholder names and companies hide edge cases and the product's voice
  better: Use representative, clearly synthetic content matched to the domain, including long and local
    names
- id: copy.typical-phrasing
  why: The copy sits close to the current defaults corpus in phrasing and construction
  better: Rewrite around the subject's facts and materials rather than substituting synonyms
- id: imagery.css-illustration
  why: CSS primitives assemble a pseudo-illustration from generic shapes that stand in for the subject
  better: Art-direct imagery from real objects, processes, or data
  keep_when:
  - abstract geometry that is the brand's established visual language
- id: imagery.jagged-clip
  why: A jagged decorative clip path on unrelated photos competes with the image subject
  better: Choose crop and contour from the content
- id: imagery.buried-raster
  why: A heavy gradient or overlay buries the main image to rescue text contrast
  better: Show the image with legible contrast by placing text off it, or remove the image
- id: imagery.missing-content-image
  why: A content image is broken or an unresolved placeholder, or meaningful image information has no
    text alternative
  better: Use owned assets or labeled local placeholders and give meaningful images a text alternative
  keep_when:
  - decorative images with an empty alt attribute
- id: imagery.generic-stock
  why: A generic stock scene supplies category cliche instead of evidence about the product
  better: Commission or select context-specific, permissioned imagery
- id: code.mobile-100vh
  why: A full-height shell sized with the static viewport height is clipped by mobile browser chrome
  better: Use dynamic viewport units and test on the target
- id: code.focus-outline-removed
  why: The focus outline is removed without a replacement, so keyboard focus is invisible
  better: Provide a visible focus-visible style with enough contrast
- id: code.clickable-non-interactive
  why: A clickable div or span lacks the name, role, state, and keyboard behavior of a real control
  better: Use a native button or link
- id: code.image-dimensions
  why: Images without intrinsic dimensions shift content as they load
  better: Supply width and height or an aspect ratio
- id: code.locale-time-rendering
  why: Hard-coded dates, numbers, or locale strings go stale or wrong by locale, and time-dependent output
    differs between server and client
  better: Format with locale-aware APIs, stabilize the initial value, then update safely on the client
- id: code.continuous-value-in-state
  why: Continuous pointer or scroll values stored in component state cause re-render loops and stutter
  better: Use motion values, refs, CSS, or platform APIs for continuous values
- id: code.animation-package-mismatch
  why: Animation imports do not match the installed package or API, or several animation packages are
    mixed
  better: Verify the project dependency and its supported import; keep one animation stack
  keep_when:
  - either import path is fine when it matches the installed package
- id: code.unvirtualized-list
  why: A large list renders every item in a scrolling data surface, stalling and consuming memory
  better: Virtualize when the measured volume requires it
- id: reference.brand-asset-reuse
  why: Logos, illustrations, or copy from a reference-only source are reused as they are
  better: Take relations from the reference and leave its assets, identity, and copy behind
- id: reference.clone-risk
  why: Layout structure, palette roles, type fingerprint, and copy are all close to one reference at once
  better: Keep the relations named in the plan's take list and change the rest; borrowing one dimension
    is structure, not cloning
  keep_when:
  - the reference is owned or licensed for this use
- id: rights.no-provenance
  why: A shipped image, video, icon set, or font has no provenance record, so nobody can show where it
    came from or what its license allows
  better: Record the asset with its source, license, and intended use, or replace it with one you can
    record
- id: rights.license-unknown
  why: An asset or font ships under an unknown license, from an unknown origin, or without a record of
    where its license document is kept
  better: Find the governing license for the exact item from the rights holder or provider, record where
    it is kept, or replace the asset
- id: rights.license-hint-only
  why: The recorded license comes from a catalog badge or embedded file metadata, which point to a license
    but do not grant one
  better: Read the license for the exact item from the rights holder or provider and record that
- id: rights.use-outside-license
  why: 'The recorded use goes beyond the license: commercial use under a non-commercial license, non-editorial
    use under an editorial-only license, an edited work whose license forbids derivatives, a platform
    the license does not cover, a generator input the license excludes, or font files shipped from a synced,
    system, or unknown copy'
  better: Keep the asset where its license allows, obtain a license for this use, ship files from a channel
    that grants it, or replace the asset
- id: rights.license-expired
  why: The license, approval, or relationship behind an asset has ended and the asset still ships
  better: Renew the right, or remove the asset and ship its recorded replacement
- id: rights.attribution-missing
  why: A license that requires credit has no recorded credit text or placement
  better: Record the credit in the form the license asks for and show it where the record says
- id: rights.notice-missing
  why: Distributed fonts, icons, or other licensed files ship without the license and copyright notices
    their license requires
  better: Ship the license text and copyright notice with the files, in a licenses folder or an about
    screen; a visible credit does not replace them
- id: rights.reserved-font-name
  why: A subset or converted open font keeps a name its license reserves for the original release
  better: Rename the modified font's internal names, ship the unmodified release, or obtain written permission
    from the rights holder
- id: rights.unverified-mark
  why: Another party's logo or mark appears without confirmed authorization, or implies a customer, partner,
    or press relationship that nobody confirmed
  better: Confirm the relationship and use the owner's approved asset and guidelines, or name the other
    party in plain text
  keep_when:
  - a compatibility or integration reference whose owner's guidance allows plain reference, recorded as
    not-needed
- id: rights.generated-as-evidence
  why: Generated media stands in for a real product, person, place, or result that the page presents as
    real
  better: Use a real photograph or recording as evidence, or make the generated image plainly illustrative
    and change its role
- id: rights.generated-from-reference
  why: Reference-only material went into a generator, so the output can carry expression from a source
    the project may only study
  better: Generate again from own or licensed inputs and a description of the qualities to carry over
- id: rights.generated-unreviewed
  why: Generated media ships without a check for stray marks, watermarks, recognizable people, copied-looking
    characters, or broken text
  better: Review each generated asset for those problems and record the review in the ledger
- id: rights.release-missing
  why: A photo or video in commercial or promotional use may show people or private property whose release
    status is open
  better: Record obtained releases, or record that nothing needing one is depicted; otherwise replace
    the media
- id: rights.unapproved-mark-symbol
  why: A registered or trademark sign appears without brand guidance that sets it for that mark
  better: Drop the sign, or follow the owner's approved guidance and record the symbol with the mark
