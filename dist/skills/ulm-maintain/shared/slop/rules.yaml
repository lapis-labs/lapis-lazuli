      params:
        pattern: alternating-media-text
      threshold:
        repeats_max: 2
  why: Image and text rows alternate by rule without a narrative reason, making distinct ideas look equivalent
  better: Consolidate related content or choose a structure that reflects each relationship
  keep_when:
  - id: sequence-narrative
    when: a step-by-step narrative where alternation tracks the sequence
  waiver:
    scope: rule
  verify: static
- id: layout.decorative-numbering
  class: default
  domain: layout
  layers:
  - render
  - review
  severity:
    create: gate
    review: P3
  detect:
    render:
      detector: index-markers
      params:
        check: non-sequential
  why: Numbers on non-sequential sections imply progress, sequence, or record identity that does not exist
  better: Number only real steps, ranked items, or records; otherwise use descriptive headings
  keep_when:
  - id: ordered-process
    when: a real ordered process
  - id: ranked-items
    when: ranked items
  - id: record-identifiers
    when: record identifiers
  waiver:
    scope: rule
  verify: review
- id: layout.heading-proximity
  class: quality
  domain: layout
  layers:
  - render
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: gap-proximity
      params:
        check: heading-above-vs-below
  why: The space above a heading is no larger than the space below it, so the heading attaches to the
    previous section
  better: Give headings more space above than below
  keep_when:
  - id: repeating-rows
    when: repeating heading rows, such as an accordion or definition list, that keep one even gap by design
  waiver:
    scope: value
  verify: static
- id: layout.monotonous-spacing
  class: quality
  domain: layout
  layers:
  - render
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: gap-proximity
      params:
        check: monotonous
      threshold:
        level_ratio_min: 1.5
  why: The same gap at every hierarchy level makes siblings, groups, and sections hard to tell apart
  better: Order spacing as inside a group, then between siblings, then between groups, then between sections
  keep_when:
  - id: contract-spacing
    when: the design contract fixes the spacing step for each level and the page follows it
  - id: single-level-surface
    when: a surface with one level of grouping, such as a log, a feed, or a plain table, so there are
      no groups or sections to tell apart
  waiver:
    scope: value
  verify: static
- id: layout.compact-overflow
  class: requirement
  domain: layout
  layers:
  - render
  severity:
    create: gate
    review: P1
  detect:
    render:
      detector: overflow-check
      params:
        viewports:
        - 320
        - 390
        checks:
        - page-horizontal-scroll
        - clipped-text
        - overlapping-controls
  why: Fixed columns overflow at compact width, so text or controls clip, overlap, or force page scrolling
  better: Let columns collapse or reflow at compact widths; scroll only regions whose content needs two
    dimensions
  keep_when:
  - id: scrolling-region
    when: data tables, maps, and diagrams that scroll inside their own region
  waiver:
    scope: none
  verify: static
- id: layout.crowded-hero
  class: quality
  domain: layout
  layers:
  - render
  - review
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: section-inventory
      params:
        section: first
        check: proof-in-hero
  why: A logo wall, metrics, and extra copy packed into the hero bury the proposition and the action
  better: Keep the opening to proposition and action; place real proof immediately after
  keep_when:
  - id: brief-fixed-opening
    when: the brief fixes what the opening must carry, such as an event's date and place, and the plan
      lists those items
  waiver:
    scope: value
  verify: review
- id: layout.edge-flush
  class: quality
  domain: layout
  layers:
  - render
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: edge-inset
      params:
        viewport: 390
      threshold:
        inset_px_min: 12
  why: Cards touch the viewport or scroller edge without a safe inset, so content feels clipped and targets
    become awkward
  better: Add an intentional inset and a visible scroll affordance
  keep_when:
  - id: full-bleed-media
    when: full-bleed media that is meant to run to the edge
  waiver:
    scope: value
  verify: static
- id: layout.split-heading
  class: quality
  domain: layout
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: reading-path
      params:
        check: heading-separated-from-intro
  why: A heading sits in one column and its explanation in another, splitting a dependent reading path
  better: Keep a dependent heading and intro in one reading path
  keep_when:
  - id: aligned-side-heading
    when: a side heading aligned to the first line of its text, with the heading before the text in reading
      order
  waiver:
    scope: value
  verify: static
- id: layout.decorative-opening-stack
  class: quality
  domain: layout
  layers:
  - render
  - review
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: section-inventory
      params:
        section: first
        check: task-below-ornament
  why: A decorative opening stack pushes necessary context or the primary action out of reach
  better: Remove the unearned stack; keep deliberate long-form or immersive openings without enforcing
    a universal fold
  keep_when:
  - id: immersive-opening
    when: a deliberate immersive or long-form opening
  waiver:
    scope: value
  verify: review
- id: layout.wrapped-navigation
  class: quality
  domain: layout
  layers:
  - render
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: text-metrics
      params:
        metric: rows
        roles:
        - nav
        viewport: 1440
      threshold:
        max: 1
  why: Navigation wraps to two lines at common desktop widths, consuming the opening and destabilizing
    scanning
  better: Prioritize the items or change the navigation model
  keep_when:
  - id: footer-link-groups
    when: footer or sitemap link groups, which sit at the end of the page rather than in the opening
  waiver:
    scope: value
  verify: static
- id: layout.occluded-text
  class: requirement
  domain: layout
  layers:
  - render
  severity:
    create: gate
    review: P1
  detect:
    render:
      detector: text-occlusion
  why: A decorative layer covers text, hiding content
  better: Reorder the layers or reserve space for the text
  keep_when:
  - id: legible-overlap
    when: display type that a layer overlaps partly while every word stays legible
  waiver:
    scope: none
  verify: static
- id: layout.card-everything
  class: default
  domain: layout
  layers:
  - render
  - review
  severity:
    create: gate
    review: P3
  detect:
    render:
      detector: card-nesting
      params:
        check: card-share
      threshold:
        content_share_max: 0.8
  why: Cards become the whole page structure, so every item is equal and enclosed
  better: Use rows, groups, sections, or bare content where they express the relation better
  keep_when:
  - id: independent-objects
    when: collections of independent, comparable objects
  waiver:
    scope: rule
  verify: review
- id: layout.shrunk-desktop
  class: quality
  domain: layout
  layers:
  - render
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: responsive-structure
      params:
        compare:
        - 390
        - 1440
        check: scaled-only
  why: The compact layout is the desktop composition shrunk, treating responsive behavior as scale
  better: Define content order, collapse, and density for each section at each width
  keep_when:
  - id: fixed-canvas
    when: a fixed-canvas surface, such as a map, diagram, slide, or spreadsheet, whose layout is the canvas
      itself
  waiver:
    scope: value
  verify: static
- id: layout.symmetry-excess
  class: default
  domain: layout
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: symmetry
      threshold:
        max: 0.85
  why: Nearly everything centers on one axis, so the layout expresses no priority through placement
  better: Place content by reading order and weight; keep symmetry where the content is genuinely balanced
  keep_when:
  - id: ceremonial-surface
    when: ceremonial, poster-like, or single-message surfaces
  waiver:
    scope: rule
  verify: static
- id: layout.missing-signature
  class: quality
  domain: layout
  layers:
  - plan
  - render
  severity:
    create: warn
    review: P2
  detect:
    plan:
      detector: plan-missing
      path: layout.signature
      params:
        modes:
        - create
    render:
      detector: signature-present
  why: No element unique to this subject and task is planned or rendered, so the surface could belong
    to any product
  better: Name one signature element drawn from world_materials in the plan and build it
  keep_when:
  - id: repair-scope
    when: a repair plan (mode repair) whose scope leaves the visual identity untouched
  waiver:
    scope: rule
  verify: static
- id: layout.unanchored-lever
  class: quality
  domain: layout
  layers:
  - plan
  - review
  severity:
    create: gate
    review: P1
  detect:
    plan:
      detector: plan-anchored-text
      path: direction.levers[*]
      params:
        anchors:
        - world_materials
        - layout.signature
        modes:
        - create
        empty: hit-unless-operate-only
        skip_style_frames:
        - inherit
    review:
      detector: counterfactual-test
  why: A lever that names no material of this subject (clean, modern, bold type, more whitespace) would
    fit any product, so the direction stays a default
  better: Write each lever as one sentence - the lever, what visibly changes, and the world material it
    comes from, named as world_materials writes it
  keep_when:
  - id: form-fixed-by-contract-or-brief
    when: the contract or the brief fixes the form and the plan says so
  waiver:
    scope: rule
  verify: static
- id: layout.typical-composition
  class: default
  domain: layout
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: typicality-distance
      params:
        corpus: defaults
        features:
        - section_sequence
        - archetypes
        - symmetry
        - density
      threshold:
        distance_min: 0.2
  why: The composition sits close to the current defaults corpus across sequence, archetypes, symmetry,
    and density
  better: Revisit the content ranking and signature; change the structure where the content relation differs
  keep_when:
  - id: content-fixed-structure
    when: the content has a structure of its own, such as a form, a legal text, a changelog, or a data
      table
  - id: form-fixed-by-contract-or-brief
    when: the contract or the brief fixes the composition and the plan says so
  waiver:
    scope: rule
  verify: static
- id: component.emoji-icons
  class: default
  domain: component
  layers:
  - source
  - render
  severity:
    create: gate
    review: P2
  detect:
    source:
      detector: source-pattern
      params:
        patterns:
        - \p{Extended_Pictographic}
        - '[\u2190-\u21FF\u2700-\u27BF]'
        scope: icon-slots
    render:
      detector: icon-inventory
      params:
        check: emoji
  why: Emoji or Unicode glyphs serve as product icons, so weight and style vary by operating system
  better: Use one maintained icon family and label icon-only buttons
  keep_when:
  - id: emoji-content
    when: user-generated content, reactions, or a brand voice built on emoji
  waiver:
    scope: value
  verify: static
- id: component.hand-drawn-icons
  class: default
  domain: component
  layers:
  - source
  - render
  severity:
    create: gate
    review: P3
  detect:
    source:
      detector: source-ast
      params:
        query: inline-svg-path-for-standard-action
    render:
      detector: icon-inventory
      params:
        check: hand-authored-standard-actions
  why: Hand-authored SVG paths for standard actions reinvent tested geometry and drift from the library
    icons beside them
  better: Use the project icon family for standard actions; draw custom icons only for subject-specific
    concepts
  keep_when:
  - id: uncovered-concept
    when: custom icons for concepts the family does not cover, drawn on the family's grid and stroke
  waiver:
    scope: value
  verify: static
- id: component.mixed-icon-families
  class: quality
  domain: component
  layers:
  - source
  - render
  severity:
    create: warn
    review: P2
  detect:
    source:
      detector: dependency-check
      params:
        check: icon-packages
    render:
      detector: icon-inventory
      params:
        check: families
      threshold:
        families_max: 1
  why: Two or more icon families on one surface disagree in stroke, fill, optical size, and grid
  better: Normalize to one family, weight, grid, and alignment
  keep_when:
  - id: brand-marks
    when: third-party brand marks beside the interface family, which cannot be redrawn in its style
  - id: content-glyph-set
    when: a glyph set that is content rather than interface chrome, such as country flags or file-type
      badges
  waiver:
    scope: value
  verify: static
- id: component.fake-app-window
  class: default
  domain: component
  layers:
  - render
  - review
  severity:
    create: gate
    review: P2
  detect:
    render:
      detector: decorative-dom
      params:
        kind: app-window
  why: Decorative divs mimic an app window or data, replacing real product evidence with a facsimile
  better: Use a real capture or a clearly labeled illustrative slot
  keep_when:
  - id: labeled-illustration
    when: a labeled illustration where no product exists yet
  waiver:
    scope: value
  verify: review
- id: component.generic-spinner
  class: quality
  domain: component
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: state-coverage
      params:
        state: loading
        check: indicator-kind
      threshold:
        spinner_shown_ms_max: 1000
  why: One spinner for every wait ignores duration and layout and gives no sense of structure or preserved
    task
  better: Choose by wait - a delayed indicator, skeleton, progress, or inline status
  keep_when:
  - id: handoff-wait
    when: a hand-off wait with no progress to report and no content structure to preview, such as an external
      payment or sign-in redirect, with text that names what is happening
  waiver:
    scope: value
  verify: runtime
- id: component.library-default-theme
  class: default
  domain: component
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: typicality-distance
      params:
        corpus: library-default-themes
        features:
        - type
        - radius
        - spacing
        - color-roles
        - states
      threshold:
        distance_min: 0.15
  why: The component library's starter styling has become the brand even though its behavior is sound
  better: Keep the useful primitives, then define type, color roles, radius, spacing, states, and composition
    from the product
  keep_when:
  - id: adopted-library-system
    when: internal tools where the library's system is the adopted contract
  waiver:
    scope: rule
  verify: static
- id: component.unlabeled-input
  class: requirement
  domain: component
  layers:
  - source
  - render
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: source-ast
      params:
        query: input-without-associated-label
    render:
      detector: accessibility-tree
      params:
        check: input-label
    behavior:
      detector: accessibility-tree
      params:
        check: label-persists-after-input
  why: An input has no programmatic label, or its placeholder is the only label and disappears once the
    user types
  better: Associate a visible label with each field, with helper and error text linked to it
  waiver:
    scope: none
  verify: static
- id: component.unnamed-icon-button
  class: requirement
  domain: component
  layers:
  - render
  severity:
    create: gate
    review: P1
  detect:
    render:
      detector: accessibility-tree
      params:
        check: control-name
        roles:
        - button
        - link
  why: An icon-only control has no accessible name, so its action is undiscoverable with assistive technology
  better: Give the control a visible or programmatic name that states the action
  waiver:
    scope: none
  verify: static
- id: component.small-target
  class: requirement
  domain: component
  layers:
  - render
  severity:
    create: gate
    review: P2
  detect:
    render:
      detector: target-size
      params:
        roles:
        - button
        - link
        - input
      threshold:
        size_min: 24
  why: A pointer target is smaller than 24 by 24 CSS px and has too little clear space around it, so it
    is easy to miss or to hit a neighbor
  better: Make targets at least 24 px, or keep clear space around small ones; touch-first surfaces are
    easier at 44 px
  keep_when:
  - id: inline-link
    when: links inside a sentence
  - id: browser-default-size
    when: controls left at the size the browser gives them
  - id: equivalent-full-size-control
    when: a control whose function a full-size control on the same page also offers
  - id: size-carries-information
    when: targets whose size carries information, such as map pins at their true positions
  waiver:
    scope: none
  verify: static
- id: ux.routine-modal
  class: quality
  domain: ux
  layers:
  - behavior
  - review
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: dialog-usage
      params:
        check: routine-navigation-or-long-task
  why: A modal handles routine navigation or a long task, interrupting context without a protected-focus
    need
  better: Use a page, sheet, inline edit, or disclosure as the task requires
  keep_when:
  - id: destructive-confirmation
    when: confirmation of a destructive action
  - id: blocking-short-task
    when: a short task that must block the rest of the screen
  waiver:
    scope: value
  verify: runtime
- id: ux.dead-control
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
    adjust:
    - when: the primary task is blocked
      review: P0
  detect:
    behavior:
      detector: control-has-effect
      params:
        also: console-errors
  why: An element that looks interactive does nothing, or a runtime error or cosmetic result stands in
    for the promised state or data outcome
  better: Exercise the consequential path and make the control produce the state or data it promises
  keep_when:
  - id: prototype-scope
    when: a local prototype whose stated scope excludes the backend, where the control says so
  waiver:
    scope: none
  verify: runtime
- id: ux.missing-states
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: state-coverage
      params:
        states:
        - empty
        - loading
        - error
        - offline
        - success
        relevance: plan-and-task
  why: A polished resting frame hides missing states that the task can reach - empty, loading, error,
    offline, success, or recovery
  better: Design and exercise every relevant state, including recovery
  keep_when:
  - id: unreachable-state
    when: states the surface cannot reach, such as offline on a static page
  waiver:
    scope: none
  verify: runtime
- id: ux.preselected-option
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
    adjust:
    - when: the preselected option adds a charge
      review: P0
  detect:
    behavior:
      detector: choice-analysis
      params:
        check: preselection
        purposes:
        - consent
        - marketing
        - permission-preprompt
        - add-on
        - upsell
        - plan
        field_purposes:
        - consent
        - marketing
        - add-on
  packages:
  - subscription-trap
  - consent-steering
  why: An optional extra, a consent, or a costlier plan is already selected, so doing nothing becomes
    agreement
  better: Start optional choices unselected and let the user opt in; show plans side by side without a
    default pick
  keep_when:
  - id: free-reversible-default
    when: a free, reversible default that is neither a consent nor a charge, such as standard delivery
  waiver:
    scope: none
  verify: runtime
- id: ux.drip-pricing
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: flow-analysis
      params:
        check: drip
        kinds:
        - primary
        - purchase
        - subscribe
  why: Required fees, shipping, or taxes first appear, or the price rises or loses a discount, after the
    price the user compared, so the price shown is not the price paid
  better: Show the total the user must pay where the price first appears, or name each required charge
    there as still to be calculated, and keep it unless the user changes something
  keep_when:
  - id: pending-input-charge
    when: a charge that depends on input given later, such as a delivery address, named as pending where
      the price first appears
  waiver:
    scope: none
  verify: runtime
- id: ux.sneak-into-basket
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P0
  detect:
    behavior:
      detector: flow-analysis
      params:
        check: sneak
  why: An item or service enters the cart without the user adding it
  better: Add only what the user chose; offer extras as separate choices that start unselected
  waiver:
    scope: none
  verify: runtime
- id: ux.hidden-subscription
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
    adjust:
    - when: a free or discounted trial converts to a paid plan
      review: P0
  detect:
    behavior:
      detector: flow-analysis
      params:
        check: terms
        kinds:
        - primary
        - purchase
        - subscribe
  packages:
  - subscription-trap
  why: A recurring charge's renewal price, cadence, trial end, or way to cancel is missing or out of view
    when the user commits
  better: Put the renewal price, cadence, trial end date, and how to cancel next to the commit control,
    readable without expanding anything
  waiver:
    scope: none
  verify: runtime
- id: ux.obstructed-exit
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
    adjust:
    - when: leaving cannot be finished without contacting the business
      review: P0
  detect:
    behavior:
      detector: flow-analysis
      params:
        check: exit
        kinds:
        - cancel-subscription
        - delete-account
        - withdraw-consent
        - unsubscribe
        channel: self-serve
      threshold:
        extra_steps_max: 2
        extra_interactions_max: 3
        offers_max: 1
        blocking_offers_max: 0
  packages:
  - subscription-trap
  why: Leaving takes far more effort than joining, or cannot be finished - repeated offers, a required
    call or chat, a hidden final action, or reauthentication the join did not need
  better: Keep a direct, visible exit in the channel the user joined through; beyond joining's effort,
    allow one consequence review and one confirmation, offer at most one alternative that does not block,
    and end with a receipt
  waiver:
    scope: none
  verify: runtime
- id: ux.false-hierarchy
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P2
  detect:
    behavior:
      detector: choice-analysis
      params:
        check: prominence
        purposes:
        - consent
        - marketing
        - permission-preprompt
        - upsell
        - retention
        - add-on
      threshold:
        prominence_ratio_max: 4
  packages:
  - pressure-selling
  - consent-steering
  why: The option that serves the business far outweighs the refusal - a large filled button against small,
    faint, or unstyled text
  better: Give accepting and declining comparable size, contrast, and styling, and let the labels explain
    the difference
  keep_when:
  - id: no-favored-side
    when: choices without a business-favored side, such as confirming the user's own action
  waiver:
    scope: none
  verify: runtime
- id: ux.asymmetric-decline
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: choice-analysis
      params:
        check: decline-effort
        purposes:
        - consent
        - marketing
        - permission-preprompt
        - upsell
        - add-on
      threshold:
        decline_extra_interactions_max: 0
  packages:
  - consent-steering
  why: Accepting takes one action while declining is missing or takes more, such as a settings page of
    switches to turn off
  better: Offer the refusal on the same layer as the acceptance, completed in as few actions
  waiver:
    scope: none
  verify: runtime
- id: ux.nagging
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P2
  detect:
    behavior:
      detector: dialog-usage
      params:
        check: recurrence
        purposes:
        - consent
        - marketing
        - permission-preprompt
        - upsell
        - retention
        - announcement
        - other
      threshold:
        reasks_after_decline_max: 0
  packages:
  - subscription-trap
  - pressure-selling
  - consent-steering
  why: A request the user declined comes back during the same visit, pressing them to change the answer
  better: Respect the refusal and let the user change it later from a stable place such as settings
  waiver:
    scope: none
  verify: runtime
- id: ux.false-urgency
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: urgency-integrity
      params:
        checks:
        - resets
        - drifts
        - expiry
        - unbacked
        unbacked_kinds:
        - stock
        - demand
        - activity
  packages:
  - pressure-selling
  why: A countdown restarts on reload or runs out with no consequence, or a stock count, a viewer count,
    or a purchase notice has no source or changes with no cause, inventing pressure to decide
  better: Show only real deadlines, stock, and activity with their basis, such as the closing time or
    when the count was updated, or show none
  waiver:
    scope: none
  verify: runtime
- id: ux.forced-action
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: flow-analysis
      params:
        check: gates
        gates:
        - account
        - optional-consent
        - permission
        - share
        - install
        - survey
  why: The flow demands something the goal does not need - an account, an optional consent, a permission,
    a share, an app install, or a survey - before the user can continue
  better: Ask only for what the task needs; offer a guest path and make optional steps skippable
  keep_when:
  - id: listed-prerequisite
    when: prerequisites the plan flow lists under requires with a reason, such as an account for a service
      that keeps the user's data
  waiver:
    scope: none
  verify: runtime
- id: ux.confirmshaming
  class: requirement
  domain: ux
  layers:
  - behavior
  - review
  severity:
    create: gate
    review: P2
  detect:
    behavior:
      detector: choice-analysis
      family: confirmshaming
      params:
        check: copy
        kinds:
        - decline
        - dismiss
  packages:
  - pressure-selling
  why: The refusal is worded to shame, guilt, or frighten the user into accepting
  better: Name the plain outcome of declining, such as not now or continue without the discount
  waiver:
    scope: none
  verify: review
- id: ux.back-trap
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: history-behavior
      params:
        check: back-trap
      threshold:
        presses_to_leave_max: 1
  why: Browser Back does not leave the page because the page adds history entries or reopens a sheet to
    hold the user
  better: Let Back leave the page; one Back may first close an overlay the user opened
  waiver:
    scope: none
  verify: runtime
- id: ux.keyboard-trap
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P0
  detect:
    behavior:
      detector: keyboard-traversal
      params:
        check: trap
  why: Keyboard focus enters a region and cannot leave it with Tab, Shift+Tab, or Escape, so the rest
    of the page is out of reach
  better: Let focus move on with standard keys; contain focus only inside an open modal that Escape or
    a close control dismisses
  waiver:
    scope: none
  verify: runtime
- id: ux.keyboard-inoperable
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
    adjust:
    - when: the primary task is blocked
      review: P0
  detect:
    behavior:
      detector: keyboard-traversal
      params:
        check: operable
        semantic: true
  why: A control that works with a pointer cannot be reached or activated from the keyboard
  better: Keep controls in the tab order and make Enter and Space do what a click does
  waiver:
    scope: none
  verify: runtime
- id: ux.focus-order
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P2
  detect:
    behavior:
      detector: keyboard-traversal
      params:
        check: order
      threshold:
        order_inversions_max: 0
  why: Tab order jumps backward or across the layout, so keyboard users lose their place
  better: Order the DOM in visual reading order and avoid positive tabindex
  waiver:
    scope: none
  verify: runtime
- id: ux.no-bypass
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: keyboard-bypass
      params:
        check: bypass
      threshold:
        repeated_stops_max: 1
  why: Every page opens with the same run of navigation stops and offers no way past it, so keyboard and
    screen reader users walk the whole block on each page
  better: Mark the primary content with a main landmark, start it with a heading, and add a skip link
    as the first stop
  waiver:
    scope: none
  verify: runtime
- id: ux.skip-link-missing
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: keyboard-bypass
      params:
        check: skip-link
      threshold:
        repeated_stops_max: 5
  why: Sighted keyboard users tab through a long repeated header on every page, or a skip link is present
    but leaves focus where it was
  better: Make the first stop a skip link that becomes visible on focus and moves focus into the main
    content
  keep_when:
  - id: short-header
    when: a short header whose few stops are the page's main task
  waiver:
    scope: value
  verify: runtime
- id: ux.focus-obscured
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: keyboard-traversal
      params:
        check: obscured
      threshold:
        obscured_share_max: 0.99
  why: The focused control is entirely hidden behind a sticky header, a banner, or a fixed bar
  better: Reserve room with scroll padding or move fixed content so focused elements stay in view
  waiver:
    scope: none
  verify: runtime
- id: ux.dialog-focus
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: dialog-usage
      params:
        check: focus-management
  why: A dialog opens without taking focus, lets focus slip behind it, cannot be closed with Escape or
    a visible control, drops focus when it closes, or starts a destructive confirmation on the destructive
    button
  better: Move focus into the dialog, keep it there while a modal is open, close on Escape and a visible
    control, return focus to the control that opened it, and start confirmations on the safe choice
  waiver:
    scope: none
  verify: runtime
- id: ux.unexpected-context-change
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: context-change
      params:
        events:
        - focus
        - input
  why: Focusing a control or changing a value navigates, submits, or opens a window without the user asking
  better: Change context only on an explicit action such as a button, or say beforehand what the change
    will do
  waiver:
    scope: none
  verify: runtime
- id: ux.timeout-without-warning
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: time-limit
      params:
        exempt_over_s: 72000
      threshold:
        warn_lead_s_min: 20
        extensions_min: 10
  why: A session or hold expires without warning or a simple way to extend it, and entered work can be
    lost
  better: Warn before the limit with at least 20 seconds to extend in one action, or remove the limit
  keep_when:
  - id: essential-limit
    when: limits that are essential or tied to a real-time event, such as an auction closing
  waiver:
    scope: none
  verify: runtime
- id: ux.gesture-only
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: pointer-alternatives
      params:
        check: gesture
        kinds:
        - drag
        - path-gesture
        - multipoint
  why: Reordering, sliding, swiping, or zooming works only with a drag or a multi-finger gesture
  better: Offer a single-tap alternative such as move buttons, a menu, or a value input, alongside keyboard
    support
  keep_when:
  - id: gesture-is-task
    when: gestures that are the task itself, such as freehand drawing
  waiver:
    scope: none
  verify: runtime
- id: ux.hover-content
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P2
  detect:
    behavior:
      detector: pointer-alternatives
      params:
        check: hover-content
  why: Content that appears on hover cannot be reached with keyboard focus, dismissed without moving the
    pointer, or hovered without disappearing
  better: Reveal the same content on focus, close it with Escape, and keep it open while the pointer is
    over it
  waiver:
    scope: none
  verify: runtime
- id: ux.status-not-announced
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P2
  detect:
    behavior:
      detector: status-announcement
      params:
        sources:
        - controls
        - commits
        - states
  why: A result such as an added item, a saved change, or a new result count appears on screen but reaches
    neither a live region nor focus
  better: Put status text in a polite live region, and move focus only when the user must act on the result
  waiver:
    scope: none
  verify: runtime
- id: ux.input-error-unidentified
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: form-behavior
      params:
        check: error-identification
  why: After a failed submit the error shows only as a color or icon, is not tied to its field, or is
    neither announced nor focused
  better: Describe each error in text next to its field, link it programmatically, and move focus to the
    first error or a summary
  waiver:
    scope: none
  verify: runtime
- id: ux.redundant-entry
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P2
  detect:
    behavior:
      detector: form-behavior
      params:
        check: redundant-entry
  why: A later step asks again for information the user already gave, without prefilling it or offering
    to reuse it
  better: Carry values forward within the flow, or offer a same-as option
  keep_when:
  - id: security-reentry
    when: re-entry that protects security, such as confirming a new password
  - id: expired-information
    when: information that is no longer valid, such as an expired code
  waiver:
    scope: none
  verify: runtime
- id: ux.inaccessible-auth
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: form-behavior
      params:
        check: auth
  why: Signing in needs a puzzle, a transcription, or a memory test with no alternative, or blocks pasting
    into password and code fields
  better: Allow paste and password managers, and offer a way to sign in without a cognitive test
  waiver:
    scope: none
  verify: runtime
- id: ux.autoplay-audio
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: media-autoplay
      threshold:
        audible_seconds_max: 3
  why: Sound plays by itself with no way to pause or mute it, drowning out screen readers and startling
    people
  better: Start media muted or on request, with pause and volume controls
  waiver:
    scope: none
  verify: runtime
- id: ux.no-review-before-commit
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: flow-analysis
      params:
        check: review
        kinds:
        - primary
        - purchase
        - subscribe
  why: A purchase or other binding commitment is made in one action, with no step that shows the total
    and the choices and lets the user change them, and no way to undo it
  better: Show a review with the total, items, and terms and a way to edit them before the commit, or
    let the user cancel it afterward
  keep_when:
  - id: no-money-or-legal-effect
    when: commitments with no money or legal effect, such as saving a draft
  waiver:
    scope: none
  verify: runtime
- id: ux.duplicate-submit
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: commit-safety
      params:
        check: duplicate
      threshold:
        effects_max: 1
  why: Two quick activations, a retry after an unknown outcome, or an automatic resend creates a second
    order, charge, or record
  better: Show a pending state that blocks repeats, send an idempotency key, and check an unknown outcome
    before offering a retry
  waiver:
    scope: none
  verify: runtime
- id: ux.false-status
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: commit-safety
      params:
        check: status
  why: The page says done while the change failed or its outcome is unknown, or says failed when the change
    may already have happened
  better: Report only what the backend confirmed; name an unknown outcome and check its status before
    offering a repeat
  waiver:
    scope: none
  verify: runtime
- id: ux.lost-input
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: form-behavior
      params:
        check: lost-input
        after:
        - invalid-submit
        - server-error
        - reload
        - back
        - reauth
  why: Values the user entered disappear after a validation error, a failed request, Back, or signing
    in again
  better: Keep entered values through errors and navigation within the flow; clear only secrets, and say
    why
  keep_when:
  - id: cleared-secret
    when: a secret or single-use value, such as a password, card number, or one-time code, is cleared
      on purpose and the form says why
  waiver:
    scope: value
  verify: runtime
- id: ux.destructive-without-undo
  class: requirement
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: commit-safety
      params:
        check: undo
  why: A destructive action runs with neither a confirmation that names what is lost nor a working undo,
    or its undo does not bring the object back
  better: Confirm irreversible actions with the object's name and consequence, or act at once with an
    undo that restores it
  keep_when:
  - id: one-step-recreate
    when: removing something the user can recreate in one step, such as a search filter
  waiver:
    scope: none
  verify: runtime
- id: ux.dead-end
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: flow-analysis
      params:
        check: dead-end
  why: A step offers no way forward or back other than the browser, including an error with no recovery
    action
  better: Give every state a next action - retry, edit, go back, or get help - and keep the user's place
  keep_when:
  - id: host-owns-navigation
    when: the surface runs inside a host that owns navigation, such as an embedded widget or webview,
      and brief.platform lists embedded
  - id: kiosk-auto-reset
    when: a kiosk or signage screen that returns to its start by itself after a visible countdown
  waiver:
    scope: value
  verify: runtime
- id: ux.permission-on-load
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: permission-requests
      params:
        check: without-gesture
        apis:
        - notifications
        - geolocation
        - camera
        - microphone
  packages:
  - consent-steering
  why: The browser asks for notifications, location, or the camera before the user has done anything that
    needs it, so the request has no context and a refusal sticks
  better: Ask when a feature needs the permission, from a user action, after saying why
  keep_when:
  - id: permission-is-job
    when: a page whose one job needs the permission at once, such as a scanner the user opened
  waiver:
    scope: value
  verify: runtime
- id: ux.entry-interruption
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: dialog-usage
      params:
        check: entry-interruption
        triggers:
        - load
        - timer
        - scroll
        - exit-intent
        - idle
        - navigation
        purposes:
        - marketing
        - permission-preprompt
        - upsell
        - retention
        - announcement
        - other
        blocking: true
  packages:
  - pressure-selling
  why: A modal or sheet interrupts before the user has done anything - on load, on a timer, on scroll,
    or on the way out - to ask for something the page's job does not need
  better: Place the offer inline where it is relevant, or ask after the user shows interest
  keep_when:
  - id: equal-ease-decision
    when: a decision required before content can be shown, with accepting and declining equally easy
  waiver:
    scope: value
  verify: runtime
- id: ux.lost-context-on-return
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: history-behavior
      params:
        check: restore
        restores:
        - filters
        - page
        - scroll
        - input
        - selection
        also: deep-link
  why: Coming back with Back or after signing in loses filters, the page, the scroll position, or the
    linked destination, so the user starts over
  better: Keep list state in the URL or history, restore the scroll position, and return to the requested
    destination after sign-in
  keep_when:
  - id: live-feed
    when: a live feed whose order changes, so a restored position would land on other items
  - id: cleared-for-security
    when: state cleared on purpose for security, such as when a session ends on a shared device, with
      the page saying so
  waiver:
    scope: value
  verify: runtime
- id: ux.excess-steps
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: flow-analysis
      params:
        check: steps
      threshold:
        steps_over_plan_max: 0
        single_field_steps_max: 1
  why: A flow takes more steps than its plan allows, or splits a short form into one-field screens
  better: Group related fields into steps that each settle a decision, and cut steps that decide nothing
  keep_when:
  - id: boundary-step
    when: one-field steps at a branch, a verification boundary, or a save-and-resume point
  waiver:
    scope: value
  verify: runtime
- id: ux.premature-validation
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: form-behavior
      params:
        check: premature-validation
  why: Errors appear while the user is still typing, or on untouched fields as the page loads
  better: Validate on blur or submit, and clear an error as soon as the value becomes valid
  keep_when:
  - id: helpful-live-feedback
    when: live feedback that helps while typing, such as password strength or characters remaining
  waiver:
    scope: value
  verify: runtime
- id: ux.disabled-submit-unexplained
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: form-behavior
      params:
        check: disabled-submit
  why: The submit control stays disabled with no visible reason, so the user cannot tell what is missing
  better: Keep submit enabled and explain errors on submit, or show next to it what is still needed
  keep_when:
  - id: request-in-flight
    when: the control is disabled only while its own request is in flight and shows a pending state
  waiver:
    scope: value
  verify: runtime
- id: ux.scroll-hijack
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: scroll-behavior
      threshold:
        ratio_min: 0.5
        ratio_max: 2.0
  why: The page takes over scrolling - snapping between sections, changing how far a scroll moves, or
    holding it while an animation plays - so users lose control of their position
  better: Keep native scrolling and tie effects to scroll position without changing the distance moved
  keep_when:
  - id: entered-presentation-mode
    when: a full-screen presentation mode the user entered on purpose
  waiver:
    scope: value
  verify: runtime
- id: ux.subscription-trap
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: package-hit
      params:
        package: subscription-trap
  why: Hidden renewal terms, a preselected plan or extra, a hard exit, and repeated asks work together
    to keep people paying
  better: Fix the members together - disclose terms at the commit, start choices unselected, and make
    leaving as direct as joining
  waiver:
    scope: rule
  verify: runtime
- id: ux.pressure-selling
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: package-hit
      params:
        package: pressure-selling
  why: Interruptions, invented urgency, lopsided choices, shaming refusals, and repeated asks stack up
    to push a decision
  better: Remove the pressure devices and let the offer stand on its facts
  waiver:
    scope: rule
  verify: runtime
- id: ux.consent-steering
  class: quality
  domain: ux
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: package-hit
      params:
        package: consent-steering
  why: Preselected consents, lopsided buttons, a buried refusal, early permission prompts, and repeated
    asks together steer people into agreeing
  better: Ask once, at the moment it matters, with an unselected choice and a refusal as easy as acceptance
  waiver:
    scope: rule
  verify: runtime
- id: motion.pulse-without-status
  class: default
  domain: motion
  layers:
  - source
  - render
  severity:
    create: gate
    review: P2
  detect:
    source:
      detector: source-pattern
      params:
        patterns:
        - animate-pulse
        - animate-ping
    render:
      detector: motion-inventory
      params:
        check: infinite-pulse-small-element
  packages:
  - dark-luminous
  why: An infinitely pulsing status dot performs liveness without any changing status
  better: Use a stable status or real progress
  keep_when:
  - id: live-status
    when: the dot reflects live status that changes
  - id: loading-skeleton
    when: a skeleton placeholder while loading
  waiver:
    scope: value
  verify: static
- id: motion.decorative-cursor
  class: default
  domain: motion
  layers:
  - source
  - render
  severity:
    create: gate
    review: P3
  detect:
    source:
      detector: source-pattern
      params:
        patterns:
        - '@keyframes\s+blink'
        - animate-blink
    render:
      detector: motion-inventory
      params:
        check: blink-keyframes
  why: A decorative blinking cursor mimics typing or generation indefinitely
  better: Show the actual input state, or remove it
  keep_when:
  - id: text-input-focus
    when: a real text input with focus
  waiver:
    scope: value
  verify: static
- id: motion.uncontrolled-marquee
  class: requirement
  domain: motion
  layers:
  - render
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    render:
      detector: motion-inventory
      params:
        check: auto-moving-content
    behavior:
      detector: motion-inventory
      params:
        check: pause-control
      threshold:
        seconds_without_control_max: 5
  why: Content auto-scrolls without a way to pause, stop, or hide it, moving before it can be read
  better: Use static overflow or a controlled carousel with a pause control
  waiver:
    scope: none
  verify: runtime
- id: motion.bounce-default
  class: default
  domain: motion
  layers:
  - source
  - render
  severity:
    create: gate
    review: P2
  detect:
    source:
      detector: source-pattern
      params:
        patterns:
        - animate-bounce
        - elastic
        - back\.(in|out|inOut)
        - cubic-bezier\(\s*[\d.]+\s*,\s*(-|1\.\d*[1-9]|[2-9])
        - cubic-bezier\((\s*-?[\d.]+\s*,){3}\s*(-|1\.\d*[1-9]|[2-9])
    render:
      detector: motion-inventory
      params:
        check: overshoot-easing
      threshold:
        share_max: 0.5
  why: Bounce or elastic easing as the global default applies personality indiscriminately and slows tasks
  better: Match easing to direct manipulation, platform, and tone; keep overshoot for moments that earn
    it
  keep_when:
  - id: playful-brand-motion
    when: playful subjects where overshoot is the brand's motion voice
  - id: drag-release
    when: release after a physical drag
  waiver:
    scope: value
  verify: static
- id: motion.layout-property-animation
  class: quality
  domain: motion
  layers:
  - source
  - render
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: source-pattern
      params:
        patterns:
        - transition(-property)?:[^;]*(?<![-\w])(width|height|top|left|right|bottom|margin|padding)(?![-\w])
    render:
      detector: motion-inventory
      params:
        check: animated-properties
        properties:
        - width
        - height
        - top
        - left
        - right
        - bottom
        - margin-top
        - margin-right
        - margin-bottom
        - margin-left
        - padding-top
        - padding-right
        - padding-bottom
        - padding-left
    behavior:
      detector: layout-shift
      params:
        during: state-change
        measure: layout-animated
  why: Routine state changes animate width, height, or position, shifting neighboring content and causing
    jank
  better: Animate transform and opacity, or use a layout animation tool built for the change
  keep_when:
  - id: measured-layout-animation
    when: a purposeful layout animation handled by a tool that measures and transforms
  waiver:
    scope: value
  verify: runtime
- id: motion.hover-zoom-everything
  class: default
  domain: motion
  layers:
  - behavior
  severity:
    create: gate
    review: P3
  detect:
    behavior:
      detector: motion-inventory
      params:
        check: hover-transform
        target: media
      threshold:
        media_share_max: 0.8
  why: Every image scales or shifts on hover, making the gallery restless and moving crops and alignment
  better: Use hover to reveal actionable information, or keep images still
  keep_when:
  - id: inspection-zoom
    when: hover zoom that lets a visitor inspect detail on one or two product or artwork images, not a
      transform across a gallery
  waiver:
    scope: rule
  verify: runtime
- id: motion.transition-all
  class: quality
  domain: motion
  layers:
  - source
  - render
  severity:
    create: warn
    review: P2
  detect:
    source:
      detector: source-pattern
      params:
        patterns:
        - transition:\s*all
        - transition-all
    render:
      detector: motion-inventory
      params:
        check: transition-property-all
  why: Transitioning all properties animates unintended properties and makes interaction inconsistent
  better: Name the properties and durations to animate
  waiver:
    scope: value
  verify: static
- id: motion.reduced-motion-missing
  class: requirement
  domain: motion
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: reduced-motion-respected
  why: Nonessential motion has no reduced-motion branch, so motion-sensitive users cannot avoid it
  better: Under reduced motion, remove spatial motion and keep state feedback
  waiver:
    scope: none
  verify: runtime
- id: motion.ambient-loops
  class: default
  domain: motion
  layers:
  - render
  severity:
    create: gate
    review: P3
  detect:
    render:
      detector: motion-inventory
      params:
        check: infinite-decorative
      threshold:
        count_max: 1
  why: Infinite decorative micro-loops compete with the task for attention
  better: Keep only motion earned by state, expression, or subject, with reading and reduced-motion control
    preserved
  keep_when:
  - id: planned-expressive-motion
    when: expressive or subject-driven motion recorded in the plan's motion dial
  waiver:
    scope: rule
  verify: static
- id: motion.scroll-gated-content
  class: quality
  domain: motion
  layers:
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    behavior:
      detector: motion-inventory
      params:
        check: hidden-at-rest
  why: Scroll animation gates reading, leaving content hidden or delayed until the animation runs
  better: Keep content available at rest and enhance progressively
  keep_when:
  - id: story-with-static-fallback
    when: a scroll-driven story whose content is complete and readable with animation off, shown by the
      reduced-motion capture
  waiver:
    scope: value
  verify: runtime
- id: copy.dash-cadence
  class: default
  domain: copy
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: punctuation-density
      params:
        glyphs:
        - em-dash
        trigger: density
      threshold:
        ratio_to_baseline_max: 2.0
  why: Frequent dashes in labels, calls to action, or every paragraph give unrelated messages one cadence
    and hide whether the relation is cause, contrast, or aside
  better: Use sentence structure and punctuation that state the relation; keep a dash where the relation
    is clear and matches the voice
  keep_when:
  - id: approved-copy
    when: approved copy
  - id: exact-quotation
    when: exact quotations
  - id: notation
    when: notation
  - id: genuine-interruption
    when: a genuine interruption
  waiver:
    scope: rule
  verify: review
- id: copy.buzzwords
  class: default
  domain: copy
  layers:
  - plan
  - render
  severity:
    create: warn
    review: P2
  detect:
    plan:
      detector: copy-family-rate
      path: content.key_copy[*].text
      family: buzzwords
      params:
        trigger: once
    render:
      detector: copy-family-rate
      family: buzzwords
      params:
        trigger: once
        slots:
        - headline
        - subhead
        - cta
  packages:
  - dark-luminous
  why: Sales words and lexical markers claim improvement, seamlessness, or scale without an observable
    difference, so the claim fits any product
  better: Name the user action, the handoff removed, or the verifiable capability
  keep_when:
  - id: governed-term
    when: a governed technical meaning, such as robust error handling
  - id: brand-voice-with-proof
    when: an established brand voice paired with specific proof nearby
  waiver:
    scope: value
  verify: review
- id: copy.contrast-frame
  class: default
  domain: copy
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: rhetorical-shell
      params:
        shell: not-x-but-y
        trigger: density
  why: A negative setup that corrects no belief exists only to enlarge the positive claim that follows
  better: Write one direct proposition with the supported capability
  keep_when:
  - id: scope-or-misconception
    when: the contrast carries scope or corrects a real misconception
  - id: quoted-or-governed
    when: quoted or governed language
  waiver:
    scope: value
  verify: review
- id: copy.staging
  class: default
  domain: copy
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: rhetorical-shell
      family: staging_phrases
      params:
        shell: staging
        trigger: once
  why: The text announces a point before making it, or closes by praising what it just said
  better: State the point
  keep_when:
  - id: safety-staging
    when: staging that establishes safety
  - id: narrative-voice
    when: narrative voice
  waiver:
    scope: value
  verify: review
- id: copy.forced-triad
  class: default
  domain: copy
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: rhetorical-shell
      params:
        shell: triad
        trigger: density
  why: Ideas are padded into threes, or synonyms pose as separate benefits for symmetry
  better: List the actual parts or actions, however many there are
  keep_when:
  - id: true-triad
    when: a complete set that truly has three parts
  waiver:
    scope: value
  verify: review
- id: copy.uniform-rhythm
  class: default
  domain: copy
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: rhythm-variance
      params:
        checks:
        - sentence-length-variance
        - repeated-openings
        - repeated-endings
  why: Sentence length barely varies and openings or endings repeat, so the rhythm follows a rule instead
    of the content
  better: Merge repeated structures and let sentence shape follow the content
  keep_when:
  - id: deliberate-anaphora
    when: deliberate anaphora in a speech, quotation, or campaign
  waiver:
    scope: rule
  verify: review
- id: copy.generative-metaphor
  class: quality
  domain: copy
  layers:
  - render
  - review
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: copy-family-rate
      family: metaphor_families
      params:
        per: 1000-words
        trigger: density
        through_metaphor_min_repeats: 3
  why: Imported metaphor families unrelated to the subject stand in for plain statements
  better: State the literal proposition first; keep only imagery drawn from the subject's world_materials
  keep_when:
  - id: metaphor-is-argument
    when: the metaphor is the argument itself
  - id: world-material-imagery
    when: imagery taken from world_materials
  waiver:
    scope: value
  verify: review
- id: copy.empty-significance
  class: default
  domain: copy
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: copy-family-rate
      family: significance_markers
      params:
        trigger: once
  why: An ordinary detail is labeled pivotal, transformative, or historic without support
  better: Keep the capability and remove the unsupported significance
  keep_when:
  - id: supported-significance
    when: significance the source supports, such as a stated date, dependency, or cited result
  waiver:
    scope: value
  verify: review
- id: copy.borrowed-authority
  class: quality
  domain: copy
  layers:
  - render
  - review
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: copy-family-rate
      family: vague_attribution
      params:
        trigger: once
  why: Vague attribution or borrowed authority asserts support that the copy cannot show
  better: Cite supplied, attributable evidence or state the relation the source defines; remove an unsupported
    authority claim, and never invent a relation
  keep_when:
  - id: undefined-source-relation
    when: the source does not define the relation; keep the vague wording or ask rather than invent one
  waiver:
    scope: value
  verify: review
- id: copy.intensifier-hedging
  class: default
  domain: copy
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: copy-family-rate
      family: intensifiers_hedges
      params:
        trigger: density
  why: Intensifiers and stacked hedges replace a precise claim with degree words
  better: State the claim at the strength the evidence supports
  keep_when:
  - id: exact-quotation
    when: exact quotations
  - id: required-qualifier
    when: qualifiers that a regulation, a medical label, or a legal notice requires
  - id: calibrated-to-source
    when: hedges that state the strength the source supports, such as a forecast range or a study's stated
      uncertainty
  waiver:
    scope: rule
  verify: review
- id: copy.closing-formula
  class: default
  domain: copy
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: copy-family-rate
      family: closing_formulas
      params:
        trigger: once
  why: A stock closing formula ends the text with an outlook or summary that adds nothing
  better: End on the last fact or the next action
  keep_when:
  - id: exact-quotation
    when: exact quotations
  - id: genre-sign-off
    when: a sign-off that the text's genre requires, such as the close of a letter or an email
  waiver:
    scope: value
  verify: review
- id: copy.formatting-residue
  class: default
  domain: copy
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: formatting-residue
      params:
        checks:
        - bold-label-bullets
        - heading-restates-sentence
        - emoji-markers
        - decorative-capitalization
        - flattened-label-value
  why: Formatting follows a rule - bold-labeled bullets, emoji markers, restating headings - instead of
    the structure readers use
  better: Format only the relationships the content has
  keep_when:
  - id: consistent-reference-format
    when: scan-oriented reference pages that use consistent formatting
  waiver:
    scope: rule
  verify: review
- id: copy.translationese
  class: quality
  domain: copy
  layers:
  - render
  locales:
  - ko
  - ja
  - zh
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: construction-rate
      family: translationese_constructions
      params:
        per: 1000-words
        trigger: density
  why: Constructions carried over from English, such as double passives and heavy postpositional phrases,
    make the text read as translated
  better: Write directly in the target language, using particles and endings to show the relations
  keep_when:
  - id: quoted-or-governed
    when: quoted or governed language
  waiver:
    scope: value
  verify: review
- id: copy.register-mix
  class: quality
  domain: copy
  layers:
  - render
  locales:
  - ko
  - ja
  - zh
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: register-consistency
      params:
        expected: content.voice.register
  why: Honorific or formality registers mix on one surface
  better: Set the register per surface in the plan and keep it
  keep_when:
  - id: quoted-speech
    when: quoted speech
  - id: fixed-legal-register
    when: legal text with a fixed register
  waiver:
    scope: value
  verify: static
- id: copy.name-swap
  class: quality
  domain: copy
  layers:
  - plan
  - review
  severity:
    create: warn
    review: P2
  detect:
    plan:
      detector: name-swap-test
      path: content.key_copy[*].text
    review:
      detector: name-swap-test
  why: The key copy stays true when the product name is swapped for another product, so it says nothing
    specific
  better: Rewrite around a fact, material, or action that only this product has
  keep_when:
  - id: fixed-function-text
    when: text whose wording its function or the law fixes, such as terms, a privacy notice, or a standard
      system message
  waiver:
    scope: value
  verify: review
- id: copy.vague-cta
  class: quality
  domain: copy
  layers:
  - plan
  - render
  severity:
    create: gate
    review: P1
  detect:
    plan:
      detector: copy-family-rate
      path: content.key_copy[?slot=cta].text
      family: vague_cta
      params:
        trigger: once
    render:
      detector: copy-family-rate
      family: vague_cta
      params:
        trigger: once
        roles:
        - button
        - link
        also: duplicate-labels
  why: Vague or duplicate action labels leave the outcome unclear at the decision point
  better: Name the outcome of the action in the label
  keep_when:
  - id: step-title-states-outcome
    when: a multi-step flow where the step title states the outcome
  waiver:
    scope: value
  verify: static
- id: copy.fabricated-proof
  class: requirement
  domain: copy
  layers:
  - render
  - review
  severity:
    create: gate
    review: P1
  detect:
    render:
      detector: placeholder-genericness
      params:
        check: fabricated-proof
        kinds:
        - metrics
        - customer-names
        - quotes
        - logos
        - photo-credits
  why: Invented metrics, customers, quotes, logos, or credits are presented as real evidence
  better: Use real, permissioned proof, clearly labeled sample data, or structurally neutral placeholders
  keep_when:
  - id: disclosed-sample-data
    when: sample or demo data disclosed once where the data is presented
  waiver:
    scope: none
  verify: review
- id: copy.error-without-recovery
  class: quality
  domain: copy
  layers:
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    behavior:
      detector: state-coverage
      params:
        state: error
        check: problem-and-recovery
  why: An error message apologizes or jokes without naming the problem and a route forward
  better: Say what happened, what it affects, and what the user can do next
  keep_when:
  - id: cause-withheld-for-security
    when: the cause is withheld on purpose so the message does not reveal whether an account or item exists,
      and a way forward is still offered
  waiver:
    scope: value
  verify: runtime
- id: copy.meta-text
  class: quality
  domain: copy
  layers:
  - plan
  - render
  severity:
    create: warn
    review: P2
    adjust:
    - when: repetition obscures a consequential disclosure
      review: P1
  detect:
    plan:
      detector: meta-text
      path: content.key_copy[*].text
    render:
      detector: meta-text
      family: leftover_phrases
      params:
        kinds:
        - producer-facing
        - repeated-heading-body
        - demo-badges
        - build-labels
        - chat-leftovers
  why: Copy addresses the builder, the prompt, or QA instead of the user, or repeats what the hierarchy
    already says
  better: Keep one decision-relevant message; move implementation and test notes to the developer handoff
  keep_when:
  - id: qualified-disclosure
    when: a consequential disclosure - simulation, non-delivery, privacy, persistence, consent, eligibility,
      recovery, safety, or legal - placed once at the decision it qualifies
  - id: compatibility-label
    when: a version, build, or environment label where compatibility or availability depends on it
  waiver:
    scope: value
  verify: review
- id: copy.separator-join
  class: default
  domain: copy
  layers:
  - render
  - review
  severity:
    create: warn
    review: P3
    adjust:
    - when: status, eligibility, or another decision-relevant meaning is obscured
      review: P2
  detect:
    render:
      detector: separator-shape
      params:
        lead_only: true
      threshold:
        repeats_max: 2
  why: The same label, separator, and dependent tail recur across unrelated content, flattening a title
    and its qualifier into peers
  better: Diagnose each side's role, then express the relation with grammar, hierarchy, or clear field
    syntax while keeping every fact; do not mass-replace separators or force every repair into a two-line
    heading
  keep_when:
  - id: label-value-syntax
    when: clear label-value syntax
  - id: conventional-title-punctuation
    when: conventional title and subtitle punctuation whose relation is already clear
  - id: peer-metadata
    when: genuine peer metadata and enumerations
  - id: notation-or-code
    when: notation and code
  - id: exact-quotation
    when: exact quotations
  - id: governed-name
    when: governed names and approved official copy
  waiver:
    scope: value
  verify: review
- id: copy.decorative-metadata
  class: default
  domain: copy
  layers:
  - render
  - review
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: meta-text
      params:
        kinds:
        - decorative-metadata-strip
        - ambient-status
  why: A middle-dot metadata strip or an ambient locale, weather, demo, or status strip gains prominence
    without changing any task
  better: Keep real filters and consequential state beside the object they affect; remove or consolidate
    ornamental strips
  keep_when:
  - id: decision-metadata
    when: real metadata the user filters or decides by
  waiver:
    scope: value
  verify: review
- id: copy.placeholder-content
  class: default
  domain: copy
  layers:
  - plan
  - render
  severity:
    create: warn
    review: P3
  detect:
    plan:
      detector: placeholder-genericness
      path: content.key_copy[*].text
      family: placeholder_entities
    render:
      detector: placeholder-genericness
      family: placeholder_entities
      params:
        check: names-and-companies
  why: Placeholder names and companies hide edge cases and the product's voice
  better: Use representative, clearly synthetic content matched to the domain, including long and local
    names
  keep_when:
  - id: reserved-example-values
    when: values reserved for examples, such as example.com or 555 phone numbers, in documentation or
      code samples
  waiver:
    scope: value
  verify: static
- id: copy.typical-phrasing
  class: default
  domain: copy
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: typicality-distance
      params:
        corpus: defaults
        features:
        - ngram
        - construction
      threshold:
        distance_min: 0.2
  why: The copy sits close to the current defaults corpus in phrasing and construction
  better: Rewrite around the subject's facts and materials rather than substituting synonyms
  keep_when:
  - id: fixed-by-convention
    when: wording that a legal, platform, or interface convention fixes, such as terms, system dialogs,
      or standard control labels
  - id: approved-copy
    when: approved copy
  waiver:
    scope: rule
  verify: static
- id: imagery.css-illustration
  class: default
  domain: imagery
  layers:
  - render
  severity:
    create: gate
    review: P3
  detect:
    render:
      detector: decorative-dom
      params:
        kind: shape-illustration
  why: CSS primitives assemble a pseudo-illustration from generic shapes that stand in for the subject
  better: Art-direct imagery from real objects, processes, or data
  keep_when:
  - id: brand-geometry
    when: abstract geometry that is the brand's established visual language
  waiver:
    scope: value
  verify: static
- id: imagery.jagged-clip
  class: default
  domain: imagery
  layers:
  - render
  severity:
    create: gate
    review: P3
  detect:
    render:
      detector: image-inventory
      params:
        check: decorative-clip-path
  why: A jagged decorative clip path on unrelated photos competes with the image subject
  better: Choose crop and contour from the content
  keep_when:
  - id: content-contour
    when: a clip that follows the outline of the image's own subject, such as a product silhouette or
      a map region
  - id: contract-shape-language
    when: a brand shape language recorded in the contract
  waiver:
    scope: value
  verify: static
- id: imagery.buried-raster
  class: quality
  domain: imagery
  layers:
  - render
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: image-inventory
      params:
        check: overlay-coverage
        min_covered_share: 0.8
      threshold:
        overlay_alpha_max: 0.6
  why: A heavy gradient or overlay buries the main image to rescue text contrast
  better: Show the image with legible contrast by placing text off it, or remove the image
  keep_when:
  - id: decorative-backdrop
    when: a decorative backdrop with empty alt text, which carries nothing the page needs
  waiver:
    scope: value
  verify: static
- id: imagery.missing-content-image
  class: requirement
  domain: imagery
  layers:
  - source
  - render
  severity:
    create: gate
    review: P1
    adjust:
    - when: no required information or accessible equivalent is lost
      review: P2
  detect:
    source:
      detector: source-ast
      params:
        query: img-without-alt
    render:
      detector: image-inventory
      params:
        check:
        - load-failure
        - unresolved-placeholder
        - missing-alternative
  why: A content image is broken or an unresolved placeholder, or meaningful image information has no
    text alternative
  better: Use owned assets or labeled local placeholders and give meaningful images a text alternative
  keep_when:
  - id: empty-alt-decoration
    when: decorative images with an empty alt attribute
  waiver:
    scope: none
  verify: static
- id: imagery.generic-stock
  class: default
  domain: imagery
  layers:
  - render
  - review
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: image-embedding-region
      list: stock_image_regions
      region:
        space: embedding
  why: A generic stock scene supplies category cliche instead of evidence about the product
  better: Commission or select context-specific, permissioned imagery
  keep_when:
  - id: supplied-asset
    when: an image the client or brief supplied, recorded in the asset ledger with its origin
  waiver:
    scope: value
  verify: review
- id: code.mobile-100vh
  class: quality
  domain: code
  layers:
  - source
  - render
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: source-pattern
      params:
        patterns:
        - h-screen
        - 100vh
    render:
      detector: overflow-check
      params:
        viewports:
        - 390
        checks:
        - dynamic-viewport-clip
  why: A full-height shell sized with the static viewport height is clipped by mobile browser chrome
  better: Use dynamic viewport units and test on the target
  keep_when:
  - id: dvh-fallback
    when: 100vh is only the fallback declared before a dynamic-viewport value for the same property
  - id: no-mobile-browser
    when: the brief lists no web platform, such as a desktop app or an embedded kiosk, so no mobile browser
      chrome resizes the viewport
  waiver:
    scope: value
  verify: static
- id: code.focus-outline-removed
  class: requirement
  domain: code
  layers:
  - source
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: source-pattern
      params:
        patterns:
        - outline:\s*(none|0)\s*(!important)?\s*[;}]
        - outline-none
    behavior:
      detector: focus-visible
  why: The focus outline is removed without a replacement, so keyboard focus is invisible
  better: Provide a visible focus-visible style with enough contrast
  waiver:
    scope: none
  verify: runtime
- id: code.clickable-non-interactive
  class: requirement
  domain: code
  layers:
  - source
  - render
  - behavior
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: source-ast
      params:
        query: click-handler-on-non-interactive-element
    render:
      detector: accessibility-tree
      params:
        check: pointer-only-control
    behavior:
      detector: keyboard-traversal
      params:
        check: operable
        semantic: false
  why: A clickable div or span lacks the name, role, state, and keyboard behavior of a real control
  better: Use a native button or link
  waiver:
    scope: none
  verify: runtime
- id: code.image-dimensions
  class: quality
  domain: code
  layers:
  - source
  - render
  severity:
    create: warn
    review: P2
  detect:
    source:
      detector: source-ast
      params:
        query: img-without-intrinsic-size
    render:
      detector: layout-shift
      params:
        during: load
      threshold:
        cls_max: 0.1
  why: Images without intrinsic dimensions shift content as they load
  better: Supply width and height or an aspect ratio
  keep_when:
  - id: css-reserved-box
    when: the box is reserved by a CSS aspect-ratio or fixed size that the source query cannot see, and
      the render shows no layout shift
  waiver:
    scope: value
  verify: static
- id: code.locale-time-rendering
  class: quality
  domain: code
  layers:
  - source
  - behavior
  severity:
    create: warn
    review: P2
  detect:
    source:
      detector: source-ast
      params:
        query: hard-coded-date-number-or-locale-string
    behavior:
      detector: console-errors
      params:
        kinds:
        - hydration-mismatch
  why: Hard-coded dates, numbers, or locale strings go stale or wrong by locale, and time-dependent output
    differs between server and client
  better: Format with locale-aware APIs, stabilize the initial value, then update safely on the client
  keep_when:
  - id: content-literal
    when: a date or number that is part of the written content, such as a publication date or a historical
      year
  - id: fixed-format-by-spec
    when: a format that the brief or a standard fixes, such as ISO 8601 timestamps in a log view
  waiver:
    scope: value
  verify: runtime
- id: code.continuous-value-in-state
  class: quality
  domain: code
  layers:
  - source
  severity:
    create: warn
    review: P2
  detect:
    source:
      detector: source-ast
      params:
        query: state-setter-in-pointer-or-scroll-handler
  why: Continuous pointer or scroll values stored in component state cause re-render loops and stutter
  better: Use motion values, refs, CSS, or platform APIs for continuous values
  keep_when:
  - id: frame-throttled
    when: the setter runs at most once per frame through requestAnimationFrame or a throttle
  - id: value-is-displayed
    when: the value is rendered as text or structure that refs and CSS cannot update, such as a slider's
      numeric readout
  waiver:
    scope: value
  verify: static
- id: code.animation-package-mismatch
  class: quality
  domain: code
  layers:
  - source
  severity:
    create: warn
    review: P2
  detect:
    source:
      detector: dependency-check
      params:
        check: animation-imports-vs-installed
        unobserved: not-verified
  why: Animation imports do not match the installed package or API, or several animation packages are
    mixed
  better: Verify the project dependency and its supported import; keep one animation stack
  keep_when:
  - id: matching-import-path
    when: either import path is fine when it matches the installed package
  waiver:
    scope: value
  verify: static
- id: code.unvirtualized-list
  class: quality
  domain: code
  layers:
  - render
  severity:
    create: gate
    review: P1
  detect:
    render:
      detector: large-list
      threshold:
        rendered_items_max: 500
  why: A large list renders every item in a scrolling data surface, stalling and consuming memory
  better: Virtualize when the measured volume requires it
  keep_when:
  - id: measured-within-budget
    when: the full list was measured on the target device and stays within a performance budget that the
      brief states
  - id: needs-full-dom
    when: the full list must stay in the page for find-in-page, print, or assistive technology, and its
      count is bounded by the source
  waiver:
    scope: value
  verify: runtime
- id: reference.brand-asset-reuse
  class: requirement
  domain: reference
  layers:
  - render
  - review
  severity:
    create: gate
    review: P0
  detect:
    render:
      detector: reference-asset-match
      params:
        rights: reference-only
  why: Logos, illustrations, or copy from a reference-only source are reused as they are
  better: Take relations from the reference and leave its assets, identity, and copy behind
  waiver:
    scope: none
  verify: static
- id: reference.clone-risk
  class: quality
  domain: reference
  layers:
  - render
  - review
  severity:
    create: gate
    review: P1
  detect:
    render:
      detector: reference-distance
      params:
        rights:
        - reference-only
        dimensions:
        - layout
        - palette
        - type
        - copy
        require_all_dimensions: true
      threshold:
        distance_min: 0.15
  why: Layout structure, palette roles, type fingerprint, and copy are all close to one reference at once
  better: Keep the relations named in the plan's take list and change the rest; borrowing one dimension
    is structure, not cloning
  keep_when:
  - id: licensed-reference
    when: the reference is owned or licensed for this use
  waiver:
    scope: value
  verify: static
- id: rights.no-provenance
  class: requirement
  domain: rights
  layers:
  - source
  - render
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: asset-ledger
      params:
        check: coverage
    render:
      detector: asset-ledger
      params:
        check: coverage
  why: A shipped image, video, icon set, or font has no provenance record, so nobody can show where it
    came from or what its license allows
  better: Record the asset with its source, license, and intended use, or replace it with one you can
    record
  waiver:
    scope: none
  verify: static
- id: rights.license-unknown
  class: requirement
  domain: rights
  layers:
  - source
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: asset-ledger
      params:
        check: license
  why: An asset or font ships under an unknown license, from an unknown origin, or without a record of
    where its license document is kept
  better: Find the governing license for the exact item from the rights holder or provider, record where
    it is kept, or replace the asset
  waiver:
    scope: none
  verify: static
- id: rights.license-hint-only
  class: quality
  domain: rights
  layers:
  - source
  severity:
    create: warn
    review: P2
  detect:
    source:
      detector: asset-ledger
      params:
        check: license
  why: The recorded license comes from a catalog badge or embedded file metadata, which point to a license
    but do not grant one
  better: Read the license for the exact item from the rights holder or provider and record that
  waiver:
    scope: value
  verify: static
- id: rights.use-outside-license
  class: requirement
  domain: rights
  layers:
  - source
  severity:
    create: gate
    review: P0
  detect:
    source:
      detector: asset-ledger
      params:
        check: use
  why: 'The recorded use goes beyond the license: commercial use under a non-commercial license, non-editorial
    use under an editorial-only license, an edited work whose license forbids derivatives, a platform
    the license does not cover, a generator input the license excludes, or font files shipped from a synced,
    system, or unknown copy'
  better: Keep the asset where its license allows, obtain a license for this use, ship files from a channel
    that grants it, or replace the asset
  waiver:
    scope: none
  verify: static
- id: rights.license-expired
  class: requirement
  domain: rights
  layers:
  - source
  severity:
    create: gate
    review: P0
  detect:
    source:
      detector: asset-ledger
      params:
        check: expiry
  why: The license, approval, or relationship behind an asset has ended and the asset still ships
  better: Renew the right, or remove the asset and ship its recorded replacement
  waiver:
    scope: none
  verify: static
- id: rights.attribution-missing
  class: requirement
  domain: rights
  layers:
  - source
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: asset-ledger
      params:
        check: attribution
  why: A license that requires credit has no recorded credit text or placement
  better: Record the credit in the form the license asks for and show it where the record says
  waiver:
    scope: none
  verify: static
- id: rights.notice-missing
  class: requirement
  domain: rights
  layers:
  - source
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: asset-ledger
      params:
        check: notices
  why: Distributed fonts, icons, or other licensed files ship without the license and copyright notices
    their license requires
  better: Ship the license text and copyright notice with the files, in a licenses folder or an about
    screen; a visible credit does not replace them
  waiver:
    scope: none
  verify: static
- id: rights.reserved-font-name
  class: requirement
  domain: rights
  layers:
  - source
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: asset-ledger
      params:
        check: reserved-names
  why: A subset or converted open font keeps a name its license reserves for the original release
  better: Rename the modified font's internal names, ship the unmodified release, or obtain written permission
    from the rights holder
  waiver:
    scope: none
  verify: static
- id: rights.unverified-mark
  class: requirement
  domain: rights
  layers:
  - source
  severity:
    create: gate
    review: P0
  detect:
    source:
      detector: asset-ledger
      params:
        check: marks
  why: Another party's logo or mark appears without confirmed authorization, or implies a customer, partner,
    or press relationship that nobody confirmed
  better: Confirm the relationship and use the owner's approved asset and guidelines, or name the other
    party in plain text
  keep_when:
  - id: plain-reference-allowed
    when: a compatibility or integration reference whose owner's guidance allows plain reference, recorded
      as not-needed
  waiver:
    scope: none
  verify: static
- id: rights.generated-as-evidence
  class: requirement
  domain: rights
  layers:
  - source
  - review
  severity:
    create: gate
    review: P0
  detect:
    source:
      detector: asset-ledger
      params:
        check: generated
  why: Generated media stands in for a real product, person, place, or result that the page presents as
    real
  better: Use a real photograph or recording as evidence, or make the generated image plainly illustrative
    and change its role
  waiver:
    scope: none
  verify: static
- id: rights.generated-from-reference
  class: requirement
  domain: rights
  layers:
  - source
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: asset-ledger
      params:
        check: generated
  why: Reference-only material went into a generator, so the output can carry expression from a source
    the project may only study
  better: Generate again from own or licensed inputs and a description of the qualities to carry over
  waiver:
    scope: none
  verify: static
- id: rights.generated-unreviewed
  class: quality
  domain: rights
  layers:
  - source
  severity:
    create: warn
    review: P2
  detect:
    source:
      detector: asset-ledger
      params:
        check: generated
  why: Generated media ships without a check for stray marks, watermarks, recognizable people, copied-looking
    characters, or broken text
  better: Review each generated asset for those problems and record the review in the ledger
  waiver:
    scope: value
  verify: static
- id: rights.release-missing
  class: requirement
  domain: rights
  layers:
  - source
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: asset-ledger
      params:
        check: releases
  why: A photo or video in commercial or promotional use may show people or private property whose release
    status is open
  better: Record obtained releases, or record that nothing needing one is depicted; otherwise replace
    the media
  waiver:
    scope: none
  verify: static
- id: rights.unapproved-mark-symbol
  class: quality
  domain: rights
  layers:
  - render
  severity:
    create: warn
    review: P3
  detect:
    render:
      detector: asset-ledger
      params:
        check: mark-symbols
  why: A registered or trademark sign appears without brand guidance that sets it for that mark
  better: Drop the sign, or follow the owner's approved guidance and record the symbol with the mark
  waiver:
    scope: value
  verify: static
