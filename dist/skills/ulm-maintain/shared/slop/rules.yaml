packages:
  warm-editorial:
    members:
    - color.cream-base
    - color.terracotta-accent
    - type.serif-luxury-display
    structure:
      base:
        role: field
        warmth: warm
        c_max: 0.045
        l_min: 0.9
      accent:
        count: 1
        warmth: warm
        c:
        - 0.08
        - 0.16
      display_type:
        serif: true
    hit_when:
      min_members: 2
    observed:
      eras:
      - 2025
      note: cream paper field, serif display, clay accent, tiny uppercase metadata
  dark-luminous:
    members:
    - color.violet-blue-gradient
    - color.hero-halo
    - color.neon-glow
    - color.gradient-headline
    - surface.glass-everywhere
    - type.overused-neutral-grotesque
    - motion.pulse-without-status
    - copy.buzzwords
    structure:
      base:
        role: field
        l_max: 0.25
      accents:
        hues:
        - 255
        - 320
        luminous: true
      material:
        translucent_panels: true
    hit_when:
      min_members: 3
    observed:
      eras:
      - 2022
      - 2023
      - 2024
      note: dark field, violet-to-blue gradients, glow, glass cards
  hard-edge-graphic:
    members:
    - surface.hard-offset-shadow
    - type.costume-monospace
    - type.caps-prose
    - type.oversized-display
    structure:
      surfaces:
        border_px_min: 2
        shadow_blur_px_max: 0
      palette:
        saturated_blocks: true
    hit_when:
      min_members: 2
    observed:
      eras:
      - 2026
      note: thick outlines, offset shadows, saturated blocks, heavy grotesque
  subscription-trap:
    members:
    - ux.hidden-subscription
    - ux.preselected-option
    - ux.obstructed-exit
    - ux.nagging
    structure:
      scope: member hits in a join flow, its paired exit flow, or the offers between them
    hit_when:
      min_members: 2
  pressure-selling:
    members:
    - ux.entry-interruption
    - ux.false-urgency
    - ux.false-hierarchy
    - ux.confirmshaming
    - ux.nagging
    structure:
      scope: member hits on the same page or flow
    hit_when:
      min_members: 3
  consent-steering:
    members:
    - ux.preselected-option
    - ux.false-hierarchy
    - ux.asymmetric-decline
    - ux.nagging
    - ux.permission-on-load
    structure:
      scope: member hits on consent, marketing, or permission decisions; browser permission requests count
        as permission decisions
    hit_when:
      min_members: 2
rules:
- id: system.font-outside-contract
  class: contract
  domain: system
  layers:
  - source
  - render
  severity:
    create: gate
    review: P2
  detect:
    source:
      detector: css-font-family
      params:
        compare: contract-families
    render:
      detector: contract-diff
      params:
        kind: font-family
  why: A font family outside the design contract gives one region an unrelated typographic voice
  better: Use the contract family for that role, or record a proposed design change with the reason
  keep_when:
  - id: proposed-change
    when: the change is recorded as a proposed design change
  waiver:
    scope: value
  verify: static
- id: system.literal-color
  class: contract
  domain: system
  layers:
  - source
  - render
  severity:
    create: gate
    review: P2
  detect:
    source:
      detector: css-literal-color
    render:
      detector: contract-diff
      params:
        kind: color
      threshold:
        delta_e_ok_max: 0.02
  why: Literal colors outside semantic tokens drift into near-duplicate grays and accents
  better: Use the semantic token for the role, or add a token when the value repeats with a real role
  keep_when:
  - id: content-color
    when: data or content colors that come from the content itself, such as a product swatch
  waiver:
    scope: value
  verify: static
- id: system.off-scale-value
  class: contract
  domain: system
  layers:
  - source
  - render
  severity:
    create: gate
    review: P2
  detect:
    source:
      detector: css-off-scale-value
      params:
        properties:
        - border-radius
        - font-size
        - gap
        - margin
        - padding
    render:
      detector: contract-diff
      params:
        kind:
        - radius
        - font-size
        - spacing
  why: One-off radius, size, or spacing values make equivalent components drift without a role or optical
    reason
  better: Use the scale step for the same role and condition; document an optical correction when one
    is needed
  keep_when:
  - id: optical-correction
    when: a documented optical correction, such as balancing an icon inside a round button
  waiver:
    scope: value
  verify: static
- id: system.bypassed-primitive
  class: contract
  domain: system
  layers:
  - source
  - review
  severity:
    create: gate
    review: P1
  detect:
    source:
      detector: source-ast
      params:
        query: raw-element-where-adopted-primitive-exists
  why: A component that bypasses the adopted primitives or theme API behaves and styles its states differently
    from its peers
  better: Build on the adopted primitive and theme API; extend the primitive when it lacks a needed state
  keep_when:
  - id: recorded-primitive-gap
    when: the primitive cannot express a documented requirement and the gap is recorded
  waiver:
    scope: value
  verify: review
- id: plan.uncompared-decision
  class: quality
  domain: plan
  layers:
  - plan
  severity:
    create: gate
    review: P1
  detect:
    plan:
      detector: plan-candidates
      path: explorations
      params:
        modes:
        - create
        copy_slots:
        - headline
        - subhead
        - cta
        min_candidates: 2
  why: A decision made without a second candidate is the first answer that came to mind, and for most
    pages that is the default for that kind of page
  better: Record each open decision in explorations - two or more candidates with their sources, what
    they were compared on, the chosen one, and why the runner-up lost; a decision the contract or the
    brief fixes says so with fixed_by
  waiver:
    scope: none
  verify: static
- id: type.serif-luxury-display
  class: default
  domain: type
  layers:
  - plan
  - render
  - review
  severity:
    create: gate
    review: P3
  detect:
    plan:
      detector: plan-font-region
      path: tokens.type.roles[?role=display|heading].family
      list: luxury_serif_regions
    render:
      detector: rendered-family-region
      list: luxury_serif_regions
      params:
        roles:
        - display
        - heading
        include_italic: true
  packages:
  - warm-editorial
  why: A high-contrast or italic serif display stands in for premium without any tie to the subject
  better: Choose display type from the product's material, voice, and content; compare a subject-earned
    serif, sans, and mixed route
  keep_when:
  - id: specified-face
    when: the brand or contract specifies the face
  - id: editorial-reading
    when: publishing or editorial subjects where the reading sequence earns it
  waiver:
    scope: value
  verify: static
- id: type.eyebrow-kicker
  class: default
  domain: type
  layers:
  - render
  - review
  severity:
    create: gate
    review: P3
  detect:
    render:
      detector: eyebrow-relation
      params:
        kind: label
      threshold:
        repeats_max: 2
  why: A small tracked uppercase label or index marker repeats before most headings without adding category,
    scope, state, or sequence
  better: Remove it; when context is needed, write a specific label and let the title carry the proposition
  keep_when:
  - id: real-category
    when: the label names a real category or scope that differs between sections
  - id: ordered-process
    when: the marker numbers a real ordered process
  waiver:
    scope: rule
  verify: review
- id: type.heading-badge
  class: default
  domain: type
  layers:
  - render
  - review
  severity:
    create: gate
    review: P3
  detect:
    render:
      detector: eyebrow-relation
      params:
        kind: badge
  why: A badge chip or status strip above a headline delays the message and can imply a state that does
    not exist
  better: Keep a real current status beside the object it describes; otherwise omit it
  keep_when:
  - id: current-state
    when: the badge reflects authoritative current state
  - id: filter-or-state-chip
    when: the chip filters content or identifies authoritative current state
  waiver:
    scope: value
  verify: review
- id: type.icon-tile-heading
  class: default
  domain: type
  layers:
  - render
  severity:
    create: gate
    review: P3
  detect:
    render:
      detector: template-repetition
      params:
        pattern:
        - icon
        - heading
        - text
      threshold:
        repeats_max: 2
  why: Every section opens with the same stacked icon tile, heading, and paragraph, so the icon only duplicates
    the label
  better: Use icons for recognition or actions; let content differences shape each section
  keep_when:
  - id: recognition-icon
    when: icons that users need to recognize a category or action
  waiver:
    scope: rule
  verify: static
- id: type.oversized-display
  class: quality
  domain: type
  layers:
  - render
  - review
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: type-hierarchy
      params:
        check: oversized
      threshold:
        first_viewport_area_share_max: 0.4
        lines_at_390_max: 4
  packages:
  - hard-edge-graphic
  why: Headline scale grows past the content and viewport need, crowding the task or wrapping awkwardly
  better: Balance title, evidence, and action for the surface; do not force every opening into one viewport
  keep_when:
  - id: title-is-content
    when: an immersive or campaign opening where the title is the content
  waiver:
    scope: value
  verify: static
- id: type.negative-tracking
  class: quality
  domain: type
  layers:
  - source
  - render
  severity:
    create: warn
    review: P2
  detect:
    source:
      detector: source-pattern
      params:
        patterns:
        - letter-spacing:\s*-(0?\.0[5-9]|0?\.[1-9]|[1-9])[0-9.]*em
        - tracking-\[-(0?\.0[5-9]|0?\.[1-9])
        - tracking-tighter
    render:
      detector: text-metrics
      params:
        metric: letter_spacing_em
      threshold:
        min: -0.04
  why: Tracking tighter than the face tolerates makes letterforms collide and word shapes collapse
  better: Respect the face's spacing; tighten only display sizes where the letterforms survive
  keep_when:
  - id: tight-display-face
    when: a display face designed for tight setting at that size
  waiver:
    scope: value
  verify: static
- id: type.body-tracking
  class: quality
  domain: type
  layers:
  - render
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: text-metrics
      params:
        metric: letter_spacing_em
        roles:
        - body
      threshold:
        max: 0.02
  why: Positive tracking on paragraphs stripes the text and tires the reader
  better: Keep body tracking near the face's default
  keep_when:
  - id: contract-tracking
    when: the design contract sets the body tracking and the plan cites it
  - id: measured-correction
    when: the face's metrics are measured to need open spacing at that size
  waiver:
    scope: value
  verify: static
- id: type.tight-leading
  class: quality
  domain: type
  layers:
  - render
  severity:
    create: gate
    review: P1
  detect:
    render:
      detector: text-metrics
      params:
        metric: line_height
        roles:
        - body
      threshold:
        min:
          latn: 1.2
          cyrl: 1.2
          grek: 1.2
          hang: 1.4
          hani: 1.4
          kana: 1.4
          other: 1.3
  why: Body leading near 1 makes ascenders and descenders collide and lines hard to track
  better: Set leading for size, measure, script, and content
  keep_when:
  - id: single-line-text
    when: body-role text that never wraps, such as one-line table cells, so no two lines can collide
  - id: contract-leading
    when: the design contract sets the leading and the plan cites it
  waiver:
    scope: value
  verify: static
- id: type.long-measure
  class: quality
  domain: type
  layers:
  - render
  severity:
    create: warn
    review: P2
  detect:
    render:
      detector: text-metrics
      params:
        metric: measure_chars
        roles:
        - body
      threshold:
        max:
          latn: 80
          cyrl: 80
          grek: 80
          hang: 45
          hani: 40
          kana: 40
          other: 80
  why: Paragraphs that run past a comfortable measure make readers lose the next line
  better: Constrain the prose measure; give data its own grid
  keep_when:
  - id: data-grid
    when: tables and data rows, which follow their own grid
  waiver:
    scope: value
  verify: static
- id: type.flat-hierarchy
  class: quality
  domain: type
  layers:
  - plan
  - render
  severity:
    create: gate
    review: P1
  detect:
    plan:
      detector: plan-value-range
      path: tokens.type.scale.ratio
      threshold:
        min: 1.125
    render:
      detector: type-hierarchy
      params:
        check: flat
        levers:
        - size
        - weight
        - contrast
      threshold:
        heading_body_ratio_min: 1.2
  why: Title, label, and body share size, weight, and color, so the scan order is flat despite semantic
    headings
  better: Separate adjacent roles by changing one lever at a time - size, weight, contrast, or space
  keep_when:
  - id: contract-scale
    when: the design contract fixes the type scale and the plan cites it
  - id: non-size-levers
    when: the roles are separated by weight, contrast, or space instead of size, and the plan names the
      lever for each pair of roles
  waiver:
    scope: value
  verify: static
- id: type.overused-neutral-grotesque
  class: default
  domain: type
  layers:
  - plan
  - render
  severity:
    create: gate
    review: P3
  detect:
    plan:
      detector: plan-font-region
      path: tokens.type.roles[*].family
      list: overused_type_regions
    render:
      detector: rendered-family-region
      list: overused_type_regions
  packages:
  - dark-luminous
  why: A featureless low-contrast, high-x-height grotesque carries every role with no distinction between
    product, editorial, and data voices
  better: Pair type by role; keep the face only when the contract or platform specifies it, or when it
    won a recorded comparison on this surface's own copy
  keep_when:
  - id: specified-face
    when: the contract or platform specifies the face
  - id: role-variation
    when: a one-family system with deliberate role variation
  - id: won-comparison
    when: the face won a side-by-side comparison on this surface's own copy, recorded in explorations
  waiver:
    scope: value
  verify: static
- id: type.single-neutral-sans
  class: default
  domain: type
  layers:
  - plan
  - render
  severity:
    create: gate
    review: P3
  detect:
    plan:
      detector: plan-distinct-values
      path: tokens.type.roles[*].family
      params:
        min_items: 2
      threshold:
        distinct_min: 2
    render:
      detector: text-metrics
      params:
        metric: distinct_families
      threshold:
        min: 2
  why: One family, usually a neutral sans, carries every role with no variation in width, optical size,
    or weight, so consistency turns into monotony
  better: Vary optical size, width, or weight by role, or add a deliberate companion face
  keep_when:
  - id: role-variation
    when: a one-family system that varies width, optical size, or weight by role
  - id: platform-body-readability
    when: body readability on the target platform favors one family
  - id: specified-family
