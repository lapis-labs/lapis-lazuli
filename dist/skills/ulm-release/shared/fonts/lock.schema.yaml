# LapisLazuli fonts lock schema — v0 draft
# Location: .lapis/fonts.lock.json in the project
# lapis decides; `lazuli lock` pins the source, license, and delivery path as of that moment.
# plan_check and ulm-release read this file, not the machine-local lazuli DB.
# One lock per project; each font lists the plan tasks that use it (plans are per task).
# This is the fonts' provenance record; other media is recorded in the asset ledger
# (assets/ledger.schema.yaml). The rights check (assets/CHECKS.md) reads both.
# Never store credentials, license keys, payment data, or private receipts here.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/lapis-labs/lapis-lazuli/schemas/fonts-lock.v0.json
title: LapisLazuli fonts lock
type: object
additionalProperties: false
required: [version, locked_at, fonts]
properties:
  version: { const: 0 }
  locked_at: { type: string, format: date-time }
  fonts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [role, family, postscript_names, source, license, delivery, used_by]
      properties:
        role: { enum: [display, heading, body, ui, data, code, caption] }
        used_by: { type: array, minItems: 1, items: { type: string } }   # plan task ids
        family: { type: string }
        postscript_names: { type: array, minItems: 1, items: { type: string } }
        scripts: { type: array, items: { type: string } }
        source:                                     # where the files come from (the acquisition channel)
          # foundry-purchase: files delivered by the foundry or reseller under a purchased license;
          # adobe-sync, sandoll: a subscription client's synced files; user-installed: provenance unknown
          enum: [system, adobe-sync, google-fonts, fontsource, fontshare, noonnu, sandoll, open-source-other,
                 foundry-purchase, user-installed]
        catalog_match:
          type: object
          properties:
            catalog: { type: string }
            key: { type: string }
            method: { enum: [exact_ps, exact_family, fuzzy] }
            confidence: { type: number, minimum: 0, maximum: 1 }
        license:
          type: object
          additionalProperties: false
          required: [kind, checked_at]
          properties:
            kind: { enum: [ofl, apache, kogl-1, commercial-subscription, commercial-perpetual, system, unknown] }
            uses:                                   # what the license grants per use; a missing use is unknown
              type: object
              additionalProperties: false
              properties:
                web: { $ref: "#/$defs/grant" }        # font data served to visitors, by the delivery path below
                app: { $ref: "#/$defs/grant" }        # files bundled in a native or desktop app
                server: { $ref: "#/$defs/grant" }     # installed on a server that renders images or documents
                document: { $ref: "#/$defs/grant" }   # embedded in PDFs or ebooks
                editor: { $ref: "#/$defs/grant" }     # customers compose their own text with it
            url: { type: string, pattern: "^https?://[^?#]*$" }   # the governing license text
            checked_at: { type: string, format: date }
            # rights-holder: the license text shipped with the files or published by the foundry or rights holder
            # provider: the terms of the service that delivers the files
            # user-declared: facts the user states without a document at hand
            # catalog summaries and file metadata are hints only
            source_class: { enum: [rights-holder, provider, catalog-summary, file-metadata, user-declared] }
        files:                                      # font files that ship (self-host or app bundle); globs allowed
          type: array
          minItems: 1
          items: { type: string, pattern: "^(?!/)(?!.*\\.\\.)[^\\0]+$" }
        modified:                                   # woff-unchanged: compressed only, data and metadata kept
          enum: [none, woff-unchanged, subset, converted, rebuilt]
        reserved_names:                             # reserved font names the license declares
          type: object
          additionalProperties: false
          required: [names, permission]
          properties:
            names: { type: array, items: { type: string, minLength: 1 } }
            permission: { type: boolean }           # written permission to keep them on a modified version
        shipped_names:                              # family, full, and PostScript names inside the shipped files
          type: array
          items: { type: string }
        notices:                                    # license and copyright texts that ship with the files
          type: array
          items: { type: string }
        notices_embedded: { type: boolean }         # copyright and license name records inside the shipped files
        delivery:                                   # how the font is delivered in the target environment
          enum: [self-host, adobe-web-project, google-fonts-api, app-bundle, system-only, not-deliverable]
        fallback: { type: array, items: { type: string } }
      allOf:
        - if: { required: [files] }
          then: { required: [modified] }
        - if:
            properties:
              license: { properties: { kind: { const: ofl } } }
              modified: { enum: [subset, converted, rebuilt] }
            required: [modified]
          then: { required: [reserved_names] }

$defs:
  grant: { enum: [allowed, allowed-with-conditions, not-allowed, unknown] }
