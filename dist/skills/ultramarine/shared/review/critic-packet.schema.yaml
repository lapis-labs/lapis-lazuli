# Critic packet: the fixed inputs one critic report is judged against; written by `lapis-design critic packet`, never by hand.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/lapis-labs/lapis-lazuli/schemas/critic-packet.v0.json
title: LapisLazuli critic packet
# `.lapis/critic/<task>.packet.json` (or the `--out` path under `.lapis/critic/`), deterministic JSON: sorted keys,
# no timestamps, no maker reasons. A critic report counts only for the packet whose bytes hash to its
# `target.packet.sha256`; `lapis-design critic packet` rebuilds the packet from `args` and the project to check that.
type: object
additionalProperties: false
required: [version, task, args, requirements, plan, direction, gaps, asks, inputs, findings, changes, disputes]
properties:
  version: { const: 0 }
  task: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,63}$" }
  args:                                            # what the packet was built from, as project-relative paths
    type: object
    additionalProperties: false
    required: [extracts, lint]
    properties:
      extracts: { type: array, minItems: 1, items: { type: string, minLength: 1 } }   # render extracts, in the order given
      lint: { type: string, minLength: 1 }         # the lint report
      session: { type: string, minLength: 1 }      # the behavior session, when one was given
      motion: { type: string, minLength: 1 }       # the motion evidence (render/motion.schema.yaml); a page that moves needs it
  rules:                                           # the worker rules the critic was given verbatim (shared/review/worker-rules.md); a delta follows a packet with the same digest
    type: object
    additionalProperties: false
    required: [sha256]
    properties:
      sha256: { $ref: "#/$defs/digest" }
  supporting:                                      # evidence the maker declared for the shown page (specimen, reference capture, ?query variant): shown to the critic, never a page under review
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, link, path, sha256, claim]
      properties:
        kind: { enum: [specimen, reference-capture, query-variant] }
        link: { type: string }                     # the address as the questions show it
        path: { type: string }                     # the file that carries the claim, also listed in `inputs`
        sha256: { $ref: "#/$defs/digest" }
        claim: { type: string }                    # what the maker says the file shows; judge it against the file
        page: { type: string }                     # the shown page a ?query variant belongs to
  requirements:                                    # the owner's rows, as the CLI copied them (requirements/schema.yaml)
                                                   # then the guideline rows (id `G:<guideline>/<item>`): checklist items of the guidelines the plan names, a lapis source and never the owner's words
    type: object
    additionalProperties: false
    required: [sha256, rows, owner_decisions]
    properties:
      sha256: { oneOf: [{ $ref: "#/$defs/digest" }, { type: "null" }] }   # of `rows` and `owner_decisions` as listed here; null with no record
      rows:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, text]
          properties:
            id: { $ref: "#/$defs/requirement_id" }
            section: { type: string }
            text: { type: string, minLength: 1 }
            guideline:                                 # a guideline row only: what the item is and what measures it
              type: object
              additionalProperties: false
              required: [id, item, url, measure, platforms]
              properties:
                id: { enum: [apple-hig, material-3, fluent-2, krds, wcag-2.2] }
                item: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
                url: { type: string, pattern: "^https://" }
                measure: { enum: [render, behavior, static, judge] }   # what could establish it; `rules` and `check` say what does
                platforms: { type: array, minItems: 1, items: { enum: [web, ios, android, desktop, email, embedded] } }
                rules: { type: array, items: { type: string } }       # lint rules whose findings are evidence for it (their findings name the item)
                check: { enum: [target-size] }                         # the mechanical check `guideline.target-size` runs
                threshold: { type: object }                            # value, unit, quantity in the guideline's own unit (guidelines/units.yaml says how CSS px stands for it)
                limits: { type: string }                               # what a measurement cannot see
                needs_review: { const: true }                          # written from a section list, not read in full
      owner_decisions:                             # an owner's `drop` or `narrow` of a row, with the owner's words
        type: array
        items:
          type: object
          additionalProperties: false
          required: [row, decision, quote]
          properties:
            row: { $ref: "#/$defs/row_id" }
            decision: { enum: [drop, narrow] }
            quote: { type: string }
  plan:                                            # the plan's design fields; no maker reason, evidence, or concept
    type: object
    additionalProperties: false
    properties:
      brief: { type: object }
      world_materials: { type: array, items: { type: string } }
      layout:
        type: object
        additionalProperties: false
        properties:
          phone_task: { type: object }
          sections: { type: array, items: { type: object } }
          signature: { type: string }
          procedure:
            type: object
            additionalProperties: false
            properties:
              priority: { type: array, items: { type: string } }
      tokens:
        type: object
        additionalProperties: false
        properties:
          type:
            type: object
            additionalProperties: false
            properties:
              roles: { type: array }
              scale: { type: object }                  # base_px and ratio, the steps a font-size dispute is judged against
          color: { type: object, additionalProperties: false, properties: { roles: { type: array } } }
          space:                                       # the steps a spacing dispute is judged against
            type: object
            additionalProperties: false
            properties:
              base_px: { type: number }
              scale: { type: array, items: { type: number } }
          shape:                                       # the radius steps a radius dispute is judged against; the maker's `rule` and each contour's `reason` stay out
            type: object
            additionalProperties: false
            properties:
              radius: { type: object }
              media_contours: { type: array, items: { type: object } }
      content:
        type: object
        additionalProperties: false
        properties:
          voice: { type: object }
          key_copy: { type: array, items: { type: object } }
      flows:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, kind, goal, start, done]
          properties:
            id: { type: string }
            kind: { type: string }
            goal: { type: string }
            start: { type: string }
            done: { type: object }
      references:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [source, kind, take, leave]
          properties:
            source: { type: string }
            kind: { type: string }
            take: { type: array, items: { type: string } }
            leave: { type: array, items: { type: string } }
            profile: { type: string }
      explorations:                                # without `runner_up_lost` and `reason`
        type: array
        items:
          type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision: { type: string }
            covers: { type: array, items: { type: string } }
            candidates:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, source]
                properties:
                  name: { type: string }
                  source: { type: string }
                  artifact: { type: string }
            compared_on: { type: array, items: { type: string } }
            comparisons: { type: array, items: { type: object } }
            chosen: { type: string }
            fixed_by: { type: string }
      defaults:                                    # a keep as the plan names it, with the rule's own case text instead of the maker's reason
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, decision]
          properties:
            id: { type: string }
            decision: { enum: [keep, reject] }
            keep_when: { type: string }
            case_when: { type: string }            # `when` of that `keep_when` case in slop/rules.yaml
  direction:                                       # the direction conversation resolved for the critic: ids, option texts, who chose, the pick; no maker reason
    type: object
    additionalProperties: false
    required: [items, pick, contact]
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, label, state, by, choice, options]
          properties:
            id: { type: string }                   # S1, K2, O1, G1, or C2.G1
            label: { type: string }
            state: { enum: [open, narrowed, decided, delegated] }
            by: { enum: [owner, assumed, null] }
            choice: { type: [array, "null"], items: { type: string } }   # option ids, keep, drop, all, other
            options:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
                  does: { type: string }
      pick:
        type: [object, "null"]
        additionalProperties: false
        required: [candidate, by, card, captures]
        properties:
          candidate: { type: string }
          by: { enum: [owner, assumed] }
          card: { type: object }                   # the picked rough's card.yaml (diverge/card.schema.yaml)
          captures: { type: array, items: { type: string } }   # project-relative screenshots of the picked rough
      contact: { type: [string, "null"] }          # the contact sheet of the sealed roughs
  reference_digest:                                # the references record's digest as it stands: what each reference gives the page and what it leaves out (absent when the run has none)
    type: object
    additionalProperties: false
    required: [references]
    properties:
      references:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, direction, take, leave]
          properties:
            id: { type: string }                   # the reference's id in the references record
            direction: { type: string }            # its lettered direction, or none
            take:                                  # what the page takes from it, and where
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, element, at, why, by]
                properties:
                  id: { type: string, pattern: "^M[1-9][0-9]*$" }
                  element: { type: string }        # the specific element of the reference
                  at: { type: string }             # where it goes on our page
                  why: { type: string }
                  by: { enum: [agent, owner] }     # `owner`: the owner moved or placed it in a reply
            leave:                                 # what is attractive and excluded: brand colors, copy, illustrations, marks, a trend kit
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, what, why, by]
                properties:
                  id: { type: string, pattern: "^M[1-9][0-9]*$" }
                  what: { type: string }
                  why: { type: string }
                  by: { enum: [agent, owner] }
  motion:                                          # a page with motion: what was recorded of the shown build, never a flattened screenshot alone
    type: object
    additionalProperties: false
    required: [manifest, px_per_s, locales, scenes]
    properties:
      manifest:
        type: object
        additionalProperties: false
        required: [path, sha256]
        properties:
          path: { type: string }
          sha256: { $ref: "#/$defs/digest" }
      px_per_s: { type: integer, minimum: 1 }      # the speed of the scripted scroll, so dwell is runway over it
      locales:                                     # each locale shown; for each width the playback, settled, and reduced-motion captures and the build identity
        type: array
        items: { type: object }
      scenes:                                      # pinned scenes: what each holds on screen, the empty scroll runway around it, and its dwell
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, selector, text, content_px, runway_px, dwell_ms]
          properties:
            id: { type: string }                   # <lang>-<width>-S<n>
            selector: { type: string }
            text: { type: string }
            content_px: { type: integer, minimum: 0 }
            runway_px: { type: integer, minimum: 0 }
            dwell_ms: { type: integer, minimum: 0 }
  gaps:                                            # the decisions the owner has not made, as the owner block lists them now (`gaps.py`)
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, area, text]
      properties:
        id: { type: string }                       # style:S1, objects:O1, signature, color, layout, motion, type:<role>, copy:<locale>
        area: { enum: [style, objects, signature, color, layout, motion, type, copy] }
        text: { type: string }                     # what the agent filled in
  asks:                                            # the `## Asks` items of the brief record, without the run's `Basis:`
    type: array
    items:
      type: object
      additionalProperties: false
      required: [trigger, by, said]
      properties:
        trigger: { type: string }
        by: { enum: [owner, run] }
        said: { type: string }
  inputs:                                          # every file the critic may read, with its digest; nothing else is an input
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, path, sha256]
      properties:
        kind:
          enum: [extract, screenshot, lint, session, requirement-source, product, design, context, taste,
                 references-record, reference-capture, reference-profile, exploration, direction-contact,
                 direction-capture, motion, supporting-evidence, source-extracts, extract-source]
        path: { type: string, minLength: 1 }       # relative to the project root, with `/`
        sha256: { $ref: "#/$defs/digest" }
  findings:                                        # the lint report's findings by index, without their `fix` text or waivers
    type: array
    items:
      type: object
      additionalProperties: false
      required: [index, rule_id, layer, observed, status]
      properties:
        index: { type: integer, minimum: 0 }
        rule_id: { type: string }
        layer: { type: string }
        observed: { type: string }
        location: { type: object }
        status: { type: string }
        guideline_items: { type: array, items: { type: string } }   # the guideline rows (`<guideline>/<item>`) the finding is evidence for
  changes:                                         # change-log rows (integrity/schema.yaml) that were reactive, touched an open finding, or came after the slice
    type: array
    items:
      type: object
      additionalProperties: false
      required: [seq, kind, pointer, before, after, related_open, reactive, after_slice]
      properties:
        seq: { type: integer, minimum: 0 }
        kind: { type: string }
        pointer: { type: string }
        before: {}                                 # without any `reason`, `evidence`, or `runner_up_lost` key
        after: {}
        related_open: { type: array, items: { type: string } }
        reactive: { type: boolean }
        after_slice: { type: boolean }
  disputes:                                        # `.lapis/disputes/<task>.yaml` (review/disputes.schema.yaml) without the maker's reason and refs
    type: array
    items:
      type: object
      additionalProperties: false
      required: [index, report, rule_id, observed]
      properties:
        index: { type: integer, minimum: 0 }
        report: { type: string }
        rule_id: { type: string }
        location: { type: object }
        observed: { type: string }
$defs:
  digest: { type: string, pattern: "^[0-9a-f]{64}$" }
  row_id: { type: string, pattern: "^R[0-9a-f]{6,8}$" }
  requirement_id: { type: string, pattern: "^(R[0-9a-f]{6,8}|G:[a-z0-9.-]+/[a-z0-9-]+)$" }   # an owner's row, or a guideline row
