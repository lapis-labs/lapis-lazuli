# LapisLazuli finding schema — v0 draft
# Output of plan_check, slop_lint, the evaluator, and the release gate.
# Every rejection states the observed property, why it matters here, and a corrective move;
# evidence says how the finding was established so unverified claims stay labeled.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/lapis-labs/lapis-lazuli/schemas/finding.v0.json
title: LapisLazuli findings report
type: object
additionalProperties: false
required: [version, tool, target, findings]
properties:
  version: { const: 0 }
  tool:
    type: object
    required: [name, version]
    properties:
      name: { enum: [plan_check, slop_lint, render_check, behavior_check, rights_check, critic, release_gate] }
      version: { type: string }
  target:
    type: object
    properties:
      plan: { type: string }                         # path to the plan file
      extract: { type: string }                      # path to the render extract
      session: { type: string }                      # path to the behavior session log
      ledger: { type: string }                       # path to the asset ledger
      source: { type: string }                       # the project source tree slop lint read (--source)
      lock: { type: string }                         # the fonts lock slop lint read (--lock)
      task: { type: string }
  summary:
    type: object
    properties:
      blocking: { type: integer, minimum: 0 }        # findings that stop the workflow
      total: { type: integer, minimum: 0 }
      skipped: { type: integer, minimum: 0 }         # findings with status skipped: not judged, never a defect (plan_check, slop_lint)
      defects: { type: integer, minimum: 0 }         # release_gate: blocking findings that report a defect (GATE.md)
      no_evidence: { type: integer, minimum: 0 }     # release_gate: blocking findings that report a check that did not run or an input that is missing; blocking = defects + no_evidence
      to_confirm: { type: integer, minimum: 0 }      # release_gate: findings that do not block; total = blocking + to_confirm
      not_run:                                       # release_gate: no_evidence by cause, zero counts left out
        type: object
        additionalProperties: false
        properties:
          inputs: { type: integer, minimum: 1 }        # release.input-missing
          stale: { type: integer, minimum: 1 }         # release.input-stale
          widths: { type: integer, minimum: 1 }        # release.width-missing
          themes: { type: integer, minimum: 1 }        # release.theme-missing
          probes: { type: integer, minimum: 1 }        # release.probe-incomplete
          backend: { type: integer, minimum: 1 }       # release.backend-insufficient
          layers: { type: integer, minimum: 1 }        # release.layer-missing
          requirements: { type: integer, minimum: 1 }  # release.requirement-unverified
          critic: { type: integer, minimum: 1 }        # release.critic-missing
          licenses: { type: integer, minimum: 1 }      # release.license-unchecked
  scope:                                           # what slop lint actually ran (slop_lint); the release gate reads it
    type: object
    additionalProperties: false
    required: [layers]
    properties:
      layers:                                      # layers that ran, after --layer and the inputs given; a --layer whose inputs are missing is exit 2, never dropped
        type: array
        items: { enum: [plan, source, render, behavior, review] }
      rules:                                       # present only when --rule narrowed the run (its patterns leave out a packaged rule): the patterns given
        type: array
        items: { type: string }
      rules_file: { type: string }                 # present only when --rules named a file other than the packaged rules
      unread_links:                                # present only when the tree walk passed links over: they were not read (slop_lint); the release gate reads it
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          source: { type: array, minItems: 1, items: { type: string } }   # relative to --source: file links that resolve outside it, and folder links (never followed; listed with a trailing /)
          corpus: { type: array, minItems: 1, items: { type: string } }   # relative to --corpus
  analyzers:                                       # morphological analyzers that ran, by locale (slop_lint)
    type: object
    additionalProperties: { type: string }         # e.g. ko: "kiwipiepy 0.24.0"
  findings:
    type: array
    items: { $ref: "#/$defs/finding" }
  walkthroughs:                                    # critic: the visitor's tasks walked on the captures before judging; optional, and no check or gate reads it
    type: array
    items:
      type: object
      additionalProperties: false
      required: [task, viewport, completed, first_look]
      properties:
        task: { type: string, minLength: 3 }           # one of one to three tasks derived from the brief: "find today's hours and book"
        viewport: { enum: [320, 390, 768, 1440] }      # the capture walked; walk 1440 and 390
        first_look: { type: string, minLength: 3 }     # where the eye went first
        read_or_scrolled_past: { type: string }        # what had to be read or scrolled past to reach the next step
        stuck: { type: string }                        # where the walk stopped or turned back; absent when it did not
        completed: { enum: ["yes", "partly", "no", "not-walked"] }   # not-walked: the capture or the session could not show the step
        refs: { type: array, items: { type: string } } # capture files, box ids, or session steps the walk rests on

$defs:
  finding:
    type: object
    additionalProperties: false
    required: [rule_id, class, severity, layer, observed, blocking, evidence, status]
    properties:
      rule_id: { type: string }                      # a rules.yaml id, a built-in check id (schema.*, contract.*, font.*, reference.*, flow.*,
                                                    # release.* from release/GATE.md), or a critic judgement no rule covers
                                                    # (review.counterfactual, review.world-materials, review.package-drift, review.task-walkthrough)
      class: { enum: [requirement, quality, default, contract] }
      severity:
        type: object
        properties:
          create: { enum: [gate, warn, off, info] }
          review: { enum: [P0, P1, P2, P3] }
      layer: { enum: [plan, source, render, behavior, review] }
      location:
        type: object
        properties:
          file: { type: string }
          path: { type: string }                     # plan path, JSON pointer, or CSS selector
          viewport: { enum: [320, 390, 768, 1440] }
          box: { type: string }                      # box id in the render extract or the session's nodes
          context: { type: string }                  # behavior session context id
          flow: { type: string }                     # plan flow id
          step: { type: integer, minimum: 0 }        # step index in that flow's run
          asset: { type: string }                    # asset ledger id, or a fonts lock family
      observed: { type: string, minLength: 3 }       # the visible or measured property
      context:                                       # was the choice earned here?
        type: object
        properties:
          verdict: { enum: [earned, unearned, unknown] }
          basis: { type: string }                    # e.g. a defaults entry, a contract value
      consequence: { type: string }                  # effect on the user or the design
      fix: { type: string }                          # the corrective move
      blocking: { type: boolean }
      package: { type: string }                      # package that was hit, if any
      distance: { type: number, minimum: 0 }         # typicality or reference distance, if used
      evidence:
        type: object
        required: [type]
        properties:
          type: { enum: [plan, source, image, runtime, measurement, review, not-verified] }
          refs: { type: array, items: { type: string } }
      status: { enum: [open, fixed, waived, skipped] }
      skip_cause:                                    # why a skipped finding was not judged; slop lint sets it on every skipped finding
        enum:
          - input                                    # an input, field, list value, or detector the check needs is missing or failed
          - layer                                    # a later layer that must confirm a lead did not run or could not judge
          - probe                                    # the behavior probe that records the evidence did not run or ran partly
          - reviewer                                 # the rule needs a reviewer's judgement; only the critic resolves it
      waiver: { type: string }                       # the defaults entry or reason that waived it
