# LapisLazuli harness definitions — v0 draft (schema: install/harnesses.schema.yaml)
# The build (tools/build) emits `outputs`; install.sh, install.ps1, and the per-harness sections of
# INSTALLATION.md are generated from `cli` and `harnesses`. Output contents: install/OUTPUTS.md.
# Harness facts were checked against each harness's documentation and source on `checked`;
# `unverified` lists what a real run on the harness has not confirmed yet. `status: experimental`
# marks a harness whose commands come from its documentation and have not been confirmed on a real
# install; the install scripts install it only when --harness names it. Remove the status, and say
# how and when it was checked in the commit, once a real install confirms the commands.

version: 0
checked: "2026-09-25"
repo: { owner: lapis-labs, name: lapis-lazuli, catalog: lapis-lazuli, ref: release }

cli:
  entry_points: [lapis-design, lapis-design-hook, lazuli]
  install:
    - needs: uv
      steps:
        - run: [uv, tool, install, --force, "git+https://github.com/{repo}@{ref}"]
    - needs: pipx
      steps:
        - run: [pipx, install, --force, "git+https://github.com/{repo}@{ref}"]
  uninstall:
    - needs: uv
      steps:
        - run: [uv, tool, uninstall, lapis-design]
    - needs: pipx
      steps:
        - run: [pipx, uninstall, lapis-design]
  verify:
    - run: [lapis-design, --version]
      expect: "prints the version of {ref}"
    - run: [lazuli, doctor]
      expect: "exit code 0"

plugins:
  - name: lapis
    prefix: lps-
    description: Design direction, plans, and named defaults for new UI and redesigns
    skills: [lapis, lps-brief, lps-ux, lps-copy, lps-system]
    hooks: [exit-plan, stop, pre-write]
  - name: ultramarine
    prefix: ulm-
    description: Render checks, slop and rights review, and a separate critic
    skills: [ultramarine, ulm-maintain, ulm-release]
    agents: [critic]
  - name: lazuli
    prefix: lzl-
    description: Local fonts and colors, catalogs, references, and the lazuli CLI
    skills: [lazuli, lzl-fonts, lzl-color, lzl-research]
    hooks: [session-start]
    mcp: [lapis-lazuli]

outputs:
  - { id: flat-skills, path: "dist/skills/{skill}/", per: skill, format: agent-skill, from: [src/skills, src/shared/index.yaml] }
  - { id: plugin-skills, path: "plugins/{plugin}/skills/{skill}/", per: skill, format: agent-skill, from: [flat-skills] }
  - { id: claude-plugin-manifest, path: "plugins/{plugin}/.claude-plugin/plugin.json", per: plugin, format: claude-plugin-manifest, from: [install/harnesses.yaml] }
  - { id: codex-plugin-manifest, path: "plugins/{plugin}/.codex-plugin/plugin.json", per: plugin, format: codex-plugin-manifest, from: [install/harnesses.yaml] }
  - { id: claude-catalog, path: ".claude-plugin/marketplace.json", per: repo, format: claude-catalog, from: [install/harnesses.yaml] }
  - { id: codex-catalog, path: ".agents/plugins/marketplace.json", per: repo, format: codex-catalog, from: [install/harnesses.yaml] }
  - { id: plugin-hooks, path: "plugins/{plugin}/hooks/hooks.json", per: plugin, only: [lapis, lazuli], format: hooks-json, from: [install/harnesses.yaml] }
  - { id: plugin-mcp, path: "plugins/{plugin}/.mcp.json", per: plugin, only: [lazuli], format: mcp-json, from: [install/harnesses.yaml] }
  - { id: claude-agents, path: "plugins/{plugin}/agents/", per: plugin, only: [ultramarine], format: claude-agent, from: [src/agents] }
  - { id: codex-agents, path: "dist/codex/agents/", per: repo, format: codex-agent, from: [src/agents] }
  - { id: session-extension, path: "plugins/lazuli/extensions/session-start.ts", per: repo, format: ts-extension, from: [src/extensions/session-start.ts] }
  - { id: gate-extension, path: "plugins/lapis/extensions/exit-gate.ts", per: repo, format: gate-extension, from: [src/extensions/exit-gate.ts] }
  - { id: omp-package, path: "plugins/{plugin}/package.json", per: plugin, only: [lapis, lazuli], format: omp-package, from: [session-extension, gate-extension] }
  - { id: pi-package, path: "package.json", per: repo, format: pi-package, from: [flat-skills, session-extension, gate-extension] }
  - { id: hermes-plugin, path: "plugins/hermes/lapis-lazuli/", per: repo, format: hermes-plugin, from: [src/hermes] }
  - { id: antigravity-plugin-manifest, path: "dist/antigravity/{plugin}/plugin.json", per: plugin, format: antigravity-plugin-manifest, from: [install/harnesses.yaml] }
  - { id: antigravity-skills, path: "dist/antigravity/{plugin}/skills/{skill}/", per: skill, format: agent-skill, from: [flat-skills] }
  - { id: antigravity-hooks, path: "dist/antigravity/{plugin}/hooks.json", per: plugin, only: [lapis], format: antigravity-hooks-json, from: [install/harnesses.yaml] }
  - { id: antigravity-mcp, path: "dist/antigravity/{plugin}/mcp_config.json", per: plugin, only: [lazuli], format: mcp-json, from: [install/harnesses.yaml] }
  - { id: antigravity-agents, path: "dist/antigravity/{plugin}/agents/", per: plugin, only: [ultramarine], format: antigravity-agent, from: [src/agents] }
  - { id: agents-md-snippet, path: "dist/AGENTS.snippet.md", per: repo, format: agents-md-snippet, from: [install/harnesses.yaml] }

harnesses:
  - id: claude-code
    name: Claude Code
    detect: { commands: [claude], dirs: ["~/.claude"] }
    form: plugin
    consumes: [claude-catalog, claude-plugin-manifest, plugin-skills, plugin-hooks, plugin-mcp, claude-agents]
    skill_paths: ["~/.claude/skills", ".claude/skills", "plugin skills/"]
    invoke: "/{plugin}:{skill}"
    install:
      - run: [claude, plugin, marketplace, add, "{repo}@{ref}"]
      - run: [claude, plugin, install, "{plugin}@{catalog}", -s, user]
    update:
      - run: [claude, plugin, marketplace, update, "{catalog}"]
      - run: [claude, plugin, update, "{plugin}@{catalog}"]
        note: the new version loads in the next session or after /reload-plugins
    uninstall:
      - run: [claude, plugin, uninstall, "{plugin}@{catalog}", -s, user]
      - run: [claude, plugin, marketplace, remove, "{catalog}"]
        when: all-plugins
        note: removing the catalog uninstalls every plugin installed from it
    verify:
      - run: [claude, plugin, list, --json]
        expect: "an enabled entry {plugin}@{catalog} with no errors"
      - manual: "In a session, run /lapis:lapis and check that the skill loads"
    session_start: { via: plugin-hook, output: plugin-hooks, event: "SessionStart startup|resume|clear|compact|fork" }
    critic: { via: plugin-agent, output: claude-agents, note: "invoked as ultramarine:critic; the plan check runs from a hook inline in the lapis manifest" }
    exit_gate: { via: plugin-hook, output: plugin-hooks, event: Stop, note: "`lapis-design-hook --plugin-version <version> stop` continues the agent with the next step only when LAPIS_UNATTENDED=1 and says so in one line otherwise; at most 3 continues in a row for one step and 15 in a session; version skew skips the gate" }
    pre_write: { via: plugin-hook, output: plugin-hooks, event: "PreToolUse Write|Edit|MultiEdit", note: "`lapis-design-hook --plugin-version <version> pre-write` refuses a page source file's write with `permissionDecision: deny` only when LAPIS_UNATTENDED=1 and the brief, references, or plan of a create run is still owed, and in every session refuses a write to .lapis/requirements/, .lapis/state/, .lapis/changes/, or .lapis/owner/ (records only lapis-design writes); other writes under .lapis/ and to other files pass, a person's session gets one `systemMessage`; a refusal of page code repeats at most 3 times for one step; version skew skips the guard" }
    mcp: { via: plugin-mcp, output: plugin-mcp, note: "server plugin:lazuli:lapis-lazuli; the command is the CLI on PATH" }
    conflicts:
      - "Oh-My-Pi can load plugins from Claude Code's install registry; with both installed, skills load twice and dedupe by name"
    verified:
      - "2026-10-04, 2.1.285: `claude -p --model sonnet` with `--plugin-dir` for plugins/lapis, plugins/lazuli, and plugins/ultramarine, in a temporary folder with LAPIS_UNATTENDED=1 and the SaaS landing prompt (bypassPermissions): the `PreToolUse` hook (matcher Write|Edit|MultiEdit|apply_patch) let the brief record through, refused the model's first `Write` of index.html while the references record was owed (tool result `PreToolUse:Write hook error: LapisLazuli refuses this write: ...`, the file was not created), and let the first page `Write` through only after the brief, references, and plan existed (about 20 minutes later, after an operator reply to the model's question about the references); without LAPIS_UNATTENDED a `Write` of index.html under a create plan with no brief goes through with one `systemMessage` and a `first_page_write` record"
      - "2026-10-03, 2.1.285: `claude -p --plugin-dir plugins/lapis` with LAPIS_UNATTENDED=1 continues the agent once through the Stop hook (shown as Stop hook feedback with the next step); without the variable the hook prints a one-line systemMessage and the agent stops"
      - "2026-09-30, 2.1.277: from the public repository, `claude plugin marketplace add lapis-labs/lapis-lazuli@release` and `claude plugin install {plugin}@{catalog} -s user` install all three plugins at the release commit; a new session lists all eleven skills"
      - "2026-10-01, 2.1.285: `claude plugin marketplace update {catalog}` and `claude plugin update {plugin}@{catalog}` move all three plugins from 0.1.1 to 0.1.2 from the public repository; a new session lists all eleven skills"
      - "2026-10-02, 2.1.285: the same update commands move all three plugins from 0.1.2 to 0.1.3 from the public repository; a new session lists all eleven skills"
      - "2026-10-02, 2.1.285: the same update commands move all three plugins from 0.1.3 to 0.1.4 from the public repository; a new session lists all eleven skills"
      - "2026-10-02, 2.1.285: the same update commands move all three plugins from 0.1.4 to 0.2.0 from the public repository; a new session lists all eleven skills"
      - "2026-09-27, 2.1.274: `claude plugin marketplace add <local checkout>`, then `claude plugin install {plugin}@{catalog} -s user` installs all three plugins; adding the same marketplace again exits 0 (already on disk)"
      - "2026-09-27, 2.1.274: the SessionStart hook runs `lapis-design hook session-start` and exits 0 with the inventory summary; the MCP server plugin:lazuli:lapis-lazuli connects"
      - "2026-09-27, 2.1.274: `claude plugin list --json` reports each plugin's version and installPath (~/.claude/plugins/cache/{catalog}/{plugin}/{version}/); a local-path catalog loads the plugin from the checkout"
      - "2026-09-27, 2.1.274: sessions started from the Claude desktop app and from an IDE extension found `lapis-design` (installed with uv tool in ~/.local/bin): the inventory summary arrived and slop_lint answered. A process started with launchd's default PATH alone does not find it (env -i), so the apps pass more than that PATH"
      - "2026-09-27, 2.1.274: in plan mode, the PermissionRequest hook on ExitPlanMode denies a plan whose lapis-plan block has blocking findings and shows the reasons; a plan without blocking findings goes to the normal approval prompt"
    sources:
      - https://code.claude.com/docs/en/plugins/manifest-reference
      - https://code.claude.com/docs/en/plugins/marketplace-reference
      - https://code.claude.com/docs/en/plugins/cli-reference
      - https://code.claude.com/docs/en/hooks

  - id: codex
    name: OpenAI Codex CLI
    detect: { commands: [codex], dirs: ["~/.codex"] }
    form: plugin
    min_version: "0.153.0"
    consumes: [codex-catalog, codex-plugin-manifest, plugin-skills, plugin-hooks, plugin-mcp, codex-agents]
    skill_paths: [".agents/skills (cwd up to the repo root)", "~/.agents/skills"]
    invoke: "${plugin}:{skill}"
    install:
      - run: [codex, plugin, marketplace, add, "{repo}", --ref, "{ref}"]
      - run: [codex, plugin, add, "{plugin}@{catalog}"]
      - copy: { from: "dist/codex/agents/ulm-critic.toml", to: "~/.codex/agents/ulm-critic.toml" }
        confirm: true
      - manual: "Open /hooks in Codex and trust the lazuli session-start hook and the lapis stop and pre-write hooks; none of them runs until trusted"
    update:
      - run: [codex, plugin, marketplace, upgrade, "{catalog}"]
        note: there is no per-plugin update; new skills appear in the next session
      - copy: { from: "dist/codex/agents/ulm-critic.toml", to: "~/.codex/agents/ulm-critic.toml" }
        confirm: true
    uninstall:
      - run: [codex, plugin, remove, "{plugin}@{catalog}"]
      - run: [codex, plugin, marketplace, remove, "{catalog}"]
        when: all-plugins
      - remove: "~/.codex/plugins/cache/{catalog}/"
        when: all-plugins
      - remove: "~/.codex/agents/ulm-critic.toml"
        confirm: true
    verify:
      - run: [codex, plugin, list, --json]
        expect: "{plugin}@{catalog} installed and enabled"
      - manual: "For {plugin}, check that ~/.codex/agents/ulm-critic.toml exists and matches dist/codex/agents/ulm-critic.toml from {repo} at {ref}; a marketplace upgrade alone does not copy the critic file"
        plugins: [ultramarine]
      - manual: "In a new session, type $lapis:lps-ux and check that the skill is offered"
    session_start: { via: plugin-hook, output: plugin-hooks, event: "SessionStart startup|resume|clear|compact", note: "matchers are regular expressions; the fork alternative never matches here" }
    critic: { via: agent-file, output: codex-agents, note: "plugins cannot ship subagents; the installer copies the TOML file" }
    exit_gate: { via: plugin-hook, output: plugin-hooks, event: Stop, note: "`lapis-design-hook --plugin-version <version> stop` continues the agent with the next step only when LAPIS_UNATTENDED=1 and says so in one line otherwise; the lapis plugin's hook needs trust like the lazuli one; Stop takes no matcher; version skew skips the gate" }
    pre_write: { via: plugin-hook, output: plugin-hooks, event: "PreToolUse apply_patch", note: "the same hook as in Claude Code: Codex reports every file edit as `apply_patch` (its matchers also take Edit and Write) with the patch text in `tool_input.command`, and takes the same `permissionDecision: deny`; the lapis plugin's hook needs trust like the others" }
    mcp: { via: plugin-mcp, output: plugin-mcp }
    trust:
      - "every plugin hook needs trust for its exact hash via /hooks; a changed hook needs trust again"
      - "render and behavior checks start Chromium, and lazuli-backed checks read the lazuli user cache; interactive Codex sessions usually show an approval prompt: approve the requested access, or run the checks in a sandbox mode that allows both"
      - "`codex --help` and `codex exec --help` (0.159.3, checked 2026-10-02) list `-s, --sandbox` with `read-only`, `workspace-write`, and `danger-full-access`; `codex --help` lists `-a, --ask-for-approval` with `on-request` and `never`, but exec's help does not list that option, so put it before `exec` (for example `codex --ask-for-approval never exec --sandbox workspace-write`). If approvals are possible, approve the requested browser and cache access; otherwise run with a sandbox mode that allows both, such as `--sandbox danger-full-access` only with the user's authorization for broader access"
    conflicts:
      - "Codex reads the first plugin manifest it finds and never merges: a root plugin.json with an agent-plugins $schema, then .codex-plugin, then .claude-plugin. The Codex manifest repeats skills, hooks, and MCP"
      - "a github source type in a catalog is skipped; catalogs use ./ relative sources"
    unverified:
      - "which shell runs hook commands on Windows (the command is a plain program on PATH, so any should do)"
      - "browser and cache access on this host with 0.159.3 have not been reproduced: in the 2026-10-01 pilot with 0.159.2, headless `codex exec` under `workspace-write` with approval `never` failed to start Chromium with `bootstrap_check_in org.chromium.Chromium.MachPortRendezvousServer: Permission denied (1100)`, so render, behavior, and critic checks did not run; the lazuli user cache was also inaccessible"
      - "that the plugin's hooks/hooks.json `PreToolUse` entry runs after an install and trust: the 2026-10-04 check (verified below) gave Codex the same matcher and command through `-c hooks.PreToolUse=...`, not through an installed plugin"
    verified:
      - "2026-10-04, 0.160.0: `codex exec --dangerously-bypass-hook-trust` with LAPIS_UNATTENDED=1 and a `PreToolUse` hook of the plugin's matcher and command: the model's `apply_patch` adding index.html to an empty folder is refused (`Command blocked by PreToolUse hook: LapisLazuli refuses this write: ...`) and index.html is not created; the hook's event carries the patch in `tool_input.command` with an absolute path, and `permissionDecision: deny` blocks it"
      - "2026-10-03, 0.160.0: with the built lapis plugin installed in an isolated CODEX_HOME and `codex exec --dangerously-bypass-hook-trust`, the plugin's Stop hook gets the session id and LAPIS_UNATTENDED, continues the agent with the next step three times, then the gate lets it stop; without the flag the untrusted hook is skipped and the output says nothing about it"
      - "2026-09-30, 0.159.0: from the public repository, `codex plugin marketplace add lapis-labs/lapis-lazuli --ref release` and `codex plugin add {plugin}@{catalog}` install all three plugins at the release commit; a new session lists all eleven skills as {plugin}:{skill}"
      - "2026-10-01, 0.159.2: `codex plugin marketplace upgrade {catalog}` moves all three plugins from 0.1.1 to 0.1.2 from the public repository; a new session lists all eleven skills as {plugin}:{skill}"
      - "2026-10-02, 0.159.3: `codex plugin marketplace upgrade {catalog}` moves all three plugins from 0.1.2 to 0.1.3 from the public repository; a new session lists all eleven skills as {plugin}:{skill}"
      - "2026-10-02, 0.159.3: `codex plugin marketplace upgrade {catalog}` moves all three plugins from 0.1.3 to 0.1.4 from the public repository; a new session lists all eleven skills as {plugin}:{skill}"
      - "2026-10-02, 0.159.3: `codex plugin marketplace upgrade {catalog}` moves all three plugins from 0.1.4 to 0.2.0 from the public repository; a new session lists all eleven skills as {plugin}:{skill}"
      - "2026-09-27, 0.157.0: `codex plugin marketplace add <local checkout>`, then `codex plugin add {plugin}@{catalog}` installs all three plugins to ~/.codex/plugins/cache/{catalog}/{plugin}/{version}/; adding the same marketplace again exits 0"
      - "2026-09-27, 0.157.0: `codex plugin list --json` reports each plugin installed and enabled; `codex mcp list` lists lapis-lazuli (lapis-design mcp)"
      - "2026-09-27, 0.157.0: after install the plugin hook has no entry under [hooks.state] in ~/.codex/config.toml, so it stays untrusted until approved in /hooks"
      - "2026-09-27, 0.157.0: trusting the hook in /hooks records [hooks.state.\"lazuli@lapis-lazuli:hooks/hooks.json:session_start:0:0\"]; the next session gets the inventory summary"
      - "2026-09-27, 0.157.0: a session calls the MCP tool slop_lint on lapis-lazuli (with no inputs it answers 'nothing to lint')"
      - "2026-09-27: a session started from the Codex app found `lapis-design`: the inventory summary arrived and slop_lint answered"
      - "2026-09-27, 0.157.0: a plugin skill is listed to the session as {plugin}:{skill} (lapis:lapis, from the plugin cache), so it is invoked as $lapis:lapis"
      - "2026-09-27, 0.157.0: with dist/codex/agents/ulm-critic.toml copied to ~/.codex/agents/, a read-only session (-s read-only) spawns ulm-critic as a subagent (its thread records agent_role ulm-critic) and returns the critic report as its answer; nothing is written to disk"
      - "2026-09-27, 0.157.1: after `codex plugin add lapis@{catalog}` a new session lists lapis:lapis, lapis:lps-copy, lapis:lps-system, and lapis:lps-ux among its skills (session record)"
      - "2026-09-27, 0.157.1: in the TUI, $ opens the skill list; typing lps-ux shows `lps-ux (lapis)` with its description, and Enter inserts $lapis:lps-ux into the composer"
      - "2026-09-27, 0.157.1: the first TUI session after install asks about the new plugin hook (review, trust all, or continue without trusting); continuing without trust records nothing under [hooks.state]"
      - "2026-09-27, 0.157.1: `codex plugin remove` and `codex plugin marketplace remove` leave an empty ~/.codex/plugins/cache/{catalog}/ directory; nothing else of the plugin remains, and the [plugins.\"{plugin}@{catalog}\"] entries leave config.toml"
      - "2026-09-27, 0.157.1: `install.sh --uninstall --harness codex --yes` removes the three plugins, the marketplace, and that empty directory (`removed empty folder`)"
    sources:
      - https://developers.openai.com/plugins/build/plugins
      - https://learn.chatgpt.com/docs/hooks
      - https://developers.openai.com/codex/skills
      - https://developers.openai.com/codex/subagents

  - id: oh-my-pi
    name: Oh-My-Pi
    detect: { commands: [omp], dirs: ["~/.omp"] }
    form: plugin
    consumes: [claude-catalog, claude-plugin-manifest, plugin-skills, plugin-mcp, claude-agents, omp-package, session-extension, gate-extension]
    skill_paths: [".omp/skills", "~/.omp/agent/skills", ".agents/skills", ".claude/skills"]
    invoke: "/skill:{skill}"
    install:
      - run: [omp, plugin, marketplace, add, "{repo}"]
      - run: [omp, plugin, install, --scope, user, "{plugin}@{catalog}"]
      - manual: "Restart omp so the session-start and exit-gate extensions load; /reload-plugins refreshes skills and MCP only"
    update:
      - run: [omp, plugin, marketplace, update, "{catalog}"]
      - run: [omp, plugin, upgrade, --scope, user, "{plugin}@{catalog}"]
    uninstall:
      - run: [omp, plugin, uninstall, --scope, user, "{plugin}@{catalog}"]
      - run: [omp, plugin, marketplace, remove, "{catalog}"]
        when: all-plugins
    verify:
      - run: [omp, plugin, list]
        expect: "{plugin}@{catalog} listed and enabled"
      - manual: "In a session, run /skill:lps-ux"
    session_start: { via: extension, output: session-extension, event: session_start, note: "omp does not run hooks/hooks.json; a marketplace install links the plugin's package.json into ~/.omp/plugins/node_modules, and its omp.extensions load after a restart" }
    critic: { via: plugin-agent, output: claude-agents, note: "loaded as a task agent" }
    exit_gate: { via: extension, output: gate-extension, event: session_stop, note: "asks `lapis-design-hook --plugin-version <version> stop` and answers `{ decision: block }`, only when LAPIS_UNATTENDED=1; the lapis plugin's package.json links the extension; version skew skips the gate" }
    pre_write: { via: extension, output: gate-extension, event: tool_call, note: "the exit-gate extension also registers a `tool_call` handler for the write and edit tools; it asks `lapis-design-hook --plugin-version <version> pre-write` and answers `{ block: true, reason }` for page code only when LAPIS_UNATTENDED=1, and in every session for a write to .lapis/requirements/, .lapis/state/, .lapis/changes/, or .lapis/owner/; a handler error or timeout blocks the tool in omp, so the extension answers within 20 seconds and treats any failure as no answer; version skew skips the guard" }
    mcp: { via: plugin-mcp, output: plugin-mcp }
    conflicts:
      - "reads .omp-plugin, then .claude-plugin manifests; never .codex-plugin"
      - "can also load Claude Code's installed plugins; skills with the same name keep the highest-priority source"
    unverified:
      - "whether omp plugin marketplace add accepts a ref; neither the command's help nor docs/marketplace.md (18.4.3, read 2026-09-30) names one for any source form, so the catalog follows the default branch"
    verified:
      - "2026-10-04, 18.5.0: `omp -p -e exit-gate.ts` with LAPIS_UNATTENDED=1: the `tool_call` handler refuses the model's `write` of index.html (the model then wrote the brief record under .lapis/), `.lapis/order/<task>.json` records `denied: {step: brief, count: 1}`, and index.html is not created"
      - "2026-10-03, 18.4.10: `omp -p -e exit-gate.ts` with LAPIS_UNATTENDED=1 fires session_stop in print mode (its agent_before_settle registration ignored); `{ decision: block }` continued the agent three times with the next step, then the gate let it stop and recorded the step"
      - "2026-09-30, 18.4.4: from the public repository, `omp plugin marketplace add lapis-labs/lapis-lazuli` (default branch release) and `omp plugin install --scope user {plugin}@{catalog}` install all three plugins at the release commit; a new session lists all eleven skills"
      - "2026-10-01, 18.4.5: `omp plugin marketplace update {catalog}` and `omp plugin upgrade --scope user {plugin}@{catalog}` move all three plugins from 0.1.1 to 0.1.2 from the public repository; a new session lists all eleven skills"
      - "2026-10-02, 18.4.8: the same update commands move all three plugins from 0.1.2 to 0.1.3 from the public repository; a new session lists all eleven skills"
      - "2026-10-02, 18.4.8: the same update commands move all three plugins from 0.1.3 to 0.1.4 from the public repository; a new session lists all eleven skills"
      - "2026-10-02, 18.4.8: the same update commands move all three plugins from 0.1.4 to 0.2.0 from the public repository; a new session lists all eleven skills"
      - "2026-09-27, 18.3.1: `omp plugin marketplace add <local checkout>`, then `omp plugin install --scope user {plugin}@{catalog}` installs all three plugins to ~/.omp/plugins/cache/plugins/{catalog}___{plugin}___{version}/; adding the same marketplace again exits 1 (already exists), which the installer reports as a failed step to rerun with --update"
      - "2026-09-27, 18.3.1: the MCP tool slop_lint is available in a session"
      - "2026-09-27, 18.3.1: with the package's version field a marketplace install links @lapis-labs/lazuli-omp into ~/.omp/plugins/node_modules (a link to the plugin cache) and a new session gets the inventory summary; earlier the same day, without the version field, it got none"
      - "2026-09-27, 18.3.1: the plugin's agents/critic.md (Claude format, name and description only) is listed among the task agents as critic, and a spawned critic returns its report"
    sources:
      - https://github.com/can1357/oh-my-pi/blob/main/docs/marketplace.md
      - https://github.com/can1357/oh-my-pi/blob/main/docs/skills.md
      - https://github.com/can1357/oh-my-pi/blob/main/docs/extensions.md

  - id: pi
    name: pi
    status: experimental
    detect: { commands: [pi], dirs: ["~/.pi/agent"] }
    form: package
    consumes: [pi-package, flat-skills, session-extension, gate-extension]
    skill_paths: ["~/.pi/agent/skills", ".pi/skills", "~/.agents/skills", ".agents/skills"]
    invoke: "/skill:{skill}"
    install:
      - run: [pi, install, "git:github.com/{repo}@{ref}"]
    update:
      - run: [pi, install, "git:github.com/{repo}@{ref}"]
        note: pi keys git packages by repository without the ref, so installing again replaces the older install
    uninstall:
      - run: [pi, remove, "git:github.com/{repo}"]
        when: all-plugins
        note: one package carries every plugin's skills, so it goes only when every plugin is removed
    verify:
      - run: [pi, list]
        expect: "the {repo} package is listed"
      - manual: "In a session, run /skill:lps-ux"
    session_start: { via: extension, output: session-extension, event: session_start }
    critic: { via: instructions, note: "pi has no subagents; the skill asks for a fresh session as the critic" }
    exit_gate: { via: extension, output: gate-extension, event: agent_before_settle, note: "asks `lapis-design-hook --plugin-version <version> stop` and continues the agent with a custom message and `continue: true`, only when LAPIS_UNATTENDED=1; version skew skips the gate" }
    pre_write: { via: extension, output: gate-extension, event: tool_call, note: "the same `tool_call` handler as in Oh-My-Pi, answering `{ block: true, reason }` for page code only when LAPIS_UNATTENDED=1, and in every session for a write to .lapis/requirements/, .lapis/state/, .lapis/changes/, or .lapis/owner/" }
    mcp: { via: none, note: "pi 1.0.0 has a built-in MCP client (servers in ~/.pi/agent/mcp.json or .pi/settings.json; a Python stdio server connected in a container on 2026-10-03), but the installer does not register lapis-lazuli there yet" }
    trust:
      - "project packages load only after project trust"
    conflicts:
      - "a git source has no subdirectory selector, so the repository root package.json carries the pi key"
      - "pi also reads ~/.agents/skills; do not install flat skills there alongside the package"
    unverified:
      - "that pi's `tool_call` event carries `toolName` and `input` as Oh-My-Pi's does: pi's extension docs show `toolName` and `{ block: true, reason }` only. The 2026-10-04 check was not run, because the saved ChatGPT login for the lapis-pi container had expired and a run would have refreshed it"
    verified:
      - "2026-10-03, 1.0.0, in the lapis-pi:arms3 container with `--thinking high`: with LAPIS_UNATTENDED=1 the exit-gate extension (loaded with --extension, its session_stop registration ignored) continued the agent through agent_before_settle three times with the next step, then left `capped` in .lapis/gate/<task>.json"
    sources:
      - https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/packages.md
      - https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/extensions.md
      - https://pi.dev

  - id: hermes
    name: Hermes Agent
    status: experimental
    detect: { commands: [hermes], dirs: ["~/.hermes"] }
    form: flat-and-plugin
    consumes: [flat-skills, hermes-plugin]
    skill_paths: ["~/.hermes/skills", "skills.external_dirs in ~/.hermes/config.yaml"]
    invoke: "/{skill}"
    install:
      - run: [hermes, skills, install, "{repo}/dist/skills/{skill}", --yes]
      - run: [hermes, plugins, install, "{repo}/plugins/hermes/lapis-lazuli", --ref, "{sha}", --enable]
        confirm: true
        note: plugins are disabled by default; --enable turns this one on. --ref takes only a full commit
      - run: [hermes, mcp, add, lapis-lazuli, --command, lapis-design, --args, mcp]
    update:
      - run: [hermes, skills, update]
      - run: [hermes, plugins, install, "{repo}/plugins/hermes/lapis-lazuli", --ref, "{sha}", --enable, --force]
        confirm: true
        note: update refuses to move a pinned plugin; reinstall at the new commit
    uninstall:
      - run: [hermes, skills, uninstall, "{skill}"]
      - run: [hermes, plugins, remove, lapis-lazuli]
        when: all-plugins
        note: the one Hermes plugin serves every skill's session summary
      - run: [hermes, mcp, remove, lapis-lazuli]
        when: all-plugins
    verify:
      - run: [hermes, skills, list]
        expect: "every skill of the selected plugins is listed"
      - run: [hermes, plugins, list]
        expect: "lapis-lazuli enabled"
      - manual: "In a session, run /lps-ux"
    session_start: { via: hermes-plugin-hook, output: hermes-plugin, event: "pre_llm_call when is_first_turn", note: "on_session_start ignores return values, so it cannot add context" }
    critic: { via: instructions }
    exit_gate: { via: instructions, note: "no stop event is used; the skills say to run `lapis-design next --task <task>` until it says done" }
    pre_write: { via: instructions, note: "no pre-write event is used; the lapis skill's Done block states the order, and `lapis-design next` and `release check` find a page written before its brief by file times" }
    mcp: { via: cli-register, note: "hermes mcp add; tools appear as mcp_lapis-lazuli_<tool>" }
    trust:
      - "project skills load only after hermes skills trust"
    conflicts:
      - "Hermes does not read Claude or Codex plugin manifests"
      - "skills bundled in a Hermes plugin get a plugin: namespace and stay out of the skill index, so skills install flat"
    unverified:
      - "that hermes skills install accepts a path inside a monorepo without a tap"
      - "whether hermes skills install accepts a ref; its CLI reference and skills guide (read 2026-09-30) show a ref only for plugins (--ref takes a full commit), so skills come from the default branch"
    sources:
      - https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/skills.md
      - https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/plugins.md
      - https://github.com/NousResearch/hermes-agent/blob/main/website/docs/reference/cli-commands.md

  - id: antigravity
    name: Antigravity CLI
    status: experimental
    checked: "2026-10-06"
    detect: { commands: [agy], dirs: ["~/.gemini/antigravity-cli"] }
    form: plugin
    consumes: [antigravity-plugin-manifest, antigravity-skills, antigravity-hooks, antigravity-mcp, antigravity-agents]
    skill_paths: [".agents/skills", "~/.gemini/antigravity-cli/skills", "~/.gemini/config/skills", "plugin skills/"]
    invoke: "/{skill}"
    install:
      - run: [agy, plugin, install, "{checkout}/dist/antigravity/{plugin}"]
        note: "Antigravity installs only from a local folder, not from a repository"
    update:
      - run: [agy, plugin, install, "{checkout}/dist/antigravity/{plugin}"]
        note: "installing a plugin again replaces its whole folder (agy 1.2.17, 2026-10-06: files the new version no longer has are gone)"
    uninstall:
      - run: [agy, plugin, uninstall, "{plugin}"]
    verify:
      - run: [agy, plugin, list]
        expect: "{plugin} listed with its components"
      - manual: "In a new session, ask which skills are available, or run /lapis"
    session_start: { via: instructions, note: "Antigravity has no session-start event, and what a PreInvocation hook injects (`ephemeralMessage`) reaches the model for a few steps only (agy 1.2.17, 2026-10-06: still there after one tool call, gone after three), so a summary injected at the first model call would be forgotten; the lazuli skill says to run `lazuli local fonts --summary` by hand" }
    critic: { via: plugin-agent, output: antigravity-agents, note: "the main agent starts it with `invoke_subagent` (type name critic), or it is picked as the session's agent (`agy --agent critic`); its `tools` list gives it file reading and writing and no shell, web, or browser" }
    exit_gate: { via: plugin-hook, output: antigravity-hooks, event: Stop, note: "`lapis-design-hook --plugin-version <version> --host antigravity stop` answers `{\"decision\": \"continue\", \"reason\": ...}` only when LAPIS_UNATTENDED=1 and the agent chose to stop (terminationReason NO_TOOL_CALL) with no background task running, in the person's own conversation (Antigravity runs Stop when a subagent ends too; its transcript opens with a message from its parent, and the gate leaves it alone); at most 3 continues in a row for one step and 15 in a session; otherwise it prints nothing, and its one-line notice for a person goes to stderr (the CLI log); version skew skips the gate" }
    pre_write: { via: plugin-hook, output: antigravity-hooks, event: "PreToolUse write_to_file|replace_file_content|multi_replace_file_content|notebook_edit", note: "the same guard as in Claude Code, answering `{\"decision\": \"deny\", \"reason\": ...}`; the file is `toolCall.args.TargetFile` (`NotebookPath` for notebook_edit). Antigravity stops a tool call for a hook that exits non-zero or prints JSON it does not know (even `{}`), so the command ends in `|| exit 0`, and the hook prints nothing for every other outcome; it never prints `allow`, which would also skip the permission prompt; a shell write is found afterwards, not prevented; version skew skips the guard" }
    mcp: { via: plugin-mcp, output: antigravity-mcp, note: "Antigravity names the server `lazuli_lapis-lazuli` (plugin, then server) and lists its tool `slop_lint`; the command is the CLI on PATH" }
    trust:
      - "a headless `agy -p` run soft-denies a tool that needs a permission it cannot ask for (agy 1.2.17, 2026-10-06: a file write in a temporary workspace was denied without `--dangerously-skip-permissions`, though the documentation says workspace writes are allowed); an unattended design run needs that flag or an allow rule in ~/.gemini/antigravity-cli/settings.json, and the write guard still refuses under the flag"
    conflicts:
      - "the hooks run with the plugin's folder as their working directory, so they find the project from `workspacePaths` in the event, never from the current directory"
      - "~/.gemini is also Gemini CLI's folder, so the row for other harnesses detects Gemini CLI wherever Antigravity is installed"
      - "this repository's .agents/plugins/ holds the Codex catalog, not a plugin folder; Antigravity reads that folder in a workspace"
    unverified:
      - "the `sed_file` tool, which is in agy's tool list but fails with `not found in registry` when a custom agent names it, so its arguments are unknown and the write guard does not cover it; and `multi_replace_file_content`, which the documentation lists with `TargetFile` but which a custom agent could not call either (the guard's handling of it rests on the documentation; `write_to_file`, `replace_file_content`, and `notebook_edit` were seen with `TargetFile`, `TargetFile`, and `NotebookPath`)"
      - "a global install into the real ~/.gemini (the owner's installation was not changed; `agy plugin install` and `agy plugin list` ran under an isolated HOME, and the model runs used workspace-level plugins in a temporary project)"
      - "that an installed plugin's hooks and MCP server load the same way as a workspace-level plugin's (documented, not run); the hooks' working directory was observed only for the workspace-level plugin"
      - "the interactive TUI (`/plugin`, `/hooks`, skills as slash commands, how a Stop continuation or a skipped-hook line is shown); every run was headless"
      - "Antigravity 2.0 and the IDE, which read the same plugin folder by their documentation"
      - "`|| exit 0` under cmd.exe on Windows (the documentation says hook commands run with `cmd /c` there)"
      - "install.ps1 and `agy plugin install` on Windows: the script joins the clone's path with `/`, which Windows paths usually accept"
    verified:
      - "2026-10-06, 1.2.17: `agy plugin validate` accepts the three built folders (5, 3, and 4 skills, 2 hooks, 1 agent, 1 MCP server); under an isolated HOME, `agy plugin install <folder>` copies each to ~/.gemini/config/plugins/<name>/ (the documentation says ~/.gemini/antigravity-cli/plugins/), `agy plugin list` prints the imports with their components, installing again replaces the folder (a file the new version lacks is gone) and exits 0, and `agy plugin uninstall` exits 0, also for a name that is not installed"
      - "2026-10-06, 1.2.17: with the three plugins as workspace-level plugins (.agents/plugins/) in a temporary project, `agy -p --model gemini-3.8-flash-medium` lists all twelve skills beside agy's two built-in ones, and `/lps-ux` makes the model read the plugin's skill file"
      - "2026-10-06, 1.2.17: the `PreToolUse` hook refuses a `write_to_file` to .lapis/requirements/demo.json under `--dangerously-skip-permissions` (the model is told `tool call denied by pre-tool hook: LapisLazuli refuses this write: ...` and the file is not created), and lets a write of notes.md in the same project through"
      - "2026-10-06, 1.2.17: with LAPIS_UNATTENDED=1, the same hook refuses a `write_to_file` of index.html while the brief record is owed and names the step, and .lapis/order/<task>.json records `denied: {step: brief, count: 1}`, so the environment reaches the hook"
      - "2026-10-06, 1.2.17: with `--plugin-version 9.9.9` in hooks.json against CLI 0.2.0, the write to .lapis/requirements/demo.json goes through, the hook prints nothing to stdout, and the line `LapisLazuli hooks skipped: plugin 9.9.9, CLI 0.2.0; ...` is in ~/.gemini/antigravity-cli/log/cli-<time>.log as `JSON hook command stderr`; with no `lapis-design-hook` on PATH the write goes through too (`|| exit 0`)"
      - "2026-10-06, 1.2.17: with a CLI older than the plugin (0.2.0 on PATH, which has no `--host`), the first `PreToolUse` call failed with `failed to unmarshal result from hook ...: unknown field \"systemMessage\"` and the notice in the error; run by hand, a second call printed nothing, and each hook name claims its own notice, in the plugin's folder"
      - "2026-10-06, 1.2.17: a `PreToolUse` hook that prints `{}`, `{\"systemMessage\": ...}`, text that is not JSON, or exits 1 or 2 makes the tool call fail; one that prints nothing, or only to stderr, lets it run; `Stop` and `PreInvocation` hooks that print `{}` or an unknown field, or exit 1, are ignored; the hook's working directory is the plugin's folder, and its event has `conversationId` and `workspacePaths`"
      - "2026-10-06, 1.2.17: with LAPIS_UNATTENDED=1 the `Stop` hook's `{\"decision\": \"continue\", \"reason\": ...}` re-entered the loop (a `system_message` step, and the model went on with the brief step), and .lapis/gate/<task>.json recorded the conversation id as the session, step brief, 1 continue; the event's `terminationReason` was `NO_TOOL_CALL`, not the documented `model_stop`"
      - "2026-10-06, 1.2.17: `Stop` also fires when a subagent ends, with the same fields as the person's conversation; the critic subagent's transcript opens with a system message from its parent and the person's with their own message, and with LAPIS_UNATTENDED=1 the gate continued the person's conversation once (.lapis/gate/<task>.json: session is the person's conversation id, total 1) and left the critic's transcript with no continuation"
      - "2026-10-06, 1.2.17: the lazuli plugin's mcp_config.json starts `lapis-design mcp`; Antigravity lists the server as `lazuli_lapis-lazuli`, and `slop_lint` with no arguments answers `nothing to lint`"
      - "2026-10-06, 1.2.17: `invoke_subagent` with type name critic starts the plugin's agent, which names view_file, list_dir, grep_search, find_by_name, and write_to_file as its tools (beside agy's own send_message, manage_task, and MCP access) and none for the shell"
    sources:
      - https://antigravity.google/docs/plugins
      - https://antigravity.google/docs/hooks
      - https://antigravity.google/docs/skills
      - https://antigravity.google/docs/subagents
      - https://antigravity.google/docs/mcp
      - https://antigravity.google/docs/cli/headless

  - id: other
    name: Other Agent Skills harnesses
    detect: {}
    form: flat
    consumes: [flat-skills, agents-md-snippet]
    invoke: "per harness; usually /{skill} or automatic"
    agents:
      - { id: cursor, dirs: ["~/.cursor"] }
      - { id: gemini-cli, dirs: ["~/.gemini"] }
      - { id: github-copilot, dirs: ["~/.copilot"] }
      - { id: opencode, dirs: ["~/.config/opencode"] }
      - { id: windsurf, dirs: ["~/.codeium/windsurf"] }
      - { id: kiro-cli, dirs: ["~/.kiro"] }
    install:
      - run: [npx, -y, skills, add, "https://github.com/{repo}/tree/{ref}/dist/skills", -g, -y, -a, "{agent}"]
        note: the subpath keeps the search inside dist/skills, so plugin copies are never picked up
      - manual: "Add dist/AGENTS.snippet.md to the agent's instructions file for the session summary and MCP setup"
    update:
      - run: [npx, -y, skills, update, -g, -y]
    uninstall:
      - run: [npx, -y, skills, remove, "{skill}", -g, -a, "{agent}", -y]
    verify:
      - run: [npx, -y, skills, list, -g, -a, "{agent}"]
        expect: "every skill of the selected plugins is listed"
    session_start: { via: instructions, output: agents-md-snippet }
    critic: { via: instructions }
    exit_gate: { via: instructions, note: "no stop event is used; the skills say to run `lapis-design next --task <task>` until it says done" }
    pre_write: { via: instructions, note: "no pre-write event is used; the lapis skill's Done block states the order, and `lapis-design next` and `release check` find a page written before its brief by file times" }
    mcp: { via: instructions, output: agents-md-snippet, note: "the snippet shows the harness's own MCP registration for lapis-design mcp" }
    conflicts:
      - "Codex, pi, and Hermes have their own rows; the skills CLI's Codex target ~/.codex/skills is deprecated"
    verified:
      - "2026-09-30, skills 1.7.0: `npx skills add lapis-labs/lapis-lazuli --list` on the public repository (default branch release) lists exactly the eleven skills and nothing else"
      - "2026-09-27, skills 1.7.0: `npx skills add <local checkout>/dist/skills --list` lists exactly the skills in dist/skills (six on that date) and nothing else"
      - "2026-09-27, skills 1.7.0: given the checkout root instead, it reads .claude-plugin/marketplace.json and lists the same skills from plugins/*/skills (byte-identical copies today), so the install row keeps the dist/skills subpath"
    sources:
      - https://github.com/vercel-labs/skills
      - https://agentskills.io/specification
