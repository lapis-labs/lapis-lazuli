# LapisLazuli plan file schema — v0 draft (fields-for-lookup view)
# Generated by tools/build/build.py from src/shared/plan/schema.yaml; edit the source, not this file.
# Only the fields lookups read; validate plans against the full schema (lapis-design plan check).
$schema: https://json-schema.org/draft/2020-12/schema
title: LapisLazuli plan
type: object
properties:
  version:
    const: 0
  task:
    type: object
    additionalProperties: false
    required:
    - id
    - title
    properties:
      id:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]{1,63}$
      title:
        type: string
        minLength: 1
  brief:
    type: object
    additionalProperties: false
    required:
    - subject
    - one_job
    - platform
    - locales
    - product_frame
    properties:
      subject:
        type: string
        minLength: 3
      one_job:
        type: string
        minLength: 3
      audience:
        type: string
      platform:
        type: array
        minItems: 1
        items:
          enum:
          - web
          - ios
          - android
          - desktop
          - email
          - embedded
      locales:
        type: array
        minItems: 1
        items:
          type: string
          pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
      product_frame:
        enum:
        - marketing-landing
        - saas-dashboard-admin
        - consumer-mobile-app
        - e-commerce
        - content-editorial-docs
        - forms-onboarding-checkout
        - developer-tools
        - data-visualization
        - fintech-regulated
        - internal-tools
        - portfolio-personal
        - games-entertainment
        - other
      constraints:
        type: array
        items:
          type: string
  references:
    type: array
    items:
      $ref: '#/$defs/reference'
  tokens:
    type: object
    additionalProperties: false
    properties:
      color:
        $ref: '#/$defs/color_tokens'
      type:
        $ref: '#/$defs/type_tokens'
      space:
        type: object
        properties:
          base_px:
            type: number
            exclusiveMinimum: 0
          scale:
            type: array
            items:
              type: number
      motion:
        type: object
        properties:
          reduced_motion:
            const: respect
          principles:
            $ref: '#/$defs/strings'
      shape:
        $ref: '#/$defs/shape_tokens'
      surface:
        $ref: '#/$defs/surface_tokens'
      icons:
        $ref: '#/$defs/icon_tokens'
  sources:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - ref
      properties:
        ref:
          type: string
        note:
          type: string
required:
- version
- task
- brief
$defs:
  strings:
    type: array
    items:
      type: string
  oklch:
    type: array
    minItems: 3
    maxItems: 3
    prefixItems:
    - type: number
      minimum: 0
      maximum: 1
    - type: number
      minimum: 0
      maximum: 0.5
    - type: number
      minimum: 0
      maximum: 360
  decision_answer:
    type: object
    additionalProperties: false
    required:
    - answer
    - status
    properties:
      answer:
        type: string
      status:
        enum:
        - known
        - declared
        - proposed
        - unresolved
  reference:
    type: object
    additionalProperties: false
    required:
    - source
    - kind
    - rights
    - mode
    - take
    - leave
    properties:
      source:
        type: string
      kind:
        enum:
        - site
        - image
        - system
      rights:
        enum:
        - own
        - licensed
        - reference-only
      mode:
        enum:
        - analyze
        - borrow
        - study
        - reuse
      take:
        type: array
        minItems: 1
        items:
          type: string
      leave:
        type: array
        items:
          type: string
      profile:
        type: string
    if:
      properties:
        rights:
          const: reference-only
    then:
      properties:
        mode:
          enum:
          - analyze
          - borrow
          - study
  color_tokens:
    type: object
    additionalProperties: false
    properties:
      decision:
        type: object
        additionalProperties: false
        properties:
          medium:
            $ref: '#/$defs/decision_answer'
          task_structure:
            $ref: '#/$defs/decision_answer'
          content_colors:
            $ref: '#/$defs/decision_answer'
          identity:
            $ref: '#/$defs/decision_answer'
          environment:
            $ref: '#/$defs/decision_answer'
          tone:
            $ref: '#/$defs/decision_answer'
      roles:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - role
          properties:
            name:
              type: string
            role:
              enum:
              - field
              - foreground
              - identity
              - interaction
              - status
              - data
              - content
            oklch:
              $ref: '#/$defs/oklch'
            ref:
              type: string
            theme:
              enum:
              - light
              - dark
              - high-contrast
            source_class:
              enum:
              - authored
              - provider
              - brand-approved
              - measured
              - published
              - computed
              - converted
              - nearest-match
              - screen-sample
              - unofficial
            system_code:
              type: object
              properties:
                system:
                  enum:
                  - pantone
                  - ral
                  - ral-classic
                  - ral-design-plus
                  - ncs
                  - munsell
                  - hlc
                  - freetone
                  - other
                code:
                  type: string
          oneOf:
          - required:
            - oklch
          - required:
            - ref
      relations:
        type: array
        items:
          enum:
          - tonal
          - neighboring
          - opposing
          - temperature-contrast
          - near-monochrome
          - multi-hue
      themes:
        type: array
        items:
          enum:
          - light
          - dark
          - high-contrast
      data_scales:
        type: array
        items:
          enum:
          - categorical
          - sequential
          - diverging
          - cyclic
  shape_tokens:
    type: object
    additionalProperties: false
    properties:
      radius:
        type: object
        additionalProperties: false
        properties:
          scale:
            type: array
            items:
              type: number
              minimum: 0
          by_role:
            type: object
            additionalProperties:
              type: number
              minimum: 0
      rule:
        type: string
  surface_tokens:
    type: object
    additionalProperties: false
    properties:
      elevation:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - level
          - means
          properties:
            level:
              type: integer
              minimum: 0
            means:
              type: string
      borders:
        type: string
      treatments:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - job
          properties:
            name:
              type: string
            job:
              type: string
            where:
              $ref: '#/$defs/strings'
  icon_tokens:
    type: object
    additionalProperties: false
    properties:
      family:
        type: string
      source:
        enum:
        - contract
        - library
        - drawn
        - none
      style:
        enum:
        - outline
        - filled
        - duotone
        - mixed
      stroke_px:
        type: number
        exclusiveMinimum: 0
      sizes_px:
        type: array
        items:
          type: number
          exclusiveMinimum: 0
  type_tokens:
    type: object
    additionalProperties: false
    properties:
      roles:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - role
          - family
          properties:
            role:
              enum:
              - display
              - heading
              - body
              - ui
              - data
              - code
              - caption
            family:
              type: string
            weights:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 1000
            scripts:
              type: array
              items:
                enum:
                - latn
                - cyrl
                - grek
                - hang
                - kana
                - hani
                - arab
                - hebr
                - thai
            source:
              enum:
              - inventory
              - catalog
              - contract
      scale:
        type: object
        properties:
          base_px:
            type: number
            exclusiveMinimum: 0
          ratio:
            type: number
            minimum: 1
      lock:
        type: string
        default: .lapis/fonts.lock.json
