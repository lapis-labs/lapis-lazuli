# LapisLazuli source registry — v0 draft (schema: sources/registry.schema.yaml)
# Where to look for fonts, colors, assets, and design references, and how lazuli may reach each one.
# A listing is a lead, not a license: the item's own terms still decide reuse. Access policies were
# checked against each source's terms and robots.txt on checked_at; recheck before relying on one.
# `lazuli sources` lists this file; `lazuli read` looks a URL up here before fetching it.

version: 0

sources:
  # ---------------------------------------------------------------- fonts
  - id: google-fonts
    name: Google Fonts
    url: https://fonts.google.com/
    type: [font]
    good_for: open-license families with categories, tags, scripts, and variable axes
    access: adapter
    adapter: google-fonts
    terms_url: https://policies.google.com/terms
    checked_at: "2026-09-26"
    note: robots.txt disallows only /license/; the terms forbid automated access only against robots.txt

  - id: google-fonts-repository
    name: Google Fonts repository
    url: https://github.com/google/fonts
    type: [font]
    good_for: the separately distributed open packages, their license directories, and tag data
    access: adapter
    adapter: google-fonts
    terms_url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
    license: mostly OFL-1.1; some Apache-2.0 or Ubuntu Font License
    checked_at: "2026-09-26"
    note: the adapter reads tag and tree data through the GitHub API within its unauthenticated rate limit

  - id: fontsource
    name: Fontsource
    url: https://fontsource.org/
    hosts: [api.fontsource.org]
    type: [font]
    good_for: self-hostable packages of open fonts with SPDX license ids
    access: adapter
    adapter: fontsource
    terms_url: https://fontsource.org/docs/api/introduction
    checked_at: "2026-09-26"

  - id: fontshare
    name: Fontshare
    url: https://www.fontshare.com/
    hosts: [api.fontshare.com]
    type: [font]
    good_for: free Latin families from one foundry; a visual lead until each family's license is kept
    access: adapter
    adapter: fontshare
    terms_url: https://www.fontshare.com/licenses/itf-ffl
    license: ITF Free Font License or OFL-1.1, per family
    checked_at: "2026-09-26"

  - id: anshim
    name: 안심글꼴 (Gongu, Korea Copyright Commission)
    url: https://gongu.copyright.or.kr/
    type: [font]
    good_for: Korean fonts cleared for use, with the license per font (KOGL type 1 or OFL)
    access: adapter
    adapter: anshim
    terms_url: https://gongu.copyright.or.kr/gongu/main/contents.do?menuNo=200174
    checked_at: "2026-09-26"

  - id: sandoll-cloud
    name: Sandoll Cloud (산돌구름)
    url: https://www.sandollcloud.com/
    type: [font]
    good_for: the subscription and commercial Korean catalog, its classification, and per-channel license terms
    access: adapter
    adapter: sandoll
    terms_url: https://www.sandollcloud.com/policyTermsUser
    checked_at: "2026-09-26"
    note: robots.txt asks for 10 seconds between requests; a subscription's base scope differs from web, app, and server terms

  - id: noonnu
    name: noonnu (눈누)
    url: https://noonnu.cc/
    type: [font]
    good_for: discovering Korean candidates and the maker's license link; its license summary is only a hint
    access: refused
    adapter: noonnu
    reason: noonnu's terms forbid scraping and every robot other than search engines, so lazuli sends it nothing; look fonts up on noonnu.cc in your browser.
    clause: 이용약관 제7조 (이용자의 의무)
    terms_url: https://noonnu.cc/user_agreement
    checked_at: "2026-09-26"

  - id: adobe-fonts
    name: Adobe Fonts
    url: https://fonts.adobe.com/
    type: [font]
    good_for: desktop activation and Adobe-hosted web projects; CJK classification facets
    access: refused
    adapter: adobe-cjk
    reason: Adobe's General Terms of Use forbid data gathering and extraction on Adobe websites; check a font's classification at https://fonts.adobe.com/fonts in your browser.
    clause: Adobe General Terms of Use, section 6.18 (effective 2025-10-03)
    terms_url: https://www.adobe.com/legal/terms.html
    checked_at: "2026-09-26"

  - id: yoon-design
    name: FONCO / Yoon Design
    url: https://font.co.kr/
    type: [font]
    good_for: Yoon and partner Korean families; embedding and webfont rights are separate contracts
    access: browser-link
    reason: Yoon Design blocks tools, so lazuli has no adapter for it; open the family page in your browser.
    terms_url: https://font.co.kr/policy/service
    checked_at: "2026-09-26"

  - id: morisawa
