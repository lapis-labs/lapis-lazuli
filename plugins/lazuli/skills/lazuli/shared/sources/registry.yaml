  - id: coolors
    name: Coolors
    url: https://coolors.co/
    type: [color]
    good_for: a palette generator, community gallery, image picker, and palette visualizer
    access: refused
    reason: Coolors' license forbids parsing or stockpiling its palettes and using them to train machine learning or AI systems; open it in your browser.
    clause: License, prohibited uses ("reverse engineer, parse, stockpile, download beyond reasonable implication"; "training machine learning nor artificial intelligence systems"), updated 2023-08-16
    terms_url: https://coolors.co/license
    checked_at: "2026-09-26"

