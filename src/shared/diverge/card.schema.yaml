# LapisLazuli diverge card schema — v0
# Location: .lapis/diverge/<task>/C<n>/card.yaml, next to the rough's index.html
# What one rough first view is (the opening of a page that unfolds in scenes; it is not asked to carry every object). A rough
# is bounded: the core composition at 390 and 1440, one representative motion state, and one phone state, as the one page
# `index.html`; every other device width and each further state wait for the owner's pick (`rough_bound` in `diverge/pools.yaml`). The card names the reference direction it draws on, the draws it spends (the CLI made them,
# `.lapis/state/diverge/<task>/draws.jsonl`), how each open core object is represented, the color roles with the area
# each owns, and the signature elements it adds. `lapis-design diverge check` reads the card against the draws and the
# renders; the picked card's `color` becomes the plan's `tokens.color.roles` unchanged. A card holds no reason for
# choosing itself: the owner sees the contact sheet, not a defence. It does record what the owner's declared words were
# answered with, in two places: `type` (the family of the headline and of the body, and how they answer the owner's named
# families or type classes) and `style` (for each style item the owner answered, `S<n>`, and each kit item they kept, `K<n>`,
# the element that carries it). `diverge check` reads `type` against the render's rendered fonts and `style` against the
# rough's markup; see `diverge/pools.yaml` `rough_carry` for the system-face list and the term lists.
# Breaking: `type` and `style` are required; a card made before them needs both and a new `diverge check`.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/lapis-labs/lapis-lazuli/schemas/diverge-card.v0.json
title: LapisLazuli diverge card
type: object
additionalProperties: false
required: [version, id, brief_sha256, direction, draws, hierarchy, objects, color, type, style, signature, made_in]
properties:
  version: {const: 0}
  id: {type: string, pattern: "^C[1-9][0-9]?$"}
  brief_sha256: {type: string, pattern: "^[0-9a-f]{12}$"}   # the shared brief this rough was made from: the one `lapis-design diverge contract` printed after it passed
  direction: {type: string, pattern: "^([A-E]|none)$"}   # the references record's direction (`none` when it has none)
  draws: {type: array, minItems: 1, items: {type: string, pattern: "^d[1-9][0-9]*$"}}
  hierarchy: {type: string, pattern: "^[a-z][a-z0-9-]*$"}   # the stance drawn for what the first view carries (`diverge/pools.yaml` hierarchy)
  objects:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, family, medium, first_view_share, representation, later]
      properties:
        id: {type: string, pattern: "^O[1-4]$"}
        option: {type: string, pattern: "^[a-e]$"}      # the D1 option this draws on, when it does
        family: {type: string, pattern: "^[a-z][a-z0-9-]*$"}
        medium: {enum: [drawn-svg, css-drawing, image, control, diagram, motion, text, other]}
        first_view_share: {type: number, minimum: 0, maximum: 1}   # the share of the 1440 first view the object owns; 0 when it plays its part in a later scene
        representation: {type: string, minLength: 12}   # what the visitor sees and can do with it, on this subject
        later: {type: string, minLength: 12}            # the role and scene the object has after the first view, kept apart from its share of it
  color:
    type: array
    minItems: 2
    items:
      type: object
      additionalProperties: false
      required: [name, role, oklch]
      properties:
        name: {type: string, minLength: 1}
        role: {enum: [field, foreground, identity, interaction, status, data, content]}
        oklch:
          type: array
          minItems: 3
          maxItems: 3
          prefixItems:
            - {type: number, minimum: 0, maximum: 1}
            - {type: number, minimum: 0, maximum: 0.5}
            - {type: number, minimum: 0, maximum: 360}
        area: {type: string, minLength: 8}              # where the color sits and about how much of the screen it owns
      if: {properties: {role: {enum: [field, identity]}}, required: [role]}
      then: {required: [area]}
  type:                                                 # the faces the headline and the body render in, as the render must show them
    type: object
    additionalProperties: false
    required: [headline, body]
    properties:
      headline: {$ref: "#/$defs/type_role"}             # the heading and display runs (`type_role` of the render extract)
      body: {$ref: "#/$defs/type_role"}                 # the body runs
      answers: {type: string, minLength: 20}            # how this choice answers the families or type classes the owner named; required when they named any (the taste file, a `[declared]` row, a direction answer)
  style:                                                # one row per style item the owner answered at the first direction turn (`S<n>`) and kit item they kept (`K<n>`); [] when there is none
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, selector, does, shown]
      properties:
        id: {type: string, pattern: "^[SK][1-9][0-9]?$"}
        selector: {type: string, minLength: 1}          # a CSS selector that matches an element of this rough's index.html (tag, #id, .class, [attr], :first-child, :nth-child(n), :not(), > + ~ and space)
        does: {type: string, minLength: 12}             # what that element does to carry the item, in a line
        shown:                                          # the captures that show it: [1440, 390], [1440], [390], or [] when the card claims it and neither capture shows it
          type: array
          uniqueItems: true
          items: {enum: [1440, 390]}
  signature:                                            # elements this rough adds; the owner decides each at D2
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, element, carries]
      properties:
        id: {type: string, pattern: "^G[1-9][0-9]?$"}
        element: {type: string, minLength: 2}
        carries: {type: string, minLength: 8}           # the information or job the element carries, not its look
  made_in: {enum: [subagent, main]}
$defs:
  type_role:
    type: object
    additionalProperties: false
    required: [family]
    properties:
      family: {type: string, minLength: 2, pattern: "^[^,]+$"}   # one family name as the render reports it; never a stack
      system_asked_by: {type: string, minLength: 4}     # only to choose a system face: the owner's `[declared]` line that asks for it, quoted
