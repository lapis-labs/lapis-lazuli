# Schema of diverge/pools.yaml — v0
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/lapis-labs/lapis-lazuli/schemas/diverge-pools.v0.json
title: LapisLazuli diverge pools
type: object
additionalProperties: false
required: [version, observed_on, representation, color_allocation, hierarchy, rough_bound, rough_carry, rough_opening, distance]
properties:
  version: {const: 0}
  observed_on: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
  representation:
    type: object
    minProperties: 9
    propertyNames: {pattern: "^[a-z][a-z-]*$"}
    required: [time, place-route, choice-booking, record-document, process-sequence, quantity-data, person-agent,
               product-thing, other]
    additionalProperties:
      type: object
      additionalProperties: false
      required: [means, families]
      properties:
        means: {type: string, minLength: 8}
        families:
          type: array
          minItems: 3
          items: {$ref: "#/$defs/entry"}
  color_allocation:
    type: array
    minItems: 5
    items: {$ref: "#/$defs/entry"}
  hierarchy:
    type: array
    minItems: 4
    items:
      allOf:
        - {$ref: "#/$defs/entry"}
        - {type: object, required: [opening_objects]}
  rough_bound:
    type: object
    additionalProperties: false
    required: [widths]
    properties:
      widths:
        type: array
        minItems: 2
        uniqueItems: true
        items: {enum: [320, 390, 768, 1440]}
  rough_carry:
    type: object
    additionalProperties: false
    required: [type, motion]
    properties:
      type:
        type: object
        additionalProperties: false
        required: [system_defaults, system_share, system_asks, words]
        properties:
          system_defaults: {$ref: "#/$defs/terms"}
          system_share: {type: number, exclusiveMinimum: 0, maximum: 1}
          system_asks: {$ref: "#/$defs/terms"}
          words: {$ref: "#/$defs/terms"}
      motion:
        type: object
        additionalProperties: false
        required: [words, still_words, changed_share, pixel_delta]
        properties:
          words: {$ref: "#/$defs/terms"}
          still_words: {$ref: "#/$defs/terms"}
          changed_share: {type: number, exclusiveMinimum: 0, maximum: 1}
          pixel_delta: {type: integer, minimum: 1, maximum: 255}
  rough_opening:
    type: object
    additionalProperties: false
    required: [rules, opening_words, asks]
    properties:
      rules:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: "^[a-z]+\\.[a-z0-9.-]+$"}
      opening_words: {$ref: "#/$defs/terms"}
      asks:
        type: object
        additionalProperties: {$ref: "#/$defs/terms"}
  distance:
    type: object
    additionalProperties: false
    required: [calibrated, weights, struct, reject_mass_below, minimum_pair]
    properties:
      calibrated: {type: boolean}
      weights:
        type: object
        additionalProperties: false
        required: [struct, mass, repr]
        properties:
          struct: {type: number, minimum: 0, maximum: 1}
          mass: {type: number, minimum: 0, maximum: 1}
          repr: {type: number, minimum: 0, maximum: 1}
      struct:
        type: object
        additionalProperties: false
        required: [grid_1440, grid_390, signature]
        properties:
          grid_1440: {type: number, minimum: 0, maximum: 1}
          grid_390: {type: number, minimum: 0, maximum: 1}
          signature: {type: number, minimum: 0, maximum: 1}
      reject_mass_below: {type: number, minimum: 0, maximum: 1}
      minimum_pair: {type: [number, "null"], minimum: 0, maximum: 1}
$defs:
  terms:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  entry:
    type: object
    additionalProperties: false
    required: [id, text]
    properties:
      id: {type: string, pattern: "^[a-z][a-z0-9-]*$"}
      text: {type: string, minLength: 8}
      opening_objects: {type: integer, minimum: 1, maximum: 4}
