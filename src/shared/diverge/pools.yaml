# Pools `lapis-design diverge` draws from — v0
# `representation.<kind>`: ways a core object can be represented so that the visitor can DO something with it.
# A kind is what the object is for (a time to choose, a route, a record). The first twelve families are what the E1b
# roughs actually showed (_internal/divergence/e1b/REPORT.md, "콘택트 시트에서 관찰한 구체적 차이"); the rest are
# starting points of the same sort. Each `text` says what the family lets a visitor do, never how it looks.
# `color_allocation`: where the color mass sits in the first view. `high-key-one-signal` is today's default (a pale
# field and one small vivid signal, _internal/divergence/sameness/REPORT.md): a draw gives it to at most one candidate.
# `distance`: the weights of `diverge check`, reported and never gated (only a pair with the same markup structure and a mass
# distance under `reject_mass_below` is refused). Calibrated on 2026-10-10 over the 54 E1b roughs (9 sets of 6, one run of
# `_internal/divergence/e1b`) against the owner's 9 blind set comparisons (8 decisive): the mean pair distance of a set
# picks the owner's set in 8 of 8 with structure alone, 7 of 8 at struct 0.55 / mass 0.20, 3 of 8 with mass alone (the
# owner said color did not separate the E1b sets, and their field mass barely varies: median 0.06). So structure leads, mass
# keeps a small weight, and the representation term (no E1b card names its families) takes the rest. `minimum_pair` is the
# 10th percentile of the structure-and-mass part over the 135 E1b pairs (0.39): a pair below it is listed as close on the
# contact sheet. Nine comparisons from nine sets are not independent samples; recalibrate when owner verdicts on diverge
# roughs exist. Round 3's 60 pages were not used: they carry no owner verdicts on pairs.
version: 0
observed_on: '2026-10-09'

representation:
  time:
    means: a time, a duration, a schedule, or a deadline the visitor sets or reads
    families:
      - { id: time-dial, text: "a clock face the visitor turns or taps to pick the time" }
      - { id: time-ribbon, text: "a day drawn as a strip the visitor drags a block along to choose a slot" }
      - { id: recovery-timeline, text: "a past-to-now line with marked points the visitor steps back through" }
      - { id: agenda-sentence, text: "the schedule written as one sentence whose time words are the controls" }
  place-route:
    means: a place, a route, a delay, or a distance the visitor moves along or compares
    families:
      - { id: route-line, text: "the route drawn as a line with stops, where a delay shows as a stretched segment" }
      - { id: radial-hub, text: "one place at the center and every connection as a spoke the visitor can follow" }
      - { id: two-stop-trip, text: "only the visitor's two stops and what lies between them, with the rest left out" }
      - { id: posting-wall, text: "departures and arrivals posted as a wall of rows the visitor scans and filters" }
  choice-booking:
    means: a choice between options, ending in a booking, an order, or a reservation
    families:
      - { id: fork, text: "one question at a time as a fork whose branch the visitor takes" }
      - { id: inline-control-sentence, text: "the booking written as a sentence whose blanks are the controls" }
      - { id: top-console, text: "all options as one console at the top, with the result updating below it" }
      - { id: choice-matrix, text: "options against criteria as a grid the visitor reads across before choosing" }
  record-document:
    means: a record, a file, a plan, or a document the visitor reads, compares, or annotates
    families:
      - { id: ledger, text: "records as ruled rows that show where one ends and the next begins" }
      - { id: annotated-diff, text: "two versions of one document with the changes marked where the visitor can accept them" }
      - { id: fader-overlay, text: "one document laid over its other version, with a fader the visitor moves between them" }
      - { id: doctor-spread, text: "the record opened flat as a two-page spread the visitor pages through" }
  process-sequence:
    means: a procedure with ordered steps, a current step, and what each step produced
    families:
      - { id: procedure-map, text: "the steps as stations on a map, the current one marked and its output beside it" }
      - { id: terminal-replay, text: "the run as a replayable log the visitor scrubs" }
      - { id: filling-checklist, text: "the steps as a list that fills as each one is done" }
      - { id: stepping-component, text: "one component shown stepping through each stage in place" }
  quantity-data:
    means: a number, a range, a comparison, or a distribution the visitor reads or adjusts
    families:
      - { id: bill-calculator, text: "a calculation the visitor edits, with the total recomputed where it is read" }
      - { id: distribution-strip, text: "the spread of values as one strip the visitor can probe at any point" }
      - { id: small-multiples, text: "the same measure repeated per case so the visitor compares by position" }
      - { id: storage-map, text: "a quantity drawn as areas of a whole the visitor opens one by one" }
  person-agent:
    means: a person, a team, or an agent the visitor needs to recognize and contact
    families:
      - { id: roster-wall, text: "everyone shown at once as a wall the visitor scans to find one" }
      - { id: role-spread, text: "people grouped by what they do, with the question each one answers" }
      - { id: conversation-thread, text: "the person shown through an exchange the visitor can continue" }
  product-thing:
    means: a product, an object, or a material the visitor inspects before deciding
    families:
      - { id: specimen-sheet, text: "the thing shown as a labelled specimen whose parts the visitor can open" }
      - { id: in-use-scene, text: "the thing shown in the situation it is used in, with its parts named there" }
      - { id: exploded-parts, text: "the thing taken apart so the visitor can see and pick each part" }
  other:
    means: an object that fits none of the kinds above; the proposal says what the visitor does with it
    families:
      - { id: ledger, text: "records as ruled rows that show where one ends and the next begins" }
      - { id: procedure-map, text: "the steps as stations on a map, the current one marked and its output beside it" }
      - { id: specimen-sheet, text: "the thing shown as a labelled specimen whose parts the visitor can open" }
      - { id: radial-hub, text: "one center and every connection as a spoke the visitor can follow" }

color_allocation:
  - { id: identity-as-field, text: "the identity color is the canvas of the first view; neutrals carry only text and rules" }
  - { id: content-carries-color, text: "the page is neutral and the content's own colors (images, data, drawings) carry the chroma" }
  - { id: dark-field, text: "a dark field takes most of the first view; light is the signal and the text" }
  - { id: two-zone-temperature, text: "two fields of different temperature split the first view; the seam is where the action is" }
  - { id: material-field, text: "the field is the subject's material (paper, glass, clay, metal) with its own texture of tone" }
  - { id: high-key-one-signal, text: "a pale field with one small vivid signal; today's default, so at most one candidate takes it" }

# `hierarchy`: what the first view carries and what the later scenes carry. The page is a whole experience, the first
# view is its opening: it states who and what (identity, the claim), shows the one decisive object, and holds the primary
# action. It is not required to carry every core object; an object may own none of the first view (`first_view_share: 0`)
# and play its part in a later scene. `opening_objects` is the most core objects a candidate with that stance may show in
# the first view (share above 0); `diverge check` counts them on the card.
hierarchy:
  - { id: one-decisive-object, opening_objects: 1, text: "the opening holds the claim, the primary action, and the one object that decides the page; every other object plays its part in a later scene" }
  - { id: object-led, opening_objects: 1, text: "one object owns most of the opening and the claim is a single line beside it; the rest of the page unfolds after it" }
  - { id: claim-led, opening_objects: 1, text: "the claim and the action are the opening; the decisive object is only begun there, cropped at the fold, and finishes in the next scene" }
  - { id: relation-pair, opening_objects: 2, text: "two objects in relation open the page next to the claim; every other object comes in a later scene" }

# `rough_bound`: what a rough is, so that polishing stays small before the owner's pick. A rough is the core composition at
# `widths` (the phone and the desktop first view), one representative motion state, and one phone state, written as the one
# page `index.html` with its `card.yaml`. `diverge check` refuses a render of a rough at any other device width, a full capture
# run of a rough (every width and theme), and a second page in a rough's folder. The slice brings the picked rough up to
# every device width and state after the pick.
rough_bound:
  widths: [390, 1440]

# `rough_carry`: what a rough has to carry of the owner's declared words, read by `diverge contract` and `diverge check`
# (`cli/lapis_design/rough_carries.py`). All matching is lexical and a lead for the gate, never a judgment of fit: the owner
# judges whether a face, a motion, or a style suits them. An ASCII term of four letters or more matches at a word start
# (`motion` matches "motion-led", `animat` matches "animated", neither matches "emotion"), a shorter one matches the whole
# word (`no`, `not`), and a term in another script matches as a substring; case is ignored.
# `type`: the families a browser or an OS picks when nobody chose one (`system_defaults`; a CSS generic keyword from
# `fonts/system-fonts.yaml` and a name that starts with a dot count too). A rough's headline and body must render in a
# family that is not one of them (read from the render extract's `font.rendered`), unless the card quotes an owner
# `[declared]` line with one of `system_asks`. `system_share` is the share of a role's characters a system default may paint
# before the role counts as set in it. `words` are terms that name a typeface or a type class in the owner's words; when
# any is found (or an installed family of the owner's inventory is named), the card says how its type answers them.
# `motion`: terms that ask for motion (`words`) and for stillness (`still_words`). `diverge contract` refuses
# `motion: none` while an owner `[declared]` row, the taste file, or an answered direction item (a style, a kept kit item, a
# signature element) matches `words`, unless `motion_still_by` quotes a `[declared]` line with a `still_words` term. A
# motion capture shows change when the settled and the reduced-motion capture of one scroll position differ in at least
# `changed_share` of their pixels by more than `pixel_delta` (of 255) in any channel.
rough_carry:
  type:
    system_defaults: [".SF NS", ".AppleSystemUIFont", "SF Pro", "SF Pro Text", "SF Pro Display", "SF Pro Rounded", "SF Mono",
                      "SF Compact", "San Francisco", "Helvetica", "Helvetica Neue", "Arial", "Times", "Times New Roman",
                      "Courier", "Courier New", "Menlo", "Monaco", "Consolas", "Lucida Grande", "Roboto", "Segoe UI",
                      "Segoe UI Variable", "Apple SD Gothic Neo", "Apple Gothic", "Malgun Gothic", "Hiragino Sans",
                      "Hiragino Kaku Gothic ProN", "Hiragino Kaku Gothic Pro", "Yu Gothic", "Meiryo", "PingFang SC",
                      "PingFang TC", "PingFang HK", "Microsoft YaHei", "Microsoft JhengHei", "DejaVu Sans",
                      "Liberation Sans", "Ubuntu", "Cantarell", "Droid Sans"]
    system_share: 0.25
    system_asks: ["system font", "system ui", "system-ui", "system typeface", "native font", "default font",
                  "시스템 서체", "시스템 폰트", "시스템 글꼴", "시스템서체", "시스템폰트", "기본 서체", "기본 폰트", "기본 글꼴",
                  "システムフォント", "システム書体", "デフォルトフォント", "標準フォント", "系统字体", "系統字體", "默认字体", "預設字體"]
    words: [typeface, font, typograph, geometric, grotesk, grotesque, humanist, serif, sans, monospace, blackletter,
            서체, 폰트, 글꼴, 타이포, 산세리프, 세리프, 고딕, 명조, 지오메트릭, 그로테스크, 고정폭, 모노스페이스,
            フォント, 書体, タイポ, ゴシック, 明朝, セリフ, ジオメトリック, 字体, 字體, 无衬线, 無襯線, 衬线, 襯線]
  motion:
    words: [motion, animat, kinetic, parallax, scrollytelling, marquee,
            모션, 움직, 애니메이션, 키네틱, 패럴랙스, 마퀴,
            モーション, アニメ, 動き, 動く, キネティック, パララックス,
            动画, 動畫, 动效, 動效, 动态效果, 動態效果]
    still_words: ["no", "not", "without", "never", "avoid", "don't", "static", "still", "stop", 없이, 없는, 말고, 말아, 금지, 싫, 정적, 정지, 빼,
                  なし, 不要, いらない, 避け, 静的, 静止, 无, 無, 禁止]
    changed_share: 0.001
    pixel_delta: 16

# `rough_opening`: the opening-composition rules `diverge check` runs on each rough's own render extract
# (`cli/lapis_design/rough_opening.py`), with the detectors they have in the lint of built pages. `rules` are ids of rules
# of `slop/rules.yaml` that read the first view; `component.fake-app-window` counts only when the window starts in the first
# view. When every rough of a set trips the same rule, `check` refuses the set (every rough opens the same default and they
# differ in finish only); when some do, the set passes and the owner block says which. Only the brief lifts it:
# `opening.keeps` quotes the owner's `[declared]` line that asks for what the rule flags, and `opening.carries_by` quotes the
# one that asks for all four carries of the opening (`diverge contract` reads both). A quote counts when it is in a
# `[declared]` line of the brief record, that line speaks of the opening (`opening_words`), and, for a `keeps` row, it has a
# term of `asks.<rule>`. The terms are lexical, as in `rough_carry`: a lead for the gate, never a judgment of fit. An owner's
# answer about the order of work or building is a plan of work and asks for none of this.
rough_opening:
  rules: [layout.split-hero, layout.crowded-hero, component.fake-app-window]
  opening_words: ["first view", "first screen", "opening", "hero", "above the fold", "landing view",
                  "첫 화면", "첫화면", "첫 뷰", "첫뷰", "히어로", "오프닝",
                  "ファーストビュー", "トップ画面", "首屏", "第一屏"]
  asks:
    layout.split-hero: ["two-column", "two column", "2-column", "split hero", "split opening", "side by side",
                        "2단", "두 칼럼", "두 컬럼", "투컬럼", "좌우로", "나란히",
                        "2カラム", "二列", "左右に", "两栏", "兩欄", "左右并排"]
    layout.crowded-hero: ["logo wall", "logos", "metric", "stats", "proof", "testimonial",
                          "로고", "지표", "수치", "후기", "실적",
                          "ロゴ", "実績", "指标", "数据", "口碑"]
    component.fake-app-window: ["app window", "product window", "window", "screenshot", "screen capture",
                                "앱 창", "제품 창", "창을", "스크린샷", "화면 캡처",
                                "ウィンドウ", "スクリーンショット", "窗口", "截图"]

distance:
  calibrated: true
  weights: { struct: 0.55, mass: 0.20, repr: 0.25 }
  struct: { grid_1440: 0.48, grid_390: 0.32, signature: 0.20 }
  reject_mass_below: 0.10
  minimum_pair: 0.39
