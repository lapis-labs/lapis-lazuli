# Example: sales page for a small pottery studio (create mode)
# Free text is in English; key_copy.text stays in the target locale (ko-KR) because it is real UI copy.
# Color values and comparison paths illustrate this case's decisions, not a starter palette or a completed capture run.
version: 0
mode: create
task: { id: kiln-shop-landing, title: Pottery studio sales landing }
approval: { state: approved }   # the user's own approval; a run with nobody to ask writes `state: assumed` and a reason
context:
  product: PRODUCT.md
  design: null
brief:
  subject: Online sales for a small pottery studio
  one_job: Let visitors see this firing's pieces and reserve one
  audience: Craft lovers in their 30s and 40s
  platform: [web]
  locales: [ko-KR]
  product_frame: e-commerce
  constraints: [Most visits are on mobile, Photos show pieces straight out of the kiln, Feedback only without entrance animation]
claims:
  known: [The studio fires once a month]
  declared: [No brand color yet]
  proposed: [Use the firing log as the page signature]
  unresolved: [Delivery regions]
world_materials: [firing log sheet, glaze numbers, kiln temperature curve, foot-ring marks, kiln shelf in product photographs]
direction:
  taste: { source: own-reading }
  read:
    text: "Reading this as: e-commerce / Persuade + Operate on web for craft lovers, subject-derived language, constrained by mobile-first reading"
    surface_mode: [persuade, operate]
    style_frame: subject-derived
    constraint_frame: [mobile first, real kiln photography]
  dials: { variance: 5, motion: 2, density: 4 }
  concept: Not a sales page but the record of one firing
  levers:
    - "rhythm: the firing log sheet's ruled rows set the page grid, one row per piece"
    - "scale: the kiln temperature curve runs the full width of the opening, larger than any photograph"
references:
  - source: https://example.com/archive
    kind: site
    rights: reference-only
    mode: borrow
    take: [row rhythm of the log-sheet grid, caption-to-image ratio]
    leave: [brand colors, illustrations, copy]
    profile: .lapis/refs/example-archive.json
tokens:
  color:
    decision:
      medium: { answer: "Web, mobile first", status: known }
      task_structure: { answer: list -> detail -> reserve, status: declared }
      content_colors: { answer: Glaze colors are the protagonists, status: known }
      identity: { answer: None yet, status: known }
      environment: { answer: Bright indoor viewing, status: proposed }
      tone: { answer: "High-key field L .97/C .01 across the non-photo canvas; ink L .25/C .01; reserve L .45/C .09 on small controls, not panels; warm neutral frame leaves glaze chroma to the photos", status: proposed }
    roles:
      - { name: paper, role: field, oklch: [0.97, 0.01, 85], area: "canvas of every section outside the photographs, about 80% of the first view" }
      - { name: ink, role: foreground, oklch: [0.25, 0.01, 60] }
      - { name: reserve, role: interaction, oklch: [0.45, 0.09, 250], source_class: authored }
      - { name: kiln-night, role: field, oklch: [0.22, 0.01, 60], theme: dark, area: "canvas of every section in the dark theme, about 80% of the first view" }
    relations: [near-monochrome]
    themes: [light, dark]
  type:
    roles:
      - { role: heading, family: Gowun Batang, weights: [400, 700], scripts: [hang, latn], source: catalog }
      - { role: body, family: Pretendard, weights: [400, 600], scripts: [hang, latn], source: inventory }
    scale: { base_px: 16, ratio: 1.25 }
    lock: src/shared/fonts/example.fonts.lock.json   # synthetic facts for this portable example, not a local capture
  shape:
    radius: { scale: [0, 4, 8], by_role: { control: 4, card: 8, image: 0 } }
    rule: Square image edges like the firing-log sheets; softer corners only on things you press
    # A compared authored contour is not a control radius step; square photos can still win.
    media_contours:
      - { token: --media-contour-detail, value: "0 32px 0 0", where: "detail figure", reason: "A single open corner anchors the kiln-position caption; narrow view returns to square edges" }
  surface:
    elevation:
      - { level: 0, means: the page and the firing log }
      - { level: 1, means: piece cards and the reservation sheet }
    borders: hairlines in ink at low contrast, never shadows on the log
    treatments:
      - { name: paper grain, job: marks the firing log as the studio's own record, where: [firing-log] }
  icons: { family: line icons on a 24 px grid, source: library, style: outline, stroke_px: 1.5, sizes_px: [16, 24] }
  motion: { reduced_motion: respect }
layout:
  procedure:
    content_inventory: [pieces from this firing, firing log, how to reserve]
    priority: [pieces, reservation, log]
    archetype: list-detail
  phone_task:
    decision: Inspect a piece from this firing and its availability
    first_result: "#works .piece:first-child"
    before_result: [firing identity, piece selection]
    acceptance: The phone's first useful piece record shows glaze, price and availability before optional log detail
  sections:
    - { id: firing-log, archetype: signature, answers: How were these pieces made }
    - { id: works, archetype: list, answers: What can I buy }
  signature: firing log row
content:
  real_copy: true
  voice: { register: haeyo }
  key_copy:
    - { slot: headline, text: "9월 소성분, 스물네 점이 나왔어요", locale: ko-KR }
    - { slot: cta, text: 예약하기, locale: ko-KR }
flows:
  - id: reserve-piece
    kind: primary
    goal: Reserve one piece from this firing and get a reservation number
    start: /
    done: { route: /reservations/* }
    requires: [address]
    max_steps: 4
    # Selection-first flows can add reach: {forward: Continue, selections: [Date, Time]}.
    # Names must come from that flow's rendered controls; this route-first flow uses observed fields.
  - id: firing-notices
    kind: grant-consent
    goal: Get an email when the next firing's pieces go up
    start: /
    done: { text: 알림을 신청했어요 }
  - id: stop-firing-notices
    kind: withdraw-consent
    goal: Stop the firing emails
    start: /
    done: { text: 알림을 껐어요 }
    pair: firing-notices
explorations:
  - decision: type
    covers: [heading]
    candidates:
      - { name: Gowun Batang, source: catalog:google-fonts, note: terminals close to the pen of the firing log }
      - { name: Noto Serif KR, source: catalog:google-fonts }
      - { name: system-ui, source: generic }
    compared_on: [specimen]
    chosen: Gowun Batang
    runner_up_lost: Noto Serif KR held the title evenly but read as a newspaper, not as a studio's own log
  - decision: type
    covers: [body]
    candidates:
      - { name: Pretendard, source: local }
      - { name: Noto Sans KR, source: catalog:google-fonts }
    compared_on: [specimen]
    chosen: Pretendard
    runner_up_lost: Noto Sans KR set the same measure, but its Latin sat high beside Hangul in the reservation lines
  - decision: palette
    candidates:
      - name: log-sheet paper and kiln ink
        source: firing log sheet
        note: "Observed warm log stock and dark ruled ink; proposed neutral frame, with reserve/focus separately assigned"
        artifact: .lapis/specimens/kiln-shop-landing-palette-a.html
        roles:
          - { name: paper, role: field, oklch: [0.97, 0.01, 85] }
          - { name: ink, role: foreground, oklch: [0.25, 0.01, 60] }
          - { name: reserve, role: interaction, oklch: [0.45, 0.09, 250] }
      - name: cool kiln-shelf frame
        source: kiln shelf in product photographs
        note: "Observed cool shelf shadows beside warm and blue glazes; proposed echo of that neutral temperature, without grading the photos"
        artifact: .lapis/specimens/kiln-shop-landing-palette-b.html
        roles:
          - { name: paper, role: field, oklch: [0.97, 0.01, 250] }
          - { name: ink, role: foreground, oklch: [0.25, 0.01, 250] }
          - { name: reserve, role: interaction, oklch: [0.45, 0.09, 250] }
    compared_on: [render]
    # Illustrative evidence paths, not captures shipped or executed by this example.
    comparisons:
      - variable: neutral temperature of field and ink; L/C and reserve role held fixed
        viewport: { width: 390, theme: light }
        state: product list and focused reserve control
        captures:
          log-sheet paper and kiln ink: .lapis/renders/kiln-palette-a-390.png
          cool kiln-shelf frame: .lapis/renders/kiln-palette-b-390.png
    chosen: log-sheet paper and kiln ink
    runner_up_lost: The cool shelf echo kept reserve distinct, but the blue-glazed bowl's edge read less clearly against it in the same dense list; the warm log frame kept that boundary without editing the photo
  - decision: layout
    candidates:
      - name: one ruled row per piece
        source: firing log sheet
        images: []
      - name: a photo grid of piece cards
        source: generic
        images:
          - { source: studio piece photos, role: product, reason: The actual glaze and silhouette let the buyer compare these pieces }
    compared_on: [sketch]
    chosen: one ruled row per piece
    runner_up_lost: the grid hides the glaze number and the kiln position that tell pieces apart
  - decision: motion
    fixed_by: brief
    reason: The brief requires feedback only without entrance animation; no open motion alternative is claimed
  - decision: direction
    candidates:
      - { name: the record of one firing, source: firing log sheet }
      - { name: a shop shelf of ceramics, source: generic }
    compared_on: [sketch]
    chosen: the record of one firing
    runner_up_lost: a shelf is every pottery shop's page and says nothing about this month's kiln
  - decision: copy
    covers: [headline]
    candidates:
      - { name: "9월 소성분, 스물네 점이 나왔어요", source: firing log sheet }
      - { name: "이달의 도자기를 만나보세요", source: generic }
    compared_on: [specimen]
    chosen: "9월 소성분, 스물네 점이 나왔어요"
    runner_up_lost: the second line fits any shop; the first names the month and the count only this firing has
  - decision: copy
    covers: [cta]
    candidates:
      - { name: 예약하기, source: firing log sheet }
      - { name: 지금 구매하기, source: generic }
    compared_on: [specimen]
    chosen: 예약하기
    runner_up_lost: 구매하기 promises a checkout, but the studio holds a piece for the visitor to collect
defaults:
  - id: type.single-neutral-sans
    decision: keep
    keep_when: platform-body-readability
    basis: brief
    evidence: { exploration: Pretendard }
    reason: Body text favors mobile readability, so a neutral sans stays
  - id: type.overused-neutral-grotesque
    decision: keep
    keep_when: won-comparison
    basis: brief
    evidence: { exploration: Pretendard }
    reason: Pretendard won the body specimen on a phone against Noto Sans KR
  - id: color.warm-editorial
    decision: reject
    basis: brief
    reason: The competing candidate came from actual shelf photographs; neither a stock clay accent nor a category palette was needed to distinguish reserve from the pieces
  - id: color.cream-base
    decision: keep
    keep_when: paper-material
    basis: brief
    evidence: { material: firing log sheet }
    reason: The field is the paper of the firing log sheet, one of the world materials
sources:
  - { ref: PRODUCT.md }
  - { ref: https://example.com/archive, note: log-sheet grid reference }
  - ref: src/shared/handoff/example-system.md
    note: Synthetic reservation instructions; no app or capture was run
    intake:
      id: reservation-spec
      kind: system-spec
      scope: Reservation contract and Reservation acceptance
      read_state: read
      via: local-file
      revision: synthetic-example
      snapshot: {path: src/shared/handoff/example-system.md, sha256: 6f1e95062a62d3612f0db6b58c255771a37ac4b1f9d30aa2a05ad611091b336d}
      authority: {level: reference, basis: "Synthetic demonstration, not an adopted owner contract"}
      disclosure: {state: approved-for-handoff, basis: Public synthetic example for manual text recipients}
  - ref: src/shared/fonts/example.fonts.lock.json
    intake:
      id: reservation-fonts
      kind: lapis-record
      scope: Synthetic heading and body OFL delivery records
      read_state: read
      via: local-file
      revision: synthetic-example
      snapshot: {path: src/shared/fonts/example.fonts.lock.json, sha256: 3c6460cfbafc23a4ce519ced8585c0b30668817396e0fe5f69f04352da683ecb}
      authority: {level: reference, basis: "Existing illustrative lock, not proof of a local rights review"}
      disclosure: {state: approved-for-handoff, basis: Public OFL example records for manual text recipients}
handoff:
  scopes:
    - id: reservation
      plan_paths: [/brief, /tokens/color, /tokens/type, /tokens/shape, /tokens/surface, /tokens/motion, /layout, /content, /flows/0, /explorations, /direction, /defaults]
      excerpts:
        - {source: reservation-spec, heading: Reservation contract}
        - {source: reservation-fonts, pointer: /fonts/0}
        - {source: reservation-fonts, pointer: /fonts/1}
      open_decisions: []
      implementation_paths: [src/reservation.ts]
      acceptance_refs:
        - {source: reservation-spec, heading: Reservation acceptance}
      check_owners:
        plan: coordinator
        render: local-verifier
        behavior: local-verifier
        lint: local-verifier
        critic: local-verifier
        release: coordinator
