packages:
  warm-editorial:
    members: [color.cream-base, color.terracotta-accent, type.serif-luxury-display]
    structure:
      base: { role: field, warmth: warm, c_max: 0.045, l_min: 0.9 }
      accent: { count: 1, warmth: warm, c: [0.08, 0.16] }
      display_type: { serif: true }
    hit_when: { min_members: 2 }
    observed: { eras: [2025], note: "cream paper field, serif display, clay accent, tiny uppercase metadata" }
    provenance:
      - { kind: taxonomy, source: "aesthetics#warm-editorial-package" }
      - { kind: taxonomy, source: "anti-slop#overlapping-default-packages" }
  dark-luminous:
    members: [color.violet-blue-gradient, color.hero-halo, color.neon-glow, color.gradient-headline,
              color.acid-on-black, surface.glass-everywhere, type.overused-neutral-grotesque, motion.pulse-without-status,
              copy.buzzwords]
    structure:
      base: { role: field, l_max: 0.25 }
      accents: { hues: [255, 320], luminous: true }
      material: { translucent_panels: true }
    hit_when: { min_members: 3 }
    observed: { eras: [2022, 2023, 2024], note: "dark field, violet-to-blue gradients, glow, glass cards" }
    provenance:
      - { kind: taxonomy, source: "aesthetics#dark-glass-neon-package" }
      - { kind: taxonomy, source: "anti-slop#overlapping-default-packages" }
  hard-edge-graphic:
    members: [surface.hard-offset-shadow, type.costume-monospace, type.caps-prose, type.oversized-display]
    structure:
      surfaces: { border_px_min: 2, shadow_blur_px_max: 0 }
      palette: { saturated_blocks: true }
    hit_when: { min_members: 2 }
    observed: { eras: [2026], note: "thick outlines, offset shadows, saturated blocks, heavy grotesque" }
    provenance:
      - { kind: taxonomy, source: "aesthetics#hard-edge-graphic-package" }
  reassurance-landing:
    members: [layout.template-section-sequence, layout.pricing-trio-recommendation, component.floating-chips,
              copy.stock-reassurance, copy.template-offer-terms, copy.uniform-rhythm, color.sage-soft-field,
              color.violet-indigo-accent, color.teal-accent]
    structure: { scope: "member hits on one landing page: the category's section order, a recommended middle plan, floating panels in the opening, comfort wording, stacked trial terms, headings in short sentence pairs, and a category palette" }
    hit_when: { min_members: 4 }
    observed: { eras: [2026], note: "feature, plan, and question sections with a recommended middle plan, floating status panels, comfort wording, and a calm green or indigo palette" }
    provenance:
      - { kind: measurement, source: "slop catalog 2026-10-04 saas-sequence and companions", note: "the members co-occur on 49 to 68 of 69 backup landing pages; a counter-package of restore-specific openings appears on all 8 pages of one Claude Code cohort with the lapis plan procedure (2 of them with a grilled brief), so the effect of the questions alone is not separated" }
  # Behavior packages name a mechanism made of several deceptive or coercive findings. Each member
  # is already reported on its own; the package rule groups them in the report so they are fixed together.
  subscription-trap:
    members: [ux.hidden-subscription, ux.preselected-option, ux.obstructed-exit, ux.nagging]
    structure: { scope: "member hits in a join flow, its paired exit flow, or the offers between them" }
    hit_when: { min_members: 2 }
    provenance:
      - { kind: taxonomy, source: "deceptive-design#hidden-subscription" }
      - { kind: taxonomy, source: "deceptive-design#hard-to-cancel" }
  pressure-selling:
    members: [ux.entry-interruption, ux.false-urgency, ux.false-hierarchy, ux.confirmshaming, ux.nagging]
    structure: { scope: "member hits on the same page or flow" }
    hit_when: { min_members: 3 }
    provenance:
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#persuasion-versus-deception" }
  consent-steering:
    members: [ux.preselected-option, ux.false-hierarchy, ux.asymmetric-decline, ux.nagging, ux.permission-on-load]
    structure: { scope: "member hits on consent, marketing, or permission decisions; browser permission requests count as permission decisions" }
    hit_when: { min_members: 2 }
    provenance:
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#consent-design" }

rules:

  # =============================================================== system (contract drift)

  - id: system.font-outside-contract
    class: contract
    domain: system
    layers: [source, render]
    severity: { create: gate, review: P2 }
    detect:
      source: { detector: css-font-family, params: { compare: contract-families } }
      render: { detector: contract-diff, params: { kind: font-family } }
    why: A font family outside the design contract gives one region an unrelated typographic voice
    better: Use the contract family for that role, or record a proposed design change with the reason
    keep_when:
      - { id: proposed-change, when: "the change is recorded as a proposed design change", evidence: [{ plan: "proposed_design_changes", present: true }] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#SYS-01", note: "fix pointer design-systems/design-tokens.md" }

  - id: system.literal-color
    class: contract
    domain: system
    layers: [source, render]
    severity: { create: gate, review: P2 }
    detect:
      source: { detector: css-literal-color }
      render: { detector: contract-diff, params: { kind: color }, threshold: { delta_e_ok_max: 0.02 } }
    why: Literal colors outside semantic tokens drift into near-duplicate grays and accents
    better: Use the semantic token for the role, or add a token when the value repeats with a real role
    keep_when:
      - { id: content-color, when: "data or content colors that come from the content itself, such as a product swatch", evidence: [{ plan: "tokens.color.roles[*].role", has: [data, content] }] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#SYS-02", note: "fix pointer design-systems/design-tokens.md" }
      - { kind: taxonomy, source: "anti-slop#code.9" }

  - id: system.off-scale-value
    class: contract
    domain: system
    layers: [source, render]
    severity: { create: gate, review: P2 }
    detect:
      source: { detector: css-off-scale-value, params: { properties: [border-radius, font-size, gap, margin, padding] } }
      render: { detector: contract-diff, params: { kind: [radius, font-size, spacing] } }
    why: One-off radius, size, or spacing values make equivalent components drift without a role or optical reason
    better: Use the scale step for the same role and condition; document an optical correction when one is needed
    keep_when:
      - { id: optical-correction, when: "a documented optical correction, such as balancing an icon inside a round button", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#SYS-03", note: "fix pointer fundamentals/shape-elevation-and-surfaces.md" }
      - { kind: taxonomy, source: "anti-slop#code.9" }

  - id: system.bypassed-primitive
    class: contract
    domain: system
    layers: [source, review]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: source-ast, params: { query: raw-element-where-adopted-primitive-exists } }
    why: A component that bypasses the adopted primitives or theme API behaves and styles its states differently from its peers
    better: Build on the adopted primitive and theme API; extend the primitive when it lacks a needed state
    keep_when:
      - { id: recorded-primitive-gap, when: "the primitive cannot express a documented requirement and the gap is recorded", evidence: none }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#SYS-04", note: "fix pointer design-systems/component-architecture.md" }

  # =============================================================== plan (decision evidence)

  - id: plan.uncompared-decision
    class: quality
    domain: plan
    layers: [plan]
    severity: { create: gate, review: P1 }
    detect:
      plan: { detector: plan-candidates, path: explorations, params: { modes: [create], copy_slots: [headline, subhead, cta], min_candidates: 2 } }
    why: A decision made without a second candidate is the first answer that came to mind, and for most pages that is the default for that kind of page
    better: Record each open decision in explorations - two or more candidates with their sources, what they were compared on, the chosen one, and why the runner-up lost; a decision the contract or the brief fixes says so with fixed_by
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "local pilot rollouts 2026-10-02", note: "every font role was set to system-ui and the generic-family rules were kept as INFO; no candidate was recorded for any decision" }

  # =============================================================== type

  - id: type.serif-luxury-display
    class: default
    domain: type
    layers: [plan, render, review]
    severity: { create: gate, review: P3 }
    detect:
      plan: { detector: plan-font-region, path: "tokens.type.roles[?role=display|heading].family", list: luxury_serif_regions }
      render: { detector: rendered-family-region, list: luxury_serif_regions, params: { roles: [display, heading], include_italic: true } }
    packages: [warm-editorial]
    why: A high-contrast or italic serif display stands in for premium without any tie to the subject
    better: Choose display type from the product's material, voice, and content; compare a subject-earned serif, sans, and mixed route
    keep_when:
      - { id: specified-face, when: "the brand or contract specifies the face", evidence: [design, brief] }
      - { id: editorial-reading, when: "publishing or editorial subjects where the reading sequence earns it", evidence: [brief, { plan: "brief.product_frame", has: [content-editorial-docs] }, { plan: "direction.read.surface_mode", has: [read] }] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#TYP-01", note: "fix pointer fundamentals/typography.md" }
      - { kind: taxonomy, source: "anti-slop#typography.1" }
      - { kind: taxonomy, source: "anti-slop#typography.2" }

  - id: type.eyebrow-kicker
    class: default
    domain: type
    layers: [render, review]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: eyebrow-relation, params: { kind: label }, threshold: { repeats_max: 2 } }
    why: A small tracked uppercase label or index marker repeats before most headings without adding category, scope, state, or sequence
    better: Remove it; when context is needed, write a specific label and let the title carry the proposition
    keep_when:
      - { id: real-category, when: "the label names a real category or scope that differs between sections", evidence: none }
      - { id: ordered-process, when: "the marker numbers a real ordered process", evidence: none }
    waiver: { scope: rule }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#TYP-02", note: "fix pointer quality/anti-slop.md" }
      - { kind: taxonomy, source: "anti-slop#typography.4" }

  - id: type.heading-badge
    class: default
    domain: type
    layers: [render, review]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: eyebrow-relation, params: { kind: badge } }
    why: A badge chip or status strip above a headline delays the message and can imply a state that does not exist
    better: Keep a real current status beside the object it describes; otherwise omit it
    keep_when:
      - { id: current-state, when: "the badge reflects authoritative current state", evidence: none }
      - { id: filter-or-state-chip, when: "the chip filters content or identifies authoritative current state", evidence: none }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#TYP-03", note: "fix pointer quality/anti-slop.md" }
      - { kind: taxonomy, source: "anti-slop#typography.5" }

  - id: type.icon-tile-heading
    class: default
    domain: type
    layers: [render]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: template-repetition, params: { pattern: [icon, heading, text] }, threshold: { repeats_max: 2 } }
    why: Every section opens with the same stacked icon tile, heading, and paragraph, so the icon only duplicates the label
    better: Use icons for recognition or actions; let content differences shape each section
    keep_when:
      - { id: recognition-icon, when: "icons that users need to recognize a category or action", evidence: none }
    waiver: { scope: rule }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#TYP-04", note: "fix pointer quality/anti-slop.md" }
      - { kind: taxonomy, source: "anti-slop#typography.6" }

  - id: type.oversized-display
    class: quality
    domain: type
    layers: [render, review]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: type-hierarchy, params: { check: oversized }, threshold: { first_viewport_area_share_max: 0.4, lines_at_390_max: 4 } }
    packages: [hard-edge-graphic]
    why: Headline scale grows past the content and viewport need, crowding the task or wrapping awkwardly
    better: Balance title, evidence, and action for the surface; do not force every opening into one viewport
    keep_when:
      - { id: title-is-content, when: "an immersive or campaign opening where the title is the content", evidence: [brief, { plan: "direction.read.surface_mode", has: [experience] }] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#TYP-05", note: "fix pointer fundamentals/visual-hierarchy-and-composition.md" }
      - { kind: taxonomy, source: "anti-slop#typography.7" }

  - id: type.negative-tracking
    class: quality
    domain: type
    layers: [source, render]
    severity: { create: warn, review: P2 }
    detect:
      source: { detector: source-pattern, params: { patterns: ['letter-spacing:\s*-(0?\.0[5-9]|0?\.[1-9]|[1-9])[0-9.]*em', 'tracking-\[-(0?\.0[5-9]|0?\.[1-9])', 'tracking-tighter'] } }
      render: { detector: text-metrics, params: { metric: letter_spacing_em }, threshold: { min: -0.04 } }
    why: Tracking tighter than the face tolerates makes letterforms collide and word shapes collapse
    better: Respect the face's spacing; tighten only display sizes where the letterforms survive
    keep_when:
      - { id: tight-display-face, when: "a display face designed for tight setting at that size", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#TYP-06", note: "fix pointer fundamentals/typography.md" }
      - { kind: taxonomy, source: "anti-slop#typography.9" }

  - id: type.body-tracking
    class: quality
    domain: type
    layers: [render]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: text-metrics, params: { metric: letter_spacing_em, roles: [body] }, threshold: { max: 0.02 } }
    why: Positive tracking on paragraphs stripes the text and tires the reader
    better: Keep body tracking near the face's default
    keep_when:
      - { id: contract-tracking, when: "the design contract sets the body tracking and the plan cites it", evidence: [design] }
      - { id: measured-correction, when: "the face's metrics are measured to need open spacing at that size", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#TYP-07", note: "fix pointer fundamentals/typography.md" }
      - { kind: taxonomy, source: "anti-slop#typography.10" }

  - id: type.tight-leading
    class: quality
    domain: type
    layers: [render]
    severity: { create: gate, review: P1 }
    detect:
      render: { detector: text-metrics, params: { metric: line_height, roles: [body] }, threshold: { min: { latn: 1.2, cyrl: 1.2, grek: 1.2, hang: 1.4, hani: 1.4, kana: 1.4, other: 1.3 } } }
    why: Body leading near 1 makes ascenders and descenders collide and lines hard to track
    better: Set leading for size, measure, script, and content
    keep_when:
      - { id: single-line-text, when: "body-role text that never wraps, such as one-line table cells, so no two lines can collide", evidence: none }
      - { id: contract-leading, when: "the design contract sets the leading and the plan cites it", evidence: [design] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#TYP-08", note: "fix pointer fundamentals/typography.md" }
      - { kind: taxonomy, source: "anti-slop#typography.13" }

  - id: type.long-measure
    class: quality
    domain: type
    layers: [render]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: text-metrics, params: { metric: measure_chars, roles: [body] }, threshold: { max: { latn: 80, cyrl: 80, grek: 80, hang: 45, hani: 40, kana: 40, other: 80 } } }
    why: Paragraphs that run past a comfortable measure make readers lose the next line
    better: Constrain the prose measure; give data its own grid
    keep_when:
      - { id: data-grid, when: "tables and data rows, which follow their own grid", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#TYP-09", note: "fix pointer assets/type-scale-cheatsheet.md" }
      - { kind: taxonomy, source: "anti-slop#typography.15" }

  - id: type.flat-hierarchy
    class: quality
    domain: type
    layers: [plan, render]
    severity: { create: gate, review: P1 }
    detect:
      plan: { detector: plan-value-range, path: tokens.type.scale.ratio, threshold: { min: 1.125 } }
      render: { detector: type-hierarchy, params: { check: flat, levers: [size, weight, contrast] }, threshold: { heading_body_ratio_min: 1.2 } }
    why: Title, label, and body share size, weight, and color, so the scan order is flat despite semantic headings
    better: Separate adjacent roles by changing one lever at a time - size, weight, contrast, or space
    keep_when:
      - { id: contract-scale, when: "the design contract fixes the type scale and the plan cites it", evidence: [design] }
      - { id: non-size-levers, when: "the roles are separated by weight, contrast, or space instead of size, and the plan names the lever for each pair of roles", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#TYP-10", note: "fix pointer fundamentals/visual-hierarchy-and-composition.md" }
      - { kind: taxonomy, source: "anti-slop#typography.8" }
      - { kind: method, source: "memo:text", note: plan scale ratio check before code }

  - id: type.overused-neutral-grotesque
    class: default
    domain: type
    layers: [plan, render]
    severity: { create: gate, review: P3 }
    detect:
      plan: { detector: plan-font-region, path: "tokens.type.roles[*].family", list: overused_type_regions }
      render: { detector: rendered-family-region, list: overused_type_regions }
    packages: [dark-luminous]
    why: A featureless low-contrast, high-x-height grotesque carries every role with no distinction between product, editorial, and data voices
    better: Pair type by role; keep the face only when the contract or platform specifies it, or when it won a recorded comparison on this surface's own copy
    keep_when:
      - { id: specified-face, when: "the contract or platform specifies the face", evidence: [design, brief, { plan: "brief.platform", has: [ios, android, desktop] }] }
      - { id: role-variation, when: "a one-family system with deliberate role variation", evidence: none }
      - { id: won-comparison, when: "the face won a side-by-side comparison on this surface's own copy, recorded in explorations", evidence: [exploration] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#typography.3" }
      - { kind: method, source: "memo:structure", note: PANOSE feature regions instead of font names }

  - id: type.single-neutral-sans
    class: default
    domain: type
    layers: [plan, render]
    severity: { create: gate, review: P3 }
    detect:
      plan: { detector: plan-distinct-values, path: "tokens.type.roles[*].family", params: { min_items: 2 }, threshold: { distinct_min: 2 } }
      render: { detector: text-metrics, params: { metric: distinct_families }, threshold: { min: 2 } }
    why: One family, usually a neutral sans, carries every role with no variation in width, optical size, or weight, so consistency turns into monotony
    better: Vary optical size, width, or weight by role, or add a deliberate companion face
    keep_when:
      - { id: role-variation, when: "a one-family system that varies width, optical size, or weight by role", evidence: none }
      - { id: platform-body-readability, when: "body readability on the target platform favors one family", evidence: [exploration] }
      - { id: specified-family, when: "the contract specifies one family", evidence: [design] }
    waiver: { scope: rule }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#typography.12" }

  - id: type.caps-prose
    class: default
    domain: type
    layers: [render]
    locales: [latin, cyrl, grek]
    severity: { create: warn, review: P3 }
    detect:
      render: { detector: text-metrics, params: { metric: uppercase_run_words }, threshold: { max: 4 } }
    packages: [hard-edge-graphic]
    why: All-caps prose and decorative micro-labels assert importance without adding hierarchy or meaning
    better: Reserve capitals for brief, readable labels whose role or brand earns them
    keep_when:
      - { id: established-label, when: "short labels whose role is established", evidence: none }
      - { id: brand-wordmark, when: "brand wordmarks", evidence: [design, brief] }
    waiver: { scope: rule }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#typography.11" }

  - id: type.tiny-ui-text
    class: quality
    domain: type
    layers: [render]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: text-metrics, params: { metric: size_px, roles: [body, ui, caption] }, threshold: { min: { latn: 12, cyrl: 12, grek: 12, hang: 13, hani: 13, kana: 13, other: 12 } } }
    why: Miniaturized interface text signals sophistication at the cost of legibility
    better: Use readable sizes and reduce density structurally instead
    keep_when:
      - { id: legal-metadata, when: "legal or metadata text that has a readable alternative", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#typography.14" }

  - id: type.costume-monospace
    class: default
    domain: type
    layers: [plan, render]
    severity: { create: gate, review: P3 }
    detect:
      plan: { detector: plan-font-region, path: "tokens.type.roles[?role=display|heading|body|ui].family", list: monospace_regions }
      render: { detector: rendered-family-region, list: monospace_regions, params: { roles_except: [code, data] } }
    packages: [hard-edge-graphic]
    why: Monospace is worn as a technical costume on prose and headings instead of marking code, identifiers, or aligned values
    better: Use monospace for semantic code, identifiers, or aligned numbers
    keep_when:
      - { id: code-product, when: "developer products where the text is code", evidence: [brief, { plan: "brief.product_frame", has: [developer-tools] }] }
      - { id: monospaced-brand-face, when: "a brand face that happens to be monospaced", evidence: [design, brief] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#typography.16" }

  - id: type.font-fallback
    class: quality
    domain: type
    layers: [render]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: font-fallback }
    why: Text renders in a fallback font instead of the requested one, mixing sizes and color between scripts
    better: Lock a face that covers every script in the locales, or pair a companion with matched metrics
    keep_when:
      - { id: locked-companion, when: "the rendered face is the companion or fallback that the fonts lock records for that script", evidence: none }
      - { id: user-content-scripts, when: "user-generated text in scripts the planned locales do not cover, left to the platform's fallback", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: method, source: "memo:text", note: Hangul falling back from a Latin-only face }

  - id: type.synthetic-style
    class: quality
    domain: type
    layers: [render]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: synthetic-style }
    why: The browser synthesizes bold or italic that the font does not have, distorting the letterforms
    better: Load the real weight or style, or choose a face that has it
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: method, source: "memo:text" }

  - id: type.ko.body-negative-tracking
    class: default
    domain: type
    layers: [render]
    locales: [ko]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: hangul-negative-tracking, threshold: { min: 0 } }
    why: Negative tracking applied to Korean body text out of habit crowds the syllable blocks
    better: Keep Hangul body tracking at the face's default unless a measured face needs a small correction
    keep_when:
      - { id: measured-correction, when: "the face's metrics are measured to need it at that size", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: method, source: "memo:text" }

  - id: type.ko.keep-all-missing
    class: quality
    domain: type
    layers: [render]
    locales: [ko]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: keep-all-missing }
    why: Korean body text breaks inside words because word-break keep-all is missing
    better: Set word-break keep-all on Korean text blocks and allow overflow-wrap for long tokens
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: method, source: "memo:text" }

  # =============================================================== color

  - id: color.palette-swap-only
    class: default
    domain: color
    layers: [render, review]
    severity: { create: warn, review: P3 }
    detect:
      render: { detector: typicality-distance, params: { corpus: starter-themes, exclude_features: [palette] }, threshold: { distance_min: 0.2 } }
      review: { detector: counterfactual-test }
    why: A palette or primary-color swap is the only change to a starter surface, so color is asked to distinguish default type, composition, and components
    better: Derive color roles from the subject, then resolve type, composition, imagery, and states on their own terms
    keep_when:
      - { id: recolor-task, when: "the task is only a recolor of an approved system", evidence: [design, brief] }
    waiver: { scope: rule }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#COL-01", note: "fix pointer styles/ai-era-aesthetics.md" }
      - { kind: taxonomy, source: "anti-slop#color.1", note: palette-swap part }
      - { kind: taxonomy, source: "anti-slop#components.9" }
      - { kind: taxonomy, source: "anti-slop#code.10" }

  - id: color.violet-blue-gradient
    class: default
    domain: color
    layers: [render]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: gradient-inventory, region: { space: oklch, bounds: { h: [255, 320], c: [0.1, 0.37] } }, params: { min_stops_in_region: 2 }, threshold: { area_share_max: 0.05 } }
    packages: [dark-luminous]
    why: A violet-to-blue gradient supplies the whole mood of an otherwise unchanged composition
    better: Derive color roles from the subject and let a gradient appear only where it encodes something, such as a spectrum
    keep_when:
      - { id: brand-gradient, when: "an approved brand gradient", evidence: [design, brief] }
      - { id: light-is-subject, when: "generative media, or light as the subject", evidence: [brief] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#color.1", note: gradient part }
      - { kind: taxonomy, source: "aesthetics#dark-glass-neon-package" }

  - id: color.gradient-headline
    class: default
    domain: color
    layers: [render, review]
    severity: { create: gate, review: P2 }
    detect:
      render: { detector: gradient-inventory, params: { target: text, roles: [display, heading], include_accent_word: true } }
    packages: [dark-luminous]
    why: Gradient text or one accent-colored word is the headline's main emphasis, substituting a color effect for title craft
    better: Write a precise title; use a solid role color or image emphasis only when it clarifies meaning
    keep_when:
      - { id: encoded-state, when: "the colored word encodes a real category or state", evidence: none }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#COL-02", note: "fix pointer fundamentals/visual-hierarchy-and-composition.md" }
      - { kind: taxonomy, source: "anti-slop#color.2" }

  - id: color.hero-halo
    class: default
    domain: color
    layers: [render]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: gradient-inventory, params: { kind: radial, behind: hero, min_blur_px: 40 }, threshold: { first_viewport_share_max: 0.15 } }
    packages: [dark-luminous]
    why: A radial halo or soft spotlight behind the hero fills space and simulates depth without meaning or a material model
    better: Recompose around content or use subject-specific imagery; keep one consistent light and surface model
    keep_when:
      - { id: light-is-subject, when: "light itself is the subject, such as a lighting or display product", evidence: [brief] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#COL-03", note: "fix pointer quality/anti-slop.md" }
      - { kind: taxonomy, source: "anti-slop#color.3" }
      - { kind: taxonomy, source: "anti-slop#color.4" }

  - id: color.neon-glow
    class: default
    domain: color
    layers: [render]
    severity: { create: gate, review: P2 }
    detect:
      render: { detector: surface-effects, params: { effect: glow, dark_background_l: 0.25, min_glow_chroma: 0.12, min_glow_blur_px: 8 } }
    packages: [dark-luminous]
    why: Bright outer glow on dark surfaces is a technical costume that blurs hierarchy and boundaries
    better: Build a functional dark palette with semantic roles; mark focus and state with borders and contrast
    keep_when:
      - { id: emitted-light, when: "nightlife, gaming, or display subjects where emitted light is the material", evidence: [brief, { plan: "brief.product_frame", has: [games-entertainment] }] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#COL-04", note: "fix pointer fundamentals/color.md" }
      - { kind: taxonomy, source: "anti-slop#color.5" }

  - id: color.gray-on-color
    class: quality
    domain: color
    layers: [render]
    severity: { create: gate, review: P1 }
    detect:
      render: { detector: contrast-wcag, params: { pair: neutral-text-on-chromatic-field, neutral_text_c: 0.03, chromatic_background_c: 0.08 } }
    why: A neutral gray text token placed on a saturated surface looks muddy and often fails contrast
    better: Use an on-color role tuned to the surface hue and test it on the actual surface
    keep_when:
      - { id: contract-pair, when: "the design contract defines this text color on this surface and the plan cites it", evidence: [design] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#COL-05", note: "fix pointer assets/color-and-contrast-cheatsheet.md" }
      - { kind: taxonomy, source: "anti-slop#color.6" }

  - id: color.warm-editorial
    class: default
    domain: color
    layers: [plan, render]
    severity: { create: gate, review: P3 }
    detect:
      plan: { detector: package-hit, params: { package: warm-editorial } }
      render: { detector: package-hit, params: { package: warm-editorial } }
    why: Warm cream, a clay or brass accent, and serif display arrive together as a category-generic premium package
    better: Earn warmth through the subject's materials, imagery, and brand evidence; resolve type and accent separately
    keep_when:
      - { id: subject-material, when: "food, publishing, craft, or material products whose type, imagery, grid, and copy come from the subject", evidence: [material, brief] }
    waiver: { scope: rule }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#COL-06", note: "fix pointer research/reference-and-inspiration-digging.md" }
      - { kind: taxonomy, source: "anti-slop#color.7" }

  - id: color.cream-base
    class: default
    domain: color
    layers: [plan, render]
    severity: { create: warn, review: P3 }
    detect:
      plan: { detector: plan-palette-region, path: "tokens.color.roles[?role=field].oklch", region: { space: oklch, bounds: { l: [0.9, 1.0], c: [0.008, 0.045], h: [55, 105] }, role: field } }
      render: { detector: palette-region, region: { space: oklch, bounds: { l: [0.9, 1.0], c: [0.008, 0.045], h: [55, 105] }, role: field } }
    packages: [warm-editorial]
    why: A warm cream field reads as quiet premium by default; alone it is weak, together with a clay accent and serif display it is a package
    better: Choose the field from the subject's paper, material, or imagery, and check it against the content colors
    keep_when:
      - { id: paper-material, when: "the subject's material is paper or unbleached stock", evidence: [material, brief] }
      - { id: brand-field, when: "an approved brand field", evidence: [design, brief] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#color.7", note: field part }
      - { kind: taxonomy, source: "aesthetics#warm-editorial-package" }

  - id: color.terracotta-accent
    class: default
    domain: color
    layers: [plan, render]
    severity: { create: gate, review: P3 }
    detect:
      plan: { detector: plan-palette-region, path: "tokens.color.roles[?role=identity|interaction].oklch", region: { space: oklch, bounds: { h: [30, 55], c: [0.08, 0.16] }, role: identity|interaction } }
      render:
        detector: palette-region
        region: { space: oklch, bounds: { h: [30, 55], c: [0.08, 0.16] }, role: identity|interaction }
        anchors:
          - { oklch: [0.608, 0.134, 40.5], source_class: authored }
    packages: [warm-editorial]
