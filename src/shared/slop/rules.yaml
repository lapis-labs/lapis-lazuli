  - id: color.inverted-dark-theme
    class: quality
    domain: color
    layers: [render, review]
    severity: { create: gate, review: P1 }
    detect:
      render: { detector: theme-pair, params: { check: literal-inversion } }
    why: The light palette is inverted literally for dark mode, so elevation, images, focus, and status colors look wrong
    better: Define dark-theme roles separately, with lighter surfaces for elevation and re-tuned status and focus colors
