      - { kind: method, source: "skill:assets/free-stock-asset-sources.md#read-this-before-using-the-matrix" }

  - id: rights.unapproved-mark-symbol
    class: quality
    domain: rights
    layers: [render]
    severity: { create: warn, review: P3 }
