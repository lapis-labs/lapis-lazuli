  # =============================================================== layout

  - id: layout.hero-before-priority
    class: default
    domain: layout
    layers: [render, review]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: symmetry, params: { section: hero, shapes: [centered, split-50-50], compare: plan-priority } }
      review: { detector: counterfactual-test }
    why: A centered or split hero shell was chosen before the proposition, evidence, action, and imagery were ranked
    better: Rank the opening's content first, then choose the conventional or unusual composition that expresses that order
    keep_when:
      - { id: priority-calls-for-shell, when: "the ranked content genuinely calls for the conventional shell", evidence: none }
    waiver: { scope: rule }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-01", note: "fix pointer layout/layout-decision-procedure.md" }
      - { kind: taxonomy, source: "anti-slop#layout.1" }

  - id: layout.split-hero
    class: default
    domain: layout
    layers: [render, review]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: opening-split, threshold: { object_area_share_min: 0.06, text_chars_max: 450 } }
    why: The first screen is divided in two, a column with the large heading, a short paragraph, and the buttons beside a column with an image, drawing, or product mock - the composition generated pages open with whatever the subject, so changing the subject changes a noun and nothing else
    better: Derive the opening from the content's own relation (the object and its state, a question and its answer, before and after), from the subject's own objects at their real arrangement, or from the sequence the visitor follows; the split stays only when it is what that derivation gives
    keep_when:
      - { id: won-comparison, when: "the split won a rendered comparison against an opening built from the same content without it", evidence: [composition] }
      - { id: contract-fixes-opening, when: "the design contract or the brief fixes a two-column opening and the plan says so", evidence: [design, brief] }
      - { id: evidentiary-capture, when: "the second column is a real capture of the subject itself - the product at work, the artwork, the object on sale - recorded in the asset ledger as evidence", evidence: [{ asset: { kind: [photo, screenshot, video], role: [evidentiary] } }] }
      - { id: task-in-opening, when: "the second column is the interface the visitor came to use, such as a booking panel or a search, and the first column says what it is for", evidence: none }
      - { id: record-beside-claim, when: "the second column is one record of the subject's real state, such as a restore point with its time, shown beside the claim it supports, and the plan's relationships between its contents name that pair", evidence: [{ plan: layout.procedure.relationships, present: true }] }
    waiver: { scope: rule }
    verify: review
    provenance:
      - { kind: measurement, source: "slop catalog 2026-10-04 split-hero", note: "a large heading on one side and an object on the other on 83 of 123 generated pages, 65 of 69 backup landing pages" }

  - id: layout.equal-siblings
    class: default
    domain: layout
    layers: [render]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: sibling-identity, params: { compare: plan-priority }, threshold: { similarity_max: 0.9 } }
    why: Feature or pricing cards get equal size and emphasis despite unequal content, flattening priority and recommendation
    better: Let comparison needs and content importance set count, span, order, and emphasis
    keep_when:
      - { id: peer-comparison, when: "a genuine peer comparison of equal items", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-02", note: "fix pointer layout/page-and-screen-archetypes.md" }
      - { kind: taxonomy, source: "anti-slop#layout.2" }

  - id: layout.pricing-trio-recommendation
    class: default
    domain: layout
    layers: [render]
    severity: { create: warn, review: P3 }
    detect:
      render: { detector: pricing-offers, list: recommendation_badges, params: { check: center-recommendation }, threshold: { emphasis_signals_max: 1 } }
    packages: [reassurance-landing]
    why: Three offerings with the middle one set apart as the pick arrive together, so the count and the recommendation come from the template instead of from the plans and who each fits
    better: Show the plans that exist, put the difference that decides between them first, and set one apart only for a reason the buyer can check
    keep_when:
      - { id: recommendation-has-a-reason, when: "the brief or the source names the recommended plan and why it fits, and the card says so", evidence: [brief, source] }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: measurement, source: "slop catalog 2026-10-04 pricing-trio-recommendation", note: "three offerings with an emphasized middle on 32 of 123 generated pages, 32 of 69 backup landing pages" }

  - id: layout.nested-cards
    class: default
    domain: layout
    layers: [render, review]
    severity: { create: gate, review: P2 }
    detect:
      render: { detector: card-nesting, threshold: { depth_max: 1 } }
    why: Containers stack border on border without distinct ownership or behavior, obscuring relationships
    better: Group with space, rules, or one meaningful surface
    keep_when:
      - { id: inner-role-surface, when: "an inner surface with its own role, such as a chart plot area inside a data card", evidence: none }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-03", note: "fix pointer assets/shape-line-and-layout-cheatsheet.md" }
      - { kind: taxonomy, source: "anti-slop#layout.4" }

  - id: layout.template-section-sequence
    class: default
    domain: layout
    layers: [plan, render, review]
    severity: { create: gate, review: P3 }
    detect:
      plan: { detector: plan-section-sequence, path: "layout.sections[*].archetype", params: { templates: [[hero, feature-grid, pricing, cta], [hero, logo-strip, feature-grid, testimonial, cta], [hero, feature-grid, testimonial, pricing, faq, cta], [hero, feature-grid, pricing, faq, cta]], max_distance: 0.34 } }
      render: { detector: section-sequence, params: { templates: [[hero, feature-grid, pricing, cta], [hero, logo-strip, feature-grid, testimonial, cta], [hero, feature-grid, testimonial, pricing, faq, cta], [hero, feature-grid, pricing, faq, cta]], max_distance: 0.34, min_sections: 4 } }
    packages: [reassurance-landing]
    why: Section order follows a category landing template, or unrelated sections repeat identical spans, instead of following the questions the reader brings
    better: Order sections by the reader's evaluation or task sequence, and vary structure when the content relation changes
    keep_when:
      - { id: reader-question-order, when: "the reader's questions genuinely follow that order", evidence: none }
    waiver: { scope: rule }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-04", note: "fix pointer layout/layout-decision-procedure.md" }
      - { kind: taxonomy, source: "anti-slop#layout.3" }
      - { kind: method, source: "memo:layout", note: archetype sequence and normalized edit distance }

  - id: layout.reassurance-landing
    class: default
    domain: layout
    layers: [render]
    severity: { create: warn, review: P3 }
    detect:
      render: { detector: package-hit, params: { package: reassurance-landing } }
    why: The landing page carries the category's reassurance set - its section order, a recommended middle plan, floating status panels, comfort wording, stacked trial terms, paired slogan headings, and a calm palette - so another subject would get the same page
    better: Rank what this subject's visitor must decide and prove, then give each of those its own structure, wording, and color from the subject's materials
    keep_when:
      - { id: reader-question-order, when: "the reader's questions genuinely follow that order and each member that hit is kept on its own case", evidence: none }
    waiver: { scope: rule }
    verify: review
    provenance:
      - { kind: measurement, source: "slop catalog 2026-10-04", note: "the SaaS reassurance package: sequence 68 of 69, paired CTAs 67, closing banner 66, trust strip 55, comfort wording 59, floating panels 52, recommended middle plan 32" }

  - id: layout.bento-filler
    class: default
    domain: layout
    layers: [render, review]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: grid-filler }
    why: A bento cell exists only to complete the grid shape, so empty modules advertise the template
    better: Give one cell to each meaningful item and vary weight by importance
    keep_when:
      - { id: data-cells, when: "cells of a calendar, matrix, seat map, or heatmap, where an empty cell is a real value", evidence: none }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-05", note: "fix pointer layout/layout-decision-procedure.md" }
      - { kind: taxonomy, source: "anti-slop#layout.10" }

  - id: layout.zigzag
    class: default
    domain: layout
    layers: [render]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: template-repetition, params: { pattern: alternating-media-text }, threshold: { repeats_max: 2 } }
    why: Image and text rows alternate by rule without a narrative reason, making distinct ideas look equivalent
    better: Consolidate related content or choose a structure that reflects each relationship
    keep_when:
      - { id: sequence-narrative, when: "a step-by-step narrative where alternation tracks the sequence", evidence: none }
    waiver: { scope: rule }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-06", note: "fix pointer layout/layout-decision-procedure.md" }
      - { kind: taxonomy, source: "anti-slop#layout.8" }

  - id: layout.decorative-numbering
    class: default
    domain: layout
    layers: [render, review]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: index-markers, params: { check: non-sequential } }
    why: Numbers on non-sequential sections imply progress, sequence, or record identity that does not exist
    better: Number only real steps, ranked items, or records; otherwise use descriptive headings
    keep_when:
      - { id: ordered-process, when: "a real ordered process", evidence: none }
      - { id: ranked-items, when: "ranked items", evidence: none }
      - { id: record-identifiers, when: "record identifiers", evidence: none }
    waiver: { scope: rule }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-07", note: "fix pointer quality/anti-slop.md" }
      - { kind: taxonomy, source: "anti-slop#layout.7" }

  - id: layout.heading-proximity
    class: quality
    domain: layout
    layers: [render]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: gap-proximity, params: { check: heading-above-vs-below } }
    why: The space above a heading is no larger than the space below it, so the heading attaches to the previous section
    better: Give headings more space above than below
    keep_when:
      - { id: repeating-rows, when: "repeating heading rows, such as an accordion or definition list, that keep one even gap by design", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-08", note: "fix pointer fundamentals/spacing-and-grids.md" }

  - id: layout.monotonous-spacing
    class: quality
    domain: layout
    layers: [render]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: gap-proximity, params: { check: monotonous }, threshold: { level_ratio_min: 1.5 } }
    why: The same gap at every hierarchy level makes siblings, groups, and sections hard to tell apart
    better: Order spacing as inside a group, then between siblings, then between groups, then between sections
    keep_when:
      - { id: contract-spacing, when: "the design contract fixes the spacing step for each level and the page follows it", evidence: [design] }
      - { id: single-level-surface, when: "a surface with one level of grouping, such as a log, a feed, or a plain table, so there are no groups or sections to tell apart", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-09", note: "fix pointer assets/spacing-and-grid-cheatsheet.md" }
      - { kind: taxonomy, source: "anti-slop#layout.14" }

  - id: layout.compact-overflow
    class: requirement
    domain: layout
    layers: [render]
    severity: { create: gate, review: P1 }
    detect:
      render: { detector: overflow-check, params: { viewports: [320, 390], checks: [page-horizontal-scroll, clipped-text, overlapping-controls] } }
    why: Fixed columns overflow at compact width, so text or controls clip, overlap, or force page scrolling
    better: Let columns collapse or reflow at compact widths; scroll only regions whose content needs two dimensions
    keep_when:
      - { id: scrolling-region, when: "data tables, maps, and diagrams that scroll inside their own region" }
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-10", note: "fix pointer layout/responsive-and-adaptive.md" }
      - { kind: method, source: "wcag22#1.4.10" }

  - id: layout.crowded-hero
    class: quality
    domain: layout
    layers: [render, review]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: section-inventory, params: { section: first, check: proof-in-hero } }
    why: A logo wall, metrics, and extra copy packed into the hero bury the proposition and the action
    better: Keep the opening to proposition and action; place real proof immediately after
    keep_when:
      - { id: brief-fixed-opening, when: "the brief fixes what the opening must carry, such as an event's date and place, and the plan lists those items", evidence: [brief] }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-11", note: "fix pointer product-types/marketing-and-landing.md" }
      - { kind: taxonomy, source: "anti-slop#layout.12" }

  - id: layout.edge-flush
    class: quality
    domain: layout
    layers: [render]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: edge-inset, params: { viewport: 390 }, threshold: { inset_px_min: 12 } }
    why: Cards touch the viewport or scroller edge without a safe inset, so content feels clipped and targets become awkward
    better: Add an intentional inset and a visible scroll affordance
    keep_when:
      - { id: full-bleed-media, when: "full-bleed media that is meant to run to the edge", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#LAY-12", note: "fix pointer assets/spacing-and-grid-cheatsheet.md" }
      - { kind: taxonomy, source: "anti-slop#layout.15" }

  - id: layout.split-heading
    class: quality
    domain: layout
    layers: [render]
    severity: { create: warn, review: P3 }
    detect:
      render: { detector: reading-path, params: { check: heading-separated-from-intro } }
    why: A heading sits in one column and its explanation in another, splitting a dependent reading path
    better: Keep a dependent heading and intro in one reading path
    keep_when:
      - { id: aligned-side-heading, when: "a side heading aligned to the first line of its text, with the heading before the text in reading order", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#layout.9" }

  - id: layout.decorative-opening-stack
    class: quality
    domain: layout
    layers: [render, review]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: section-inventory, params: { section: first, check: task-below-ornament } }
    why: A decorative opening stack pushes necessary context or the primary action out of reach
    better: Remove the unearned stack; keep deliberate long-form or immersive openings without enforcing a universal fold
    keep_when:
      - { id: immersive-opening, when: "a deliberate immersive or long-form opening", evidence: [brief, { plan: "direction.read.surface_mode", has: [experience] }] }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: taxonomy, source: "anti-slop#layout.11" }

  - id: layout.wrapped-navigation
    class: quality
    domain: layout
    layers: [render]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: text-metrics, params: { metric: rows, roles: [nav], viewport: 1440 }, threshold: { max: 1 } }
    why: Navigation wraps to two lines at common desktop widths, consuming the opening and destabilizing scanning
    better: Prioritize the items or change the navigation model
    keep_when:
      - { id: footer-link-groups, when: "footer or sitemap link groups, which sit at the end of the page rather than in the opening", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#layout.13" }

  - id: layout.occluded-text
    class: requirement
    domain: layout
    layers: [render]
    severity: { create: gate, review: P1 }
    detect:
      render: { detector: text-occlusion }
    why: A decorative layer covers text, hiding content
    better: Reorder the layers or reserve space for the text
    keep_when:
      - { id: legible-overlap, when: "display type that a layer overlaps partly while every word stays legible" }
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#layout.16" }

  - id: layout.card-everything
    class: default
    domain: layout
    layers: [render, review]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: card-nesting, params: { check: card-share }, threshold: { content_share_max: 0.8 } }
    why: Cards become the whole page structure, so every item is equal and enclosed
    better: Use rows, groups, sections, or bare content where they express the relation better
    keep_when:
      - { id: independent-objects, when: "collections of independent, comparable objects", evidence: none }
    waiver: { scope: rule }
    verify: review
    provenance:
      - { kind: taxonomy, source: "anti-slop#layout.18" }

  - id: layout.shrunk-desktop
    class: quality
    domain: layout
    layers: [render]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: responsive-structure, params: { compare: [390, 1440], check: scaled-only } }
    why: The compact layout is the desktop composition shrunk, treating responsive behavior as scale
    better: Define content order, collapse, and density for each section at each width
    keep_when:
      - { id: fixed-canvas, when: "a fixed-canvas surface, such as a map, diagram, slide, or spreadsheet, whose layout is the canvas itself", evidence: [brief] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#layout.20" }
      - { kind: method, source: "memo:layout" }

  - id: layout.symmetry-excess
    class: default
    domain: layout
    layers: [render]
    severity: { create: warn, review: P3 }
    detect:
      render: { detector: symmetry, threshold: { max: 0.85 } }
    why: Nearly everything centers on one axis, so the layout expresses no priority through placement
    better: Place content by reading order and weight; keep symmetry where the content is genuinely balanced
    keep_when:
      - { id: ceremonial-surface, when: "ceremonial, poster-like, or single-message surfaces", evidence: [brief] }
    waiver: { scope: rule }
    verify: static
    provenance:
      - { kind: method, source: "memo:layout" }

  - id: layout.missing-signature
    class: quality
    domain: layout
    layers: [plan, render]
    severity: { create: warn, review: P2 }
    detect:
      plan: { detector: plan-missing, path: layout.signature, params: { modes: [create] } }
      render: { detector: signature-present }
    why: No element unique to this subject and task is planned or rendered, so the surface could belong to any product
    better: Name one signature element drawn from world_materials in the plan and build it
    keep_when:
      - { id: repair-scope, when: "a repair plan (mode repair) whose scope leaves the visual identity untouched", evidence: [{ plan: "mode", has: [repair] }] }
    waiver: { scope: rule }
    verify: static
    provenance:
      - { kind: method, source: "memo:layout", note: signature absence against the plan }

  - id: layout.unanchored-lever
    class: quality
    domain: layout
    layers: [plan, review]
    severity: { create: gate, review: P1 }
    detect:
      plan: { detector: plan-anchored-text, path: "direction.levers[*]", params: { anchors: [world_materials, layout.signature], modes: [create], empty: hit-unless-operate-only, skip_style_frames: [inherit] } }
      review: { detector: counterfactual-test }
    why: A lever that names no material of this subject (clean, modern, bold type, more whitespace) would fit any product, so the direction stays a default
    better: Write each lever as one sentence - the lever, what visibly changes, and the world material it comes from, named as world_materials writes it
    keep_when:
      - { id: form-fixed-by-contract-or-brief, when: "the contract or the brief fixes the form and the plan says so", evidence: [design, brief] }
    waiver: { scope: rule }
    verify: static
    provenance:
      - { kind: method, source: "memo:structure", note: plans whose levers were adjectives passed every plan check (pilot of 2026-10-01) }

  - id: layout.typical-composition
    class: default
    domain: layout
    layers: [render]
    severity: { create: warn, review: P3 }
    detect:
      render: { detector: typicality-distance, params: { corpus: defaults, features: [section_sequence, archetypes, symmetry, density] }, threshold: { distance_min: 0.2 } }
    why: The composition sits close to the current defaults corpus across sequence, archetypes, symmetry, and density
    better: Revisit the content ranking and signature; change the structure where the content relation differs
    keep_when:
      - { id: content-fixed-structure, when: "the content has a structure of its own, such as a form, a legal text, a changelog, or a data table", evidence: none }
      - { id: form-fixed-by-contract-or-brief, when: "the contract or the brief fixes the composition and the plan says so", evidence: [design, brief] }
    waiver: { scope: rule }
    verify: static
    provenance:
      - { kind: method, source: "memo:layout", note: typicality vector }

  # =============================================================== component

  - id: component.emoji-icons
    class: default
    domain: component
    layers: [source, render]
    severity: { create: gate, review: P2 }
    detect:
      source: { detector: source-pattern, params: { patterns: ['\p{Extended_Pictographic}', '[\u2190-\u21FF\u2700-\u27BF]'], scope: icon-slots } }
      render: { detector: icon-inventory, params: { check: emoji } }
    why: Emoji or Unicode glyphs serve as product icons, so weight and style vary by operating system
    better: Use one maintained icon family and label icon-only buttons
    keep_when:
      - { id: emoji-content, when: "user-generated content, reactions, or a brand voice built on emoji", evidence: [brief] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#CMP-01", note: "fix pointer fundamentals/iconography-and-imagery.md" }
      - { kind: taxonomy, source: "anti-slop#components.1" }

  - id: component.hand-drawn-icons
    class: default
    domain: component
    layers: [source, render]
    severity: { create: gate, review: P3 }
    detect:
      source: { detector: source-ast, params: { query: inline-svg-path-for-standard-action } }
      render: { detector: icon-inventory, params: { check: hand-authored-standard-actions } }
    why: Hand-authored SVG paths for standard actions reinvent tested geometry and drift from the library icons beside them
    better: Use the project icon family for standard actions; draw custom icons only for subject-specific concepts
    keep_when:
      - { id: uncovered-concept, when: "custom icons for concepts the family does not cover, drawn on the family's grid and stroke", evidence: [{ asset: { kind: [icon-set], origin: [own, commissioned] } }] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#CMP-02", note: "fix pointer fundamentals/iconography-and-imagery.md" }
      - { kind: taxonomy, source: "anti-slop#components.2" }

  - id: component.mixed-icon-families
    class: quality
    domain: component
    layers: [source, render]
    severity: { create: warn, review: P2 }
    detect:
      source: { detector: dependency-check, params: { check: icon-packages } }
      render: { detector: icon-inventory, params: { check: families }, threshold: { families_max: 1 } }
    why: Two or more icon families on one surface disagree in stroke, fill, optical size, and grid
    better: Normalize to one family, weight, grid, and alignment
    keep_when:
      - { id: brand-marks, when: "third-party brand marks beside the interface family, which cannot be redrawn in its style", evidence: [{ asset: { kind: [mark] } }] }
      - { id: content-glyph-set, when: "a glyph set that is content rather than interface chrome, such as country flags or file-type badges", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#CMP-03", note: "fix pointer fundamentals/iconography-and-imagery.md" }
      - { kind: taxonomy, source: "anti-slop#components.3" }

  - id: component.fake-app-window
    class: default
    domain: component
    layers: [render, review]
    severity: { create: gate, review: P2 }
    detect:
      render: { detector: decorative-dom, params: { kind: app-window } }
    why: Decorative divs mimic an app window or data, replacing real product evidence with a facsimile
    better: Use a real capture or a clearly labeled illustrative slot
    keep_when:
      - { id: labeled-illustration, when: "a labeled illustration where no product exists yet", evidence: [brief] }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#CMP-04", note: "fix pointer quality/anti-slop.md" }
      - { kind: taxonomy, source: "anti-slop#components.4" }

  - id: component.floating-chips
    class: default
    domain: component
    layers: [render, review]
    severity: { create: warn, review: P3 }
    detect:
      render: { detector: decorative-dom, params: { kind: floating-chips } }
    packages: [reassurance-landing]
    why: Short status, file, and proof panels float over the edge of the opening's main object, so small reassurances decorate it instead of one real state sitting beside what it describes
    better: Show one coherent demonstration with each state beside the object it belongs to, or leave the panels out
    keep_when:
      - { id: annotated-diagram, when: "labeled callouts that explain parts of the object, each pointing at the part it names", evidence: none }
      - { id: captured-state, when: "the panels are live or captured state of a working product shown in the opening", evidence: none }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: measurement, source: "slop catalog 2026-10-04 hero-floating-cards", note: "detached chips around the hero object on 54 of 123 generated pages, 52 of 69 backup landing pages" }

  - id: component.generic-spinner
    class: quality
    domain: component
    layers: [behavior]
    severity: { create: warn, review: P2 }
    detect:
      behavior: { detector: state-coverage, params: { state: loading, check: indicator-kind }, threshold: { spinner_shown_ms_max: 1000 } }
    why: One spinner for every wait ignores duration and layout and gives no sense of structure or preserved task
    better: Choose by wait - a delayed indicator, skeleton, progress, or inline status
    keep_when:
      - { id: handoff-wait, when: "a hand-off wait with no progress to report and no content structure to preview, such as an external payment or sign-in redirect, with text that names what is happening", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "checklist#CMP-07", note: "fix pointer assets/component-states-checklist.md" }
      - { kind: taxonomy, source: "anti-slop#components.5" }

  - id: component.library-default-theme
    class: default
    domain: component
    layers: [render]
    severity: { create: warn, review: P3 }
    detect:
      render: { detector: typicality-distance, params: { corpus: library-default-themes, features: [type, radius, spacing, color-roles, states] }, threshold: { distance_min: 0.15 } }
    why: The component library's starter styling has become the brand even though its behavior is sound
    better: Keep the useful primitives, then define type, color roles, radius, spacing, states, and composition from the product
    keep_when:
      - { id: adopted-library-system, when: "internal tools where the library's system is the adopted contract", evidence: [design, brief] }
    waiver: { scope: rule }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#components.8" }

  - id: component.unlabeled-input
    class: requirement
    domain: component
    layers: [source, render, behavior]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: source-ast, params: { query: input-without-associated-label } }
      render: { detector: accessibility-tree, params: { check: input-label } }
      behavior: { detector: accessibility-tree, params: { check: label-persists-after-input } }
    why: An input has no programmatic label, or its placeholder is the only label and disappears once the user types
    better: Associate a visible label with each field, with helper and error text linked to it
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#CPY-06", note: "fix pointer assets/accessibility-cheatsheet.md" }
      - { kind: taxonomy, source: "anti-slop#code.3" }
      - { kind: method, source: "wcag22#1.3.1" }
      - { kind: method, source: "wcag22#3.3.2" }

  - id: component.unnamed-icon-button
    class: requirement
    domain: component
    layers: [render]
    severity: { create: gate, review: P1 }
    detect:
      render: { detector: accessibility-tree, params: { check: control-name, roles: [button, link] } }
    why: An icon-only control has no accessible name, so its action is undiscoverable with assistive technology
    better: Give the control a visible or programmatic name that states the action
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: taxonomy, source: "anti-slop#code.4" }
      - { kind: method, source: "wcag22#4.1.2" }

  - id: component.small-target
    class: requirement
    domain: component
    layers: [render]
    severity: { create: gate, review: P2 }
    detect:
      render: { detector: target-size, params: { roles: [button, link, input] }, threshold: { size_min: 24 } }
    why: A pointer target is smaller than 24 by 24 CSS px and has too little clear space around it, so it is easy to miss or to hit a neighbor
    better: Make targets at least 24 px, or keep clear space around small ones; touch-first surfaces are easier at 44 px
    keep_when:
      - { id: inline-link, when: "links inside a sentence" }
      - { id: browser-default-size, when: "controls left at the size the browser gives them" }
      - { id: equivalent-full-size-control, when: "a control whose function a full-size control on the same page also offers" }
      - { id: size-carries-information, when: "targets whose size carries information, such as map pins at their true positions" }
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "wcag22#2.5.8" }
      - { kind: method, source: "skill:assets/accessibility-cheatsheet.md#platform-floors" }

  # =============================================================== ux

  - id: ux.routine-modal
    class: quality
    domain: ux
    layers: [behavior, review]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: dialog-usage, params: { check: routine-navigation-or-long-task } }
    why: A modal handles routine navigation or a long task, interrupting context without a protected-focus need
    better: Use a page, sheet, inline edit, or disclosure as the task requires
    keep_when:
      - { id: destructive-confirmation, when: "confirmation of a destructive action", evidence: none }
      - { id: blocking-short-task, when: "a short task that must block the rest of the screen", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "checklist#CMP-08", note: "fix pointer ux-methodology/interaction-design.md" }
      - { kind: taxonomy, source: "anti-slop#layout.17" }

  - id: ux.dead-control
    class: requirement
    domain: ux
    layers: [behavior]
    severity:
      create: gate
      review: P1
      adjust:
        - { when: "the primary task is blocked", review: P0 }
    detect:
      behavior: { detector: control-has-effect, params: { also: console-errors } }
    why: An element that looks interactive does nothing, or a runtime error or cosmetic result stands in for the promised state or data outcome
    better: Exercise the consequential path and make the control produce the state or data it promises
    keep_when:
      - { id: prototype-scope, when: "a local prototype whose stated scope excludes the backend, where the control says so" }
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "checklist#CODE-09", note: "P0 when the primary task is blocked; fix pointer production/production-readiness-checklist.md" }
      - { kind: taxonomy, source: "anti-slop#components.10", note: outcome part }

  - id: ux.missing-states
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: state-coverage, params: { states: [empty, loading, error, offline, success], relevance: plan-and-task } }
    why: A polished resting frame hides missing states that the task can reach - empty, loading, error, offline, success, or recovery
    better: Design and exercise every relevant state, including recovery
    keep_when:
      - { id: unreachable-state, when: "states the surface cannot reach, such as offline on a static page" }
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "anti-slop#components.10", note: states part }
      - { kind: method, source: "memo:structure", note: missing states are requirement rules }

  # ----------------------------------------------------- ux: deceptive and coercive patterns (behavior)
  # These rules read the behavior session (behavior/session.schema.yaml). A finding names a mechanism;
  # `regulation` provenance records where a rule meets a law. Neither is a compliance determination.

  - id: ux.preselected-option
    class: requirement
    domain: ux
    layers: [behavior]
    severity:
      create: gate
      review: P1
      adjust:
        - { when: "the preselected option adds a charge", review: P0 }
    detect:
      behavior: { detector: choice-analysis, params: { check: preselection, purposes: [consent, marketing, permission-preprompt, add-on, upsell, plan], field_purposes: [consent, marketing, add-on] } }
    packages: [subscription-trap, consent-steering]
    why: An optional extra, a consent, or a costlier plan is already selected, so doing nothing becomes agreement
    better: Start optional choices unselected and let the user opt in; show plans side by side without a default pick
    keep_when:
      - { id: free-reversible-default, when: "a free, reversible default that is neither a consent nor a charge, such as standard delivery" }
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "deceptive-design#preselection" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#consent-design" }
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#defaults-and-recommendations-must-be-honest" }
      - { kind: regulation, source: "law:kr/ecommerce-act#21-2.1.2", note: "pre-selected options (특정옵션의 사전선택), in force 2025-02-14" }
      - { kind: regulation, source: "law:eu/crd#22", note: "extra payments need express consent, not default options" }

  - id: ux.drip-pricing
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: flow-analysis, params: { check: drip, kinds: [primary, purchase, subscribe] } }
    why: Required fees, shipping, or taxes first appear, or the price rises or loses a discount, after the price the user compared, so the price shown is not the price paid
    better: Show the total the user must pay where the price first appears, or name each required charge there as still to be calculated, and keep it unless the user changes something
    keep_when:
      - { id: pending-input-charge, when: "a charge that depends on input given later, such as a delivery address, named as pending where the price first appears" }
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "deceptive-design#hidden-costs" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#pricing-subscriptions-and-checkout" }
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#order-model" }
      - { kind: regulation, source: "law:kr/ecommerce-act#21-2.1.1", note: "drip pricing (순차공개 가격책정), in force 2025-02-14" }
      - { kind: regulation, source: "law:eu/crd#6.1.e", note: "total price including taxes and charges" }
      - { kind: taxonomy, source: "deceptive-design#bait-and-switch", note: "price rises and removed discounts after the first price" }

  - id: ux.sneak-into-basket
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P0 }
    detect:
      behavior: { detector: flow-analysis, params: { check: sneak } }
    why: An item or service enters the cart without the user adding it
    better: Add only what the user chose; offer extras as separate choices that start unselected
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "deceptive-design#sneaking" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#persuasion-versus-deception" }
      - { kind: method, source: "skill:references/product-types/e-commerce.md#cart-and-checkout-boundary" }

  - id: ux.hidden-subscription
    class: requirement
    domain: ux
    layers: [behavior]
    severity:
      create: gate
      review: P1
      adjust:
        - { when: "a free or discounted trial converts to a paid plan", review: P0 }
    detect:
      behavior: { detector: flow-analysis, params: { check: terms, kinds: [primary, purchase, subscribe] } }
    packages: [subscription-trap]
    why: A recurring charge's renewal price, cadence, trial end, or way to cancel is missing or out of view when the user commits
    better: Put the renewal price, cadence, trial end date, and how to cancel next to the commit control, readable without expanding anything
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "deceptive-design#hidden-subscription" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#pricing-subscriptions-and-checkout" }
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#synthetic-worked-example-subscription-checkout" }
      - { kind: regulation, source: "law:kr/ecommerce-act#13.6", note: "hidden renewal (숨은갱신); the 30-day advance consent before a price rise or paid conversion happens outside the page and is not observed" }
      - { kind: regulation, source: "law:us/rosca#4", note: "15 U.S.C. 8403: material terms before billing information, express informed consent, simple cancellation" }

  - id: ux.obstructed-exit
    class: requirement
    domain: ux
    layers: [behavior]
    severity:
      create: gate
      review: P1
      adjust:
        - { when: "leaving cannot be finished without contacting the business", review: P0 }
    detect:
      behavior: { detector: flow-analysis, params: { check: exit, kinds: [cancel-subscription, delete-account, withdraw-consent, unsubscribe], channel: self-serve }, threshold: { extra_steps_max: 2, extra_interactions_max: 3, offers_max: 1, blocking_offers_max: 0 } }
    packages: [subscription-trap]
    why: Leaving takes far more effort than joining, or cannot be finished - repeated offers, a required call or chat, a hidden final action, or reauthentication the join did not need
    better: Keep a direct, visible exit in the channel the user joined through; beyond joining's effort, allow one consequence review and one confirmation, offer at most one alternative that does not block, and end with a receipt
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "deceptive-design#hard-to-cancel" }
      - { kind: taxonomy, source: "deceptive-design#obstruction" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#cancellation-and-deletion" }
      - { kind: method, source: "skill:references/ux-methodology/adoption-and-account-lifecycle.md#make-retention-user-chosen" }
      - { kind: method, source: "skill:references/ux-methodology/adoption-and-account-lifecycle.md#specify-an-honest-transition" }
      - { kind: regulation, source: "law:kr/ecommerce-act#21-2.1.4", note: "obstructing cancellation or withdrawal (취소·탈퇴 등의 방해)" }
      - { kind: regulation, source: "law:eu/dsa#25.3.c", note: "termination no harder than subscribing (online platforms)" }
      - { kind: regulation, source: "law:us/rosca#4", note: "simple mechanism to stop recurring charges; the FTC negative option rule was vacated in July 2025 and is back at the ANPRM stage (March 2026)" }

  - id: ux.false-hierarchy
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P2 }
    detect:
      behavior: { detector: choice-analysis, params: { check: prominence, purposes: [consent, marketing, permission-preprompt, upsell, retention, add-on] }, threshold: { prominence_ratio_max: 4 } }
    packages: [pressure-selling, consent-steering]
    why: The option that serves the business far outweighs the refusal - a large filled button against small, faint, or unstyled text
    better: Give accepting and declining comparable size, contrast, and styling, and let the labels explain the difference
    keep_when:
      - { id: no-favored-side, when: "choices without a business-favored side, such as confirming the user's own action" }
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "deceptive-design#visual-interference" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#persuasion-versus-deception" }
      - { kind: regulation, source: "law:kr/ecommerce-act#21-2.1.3", note: "false hierarchy (잘못된 계층구조): marked differences in size, shape, or color between options" }
      - { kind: regulation, source: "law:eu/dsa#25.3.a", note: "more prominence to certain choices" }

  - id: ux.asymmetric-decline
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: choice-analysis, params: { check: decline-effort, purposes: [consent, marketing, permission-preprompt, upsell, add-on] }, threshold: { decline_extra_interactions_max: 0 } }
    packages: [consent-steering]
    why: Accepting takes one action while declining is missing or takes more, such as a settings page of switches to turn off
    better: Offer the refusal on the same layer as the acceptance, completed in as few actions
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#consent-design" }
      - { kind: taxonomy, source: "deceptive-design#obstruction" }
      - { kind: regulation, source: "law:eu/edpb-cookie-banner-taskforce-2023", note: "a first layer without a reject option was widely found to infringe; report adopted 2023-01-17, no newer EDPB cookie-banner guidance as of 2026-09-27" }

  - id: ux.nagging
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P2 }
    detect:
      behavior: { detector: dialog-usage, params: { check: recurrence, purposes: [consent, marketing, permission-preprompt, upsell, retention, announcement, other] }, threshold: { reasks_after_decline_max: 0 } }
    packages: [subscription-trap, pressure-selling, consent-steering]
    why: A request the user declined comes back during the same visit, pressing them to change the answer
    better: Respect the refusal and let the user change it later from a stable place such as settings
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "deceptive-design#nagging" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#notifications-and-engagement" }
      - { kind: regulation, source: "law:kr/ecommerce-act#21-2.1.5", note: "repeated interference (반복간섭): a repeated request is allowed only when the first one already offered not to ask again for 7 days or more; this rule is stricter within one visit" }
      - { kind: regulation, source: "law:eu/dsa#25.3.b", note: "repeatedly requesting a choice already made, especially by pop-ups" }

  - id: ux.false-urgency
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: urgency-integrity, params: { checks: [resets, drifts, expiry, unbacked], unbacked_kinds: [stock, demand, activity] } }
    packages: [pressure-selling]
    why: A countdown restarts on reload or runs out with no consequence, or a stock count, a viewer count, or a purchase notice has no source or changes with no cause, inventing pressure to decide
    better: Show only real deadlines, stock, and activity with their basis, such as the closing time or when the count was updated, or show none
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "deceptive-design#fake-urgency" }
      - { kind: taxonomy, source: "deceptive-design#fake-scarcity" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#urgency-scarcity-and-social-proof" }
      - { kind: method, source: "skill:references/product-types/e-commerce.md#content-and-copy" }
      - { kind: regulation, source: "law:eu/ucpd#annex-i.7", note: "falsely stating an offer is available only for a very limited time" }

  - id: ux.forced-action
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: flow-analysis, params: { check: gates, gates: [account, optional-consent, permission, share, install, survey] } }
    why: The flow demands something the goal does not need - an account, an optional consent, a permission, a share, an app install, or a survey - before the user can continue
    better: Ask only for what the task needs; offer a guest path and make optional steps skippable
    keep_when:
      - { id: listed-prerequisite, when: "prerequisites the plan flow lists under requires with a reason, such as an account for a service that keeps the user's data" }
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "deceptive-design#forced-action" }
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#guest-checkout" }
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#block-only-on-a-real-prerequisite" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#toss-ecosystem-example", note: "no exit other than the partner's call to action" }

  - id: ux.confirmshaming
    class: requirement
    domain: ux
    layers: [behavior, review]
    severity: { create: gate, review: P2 }
    detect:
      behavior: { detector: choice-analysis, family: confirmshaming, params: { check: copy, kinds: [decline, dismiss] } }
    packages: [pressure-selling]
    why: The refusal is worded to shame, guilt, or frighten the user into accepting
    better: Name the plain outcome of declining, such as not now or continue without the discount
    waiver: { scope: none }
    verify: review
    provenance:
      - { kind: taxonomy, source: "deceptive-design#confirmshaming" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#worked-example-newsletter-consent" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#cancellation-and-deletion" }

  - id: ux.back-trap
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: history-behavior, params: { check: back-trap }, threshold: { presses_to_leave_max: 1 } }
    why: Browser Back does not leave the page because the page adds history entries or reopens a sheet to hold the user
    better: Let Back leave the page; one Back may first close an overlay the user opened
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#toss-ecosystem-example", note: "a sheet that blocks back navigation to retain the user" }
      - { kind: taxonomy, source: "deceptive-design#obstruction" }

  # ----------------------------------------------------- ux: behavioral accessibility

  - id: ux.keyboard-trap
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P0 }
    detect:
      behavior: { detector: keyboard-traversal, params: { check: trap } }
    why: Keyboard focus enters a region and cannot leave it with Tab, Shift+Tab, or Escape, so the rest of the page is out of reach
    better: Let focus move on with standard keys; contain focus only inside an open modal that Escape or a close control dismisses
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#2.1.2" }
      - { kind: method, source: "skill:assets/accessibility-cheatsheet.md#keyboard-walk" }

  - id: ux.keyboard-inoperable
    class: requirement
    domain: ux
    layers: [behavior]
    severity:
      create: gate
      review: P1
      adjust:
        - { when: "the primary task is blocked", review: P0 }
    detect:
      behavior: { detector: keyboard-traversal, params: { check: operable, semantic: true } }
    why: A control that works with a pointer cannot be reached or activated from the keyboard
    better: Keep controls in the tab order and make Enter and Space do what a click does
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#2.1.1" }
      - { kind: method, source: "skill:assets/component-states-checklist.md#shared-state-floor" }

  - id: ux.focus-order
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P2 }
    detect:
      behavior: { detector: keyboard-traversal, params: { check: order }, threshold: { order_inversions_max: 0 } }
    why: Tab order jumps backward or across the layout, so keyboard users lose their place
    better: Order the DOM in visual reading order and avoid positive tabindex
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#2.4.3" }
      - { kind: method, source: "wcag22#1.3.2" }

  - id: ux.no-bypass
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: keyboard-bypass, params: { check: bypass }, threshold: { repeated_stops_max: 1 } }
    why: Every page opens with the same run of navigation stops and offers no way past it, so keyboard and screen reader users walk the whole block on each page
    better: Mark the primary content with a main landmark, start it with a heading, and add a skip link as the first stop
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#2.4.1" }
      - { kind: method, source: "skill:references/platforms/web.md#landmarks-headings-and-reading-order" }

  - id: ux.skip-link-missing
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: warn, review: P2 }
    detect:
      behavior: { detector: keyboard-bypass, params: { check: skip-link }, threshold: { repeated_stops_max: 5 } }
    why: Sighted keyboard users tab through a long repeated header on every page, or a skip link is present but leaves focus where it was
    better: Make the first stop a skip link that becomes visible on focus and moves focus into the main content
    keep_when:
      - { id: short-header, when: "a short header whose few stops are the page's main task", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#2.4.1", note: "landmarks and headings meet the criterion but help only users of assistive technology; this rule asks for a skip link" }
      - { kind: method, source: "skill:references/fundamentals/accessibility.md#keyboard-interaction" }

  - id: ux.focus-obscured
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: keyboard-traversal, params: { check: obscured }, threshold: { obscured_share_max: 0.99 } }
    why: The focused control is entirely hidden behind a sticky header, a banner, or a fixed bar
    better: Reserve room with scroll padding or move fixed content so focused elements stay in view
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#2.4.11" }
      - { kind: method, source: "skill:references/ux-methodology/user-messages-and-feedback.md#actions-pending-state-and-reachability" }

  - id: ux.dialog-focus
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: dialog-usage, params: { check: focus-management } }
    why: A dialog opens without taking focus, lets focus slip behind it, cannot be closed with Escape or a visible control, drops focus when it closes, or starts a destructive confirmation on the destructive button
    better: Move focus into the dialog, keep it there while a modal is open, close on Escape and a visible control, return focus to the control that opened it, and start confirmations on the safe choice
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "apg#dialog-modal" }
      - { kind: method, source: "wcag22#2.4.3" }
      - { kind: method, source: "wcag22#2.1.2" }
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#dialogs-sheets-and-interruption" }
      - { kind: method, source: "skill:assets/component-states-checklist.md#dialog-and-sheet" }

  - id: ux.unexpected-context-change
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: context-change, params: { events: [focus, input] } }
    why: Focusing a control or changing a value navigates, submits, or opens a window without the user asking
    better: Change context only on an explicit action such as a button, or say beforehand what the change will do
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#3.2.1" }
      - { kind: method, source: "wcag22#3.2.2" }

  - id: ux.timeout-without-warning
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: time-limit, params: { exempt_over_s: 72000 }, threshold: { warn_lead_s_min: 20, extensions_min: 10 } }
    why: A session or hold expires without warning or a simple way to extend it, and entered work can be lost
    better: Warn before the limit with at least 20 seconds to extend in one action, or remove the limit
    keep_when:
      - { id: essential-limit, when: "limits that are essential or tied to a real-time event, such as an auction closing" }
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#2.2.1" }
      - { kind: method, source: "skill:references/ux-methodology/system-state-and-recovery.md#design-interruption-navigation-and-resume-together" }

  - id: ux.gesture-only
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: pointer-alternatives, params: { check: gesture, kinds: [drag, path-gesture, multipoint] } }
    why: Reordering, sliding, swiping, or zooming works only with a drag or a multi-finger gesture
    better: Offer a single-tap alternative such as move buttons, a menu, or a value input, alongside keyboard support
    keep_when:
      - { id: gesture-is-task, when: "gestures that are the task itself, such as freehand drawing" }
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#2.5.1" }
      - { kind: method, source: "wcag22#2.5.7" }
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#gestures-and-direct-manipulation" }

  - id: ux.hover-content
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P2 }
    detect:
      behavior: { detector: pointer-alternatives, params: { check: hover-content } }
    why: Content that appears on hover cannot be reached with keyboard focus, dismissed without moving the pointer, or hovered without disappearing
    better: Reveal the same content on focus, close it with Escape, and keep it open while the pointer is over it
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#1.4.13" }
      - { kind: method, source: "wcag22#2.1.1" }
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#mandatory-state-inventory" }
      - { kind: method, source: "skill:assets/component-states-checklist.md#menu-popover-tooltip" }

  - id: ux.status-not-announced
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P2 }
    detect:
      behavior: { detector: status-announcement, params: { sources: [controls, commits, states] } }
    why: A result such as an added item, a saved change, or a new result count appears on screen but reaches neither a live region nor focus
    better: Put status text in a polite live region, and move focus only when the user must act on the result
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#4.1.3" }
      - { kind: method, source: "skill:references/ux-methodology/user-messages-and-feedback.md#announcement-is-not-focus-movement" }

  - id: ux.input-error-unidentified
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: form-behavior, params: { check: error-identification } }
    why: After a failed submit the error shows only as a color or icon, is not tied to its field, or is neither announced nor focused
    better: Describe each error in text next to its field, link it programmatically, and move focus to the first error or a summary
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#3.3.1" }
      - { kind: method, source: "wcag22#3.3.3" }
      - { kind: method, source: "wcag22#1.4.1" }
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#error-language" }
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#accessibility" }

  - id: ux.redundant-entry
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P2 }
    detect:
      behavior: { detector: form-behavior, params: { check: redundant-entry } }
    why: A later step asks again for information the user already gave, without prefilling it or offering to reuse it
    better: Carry values forward within the flow, or offer a same-as option
    keep_when:
      - { id: security-reentry, when: "re-entry that protects security, such as confirming a new password" }
      - { id: expired-information, when: "information that is no longer valid, such as an expired code" }
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#3.3.7" }
      - { kind: method, source: "kwcag22#7.3.4" }
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#validation-and-error-recovery" }

  - id: ux.inaccessible-auth
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: form-behavior, params: { check: auth } }
    why: Signing in needs a puzzle, a transcription, or a memory test with no alternative, or blocks pasting into password and code fields
    better: Allow paste and password managers, and offer a way to sign in without a cognitive test
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#3.3.8" }
      - { kind: method, source: "kwcag22#7.3.3" }
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#accessibility" }

  - id: ux.autoplay-audio
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: media-autoplay, threshold: { audible_seconds_max: 3 } }
    why: Sound plays by itself with no way to pause or mute it, drowning out screen readers and startling people
    better: Start media muted or on request, with pause and volume controls
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#1.4.2" }
      - { kind: method, source: "skill:references/product-types/e-commerce.md#imagery-and-product-evidence" }

  - id: ux.no-review-before-commit
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: flow-analysis, params: { check: review, kinds: [primary, purchase, subscribe] } }
    why: A purchase or other binding commitment is made in one action, with no step that shows the total and the choices and lets the user change them, and no way to undo it
    better: Show a review with the total, items, and terms and a way to edit them before the commit, or let the user cancel it afterward
    keep_when:
      - { id: no-money-or-legal-effect, when: "commitments with no money or legal effect, such as saving a draft" }
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#3.3.4" }
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#error-prevention-before-error-messages" }
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#checkout" }

  # ----------------------------------------------------- ux: state, recovery, and friction

  - id: ux.duplicate-submit
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: commit-safety, params: { check: duplicate }, threshold: { effects_max: 1 } }
    why: Two quick activations, a retry after an unknown outcome, or an automatic resend creates a second order, charge, or record
    better: Show a pending state that blocks repeats, send an idempotency key, and check an unknown outcome before offering a retry
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/ux-methodology/system-state-and-recovery.md#make-retry-a-contract-not-encouragement" }
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#timing" }
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#worked-example-invite-teammates" }

  - id: ux.false-status
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: commit-safety, params: { check: status } }
    why: The page says done while the change failed or its outcome is unknown, or says failed when the change may already have happened
    better: Report only what the backend confirmed; name an unknown outcome and check its status before offering a repeat
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/ux-methodology/system-state-and-recovery.md#model-outcomes-before-choosing-messages" }
      - { kind: method, source: "skill:references/ux-methodology/system-state-and-recovery.md#use-a-precise-visible-vocabulary" }
      - { kind: method, source: "skill:references/ux-methodology/system-state-and-recovery.md#choose-optimistic-or-pessimistic-commitment-by-harm" }

  - id: ux.lost-input
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: form-behavior, params: { check: lost-input, after: [invalid-submit, server-error, reload, back, reauth] } }
    why: Values the user entered disappear after a validation error, a failed request, Back, or signing in again
    better: Keep entered values through errors and navigation within the flow; clear only secrets, and say why
    keep_when:
      - { id: cleared-secret, when: "a secret or single-use value, such as a password, card number, or one-time code, is cleared on purpose and the form says why", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#validation-and-error-recovery" }
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#typical-failures" }
      - { kind: method, source: "skill:references/ux-methodology/system-state-and-recovery.md#design-interruption-navigation-and-resume-together" }
      - { kind: method, source: "skill:references/ux-methodology/user-messages-and-feedback.md#durability-input-and-recovery" }

  - id: ux.destructive-without-undo
    class: requirement
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: commit-safety, params: { check: undo } }
    why: A destructive action runs with neither a confirmation that names what is lost nor a working undo, or its undo does not bring the object back
    better: Confirm irreversible actions with the object's name and consequence, or act at once with an undo that restores it
    keep_when:
      - { id: one-step-recreate, when: "removing something the user can recreate in one step, such as a search filter" }
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: method, source: "wcag22#3.3.4", note: "deleting user-controllable data" }
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#add-friction-in-proportion-to-consequence" }
      - { kind: method, source: "skill:references/ux-methodology/system-state-and-recovery.md#define-undo-history-and-restore-separately" }

  - id: ux.dead-end
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: flow-analysis, params: { check: dead-end } }
    why: A step offers no way forward or back other than the browser, including an error with no recovery action
    better: Give every state a next action - retry, edit, go back, or get help - and keep the user's place
    keep_when:
      - { id: host-owns-navigation, when: "the surface runs inside a host that owns navigation, such as an embedded widget or webview, and brief.platform lists embedded", evidence: [{ plan: "brief.platform", has: [embedded] }] }
      - { id: kiosk-auto-reset, when: "a kiosk or signage screen that returns to its start by itself after a visible countdown", evidence: [brief, { plan: "brief.platform", has: [embedded] }] }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/ux-methodology/user-flow-design-and-testing.md#5-add-failure-and-recovery-before-polishing" }
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#model-intent-action-state-and-recovery" }

  - id: ux.permission-on-load
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: permission-requests, params: { check: without-gesture, apis: [notifications, geolocation, camera, microphone] } }
    packages: [consent-steering]
    why: The browser asks for notifications, location, or the camera before the user has done anything that needs it, so the request has no context and a refusal sticks
    better: Ask when a feature needs the permission, from a user action, after saying why
    keep_when:
      - { id: permission-is-job, when: "a page whose one job needs the permission at once, such as a scanner the user opened", evidence: [brief] }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:assets/notification-and-attention-card.md#preferences-and-permission-are-different-controls" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#notifications-and-engagement" }
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#toss-ecosystem-example" }

  - id: ux.entry-interruption
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: warn, review: P2 }
    detect:
      behavior: { detector: dialog-usage, params: { check: entry-interruption, triggers: [load, timer, scroll, exit-intent, idle, navigation], purposes: [marketing, permission-preprompt, upsell, retention, announcement, other], blocking: true } }
    packages: [pressure-selling]
    why: A modal or sheet interrupts before the user has done anything - on load, on a timer, on scroll, or on the way out - to ask for something the page's job does not need
    better: Place the offer inline where it is relevant, or ask after the user shows interest
    keep_when:
      - { id: equal-ease-decision, when: "a decision required before content can be shown, with accepting and declining equally easy", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#toss-ecosystem-example", note: "entry-time sheets, including notification consent" }
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#dialogs-sheets-and-interruption" }
      - { kind: method, source: "skill:references/ux-methodology/user-messages-and-feedback.md#choose-placement-and-interruption-independently" }
      - { kind: method, source: "skill:assets/notification-and-attention-card.md#first-decide-whether-to-interrupt" }

  - id: ux.lost-context-on-return
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: warn, review: P2 }
    detect:
      behavior: { detector: history-behavior, params: { check: restore, restores: [filters, page, scroll, input, selection], also: deep-link } }
    why: Coming back with Back or after signing in loses filters, the page, the scroll position, or the linked destination, so the user starts over
    better: Keep list state in the URL or history, restore the scroll position, and return to the requested destination after sign-in
    keep_when:
      - { id: live-feed, when: "a live feed whose order changes, so a restored position would land on other items", evidence: none }
      - { id: cleared-for-security, when: "state cleared on purpose for security, such as when a session ends on a shared device, with the page saying so", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/product-types/e-commerce.md#product-list-and-category-pages" }
      - { kind: method, source: "skill:references/animation/scroll-navigation-and-transitions.md#scroll-restoration-and-history" }
      - { kind: method, source: "skill:references/ux-methodology/user-flow-design-and-testing.md#2-inventory-entry-exit-and-return-paths" }

  - id: ux.excess-steps
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: warn, review: P2 }
    detect:
      behavior: { detector: flow-analysis, params: { check: steps }, threshold: { steps_over_plan_max: 0, single_field_steps_max: 1 } }
    why: A flow takes more steps than its plan allows, or splits a short form into one-field screens
    better: Group related fields into steps that each settle a decision, and cut steps that decide nothing
    keep_when:
      - { id: boundary-step, when: "one-field steps at a branch, a verification boundary, or a save-and-resume point", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#chunking-and-steps" }
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#multi-step-flows" }

  - id: ux.premature-validation
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: warn, review: P2 }
    detect:
      behavior: { detector: form-behavior, params: { check: premature-validation } }
    why: Errors appear while the user is still typing, or on untouched fields as the page loads
    better: Validate on blur or submit, and clear an error as soon as the value becomes valid
    keep_when:
      - { id: helpful-live-feedback, when: "live feedback that helps while typing, such as password strength or characters remaining", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/product-types/forms-onboarding-and-checkout.md#timing" }
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#validation-timing" }

  - id: ux.disabled-submit-unexplained
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: warn, review: P2 }
    detect:
      behavior: { detector: form-behavior, params: { check: disabled-submit } }
    why: The submit control stays disabled with no visible reason, so the user cannot tell what is missing
    better: Keep submit enabled and explain errors on submit, or show next to it what is still needed
    keep_when:
      - { id: request-in-flight, when: "the control is disabled only while its own request is in flight and shows a pending state", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/ux-methodology/interaction-design.md#mandatory-state-inventory" }
      - { kind: method, source: "skill:references/ux-methodology/user-messages-and-feedback.md#actions-pending-state-and-reachability" }

  - id: ux.scroll-hijack
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: warn, review: P2 }
    detect:
      behavior: { detector: scroll-behavior, threshold: { ratio_min: 0.5, ratio_max: 2.0 } }
    why: The page takes over scrolling - snapping between sections, changing how far a scroll moves, or holding it while an animation plays - so users lose control of their position
    better: Keep native scrolling and tie effects to scroll position without changing the distance moved
    keep_when:
      - { id: entered-presentation-mode, when: "a full-screen presentation mode the user entered on purpose", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/animation/scroll-navigation-and-transitions.md#native-behavior-is-the-baseline" }
      - { kind: method, source: "skill:references/animation/scroll-navigation-and-transitions.md#scroll-snapping" }

  # ----------------------------------------------------- ux: behavior packages

  - id: ux.subscription-trap
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: warn, review: P2 }
    detect:
      behavior: { detector: package-hit, params: { package: subscription-trap } }
    why: Hidden renewal terms, a preselected plan or extra, a hard exit, and repeated asks work together to keep people paying
    better: Fix the members together - disclose terms at the commit, start choices unselected, and make leaving as direct as joining
    waiver: { scope: rule }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "deceptive-design#hidden-subscription" }
      - { kind: taxonomy, source: "deceptive-design#hard-to-cancel" }

  - id: ux.pressure-selling
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: warn, review: P2 }
    detect:
      behavior: { detector: package-hit, params: { package: pressure-selling } }
    why: Interruptions, invented urgency, lopsided choices, shaming refusals, and repeated asks stack up to push a decision
    better: Remove the pressure devices and let the offer stand on its facts
    waiver: { scope: rule }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#persuasion-versus-deception" }

  - id: ux.consent-steering
    class: quality
    domain: ux
    layers: [behavior]
    severity: { create: warn, review: P2 }
    detect:
      behavior: { detector: package-hit, params: { package: consent-steering } }
    why: Preselected consents, lopsided buttons, a buried refusal, early permission prompts, and repeated asks together steer people into agreeing
    better: Ask once, at the moment it matters, with an unselected choice and a refusal as easy as acceptance
    waiver: { scope: rule }
    verify: runtime
    provenance:
      - { kind: method, source: "skill:references/ux-methodology/ethics-and-dark-patterns.md#consent-design" }

  # =============================================================== motion

  - id: motion.pulse-without-status
    class: default
    domain: motion
    layers: [source, render]
    severity: { create: gate, review: P2 }
    detect:
      source: { detector: source-pattern, params: { patterns: ['animate-pulse', 'animate-ping'] } }
      render: { detector: motion-inventory, params: { check: infinite-pulse-small-element } }
    packages: [dark-luminous]
    why: An infinitely pulsing status dot performs liveness without any changing status
    better: Use a stable status or real progress
    keep_when:
      - { id: live-status, when: "the dot reflects live status that changes", evidence: none }
      - { id: loading-skeleton, when: "a skeleton placeholder while loading", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#MOT-01", note: "fix pointer fundamentals/motion.md" }
      - { kind: taxonomy, source: "anti-slop#motion.1" }

  - id: motion.decorative-cursor
    class: default
    domain: motion
    layers: [source, render]
    severity: { create: gate, review: P3 }
    detect:
      source: { detector: source-pattern, params: { patterns: ['@keyframes\s+blink', 'animate-blink'] } }
      render: { detector: motion-inventory, params: { check: blink-keyframes } }
    why: A decorative blinking cursor mimics typing or generation indefinitely
    better: Show the actual input state, or remove it
    keep_when:
      - { id: text-input-focus, when: "a real text input with focus", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#MOT-02", note: "fix pointer fundamentals/motion.md" }
      - { kind: taxonomy, source: "anti-slop#motion.2" }

  - id: motion.uncontrolled-marquee
    class: requirement
    domain: motion
    layers: [render, behavior]
    severity: { create: gate, review: P1 }
    detect:
      render: { detector: motion-inventory, params: { check: auto-moving-content } }
      behavior: { detector: motion-inventory, params: { check: pause-control }, threshold: { seconds_without_control_max: 5 } }
    why: Content auto-scrolls without a way to pause, stop, or hide it, moving before it can be read
    better: Use static overflow or a controlled carousel with a pause control
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "checklist#MOT-03", note: "fix pointer fundamentals/motion.md" }
      - { kind: taxonomy, source: "anti-slop#motion.3" }
      - { kind: method, source: "wcag22#2.2.2" }

  - id: motion.bounce-default
    class: default
    domain: motion
    layers: [source, render]
    severity: { create: gate, review: P2 }
    detect:
      source: { detector: source-pattern, params: { patterns: ['animate-bounce', 'elastic', 'back\.(in|out|inOut)', 'cubic-bezier\(\s*[\d.]+\s*,\s*(-|1\.\d*[1-9]|[2-9])', 'cubic-bezier\((\s*-?[\d.]+\s*,){3}\s*(-|1\.\d*[1-9]|[2-9])'] } }
      render: { detector: motion-inventory, params: { check: overshoot-easing }, threshold: { share_max: 0.5 } }
    why: Bounce or elastic easing as the global default applies personality indiscriminately and slows tasks
    better: Match easing to direct manipulation, platform, and tone; keep overshoot for moments that earn it
    keep_when:
      - { id: playful-brand-motion, when: "playful subjects where overshoot is the brand's motion voice", evidence: [design, brief] }
      - { id: drag-release, when: "release after a physical drag", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#MOT-04", note: "fix pointer fundamentals/motion.md" }
      - { kind: taxonomy, source: "anti-slop#motion.4" }

  - id: motion.layout-property-animation
    class: quality
    domain: motion
    layers: [source, render, behavior]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: source-pattern, params: { patterns: ['transition(-property)?:[^;]*(?<![-\w])(width|height|top|left|right|bottom|margin|padding)(?![-\w])'] } }
      render: { detector: motion-inventory, params: { check: animated-properties, properties: [width, height, top, left, right, bottom, margin-top, margin-right, margin-bottom, margin-left, padding-top, padding-right, padding-bottom, padding-left] } }
      behavior: { detector: layout-shift, params: { during: state-change, measure: layout-animated } }
    why: Routine state changes animate width, height, or position, shifting neighboring content and causing jank
    better: Animate transform and opacity, or use a layout animation tool built for the change
    keep_when:
      - { id: measured-layout-animation, when: "a purposeful layout animation handled by a tool that measures and transforms", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "checklist#MOT-05", note: "fix pointer fundamentals/motion.md" }
      - { kind: taxonomy, source: "anti-slop#motion.5" }

  - id: motion.hover-zoom-everything
    class: default
    domain: motion
    layers: [behavior]
    severity: { create: gate, review: P3 }
    detect:
      behavior: { detector: motion-inventory, params: { check: hover-transform, target: media }, threshold: { media_share_max: 0.8 } }
    why: Every image scales or shifts on hover, making the gallery restless and moving crops and alignment
    better: Use hover to reveal actionable information, or keep images still
    keep_when:
      - { id: inspection-zoom, when: "hover zoom that lets a visitor inspect detail on one or two product or artwork images, not a transform across a gallery", evidence: none }
    waiver: { scope: rule }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "checklist#MOT-06", note: "fix pointer fundamentals/motion.md" }
      - { kind: taxonomy, source: "anti-slop#motion.6" }

  - id: motion.transition-all
    class: quality
    domain: motion
    layers: [source, render]
    severity: { create: warn, review: P2 }
    detect:
      source: { detector: source-pattern, params: { patterns: ['transition:\s*all', 'transition-all'] } }
      render: { detector: motion-inventory, params: { check: transition-property-all } }
    why: Transitioning all properties animates unintended properties and makes interaction inconsistent
    better: Name the properties and durations to animate
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#MOT-07", note: "fix pointer technology/implementation-patterns.md" }
      - { kind: taxonomy, source: "anti-slop#motion.8" }

  - id: motion.reduced-motion-missing
    class: requirement
    domain: motion
    layers: [behavior]
    severity: { create: gate, review: P1 }
    detect:
      behavior: { detector: reduced-motion-respected }
    why: Nonessential motion has no reduced-motion branch, so motion-sensitive users cannot avoid it
    better: Under reduced motion, remove spatial motion and keep state feedback
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "checklist#MOT-08", note: "fix pointer assets/accessibility-cheatsheet.md" }
      - { kind: taxonomy, source: "anti-slop#motion.9" }
