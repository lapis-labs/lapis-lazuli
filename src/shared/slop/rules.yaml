  # =============================================================== surface

  - id: surface.glass-everywhere
    class: default
    domain: surface
    layers: [source, render]
    severity: { create: gate, review: P2 }
    detect:
      source: { detector: source-pattern, params: { patterns: ['backdrop-filter', 'backdrop-blur'] } }
      render: { detector: surface-effects, params: { effect: backdrop-filter }, threshold: { panel_share_max: 0.5 } }
    packages: [dark-luminous]
    why: Translucent glass on most panels stops communicating layering and weakens backdrop contrast
    better: Reserve transparency for real overlays and depth
    keep_when:
      - { id: platform-material, when: "platform materials that the platform itself applies", evidence: [{ plan: "brief.platform", has: [ios, android, desktop] }] }
