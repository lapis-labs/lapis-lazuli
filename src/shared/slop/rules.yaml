    provenance:
      - { kind: method, source: "skill:references/research/brand-and-ip-guardrails.md#generated-imagery" }
      - { kind: method, source: "skill:references/research/brand-and-ip-guardrails.md#screenshots-and-reference-boards" }

  - id: rights.generated-from-reference
    class: requirement
    domain: rights
    layers: [source]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: asset-ledger, params: { check: generated } }
    why: Reference-only material went into a generator, so the output can carry expression from a source the project may only study
    better: Generate again from own or licensed inputs and a description of the qualities to carry over
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "skill:references/research/brand-and-ip-guardrails.md#generated-imagery" }

  - id: rights.generated-unreviewed
    class: quality
    domain: rights
    layers: [source]
    severity: { create: warn, review: P2 }
    detect:
      source: { detector: asset-ledger, params: { check: generated } }
    why: Generated media ships without a check for stray marks, watermarks, recognizable people, copied-looking characters, or broken text
