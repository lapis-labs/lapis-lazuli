  - id: copy.template-offer-terms
    class: default
    domain: copy
    layers: [render]
    severity: { create: warn, review: P3 }
    detect:
      render: { detector: copy-family-rate, family: offer_terms, params: { trigger: co-occurrence } }
    packages: [reassurance-landing]
    why: Trial, card, and cancellation terms stack under the calls to action as a set whether or not the business set them, so the template invents commercial terms
    better: State the terms the business has, once, beside the action they qualify, and leave out the ones it does not have
    keep_when:
      - { id: terms-given, when: "the brief or the business's published terms give these terms", evidence: [brief, source] }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: measurement, source: "slop catalog 2026-10-04 trial-reassurance", note: "14-day or no-card wording on 46 of 123 generated pages, 44 of 69 backup landing pages" }

  # =============================================================== imagery

  - id: imagery.css-illustration
    class: default
    domain: imagery
    layers: [render]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: decorative-dom, params: { kind: shape-illustration } }
    why: CSS primitives assemble a pseudo-illustration from generic shapes that stand in for the subject
    better: Art-direct imagery from real objects, processes, or data
    keep_when:
      - { id: brand-geometry, when: "abstract geometry that is the brand's established visual language", evidence: [design, brief] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#IMG-01", note: "fix pointer fundamentals/iconography-and-imagery.md" }
      - { kind: taxonomy, source: "anti-slop#imagery.1" }

  - id: imagery.jagged-clip
    class: default
    domain: imagery
    layers: [render]
    severity: { create: gate, review: P3 }
    detect:
      render: { detector: image-inventory, params: { check: decorative-clip-path } }
    why: A jagged decorative clip path on unrelated photos competes with the image subject
    better: Choose crop and contour from the content
    keep_when:
      - { id: content-contour, when: "a clip that follows the outline of the image's own subject, such as a product silhouette or a map region", evidence: none }
      - { id: contract-shape-language, when: "a brand shape language recorded in the contract", evidence: [design] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#IMG-02", note: "fix pointer fundamentals/iconography-and-imagery.md" }
      - { kind: taxonomy, source: "anti-slop#imagery.2" }

  - id: imagery.buried-raster
    class: quality
    domain: imagery
    layers: [render]
    severity: { create: warn, review: P2 }
    detect:
      render: { detector: image-inventory, params: { check: overlay-coverage, min_covered_share: 0.8 }, threshold: { overlay_alpha_max: 0.6 } }
    why: A heavy gradient or overlay buries the main image to rescue text contrast
    better: Show the image with legible contrast by placing text off it, or remove the image
    keep_when:
      - { id: decorative-backdrop, when: "a decorative backdrop with empty alt text, which carries nothing the page needs", evidence: [{ asset: { role: [decorative] } }] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#IMG-03", note: "fix pointer fundamentals/iconography-and-imagery.md" }
      - { kind: taxonomy, source: "anti-slop#imagery.3" }

  - id: imagery.missing-content-image
    class: requirement
    domain: imagery
    layers: [source, render]
    severity:
      create: gate
      review: P1
      adjust:
        - { when: "no required information or accessible equivalent is lost", review: P2 }
    detect:
      source: { detector: source-ast, params: { query: img-without-alt } }
      render: { detector: image-inventory, params: { check: [load-failure, unresolved-placeholder, missing-alternative] } }
    why: A content image is broken or an unresolved placeholder, or meaningful image information has no text alternative
    better: Use owned assets or labeled local placeholders and give meaningful images a text alternative
    keep_when:
      - { id: empty-alt-decoration, when: "decorative images with an empty alt attribute" }
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#IMG-04", note: "P1 when required information is lost; fix pointer fundamentals/iconography-and-imagery.md" }
      - { kind: taxonomy, source: "anti-slop#imagery.4" }
      - { kind: method, source: "wcag22#1.1.1" }

  - id: imagery.generic-stock
    class: default
    domain: imagery
    layers: [render, review]
    severity: { create: warn, review: P3 }
    detect:
      render: { detector: image-embedding-region, list: stock_image_regions, region: { space: embedding } }
    why: A generic stock scene supplies category cliche instead of evidence about the product
    better: Commission or select context-specific, permissioned imagery
    keep_when:
      - { id: supplied-asset, when: "an image the client or brief supplied, recorded in the asset ledger with its origin", evidence: [{ asset: { origin: [own, commissioned] } }] }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#IMG-05", note: "fix pointer research/reference-and-inspiration-digging.md" }
      - { kind: taxonomy, source: "anti-slop#imagery.5" }

  # =============================================================== code

  - id: code.mobile-100vh
    class: quality
    domain: code
    layers: [source, render]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: source-pattern, params: { patterns: ['h-screen', '100vh'] } }
      render: { detector: overflow-check, params: { viewports: [390], checks: [dynamic-viewport-clip] } }
    why: A full-height shell sized with the static viewport height is clipped by mobile browser chrome
    better: Use dynamic viewport units and test on the target
    keep_when:
      - { id: dvh-fallback, when: "100vh is only the fallback declared before a dynamic-viewport value for the same property", evidence: none }
      - { id: no-mobile-browser, when: "the brief lists no web platform, such as a desktop app or an embedded kiosk, so no mobile browser chrome resizes the viewport", evidence: [{ plan: "brief.platform", lacks: [web] }] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#CODE-01", note: "fix pointer technology/implementation-patterns.md" }
      - { kind: taxonomy, source: "anti-slop#code.1" }

  - id: code.focus-outline-removed
    class: requirement
    domain: code
    layers: [source, behavior]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: source-pattern, params: { patterns: ['outline:\s*(none|0)\s*(!important)?\s*[;}]', 'outline-none'] } }
      behavior: { detector: focus-visible }
    why: The focus outline is removed without a replacement, so keyboard focus is invisible
    better: Provide a visible focus-visible style with enough contrast
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "checklist#CODE-02", note: "fix pointer assets/accessibility-cheatsheet.md" }
      - { kind: taxonomy, source: "anti-slop#code.2" }
      - { kind: method, source: "wcag22#2.4.7" }
      - { kind: method, source: "wcag22#1.4.11", note: "the behavior measure (a 1 px ring at 3:1) is project policy modeled on 2.4.13 at half its area; 2.4.7 alone sets no size or contrast" }

  - id: code.clickable-non-interactive
    class: requirement
    domain: code
    layers: [source, render, behavior]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: source-ast, params: { query: click-handler-on-non-interactive-element } }
      render: { detector: accessibility-tree, params: { check: pointer-only-control } }
      behavior: { detector: keyboard-traversal, params: { check: operable, semantic: false } }
    why: A clickable div or span lacks the name, role, state, and keyboard behavior of a real control
    better: Use a native button or link
    waiver: { scope: none }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "checklist#CODE-03", note: "fix pointer assets/component-states-checklist.md" }
      - { kind: taxonomy, source: "anti-slop#code.14" }
      - { kind: method, source: "wcag22#2.1.1" }
      - { kind: method, source: "wcag22#4.1.2" }

  - id: code.image-dimensions
    class: quality
    domain: code
    layers: [source, render]
    severity: { create: warn, review: P2 }
    detect:
      source: { detector: source-ast, params: { query: img-without-intrinsic-size } }
      render: { detector: layout-shift, params: { during: load }, threshold: { cls_max: 0.1 } }
    why: Images without intrinsic dimensions shift content as they load
    better: Supply width and height or an aspect ratio
    keep_when:
      - { id: css-reserved-box, when: "the box is reserved by a CSS aspect-ratio or fixed size that the source query cannot see, and the render shows no layout shift", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#CODE-04", note: "fix pointer technology/implementation-patterns.md" }
      - { kind: taxonomy, source: "anti-slop#code.5" }

  - id: code.locale-time-rendering
    class: quality
    domain: code
    layers: [source, behavior]
    severity: { create: warn, review: P2 }
    detect:
      source: { detector: source-ast, params: { query: hard-coded-date-number-or-locale-string } }
      behavior: { detector: console-errors, params: { kinds: [hydration-mismatch] } }
    why: Hard-coded dates, numbers, or locale strings go stale or wrong by locale, and time-dependent output differs between server and client
    better: Format with locale-aware APIs, stabilize the initial value, then update safely on the client
    keep_when:
      - { id: content-literal, when: "a date or number that is part of the written content, such as a publication date or a historical year", evidence: none }
      - { id: fixed-format-by-spec, when: "a format that the brief or a standard fixes, such as ISO 8601 timestamps in a log view", evidence: [brief, source] }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "checklist#CODE-05", note: "fix pointer technology/implementation-patterns.md" }
      - { kind: taxonomy, source: "anti-slop#code.6" }
      - { kind: taxonomy, source: "anti-slop#code.12" }

  - id: code.continuous-value-in-state
    class: quality
    domain: code
    layers: [source]
    severity: { create: warn, review: P2 }
    detect:
      source: { detector: source-ast, params: { query: state-setter-in-pointer-or-scroll-handler } }
    why: Continuous pointer or scroll values stored in component state cause re-render loops and stutter
    better: Use motion values, refs, CSS, or platform APIs for continuous values
    keep_when:
      - { id: frame-throttled, when: "the setter runs at most once per frame through requestAnimationFrame or a throttle", evidence: none }
      - { id: value-is-displayed, when: "the value is rendered as text or structure that refs and CSS cannot update, such as a slider's numeric readout", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#CODE-06", note: "fix pointer technology/implementation-patterns.md" }
      - { kind: taxonomy, source: "anti-slop#code.7" }

  - id: code.animation-package-mismatch
    class: quality
    domain: code
    layers: [source]
    severity: { create: warn, review: P2 }
    detect:
      source: { detector: dependency-check, params: { check: animation-imports-vs-installed, unobserved: not-verified } }
    why: Animation imports do not match the installed package or API, or several animation packages are mixed
    better: Verify the project dependency and its supported import; keep one animation stack
    keep_when:
      - { id: matching-import-path, when: "either import path is fine when it matches the installed package", evidence: none }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: taxonomy, source: "checklist#CODE-07", note: "P2 when incompatibility is observed, otherwise not verified; fix pointer technology/animation-and-motion-libraries.md" }
      - { kind: taxonomy, source: "anti-slop#code.8" }

  - id: code.unvirtualized-list
    class: quality
    domain: code
    layers: [render]
    severity: { create: gate, review: P1 }
    detect:
      render: { detector: large-list, threshold: { rendered_items_max: 500 } }
    why: A large list renders every item in a scrolling data surface, stalling and consuming memory
    better: Virtualize when the measured volume requires it
    keep_when:
      - { id: measured-within-budget, when: "the full list was measured on the target device and stays within a performance budget that the brief states", evidence: [brief] }
      - { id: needs-full-dom, when: "the full list must stay in the page for find-in-page, print, or assistive technology, and its count is bounded by the source", evidence: none }
    waiver: { scope: value }
    verify: runtime
    provenance:
      - { kind: taxonomy, source: "checklist#CODE-08", note: "fix pointer technology/implementation-patterns.md" }
      - { kind: taxonomy, source: "anti-slop#code.13" }

  # =============================================================== reference

  - id: reference.brand-asset-reuse
    class: requirement
    domain: reference
    layers: [render, review]
    severity: { create: gate, review: P0 }
    detect:
      render: { detector: reference-asset-match, params: { rights: reference-only } }
    why: Logos, illustrations, or copy from a reference-only source are reused as they are
    better: Take relations from the reference and leave its assets, identity, and copy behind
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "memo:structure", note: "reference section: brand asset requirement" }

  - id: reference.clone-risk
    class: quality
    domain: reference
    layers: [render, review]
    severity: { create: gate, review: P1 }
    detect:
      render: { detector: reference-distance, params: { rights: [reference-only], dimensions: [layout, palette, type, copy], require_all_dimensions: true }, threshold: { distance_min: 0.15 } }
    why: Layout structure, palette roles, type fingerprint, and copy are all close to one reference at once
    better: Keep the relations named in the plan's take list and change the rest; borrowing one dimension is structure, not cloning
    keep_when:
      - { id: licensed-reference, when: "the reference is owned or licensed for this use", evidence: [{ plan: "references[*].rights", has: [own, licensed] }] }
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: method, source: "memo:structure", note: clone distance uses the same distance code as typicality }

  # =============================================================== rights (asset provenance and licenses)
  # Records in .lapis/assets.ledger.json and .lapis/fonts.lock.json against shipped files and renders.
  # How each check reads them: assets/CHECKS.md.

  - id: rights.no-provenance
    class: requirement
    domain: rights
    layers: [source, render]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: asset-ledger, params: { check: coverage } }
      render: { detector: asset-ledger, params: { check: coverage } }
    why: A shipped image, video, icon set, or font has no provenance record, so nobody can show where it came from or what its license allows
    better: Record the asset with its source, license, and intended use, or replace it with one you can record
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "skill:references/research/brand-and-ip-guardrails.md#provenance-ledger" }
      - { kind: method, source: "skill:references/visual-assets/asset-delivery-and-handoff.md#rights-attachment-credit-and-notices" }

  - id: rights.license-unknown
    class: requirement
    domain: rights
    layers: [source]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: asset-ledger, params: { check: license } }
    why: An asset or font ships under an unknown license, from an unknown origin, or without a record of where its license document is kept
    better: Find the governing license for the exact item from the rights holder or provider, record where it is kept, or replace the asset
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "skill:references/research/brand-and-ip-guardrails.md#asset-catalogs-and-acquisition" }
      - { kind: method, source: "skill:references/fonts/license-risk-screening.md#risk-pattern-screen" }

  - id: rights.license-hint-only
    class: quality
    domain: rights
    layers: [source]
    severity: { create: warn, review: P2 }
    detect:
      source: { detector: asset-ledger, params: { check: license } }
    why: The recorded license comes from a catalog badge or embedded file metadata, which point to a license but do not grant one
    better: Read the license for the exact item from the rights holder or provider and record that
    waiver: { scope: value }
    verify: static
    provenance:
      - { kind: method, source: "skill:assets/free-stock-asset-sources.md#read-this-before-using-the-matrix" }
      - { kind: method, source: "skill:references/fonts/licensing-and-entitlements.md#metadata-is-evidence-not-a-grant" }

  - id: rights.use-outside-license
    class: requirement
    domain: rights
    layers: [source]
    severity: { create: gate, review: P0 }
    detect:
      source: { detector: asset-ledger, params: { check: use } }
    why: "The recorded use goes beyond the license: commercial use under a non-commercial license, non-editorial use under an editorial-only license, an edited work whose license forbids derivatives, a platform the license does not cover, a generator input the license excludes, or font files shipped from a synced, system, or unknown copy"
    better: Keep the asset where its license allows, obtain a license for this use, ship files from a channel that grants it, or replace the asset
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "skill:assets/free-stock-asset-sources.md#license-scope-examples" }
      - { kind: method, source: "skill:references/research/brand-and-ip-guardrails.md#open-licenses-and-public-domain" }
      - { kind: method, source: "skill:references/visual-assets/icon-systems-and-alternatives.md#platform-and-license-boundaries" }

  - id: rights.license-expired
    class: requirement
    domain: rights
    layers: [source]
    severity: { create: gate, review: P0 }
    detect:
      source: { detector: asset-ledger, params: { check: expiry } }
    why: The license, approval, or relationship behind an asset has ended and the asset still ships
    better: Renew the right, or remove the asset and ship its recorded replacement
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "skill:references/visual-assets/asset-delivery-and-handoff.md#expiry-renewal-and-replacement" }

  - id: rights.attribution-missing
    class: requirement
    domain: rights
    layers: [source]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: asset-ledger, params: { check: attribution } }
    why: A license that requires credit has no recorded credit text or placement
    better: Record the credit in the form the license asks for and show it where the record says
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "skill:assets/free-stock-asset-sources.md#license-scope-examples" }
      - { kind: method, source: "skill:references/research/brand-and-ip-guardrails.md#open-licenses-and-public-domain" }

  - id: rights.notice-missing
    class: requirement
    domain: rights
    layers: [source]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: asset-ledger, params: { check: notices } }
    why: Distributed fonts, icons, or other licensed files ship without the license and copyright notices their license requires
    better: Ship the license text and copyright notice with the files, in a licenses folder or an about screen; a visible credit does not replace them
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "skill:references/fonts/licensing-and-entitlements.md#public-credit-is-not-the-same-as-traveling-notices" }
      - { kind: method, source: "skill:references/visual-assets/icon-systems-and-alternatives.md#notice-and-credit-handling" }

  - id: rights.reserved-font-name
    class: requirement
    domain: rights
    layers: [source]
    severity: { create: gate, review: P1 }
    detect:
      source: { detector: asset-ledger, params: { check: reserved-names } }
    why: A subset or converted open font keeps a name its license reserves for the original release
    better: Rename the modified font's internal names, ship the unmodified release, or obtain written permission from the rights holder
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "skill:references/fonts/licensing-and-entitlements.md#modification-woff-subsetting-and-rfns" }

  - id: rights.unverified-mark
    class: requirement
    domain: rights
    layers: [source]
    severity: { create: gate, review: P0 }
    detect:
      source: { detector: asset-ledger, params: { check: marks } }
    why: Another party's logo or mark appears without confirmed authorization, or implies a customer, partner, or press relationship that nobody confirmed
    better: Confirm the relationship and use the owner's approved asset and guidelines, or name the other party in plain text
    keep_when:
      - { id: plain-reference-allowed, when: "a compatibility or integration reference whose owner's guidance allows plain reference, recorded as not-needed" }
    waiver: { scope: none }
    verify: static
    provenance:
      - { kind: method, source: "skill:references/research/brand-and-ip-guardrails.md#trademarks-and-logos" }
      - { kind: method, source: "skill:references/visual-assets/icon-systems-and-alternatives.md#brand-glyphs" }

  - id: rights.generated-as-evidence
    class: requirement
    domain: rights
    layers: [source, review]
    severity: { create: gate, review: P0 }
    detect:
      source: { detector: asset-ledger, params: { check: generated } }
    why: Generated media stands in for a real product, person, place, or result that the page presents as real
    better: Use a real photograph or recording as evidence, or make the generated image plainly illustrative and change its role
    waiver: { scope: none }
