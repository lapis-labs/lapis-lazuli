  - id: copy.meta-text
    class: quality
    domain: copy
    layers: [plan, render]
    severity:
      create: warn
      review: P2
      adjust:
        - { when: "repetition obscures a consequential disclosure", review: P1 }
    detect:
      plan: { detector: meta-text, path: "content.key_copy[*].text" }
      render: { detector: meta-text, family: leftover_phrases, params: { kinds: [producer-facing, repeated-heading-body, demo-badges, fiction-notice, build-labels, chat-leftovers, change-log, developer-notes, placeholder-apology, self-description] } }
    why: Copy tells the visitor how the page was made instead of serving the subject - a demo or fictional-data notice in the opening, in a heading, or repeated past the one the brief asks for; change-log narration; the page describing itself; developer and test notes; an apology for a part nobody built - or addresses the builder, the prompt, or QA, or repeats what the hierarchy already says
    better: Show the subject and the visitor's task, and leave out how the page was made, that it is a demo, and what changed. When the brief requires a notice that the data is fictional, state it once, short, in the footer or a small persistent label, never in the hero, a heading, or beside each section; move implementation and test notes to the developer handoff
    keep_when:
      - { id: qualified-disclosure, when: "a consequential disclosure - simulation, non-delivery, privacy, persistence, consent, eligibility, recovery, safety, or legal - that the visitor needs at the decision it qualifies, said once there and not again elsewhere", evidence: none }
      - { id: compatibility-label, when: "a version, build, or environment label where compatibility or availability depends on it", evidence: none }
    waiver: { scope: value }
    verify: review
    provenance:
      - { kind: taxonomy, source: "checklist#CPY-08", note: "P1 when repetition obscures a disclosure; fix pointer readability/interface-copy-and-meta-text.md" }
      - { kind: taxonomy, source: "anti-slop#copy.1" }
      - { kind: taxonomy, source: "anti-slop#copy.16" }
      - { kind: taxonomy, source: "language-patterns#leftovers-and-meta-commentary" }

