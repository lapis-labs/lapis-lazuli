      render: { detector: palette-family, params: { accent: { bounds: { h: [262, 320], c: [0.09, 0.37], l: [0.3, 0.8] } }, field: { bounds: { l: [0.95, 1.0], c: [0.0, 0.03] } }, accent_min_share: 0.002, field_min_share: 0.3 } }
