  - id: color.text-contrast
    class: requirement
    domain: color
    layers: [render]
    severity: { create: gate, review: P1 }
    detect:
      render: { detector: contrast-wcag, params: { themes: [light, dark], states: [rest, hover, focus, disabled-excluded] }, threshold: { normal_min: 4.5, large_min: 3.0 } }
    why: Text contrast below the applicable requirement, measured on the actual surface in every theme
    better: Adjust the text or surface role until both themes meet the requirement on the worst backdrop state
    keep_when:
