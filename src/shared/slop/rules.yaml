# LapisLazuli rules — v0
# Schema: slop/rules.schema.yaml. Detector names: slop/detectors.yaml. Findings: slop/finding.schema.yaml.
#
# What this file is
#   The single source for slop and check rules. The build gives generators (lapis, lps-copy, lps-ux)
#   only id, why, better, and keep_when; checkers (ultramarine, ulm-*) get everything.
#   provenance is for maintainers and is stripped from every skill output.
#
# Rule ids
#   <domain>.<name>, or <domain>.<locale>.<name> for a rule that exists in one locale only.
#   The first segment always equals `domain`.
#
# Classes and create-mode severity (enforced by tests)
#   requirement  accessibility, broken behavior, deception, rights, and project policy that the plan
#                schema already fixes (reduced motion). Always gate, never waived.
#                keep_when on a requirement states the scope of the requirement, not an exemption.
#   contract     departure from DESIGN.md or tokens. Always gate; resolved by a proposed design change.
#   quality      a craft defect with an observable cost. Gate at P0-P1, warn at P2-P3.
#   default      an editorial signal: a familiar choice that needs a recorded reason. Gate when a hit
#                alone should force a keep/reject decision; warn when the signal is weak alone, only
#                matters inside a package, or a detector is statistical (copy families and shells,
#                embeddings, typicality distance).
#   keep_when    the cases a `keep` can rely on, each with a stable id (unique within the rule). A plan's
#                `defaults` keep names one as `keep_when`; the check waives the finding only when the id
#                is one of that rule's, and a rule that lists none takes no keep.
#   evidence     on each case of a rule that takes a keep (class requirement and waiver scope none take
#                none, so their cases carry no evidence): what the keep has to hold for the check to waive
#                (cli/lapis_design/keep_evidence.py). `none` means no plan field, design contract, or asset
#                ledger can show the premise; the keep then waives on its reason, as before, and the critic
#                reads that reason. Otherwise a list of alternatives, any one of which backs the keep:
#                  design, brief, material, source, exploration, composition   the keep cites it in its
#                      `evidence`: a token of the declared DESIGN.md, a quoted line of brief, an entry of
#                      world_materials or sources, the chosen face of a type comparison in explorations,
#                      the chosen candidate of a rendered layout comparison in explorations
#                  { asset: { kind, origin, role } }   the keep cites a ledger asset that this task uses and
#                      whose listed fields have one of the listed values
#                  { plan: PATH, has | lacks | present | min }   the plan itself says it; no citation
#                Adding a case is a contract change: give it the evidence a plan can hold, or `none`. The
#                check judges that the evidence exists where the plan says it does, never that it supports
#                the case; the critic reads the reason against the page.
#   review severity (P0-P3) starts from the default in the previous repository's checklist (see
#   Provenance source prefixes). `severity.adjust` lists the conditions that move it; the evaluator
#   applies the first that matches, otherwise impact decides.
#
# Detection
#   Detection runs on normalized features, not surface strings: OKLCH regions for color, computed
#   styles and box geometry for type and layout, families and per-locale baselines for copy, and
#   distance to a defaults corpus for typicality. `params` says what to measure and what qualifies
#   as an instance; `threshold` holds allowed bounds: `<metric>_max` is exceeded when the value is
#   above it, `<metric>_min` when below it, and bare `max`/`min` refer to the detector's metric.
#   A rule without a threshold hits when a qualifying instance is present. Per-script maps use the
#   render extract's script codes (latn, hang, hani, kana, ...); `other` covers the rest.
#   detectors.yaml says which fields each plan-layer detector reads, which render extract fields each
#   render detector reads (`reads`), and which session fields each behavior detector reads
#   (`reads_session`, behavior/session.schema.yaml). Behavior detectors report every hit they
#   observe; when the session's coverage says a probe ran only partly or not at all, the rule also
#   gets a skipped finding, so a missing observation never reads as a pass.
#   source-pattern matches are leads: when the rule also detects at render or behavior, confirm
#   there before reporting open; otherwise report with context verdict unknown until reviewed.
#   Render checks that cannot see the deciding condition are leads for the behavior layer too:
#   motion-inventory auto-moving-content (the pause control) and accessibility-tree
#   pointer-only-control (keyboard operation) are confirmed by the behavior session.
#   source-ast and dependency-check results are evidence of their own.
#
# Calibration
#   List values and thresholds are v0 seeds taken from the previous repository's checklist, the
#   standards named in provenance, or conservative guesses. Calibrate against the corpora locally,
#   edit the rule, and bump as_of. Per-locale lexicons for copy families will live in slop/lists/.
#
# Provenance source prefixes (maintainers only)
#   "The previous repository" is design-and-frontend, the author's earlier skill repository, which
#   this project's content was migrated from. It is not part of this repository; its files are cited
#   by path as they stood in a snapshot of 2026-09-23.
#   checklist#<ID>              previous repository, assets/slop-detector-checklist.md
#   anti-slop#<catalog>.<row>   previous repository, references/quality/anti-slop.md catalog table
#                               row (1-based)
#   aesthetics#<section>        previous repository, references/styles/ai-era-aesthetics.md
#   language-patterns#<family>  previous repository, references/readability/llm-language-patterns.md
#   memo:<name>                 the author's memos on text, layout, color, and structure; unpublished
#                               and kept outside this repository (NOTICE says so)
#   wcag22#<criterion>          WCAG 2.2 success criterion
#   kwcag22#<item>              Korean web content accessibility guideline 2.2 (KS X OT0003:2022)
#                               check item; no official item mapping to WCAG 2.2 exists
#   skill:<path>#<heading>      previous repository file (snapshot of 2026-09-23) and heading slug
#   deceptive-design#<type>     deceptive-pattern taxonomy at deceptive.design, as cited by the
#                               previous repository
#   apg#<pattern>               WAI-ARIA Authoring Practices pattern
#   law:<jurisdiction>/<act>#<article>   kind `regulation`: where a rule meets a law. It records a
#                               correspondence for maintainers, not a compliance determination;
#                               articles and status as checked on 2026-09-27.
# tools/slop-id-trace.yaml maps every checklist ID and catalog row of the previous repository to the
# rules below.

