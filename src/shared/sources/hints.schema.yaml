# Rotating reference hints are separate from the access-policy source registry. Version 1 groups them by axis:
# genre fields (pages of the subject's own kind), expression modes (work that does what the owner's words ask
# for), and beyond-web media (never a web-ui reference). An offer is three genre hints, two per chosen
# expression mode, and two per chosen medium.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/lapis-labs/lapis-lazuli/schemas/hints.v1.json
title: LapisLazuli reference hints
type: object
additionalProperties: false
required: [version, observed_on, note, axes]
properties:
  version: { const: 1 }
  observed_on: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
  note: { type: string, minLength: 8 }
  axes:
    type: object
    additionalProperties: false
    required: [genre, expression, beyond-web]
    properties:
      genre:
        type: object
        minProperties: 1
        propertyNames: { pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' }
        additionalProperties:
          type: object
          additionalProperties: false
          required: [means, entries]
          properties:
            means: { type: string, minLength: 8 }
            entries:
              type: array
              minItems: 4                       # three offered, at least one other rotation candidate
              items: { $ref: '#/$defs/hint' }
      expression:
        type: object
        minProperties: 1
        propertyNames: { pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' }
        additionalProperties:
          type: object
          additionalProperties: false
          required: [means, words, motion, entries]
          properties:
            means: { type: string, minLength: 8 }
            words:                              # the owner's words (English and Korean) that point at the mode
              type: array
              minItems: 2
              uniqueItems: true
              items: { type: string, minLength: 2 }
            motion: { type: boolean }           # true: a reference from this mode needs a recorded motion file
            entries:
              type: array
              minItems: 4
              items: { $ref: '#/$defs/expression_hint' }
      beyond-web:
        type: object
        minProperties: 1
        propertyNames: { pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' }
        additionalProperties:
          type: object
          additionalProperties: false
          required: [means, kind, entries]
          properties:
            means: { type: string, minLength: 8 }
            kind: { enum: [print, signage, physical-object, archive, media] }   # the references.py KINDS minus web-ui
            entries:
              type: array
              minItems: 4
              items: { $ref: '#/$defs/hint' }
$defs:
  hint:
    type: object
    additionalProperties: false
    required: [url, site, maker, locale, recognition, study]
    properties:
      url: { type: string, pattern: '^https?://[^ /]+' }
      site: { type: string, minLength: 1 }
      maker: { type: string, minLength: 1 }
      locale: { type: string, pattern: '^(global|[A-Z]{2})$' }
      recognition: { type: string, minLength: 8 }  # kind and date; gallery or first-party is not a jury award
      recognition_url: { type: string, pattern: '^https?://[^ /]+' }
      study: { type: string, minLength: 8 }        # our own one-line question, never copied page text
  expression_hint:
    type: object
    additionalProperties: false
    required: [url, site, maker, locale, recognition, study, shows]
    properties:
      url: { type: string, pattern: '^https?://[^ /]+' }
      site: { type: string, minLength: 1 }
      maker: { type: string, minLength: 1 }
      locale: { type: string, pattern: '^(global|[A-Z]{2})$' }
      recognition: { type: string, minLength: 8 }
      recognition_url: { type: string, pattern: '^https?://[^ /]+' }
      study: { type: string, minLength: 8 }
      shows: { type: string, minLength: 8 }        # what moves or behaves, in our words
