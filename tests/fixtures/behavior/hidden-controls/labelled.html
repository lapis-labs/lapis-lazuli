<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진료 예약</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  .choice { display: block; margin: 8px 0; padding: 12px 16px; border: 1px solid #567; border-radius: 8px; }
  .choice:has(input:checked) { background: #dfe; border-color: #174; }
  button, input[type=text] { min-height: 44px; font: inherit; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main id="booking">
  <h1>진료 예약</h1>
  <form id="visit" novalidate>
    <fieldset>
      <legend>진료과</legend>
      <label class="choice"><input class="visually-hidden" type="radio" name="department" value="digestive" required> <span>소화기내과</span></label>
      <label class="choice"><input class="visually-hidden" type="radio" name="department" value="respiratory" required> <span>호흡기내과</span></label>
    </fieldset>
    <p>
      <input id="reminders" class="visually-hidden" type="checkbox" name="reminders">
      <label for="reminders" class="choice">방문 전날 문자로 알려 주세요</label>
    </p>
    <p>
      <label for="patient">환자 이름</label>
      <input id="patient" name="patient" type="text" required>
    </p>
    <button type="submit">예약 내용 확인</button>
  </form>
  <p id="picked" role="status" aria-live="polite"></p>
</main>
<script>
  const form = document.getElementById('visit');
  const picked = document.getElementById('picked');
  form.addEventListener('change', () => {
    const department = form.elements.department.value;
    picked.textContent = department ? `선택한 진료과: ${department}` : '';
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    const missing = [...form.querySelectorAll('[required]')].some(field =>
      field.type === 'radio' ? !form.elements[field.name].value : !field.value);
    picked.textContent = missing ? '필수 항목을 입력해 주세요.' : '예약 내용을 확인해 주세요.';
  });
</script>
</body>
</html>
