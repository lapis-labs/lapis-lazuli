<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가입</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  /* "[필수] <이용약관>에 동의": the link sits in the middle of the label, where a press at its center lands. */
  .terms { display: flex; align-items: center; padding: 12px 16px; border: 1px solid #567; border-radius: 8px; }
  .terms a { flex: 0 0 40%; margin: 0 auto; text-align: center; }
  button { min-height: 44px; font: inherit; }
</style>
</head>
<body>
<main id="signup">
  <h1>가입</h1>
  <form id="join" novalidate>
    <input id="terms" class="visually-hidden" type="checkbox" name="terms" required>
    <label for="terms" class="terms"><span>[필수]</span><a href="/terms.html">이용약관</a><span>에 동의</span></label>
    <button type="submit">다음</button>
  </form>
</main>
<script>
  document.getElementById('join').addEventListener('submit', event => {
    event.preventDefault();
    if (!event.target.elements.terms.checked) return;
    document.getElementById('signup').innerHTML = '<h1>가입 완료</h1><p>약관에 동의하고 가입했어요.</p>';
  });
</script>
</body>
</html>
