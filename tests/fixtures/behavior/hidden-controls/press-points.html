<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>누르는 곳</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  .transparent { position: absolute; opacity: 0; width: 20px; height: 20px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  section { margin: 16px 0; padding: 8px; border: 1px dashed #999; }
  label, .wrap { display: block; padding: 12px 16px; border: 1px solid #567; border-radius: 8px; margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1>누르는 곳</h1>
  <!-- A: the only press point of the wrapper belongs to another input's label. -->
  <section id="covered">
    <div class="wrap"><input id="solo" class="visually-hidden" type="checkbox"><label for="other">다른 선택지</label></div>
    <input id="other" type="checkbox"> <span>다른 입력</span>
  </section>
  <!-- B: two labels; the first reacts and does not toggle. One press, then stop: the second must stay unpressed. -->
  <section id="twice">
    <input id="twice-box" class="visually-hidden" type="checkbox">
    <label for="twice-box" id="first-label">첫째 레이블</label>
    <label for="twice-box" id="second-label">둘째 레이블</label>
  </section>
  <!-- C: pressing the label sends the page elsewhere (no link inside it to avoid). -->
  <section id="leaves">
    <input id="leaves-box" class="visually-hidden" type="checkbox">
    <label for="leaves-box" id="leaves-label">누르면 다른 페이지로 가요</label>
  </section>
  <!-- D: the page swaps the control for a fresh one on press: the state cannot be read, and the page did react. -->
  <section id="swaps">
    <input id="swaps-box" class="visually-hidden" type="checkbox">
    <label for="swaps-box" id="swaps-label">누르면 입력이 새로 그려져요</label>
  </section>
  <!-- E: a transparent input has no box; its label's box stands for it, and shows its state. -->
  <section id="clear">
    <input id="clear-box" class="transparent" type="checkbox">
    <label for="clear-box" id="clear-label">투명한 입력</label>
  </section>
</main>
<script>
  window.presses = {first: 0, second: 0};
  document.getElementById('first-label').addEventListener('click', event => { window.presses.first++; event.preventDefault(); });
  document.getElementById('second-label').addEventListener('click', () => { window.presses.second++; });
  document.getElementById('leaves-label').addEventListener('click', event => { event.preventDefault(); location.assign('/terms.html'); });
  document.getElementById('swaps-label').addEventListener('click', event => {
    event.preventDefault();
    const old = document.getElementById('swaps-box'), fresh = old.cloneNode();
    fresh.removeAttribute('data-lapis-box');
    fresh.checked = true;
    old.replaceWith(fresh);
  });
</script>
</body>
</html>
