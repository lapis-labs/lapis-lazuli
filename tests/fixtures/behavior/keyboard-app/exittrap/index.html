<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><title>Escapable widget</title></head><body>
<header><a class="skip" href="#content">Skip to content</a><nav aria-label="Site"><a href="/second/">Second route</a><a href="/jump/">Jump route</a></nav><button type="button">Header action</button></header>
<main id="content" tabindex="-1"><h1>Escapable picker</h1><section id="widget"><h2>Picker</h2><button id="trap-a">Widget A</button><button id="trap-b">Widget B</button></section><button id="outside">Outside widget</button></main>
<script>document.getElementById('widget').addEventListener('keydown',event=>{
 if(event.key==='Tab' && !event.shiftKey){event.preventDefault();(document.activeElement.id==='trap-a'?document.getElementById('trap-b'):document.getElementById('trap-a')).focus()}
 if(event.key==='Escape'){document.getElementById('outside').focus()}
})</script>
</body></html>
