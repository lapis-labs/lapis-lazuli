<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blocked scrolling</title><style>body{margin:0;height:17000px}</style></head><body><p>Scroll blocked</p><script>addEventListener('wheel',event=>event.preventDefault(),{passive:false});addEventListener('keydown',event=>{if(['Space','ArrowDown'].includes(event.code))event.preventDefault()});addEventListener('touchmove',event=>event.preventDefault(),{passive:false})</script></body></html>
