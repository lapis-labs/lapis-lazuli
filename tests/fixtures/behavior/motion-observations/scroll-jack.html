<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scroll-jacking</title><style>body{margin:0}section{height:1400px;scroll-snap-align:start;border-top:1px solid #888}html{scroll-snap-type:y mandatory}</style></head><body><section>First boundary</section><section>Second boundary</section><section>Third boundary</section><section>Fourth boundary</section><section>Fifth boundary</section><section>Sixth boundary</section><section>Seventh boundary</section><section>Eighth boundary</section><section>Ninth boundary</section><section>Tenth boundary</section><script>document.addEventListener('wheel',event=>{event.preventDefault();scrollTo({top:Math.min(12609,Math.ceil((scrollY+1)/1401)*1401),behavior:'instant'})},{passive:false})</script></body></html>
