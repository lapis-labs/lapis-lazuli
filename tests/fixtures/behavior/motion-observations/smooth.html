<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smooth scrolling</title><style>body{margin:0;height:17000px}html{scroll-behavior:smooth}</style></head><body><p>Smooth continuation</p><script>let goal=0;document.addEventListener('wheel',event=>{event.preventDefault();goal+=450;scrollTo({top:goal,behavior:'smooth'})},{passive:false})</script></body></html>
