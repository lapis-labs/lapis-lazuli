<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll-driven motion</title>
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; }
  main { padding: 24px; }
  .spacer { height: 1200px; }
  @keyframes settle { from { opacity: 0.4; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: no-preference) {
    @supports (animation-timeline: view()) {
      #settle { animation: settle linear both; animation-timeline: view(); animation-range: entry 0% cover 40%; }
    }
  }
</style>
</head>
<body>
<main id="page">
  <h1>Kiln notes</h1>
  <div class="spacer"></div>
  <section id="settle"><h2>Firing log</h2><p>The second firing ran twelve hours.</p></section>
  <div class="spacer"></div>
</main>
</body>
</html>
