<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Canvas paint</title><style>
body {margin:0;padding:12px;background:#fff}
canvas {display:block;margin:12px 0}
</style></head><body><main>
<h1>Canvas paint</h1>
<!-- a scene whose script never drew -->
<canvas id="blank" width="240" height="120"></canvas>
<!-- a WebGL scene that draws a triangle over its clear color -->
<canvas id="scene" width="200" height="100"></canvas>
<!-- decoration filled with one flat color -->
<canvas id="backdrop" width="160" height="80" aria-hidden="true"></canvas>
</main><script>
const backdrop = document.getElementById('backdrop').getContext('2d');
backdrop.fillStyle = 'rgb(40 90 160)';
backdrop.fillRect(0, 0, 160, 80);

const gl = document.getElementById('scene').getContext('webgl');
const shader = (type, source) => {
  const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s); return s;
};
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0, 1); }'));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, 'precision mediump float; void main() { gl_FragColor = vec4(.9, .3, .1, 1); }'));
gl.linkProgram(program);
gl.useProgram(program);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-.8, -.8, .8, -.8, 0, .8]), gl.STATIC_DRAW);
const p = gl.getAttribLocation(program, 'p');
gl.enableVertexAttribArray(p);
gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);
gl.clearColor(.1, .1, .2, 1);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.drawArrays(gl.TRIANGLES, 0, 3);
</script></body></html>
