<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
* {box-sizing:border-box} html,body {margin:0;background:#fff}
body {display:flex;flex-wrap:wrap;gap:12px;padding:12px}
svg,canvas,.tile {display:block;flex:none}
.tile {width:100px;height:100px}
/* One saturated color per case. Bars cover under half of each 100 px square. */
</style></head><body>
<!-- presented as a chart: role and an accessible name that says chart, by aria-label or by <title> -->
<svg width="100" height="100" role="img" aria-label="Revenue chart"><rect x="10" y="40" width="80" height="50" fill="rgb(220 40 40)"/></svg>
<svg width="100" height="100" role="img"><title>Latency graph</title><rect x="10" y="40" width="80" height="50" fill="rgb(240 140 0)"/></svg>
<!-- drawn as a chart: three sibling bars and two text labels, no role and no name -->
<svg width="100" height="100"><rect x="10" y="40" width="20" height="50" fill="rgb(30 160 60)"/><rect x="40" y="20" width="20" height="70" fill="rgb(30 160 60)"/><rect x="70" y="60" width="20" height="30" fill="rgb(30 160 60)"/><text x="10" y="98" font-size="8" fill="rgb(30 160 60)">Q1</text><text x="40" y="98" font-size="8" fill="rgb(30 160 60)">Q2</text></svg>
<!-- the same bars with one label: not drawn as a chart -->
<svg width="100" height="100"><rect x="10" y="40" width="20" height="50" fill="rgb(30 60 200)"/><rect x="40" y="20" width="20" height="70" fill="rgb(30 60 200)"/><rect x="70" y="60" width="20" height="30" fill="rgb(30 60 200)"/><text x="10" y="98" font-size="8" fill="rgb(30 60 200)">Q1</text></svg>
<!-- named for a chart but under 48 px on its shorter side -->
<svg width="40" height="40" role="img" aria-label="Sparkline chart"><rect width="40" height="40" fill="rgb(150 30 200)"/></svg>
<!-- presented as an image, not as a chart -->
<svg width="100" height="100" role="img" aria-label="Company logo"><rect x="10" y="40" width="80" height="50" fill="rgb(230 200 0)"/></svg>
<canvas id="plot" width="100" height="100" role="img" aria-label="Traffic plot"></canvas>
<!-- a box whose own class holds the word -->
<div class="tile bar-chart" style="background:rgb(120 60 0)"></div>
<script>
  const context = document.getElementById('plot').getContext('2d');
  context.fillStyle = 'rgb(220 0 200)';
  context.fillRect(10, 40, 80, 50);
</script>
</body></html>
