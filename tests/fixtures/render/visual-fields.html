<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
* {box-sizing:border-box} body {margin:0;font:16px Arial;background:white}
section {padding:16px;display:flex;flex-wrap:wrap;gap:12px}
article {width:160px;height:100px}
.linear {background:linear-gradient(90deg,rgb(255,0,0) 20px,rgb(0,0,255) 100%)}
.radial {background:radial-gradient(circle,rgb(255,200,0) 0px,rgba(255,0,0,0) 80px)}
.halo {filter:blur(8px);background:radial-gradient(circle,rgba(0,0,255,.8),rgba(0,0,255,0))}
.card {background:#fff;box-shadow:2px 3px 5px 1px rgba(0,0,0,.5), inset 0 0 2px 2px rgba(255,0,0,.25)}
.grid {background-color:white;background-image:linear-gradient(0deg,rgba(0,0,0,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.3) 1px,transparent 1px);background-size:20px 20px}
.dots {background-color:white;background-image:radial-gradient(circle,rgba(0,0,0,.6) 1px,transparent 2px);background-size:16px 16px}
.zigzag {background:teal;clip-path:polygon(0% 0%,100% 0%,100% 70%,90% 85%,80% 70%,70% 85%,60% 70%,50% 85%,40% 70%,30% 85%,20% 70%,10% 85%,0% 70%)}
.with-image {position:relative;width:160px;height:80px}
.with-image img {width:160px;height:80px;display:block}
.overlay {position:absolute;inset:0;background:rgba(0,0,0,.5)}
img.sample {object-fit:fill;display:block}
.bg-photo {background-image:url("visual-assets/scene.png");background-size:cover}
.bg-overlay {background-image:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url("visual-assets/scene.png");background-size:cover}
.multi-paint {border:4px solid transparent;border-image:linear-gradient(45deg,rgb(0,0,0),rgb(255,255,255)) 1;mask-image:linear-gradient(0deg,rgb(0,0,0),transparent);background:rgb(240,240,240);filter:drop-shadow(2px 3px 4px rgba(0,0,0,.4))}
.gradient-text {background-image:linear-gradient(90deg,rgb(0,0,0),rgb(255,0,0));background-clip:text;color:transparent;text-shadow:1px 2px 3px rgba(0,0,0,.5)}
.glass {backdrop-filter:blur(4px) saturate(1.4);background:rgba(255,255,255,.5)}
.noise {background-image:url("visual-assets/noise.png");background-size:180px 120px}
.stripes {background-color:white;background-image:linear-gradient(90deg,rgba(0,0,0,.5) 1px,transparent 1px);background-size:12px 12px}
.crosshair {background-color:white;background-image:url("visual-assets/crosshair.svg");background-size:20px 20px}
.layered {position:relative;background:linear-gradient(90deg,rgb(25,25,25),rgb(100,100,100))}
.layered div {position:absolute;inset:10px;background:rgba(255,0,0,.4)}
</style></head><body><section>
<article class="linear"></article><article class="radial"></article>
<article class="halo"></article><article class="card"></article>
<article class="grid"></article><article class="dots"></article>
<article class="zigzag"></article>
<svg class="lucide-example" width="48" height="48" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 12h20" stroke="black" stroke-width="2"/></svg>
<button aria-label="Continue" style="border:0;background:#eee"><svg width="32" height="32" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" fill="none" stroke="black" stroke-width="2"/></svg></button>
<span style="display:inline-block;font-size:30px">⭐</span>
<img class="sample" src="visual-assets/scene.png" width="128" height="64" alt="Striped mountain">
<img class="sample" src="visual-assets/scene.png" width="64" height="32" alt="Striped mountain small">
<img src="visual-assets/missing.png" width="72" height="48" alt="Broken view">
<img data-src="http://placeholder.invalid/placeholder/320x160" width="72" height="48" alt="Unresolved placeholder">
<img src="visual-assets/scene.png" width="32" height="16">
<img src="visual-assets/scene.png" width="32" height="16" alt="">
<img data-src="{{ thumbnail }}" width="72" height="48" alt="Template slot">
<div class="with-image"><img src="visual-assets/scene.png" width="160" height="80" alt="Mountain with overlay"><div class="overlay"></div></div>
<article class="bg-photo"></article><article class="multi-paint"></article>
<article class="bg-overlay"></article>
<h2 class="gradient-text">Gradient text</h2><article class="glass"></article>
<article class="noise"></article><article class="stripes"></article><article class="crosshair"></article>
<article class="layered"><div></div></article>
</section></body></html>
