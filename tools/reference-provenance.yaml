  sources:
  - path: references/product-types/data-visualization.md
    taken: 'A chart as a claim made through encodings, chosen from the question; the analysis brief as a diagnostic list
      (condensed to what can change the form, open items as unresolved claims); the task-to-form table (rephrased, eight
      rows) read as hypotheses, with a plain table as a complete answer; the perceptual tradeoff as a tendency, with the
      conditions for a pie; dashboard region jobs (monitor, diagnose, compare, act), no filler modules, and the per-width
      responsive decisions; scales and baselines (zero for bars, labeled log scales, two axes, rates against totals, honest
      time, fixed scales across selections, disclosed breaks); labels and annotation (question title, units, evidence for
      annotations, actual versus forecast, missing shown as missing); uncertainty and freshness; tooltips, one status
      message, and focus retention; the equivalent nonvisual layers and the equivalence list; the separate no-data,
      filtered, small-sample, no-permission, and failed-query messages; D1 (2026-10-03), lines 59–73 adds encoding strength/cost tradeoffs and side-by-side alternatives to memory-based animation.'
    dropped: 'The dials baseline and the synthetic dispatch Design Read (the dials row is in SKILL.md step 3), the metrics
      list, typical failures and pitfalls (their substance survives as positive rules), the quick matrix, the analytical
      view sketch (already the data-visualization entry of archetypes.md, which this file points to), the interaction
      purposes list beyond one sentence, the worked selected-quarter contract, and the cross-references: boilerplate, held elsewhere, or example material.'
  - path: references/technology/data-visualization-implementation.md
    taken: 'The renderer draws marks and the application owns meaning, access, and state; build on the existing stack and
      add missing access instead of replacing charts; the four renderer kinds as one paragraph of fit and cost (by
      criteria, not products); no universal point-count threshold, measured on the real workload; context loss keeps the
      last committed text and table; one committed view with its seam fields, pending scope, failure, and request
      identity (as a clause); a deterministic first scope; aggregation honesty.'
    dropped: 'The named-options table (four chart libraries with dated license observations: product names, which skill
      text never carries), the library criteria and the vendor accessibility caution, the vector-graphics server-rendering
      API example, the SSR and hydration detail beyond a deterministic first scope, the volume table and the three clocks,
      the export rules (spreadsheet-injection handling), the complete dependency-free specimen and its expected outcomes
      (a runnable page, left for an eval fixture), the snapshot note, the connector pointer for library docs, pitfalls,
      the quick matrix, and the cross-references.'
