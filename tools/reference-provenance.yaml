- reference: lps-ux/references/navigation.md
  sources:
  - path: references/ux-methodology/information-architecture.md
    taken: 'Organization, labels, navigation, and search as four systems that must agree, and navigation
      exposing a structure it cannot repair; an inventory of everything reachable with its states, where
      duplicate and overloaded labels surface; top tasks with circumstance and outcome, and the nouns that
      persist across them as the object model (not the schema or the org chart); the organization schemes
      (exact, topical, task, audience, object, faceted) mixed per level, facets as filters; one canonical home
      with cross-links; labels as promises (nouns for destinations, outcomes for actions), siblings at one
      conceptual level, one preferred term with synonyms kept for search, words tested without icons; the
      navigation levels (global, local, contextual, utility, wayfinding); search needing scope, permissions,
      synonyms, result anatomy, and zero-result recovery, and never replacing organization; information scent
      with a weak and a strong path (rewritten in Korean); no three-click or depth rule; a redesign keeps learned
      structure, labels, and URLs without evidence or authorization, and redirects what moves.'
    dropped: 'The user-content-context triad table and its evidence column, open, closed, and hybrid card
      sorting, tree testing and its measures, search-log and analytics research, the healthcare and help-center
      examples, the apps-sites-hybrids table, the workspace-administration worked example (its path survives
      as the information-scent example), the IA deliverables list (replaced by plan fields), and the
      when-to-consult, pitfalls, matrix, and cross-reference sections: research method for docs or a later
      research reference, surface-type notes the lapis archetypes and product frames already carry, and
      boilerplate.'
  - path: references/layout/navigation-patterns.md
    taken: 'Pattern choice after the structure, from hierarchy, frequency, platform, and space; the selection
      matrix and quick matrix merged into one table with companion and avoid columns; per-pattern decisions:
      tabs for peer views with the tab-set keyboard model versus route links, and no two-row wrapping; bottom
      tab bar with visible labels, a stack per tab, the safe area, the on-screen keyboard, and no commands;
      menu sheet with a named trigger, focus entry and return, Escape, and a flat list; sidebar and rail
      collapse only with learned icons and one activation result per parent; breadcrumbs as hierarchy, not
      history; a command palette as an accelerator only; pagination, load more, and infinite scroll with their
      state duties; navigation told apart from tabs, segmented controls, form choices, commands, and
      disclosures by outcome, with current, selected, focused, and expanded kept apart; the lookalike-control
      scenario (rewritten on the pottery piece page); Back, Up, and Close as separate contracts; the
      navigation-and-history checklist (URL per state, Back after filters, sheets, dialogs, and deep links,
      per-tab stacks, unsaved work, focus, announcement, permissions, redirects); responsive change keeps
      destinations, location, history, names, and targets, and never adds destinations because width grew.'
    dropped: 'ASCII sketches of each pattern, top-navigation dropdown, mega-menu, and CTA detail, the
      documentation and operational-app level combinations (kept as one line on levels), the vendor tab-bar
      minimizing behavior and a host platform''s tab count (named products; kept only as "the platform or host
      sets the count"), segmented-control wrapping and page-size detail, the smoke-check procedure (replaced by
      the behavior probes and the by-hand column), and the pitfalls, matrix, and cross-reference sections:
      sketches, product names, implementation detail, and boilerplate.'
  external:
  - kind: method
    name: Information architecture as organization, labeling, navigation, and search systems, and the
      users-content-context triad (Rosenfeld, Morville, and Arango, Information Architecture for the Web
      and Beyond; named in the source)
    used_for: Structure before chrome; the scheme table
  - kind: method
    name: Information scent and information foraging (Pirolli and Card; not named in the source)
    used_for: The weak and strong path; ambiguous steps rather than step counts
  - kind: practice
    name: The rejected 'three-click rule' (named in the source, no study cited)
    used_for: No depth limit or click count replaces the text walk
  - kind: taxonomy
