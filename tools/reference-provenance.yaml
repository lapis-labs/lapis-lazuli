      pause versus disconnected, a failed refresh keeping labeled old data, renderer failure leaving text and table); D2 (2026-10-03), lines 48–59, 91–104 adds a real-selection equivalence exercise with bounded coverage claims.'
    dropped: 'The task-and-evidence template and the observed-evidence report template (review reporting belongs to
      ultramarine and the skill Reporting sections), the executable synthetic specimen and its fixed expected outcomes, the checkbox lists, the
      controls-disabled-until-working note, the snapshot note, and the cross-references.'
