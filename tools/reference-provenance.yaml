# LapisLazuli reference provenance - maintainer only (not built)
# One entry per skill reference: the frozen-snapshot files it distills, what was kept and dropped,
# and the external works whose ideas survive in it. Skill text never names them.
version: 0
note: Maintainer-only provenance for skill references. Never built into skills; agent-facing text names
  no external source.
references:
- reference: lapis/references/type.md
  sources:
  - path: references/fonts/pairing-and-role-systems.md
    taken: Roles before families, the four system shapes, same-content comparison of distinct candidates,
      the optical matching steps (apparent size, baseline and line box, stroke weight, width, punctuation
      and figures), synthesis caution, per-locale stacks through :lang().
    dropped: 'Loaded-versus-rendered evidence bookkeeping, math, emoji, and brand-mark roles, variable-axis
      token examples, the delivery budget chain, the QA matrix, and every named family: outside the plan''s
      seven roles, owned by checks or lzl-fonts, or product names.'
  - path: references/fonts/display-and-expressive-type.md
    taken: Display as a role, not a style; writing the display job before naming a face; text versus display
      drawings; optical size and pinned variable instances; one family versus a companion; the per-locale
      display boundary; CJK class terms not mapping to Latin genres.
    dropped: 'Classification history, the category table of named specimen families, the verified open-release
      table, and the cookware worked directions: history, product names, and license mechanics that belong
      to lazuli lock.'
  - path: references/fonts/multilingual-font-selection.md
    taken: Start from locale, not 'CJK'; lang does not guarantee forms or glyphs; per-script fit questions;
      regional Han forms; the fit-across-scripts list; system faces only after observing the target platforms;
      no shared CJK fallback order.
    dropped: 'The candidate source-leads table with repository links, the SUIT note, the evidence-layer
      table, the failure diagnosis table, and the Windows inventory: product names and links, and diagnosis
      owned by lzl-fonts and ultramarine.'
  - path: references/fonts/monospace-and-numeric-typography.md
    taken: Tabular versus proportional versus monospaced as different mechanisms, tnum use and rendered
      verification, numeric test content, mono scope, the CJK two-cell caution, width axis is not monospace,
      an explicit ligature policy.
    dropped: 'East Asian Width detail, the full CJK width feature list, grapheme-cluster exposition, the
      terminal acceptance checklist, and named mono families: too deep for planning; terminal QA belongs
      to implementation and checks.'
  - path: references/typography/multiscript-typesetting.md
    taken: Language tagging and :lang(), Korean keep-all scoped to Korean with overflow-wrap, Japanese
      line-edge prohibitions with line-break strict, ruby, emphasis marks, Chinese region and punctuation,
      autospace and spacing-trim as enhancements, CJK measure in ic or em, per-script line-height checks,
