- reference: lapis/references/layout.md
  sources:
  - path: references/layout/layout-decision-procedure.md
    taken: 'The nine steps in order and what each decides: inventory of real items with length ranges and states;
      priority by task and consequence, with an unresolved tie sent back to the brief; surface mode per screen with
      its layout emphasis and first question; reading order written before columns, with source, focus, and visual
      order agreeing; relation before container, the relation-structure-boundary table, and boundaries as alternatives
      rather than a ladder; the simplest archetype, combined only at a clear boundary; grid as coordination with
      shared alignment lines and a narrower reading measure; per-region responsive transformations with no content
      removed at a width; density set from the dial, then verification. Also: change composition only when the relation
      changes; modules only for real modules; repeated structure for repeated data.'
    dropped: 'The task-shape archetype table, the pricing worked example, the hero rules of thumb, and the quick
      decision matrix: archetype and section material for references/archetypes.md. The named government and vendor
      design-system conventions (product names), the deliverable template (replaced by the plan fields), and the
      pitfalls and cross-references (boilerplate).'
  - path: references/fundamentals/spacing-and-grids.md
    taken: A 4 or 8 px base as convention; a typical step list; relation levels (inside a component < siblings <
      groups < sections) with roughly doubling as a start; padding, gap, and margin ownership; rem in CSS and px
      in the plan; column counts as convention and a grid spec naming columns, gutters, margins, and maximum width;
      grid choice by content; span by priority and minimum width; baseline grids optional and never a reason to
      clip; viewport versus container by ownership; breakpoints where content fails; safe-area insets measured from
      the live boundary; density modes that remap a few tokens; bounded optical correction; visible bounds versus
      hit areas.
    dropped: 'The named published spacing systems, the per-width pixel grid example, the pricing worked example,
      the container-query code sample, the platform safe-area API names, and the matrix and pitfalls: product names,
      example values, platform specifics for the later platforms reference, and boilerplate.'
  - path: assets/spacing-and-grid-cheatsheet.md
    taken: The 4 px step table as a typical scale; more space above a heading than below; 4, 8, and 12 columns by
      width; the 1,200 to 1,440 CSS px content band; the 24 CSS px target floor with larger touch minimums on native
      platforms; per-section stack, wrap, reorder, and overflow behavior.
    dropped: 'Framework breakpoint values, platform window-size classes and units, the target table with named platform
      guidelines, and the quick layout check: framework and platform specifics for the later platforms reference,
      and a checklist that repeats the text.'
  - path: assets/shape-line-and-layout-cheatsheet.md
    taken: Start from the relationship, not the rectangle; candidate structures per task relation; grouping cues
      and how they conflict (equal gaps, narrow widths, nested enclosure, accidental alignment); line roles (rule,
      border, connector, emphasis, focus) with their checks; non-text contrast only for lines that identify controls
      or states; compare only the unresolved decision on the same content.
    dropped: 'Form reading beyond radius, corner construction and the nested-radius formula, capsule geometry, corner
      runtime checks, industrial-design transfer, and the compact decision record: radius, contour, and elevation
      are surface decisions (tokens.shape, tokens.surface) for a later shape and surface reference, and the record
      repeats the plan fields.'
  - path: references/fundamentals/visual-hierarchy-and-composition.md
    taken: 'Rewritten as relation constraints, as its map note asks: proximity order; more space above a heading
      than below; one alignment line per role and no false alignment; importance following area, weight, and contrast,
      with identical treatment only for true peers; one focal point per screen state; enclosure only for true groups;
      symmetry only where content is balanced; rank surviving without color. Also the four levers with one-lever-at-a-time
      diagnosis, visual weight across channels, sections ordered by the reader''s questions, per-region responsive
      composition, and geometry scores as leads rather than verdicts.'
    dropped: 'The composition archetypes table: shapes, not task structures; split and centered survive as opening
      forms in references/archetypes.md, master-detail as list-detail, the rest as grid kinds and the symmetry relation
      in layout.md. Also the hero rebuild with type values (type.md), the dashboard hierarchy example (the dashboard
      entry of archetypes.md covers its order), the title, eyebrow, and numbering test (served by the label-above-heading
      card), the contour and internal-line study (a later visual-assets reference), the squint procedure, research
      citations, and the matrix and pitfalls (boilerplate).'
  - path: references/layout/responsive-and-adaptive.md
    taken: Responsive, adaptive, and intrinsic together; content order first, with no positive tabindex and no reordering
      that contradicts focus; the content-driven breakpoint method; container versus viewport by ownership; per-region
      transformations and what must stay true; the three compact strategies for tables; min-block-size with dynamic
      viewport units; safe areas at the edge that can be covered; reflow at 320 CSS px and 200% text as requirements
      with their practical consequences; one document instead of duplicated markup; density moving either way per
      width.
    dropped: 'Framework breakpoint and platform window-class tables with their units, navigation transformations,
      hover and pointer capability detail, the input and orientation table, the probe-width table, and the list-detail
      worked example: platform specifics for the later platforms reference, navigation and interaction for lps-ux,
      and capture widths owned by render/DERIVED.md and ulm-release.'
  - path: references/layout/density-and-data-heavy-ui.md
    taken: Density as fewer steps rather than smaller type, set by frequency, expertise, consequence, data shape,
      and input; density preferences only where repeated work earns them; collection choice (table, interactive
      grid, list, gallery, list plus detail, modules) and when rows beat cards; identifying field first; place-value
      alignment, units, stable formats, finite status; wrap before truncating; comfortable and compact row heights;
      sticky headers and columns with their focus and zoom limits; a selection bar that reserves its space; compact-width
      strategies; every measure with label, unit, scope, and comparison.
    dropped: 'Work-definition prompts, table anatomy, row interaction patterns, filter architecture and states,
      saved views, selection and bulk-action state models, paging and virtualization, empty, error, stale, and permission
      causes, the dashboard hierarchy list, chart selection, the named product study, and the fraud-review example:
      interaction and state design for lps-ux, the dashboard order kept only in the dashboard entry of archetypes.md, chart choice for
      the later data visualization reference, and product names.'
