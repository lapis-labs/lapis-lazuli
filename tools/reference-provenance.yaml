  verify_before_release:
  - 'Composition on real Korean keyboards: the order of compositionend and the Enter keydown in each engine and on phone
    keyboards, and the re-rendered-field-drops-jamo claim (softened to can drop or double). The headless shell''s IME
    emulation does not drive an operating system input method.'
