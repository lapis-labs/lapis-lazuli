  sources:
  - path: references/design-systems/design-tokens.md
    taken: Tokens as named decisions that earn their cost (reuse, theming, audit, coordinated change);
      tiers with references running downward only; the token set as a dependency graph and the impact
      list before changing a shared step; equal values do not merge meanings; a component layer that
      copies literals; naming by purpose and state with a category.role.variant.state grammar (aligned
      here with the plan's color roles); keeping an established vocabulary; conceptual path versus
      serializer spelling with a reversible name table; component tokens with restraint (the good and
      questionable examples); typography composites with unitless line height; layered shadows not
      flattened; a gradient needs a named job; DESIGN.md as the record with per-family authority and
      generated outputs never hand-edited; import boundary versus release source; the literal-to-token
      migration steps and not deduplicating distinct roles; the worked change-impact decision (remap the
      semantic token, not the shared step), condensed; the validation checklist, folded into the check
      section.
    dropped: 'Snapshot note, when-to-consult, the dated format-version remarks and the dotted-name JSON
      example, the example token JSON listings, the utility-framework namespace section and its theme-block
      example (product name; only "a framework theme block" survives, as a place the source check treats
      as token definitions), the design-tool variables mention, the alternative contrast-metric remark,
      the modes and adaptive-scale sections (moved to theming.md), pitfalls, the quick decision matrix,
      and cross-references: history, product names, material owned by theming.md, or boilerplate.'
  - path: references/interop/design-tokens-dtcg.md
    taken: Token and group structure (a node is never both), name restrictions, type resolution order
      and never inferring a type from a value, token and group properties including $extends, brace aliases
      for whole tokens and $ref pointers for parts, keeping aliases until a consumer needs resolved values,
      producer-owned reverse-domain extension keys and preserving unknown extension data, the primitive
      type table with value shapes and unit limits (px or rem, never em, zero with a unit, unitless values
      as number, cubicBezier x range), composites as structured objects, the five typography fields with
      features and variations as reported losses, structured colors with a named space and an optional
      derived six-digit hex, collision stop on normalized names, the per-token conversion report.
    dropped: 'Status, media type, and file-extension details, the named report, its version, and its
      standards-body status, the bundled CLI workflow with every import and export behavior of the old
      script (the script does not exist in this repository), the DESIGN.md-to-format mapping table
      (reduced to the DESIGN.md rules), the design-tool variable mapping table (product name), the worked
      loss report (reduced to one sentence), the mode strategies (moved to theming.md), pitfalls, matrix,
      and cross-references.'
  - path: references/color/perceptual-authoring-and-tokens.md
    taken: 'The token-making procedure: establish roles and constraints, propose steps in OKLCH around
      fixed anchors, map per target, record semantic aliases, review themes; ramp-to-token mapping; the
      master and derived-rendition layer model with its rules (never replace a master with hex, never
      derive a master from a sample or export, no hand-edited generated files, art-directed renditions
      as named siblings); the file layout separating masters, aliases, and generated targets; the transform
      record (mapped versus clipped, tool and version, reviewer); pinning reviewed outputs; keeping precision
      until serialization; fallback-first CSS with @supports-gated custom properties and color-gamut-gated
      wide-gamut renditions; DESIGN.md colors as CSS strings with provenance prose and no forced hex; contrast
      on resolved target values after compositing; the hex-regression repair, condensed.'
    dropped: 'Perceptual-authoring principles already in lapis/references/color.md (notation versus editing,
      uneven HSL, chroma taper, hue drift, interpolation spaces, lightness is not contrast), which tokens.md
      only applies; CSS Lab D50 versus Oklab D65 and linear-light compositing (docs); print gamut and
      profile workflow (lapis color.md output_condition and docs); the bundled-tool boundary (script
      absent); the RGB-regression checklist (folded into the master rules and repair paragraph); illustrative
      values (replaced by computed pottery values); pitfalls, matrix, and cross-references.'
