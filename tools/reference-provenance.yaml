  - 'Checker behavior quoted in the text: the history probe''s preparation and Back presses, the name-swap
    test limited to headline, subhead, and other, navigation text only inside nav or role=navigation, the
    ux.routine-modal hit cases, stub routes matching the path alone with list returning the whole collection,
    and no probe for arrow keys or focus after a route change. Keep navigation.md in step if these change.'
  verified_2026_09_30:
  - 'Hangul width, measured in Chromium 153 on this Mac with the face actually used (CSS.getPlatformFontsForNode): a syllable
    advances 0.865 em in Apple SD Gothic Neo and Pretendard, 0.92 in Noto Sans CJK KR, 0.94 in Nanum Gothic, and 1.0 in
    Malgun Gothic and Apple Gothic, so four syllables at 12 px take 41.5 to 48 px. The text said about 1 em and about 48 px
    and now says about 0.85 to 1 em and about 41 to 48 px; 72 px per item is 360 CSS px divided by five. type.md carried the
    same one-em claim and was changed the same way.'
  - 'Spacing of compound nouns: the Hangul Orthography rules (korean.go.kr, Article 2 spaces words, Article 50 spaces technical
    terms by word in principle and allows writing them together, dictionary compounds are written together) agree with
    pick one way and keep it.'
  - 'IME in Chromium through DevTools: isComposing is true on input events during a composition, and the Enter keydown
    arrives with isComposing true before compositionend. This is one engine and an emulated IME, so the claims about
    engines differing and about keyCode 229 stay unverified, though UI Events (w3.org/TR/uievents) does define keyCode 229 for
    a key an IME is processing.'
  - 'Confirmed on 2026-09-30 by the maintainer, a native Korean reader: the Korean label conventions (nouns for
    destinations, the -하기 form for buttons, a 전체 menu or tab, 예약 내역 over 마이페이지, English labels reading as
    foreign), two to four syllables for tab labels, initial-consonant search as a habit, and messenger in-app
    browsers opening shared links with no history.'
- reference: ulm-release/references/visual-regression.md
  sources:
  - path: references/design-feedback/comparison-and-regression.md
    taken: 'A comparison asks what changed under held conditions and whether it was meant; the intended-difference
      list written before looking (the frozen comparison contract, now drawn from the plan''s mode, changed part,
      key_copy, and approved proposed_design_changes) and never widened after a result is seen; holding content,
      state, viewport, fonts, theme, motion, data, and capture method constant, with an unmatched comparison labeled
      apart instead of called before/after; comparing in layers, state identity first, then structure and protected
      parts, then pixels; the visual diff as a locator and never a quality score, with every tolerance and mask
      recording what it may hide; the classes intended, necessary consequence, noise, unexpected, regression,
      unresolved trade-off, and not verified, an unexpected difference never accepted by default; the compact
      comparison record.'
    dropped: 'Choosing among rendered alternatives and naming selection criteria (direction work for lapis and the
      critic, not the gate); the evidence labels (the findings schema''s evidence types serve); the contextual
      anti-slop layer and reasons for retained contested choices (lint and the critic); preserving artistic meaning
      (the critic''s counterfactual and world-materials tests); ranking coherent candidates, loop budgets, decision
      owners, and adopt, revert, and staged states (the maker''s loop in ultramarine); the unavailable-runtime cases
      and examples (the gate always has a render); the when-to-consult list, pitfalls, decision matrix, and
      cross-references (boilerplate).'
  - path: references/production/design-qa-and-visual-regression.md
    taken: 'Screenshot comparison detects change and never decides it; a baseline is a capture of an approved build,
      never a mockup; the deterministic capture conditions (engine, platform, viewport and pixel ratio, fonts, theme
      and motion, data, clock and random values, readiness, animation point) split into what render check fixes and
      what the user must hold; no universal pixel threshold, tolerances set from measured noise per region and never
      raised until a regression disappears; scoping to the meaningful region; masking only true nondeterminism, the
      smallest region, with its reason and what it could hide, and never the task''s risk; the volatility table
      turned into hold-at-the-source-first; a baseline update as a design decision, never bulk-accepted; coverage by
      width and theme starting where layout changes; Hangul fallback and line breaking as comparison hazards; a pixel
      match proving nothing about keyboard, semantics, or behavior.'
    dropped: 'The named visual-testing tools, their API sample, and their cross-host rendering advice (product names
      and vendor setup); the QA contract form (the plan and GATE.md hold it); the evidence hierarchy (the findings
      schema); the runtime-path procedure, the accessibility list, and the unstyled-card advice (behavior check
      probes); independent review (the critic in ultramarine); the manual QA categories (lint rules and the critic);
      pseudo-localization, RTL, and translation review (the later i18n reference and lps-copy); source-only review
      without a runtime (the gate always has a render); the P0 to P3 finding form (finding.schema.yaml); the checkout
      worked example; pitfalls, matrix, and cross-references (boilerplate).'
  external:
  - kind: practice
    name: Screenshot-baseline visual testing with per-snapshot tolerances, masks, and reviewed baseline updates
      (Playwright toHaveScreenshot, Chromatic, and Percy, named in the source)
    used_for: The noise run, per-region tolerances, masks, and replacing a baseline only after acceptance
  - kind: method
    name: DCT perceptual image hashing (pHash family), as render check computes media.phash
    used_for: Comparing images by differing bits; the 6-of-64 line comes from rights_check.py
  - kind: method
    name: MinHash similarity estimation (Broder), keyed as in cli/lapis_design/text_sig.py
    used_for: Viewport text_sig as a copy-change estimate
  - kind: measurement
    name: OKLab color difference (Ottosson), as the repository's delta_e_ok computes it
    used_for: The same-token line of 0.02 taken from system.literal-color
  - kind: standard
    name: WCAG 2.2 SC 1.4.10 Reflow
    used_for: Comparing 320 first; horizontal page scroll as a requirement regression
  - kind: standard
    name: CSS Text Module Level 3 word-break keep-all; the HTML lang attribute and :lang() font selection
    used_for: Korean text in comparisons
  skill_body_pointer: The gate never compares the render with an earlier build. When the task has a baseline, a
    `.lapis/renders/<task>-before.json` capture of the build that last shipped or was approved, compare the shipping
    render with it once the full set has run, and report the differences the plan does not explain right after the
    verdict; `references/visual-regression.md` says how.
  left_for_later:
  - 'lapis and the critic: choosing among rendered alternatives, the selection criteria, and the rejection record
    (the "Select a direction" section of comparison-and-regression has no other destination in the map).'
  - 'ultramarine: the bounded repair loop, decision owners, adopt and revert states, and the independent-review scope
    (bounded-closed-loop.md and inspection-and-evidence.md, still todo).'
  - 'i18n reference and lps-copy: pseudo-localization stress, RTL mirroring, locale formats, translation review.'
  - 'Contracts: a baseline input, a comparison record, and the capture environment in the extract (contract
    proposals recorded in the 2026-09-29 cloud review).'
  verify_before_release:
  - Late unicode-range subset loads on slower networks and for large Korean web fonts other than the one tested.
  - 'Checker behavior quoted in the text: running-index screenshot names and a shots folder that is never emptied;
    the browser_chrome capture laid out at 844 px and derived at 664 px; dark detection on html, body, and the first
    four sections at 390; archetype cues scaled by viewport height; the gate blocking a missing dark capture when
    the extract records a dark theme or the plan lists dark; render findings merging captures (location.viewport
    the first, observed ending with the capture list); the reference rules skipping a render
    extract given as --ref. Keep visual-regression.md in step if render check, the gate, lint, or the schemas change.'
  verified_2026_09_30:
  - 'Two captures of one build: tests/fixtures/render/kiln-shop served on loopback, lapis-design render check run twice on
    this Mac (Chromium 153.0.8010.12): all nine screenshots are byte-identical and the extracts are equal apart from the task
    name and generated_at. The page has no dynamic content, so this shows rasterization determinism only.'
  - 'Late subset loads: a page using Google Fonts Noto Sans KR (many unicode-range files, plus a paragraph of rare syllables)
    was captured at all six widths; every text run reports Noto Sans KR as rendered, fallback false. One run, one network.'
  - 'Korean keep-all in Chromium 153: with word-break: keep-all and overflow-wrap normal, lines broke only at spaces, before an
    opening bracket, and after a percent sign; Hangul next to Latin letters and numerals never broke. With overflow-wrap:
    anywhere, a unit wider than the column broke between any characters, Hangul and Latin included.'
  - 'The 6-of-64-bit line, calibrated on six real photographs (Wikimedia Commons) with the repository''s own phash at a
    displayed 480x320: JPEG quality 95 to 30, WebP quality 80 and 40, and downscaling to a half, a quarter, and a tenth all
    differ by 0 bits; JPEG quality 10 reaches 4 and a 64-color palette 2; a crop of 2 percent from each edge reaches 6, 5
    percent reaches 8 to 12, 10 percent 18 to 24, and a mirror 24 to 34; two different photographs differ by at least 28 bits.
    So 6 keeps resized and re-encoded copies, and a crop of about 2 percent per edge, as the same image; any larger recrop
    reads as a different image. The text claims resized or re-encoded only.'
  - 'A changed lang selecting other glyph forms: 直骨令海 in generic sans-serif renders differently under ja, zh-Hans, zh-Hant, and ko,
    and :lang() font-family rules apply.'
