  - 'Backlog (lzl-fonts): an evidence line or filter for full 11,172-syllable Hangul coverage.'
  - 'Backlog (rules): whether premium-serif should name high-contrast bu-ri display explicitly.'
  - 'Backlog (rules): a render-layer requirement rule for text spacing overrides.'
- reference: lapis/references/color.md
  sources:
  - path: references/color/palette-art-direction.md
    taken: six axes and what each answer must cover; tone translated into lightness, chroma, relation,
      dominance, hierarchy, and edge variables; role buckets; relation names; content stances; build candidates
      from roles, one variable at a time; four separate judgments (harmony, preference, figure-ground,
      discrimination); visual weight from area, repetition, edges, type, and isolation; concrete rejection
      reasons
    dropped: 'snapshot note, when-to-consult, research citations and their caveats, the evidence-class
      table (replaced by decision statuses and vocab value_source_classes), worked checks and expressive
      counterexamples, the validation-view list, the decision-record template (replaced by schema tokens.color),
      pitfalls, and cross-references: background, boilerplate, or superseded by contracts'
  - path: references/color/perceptual-authoring-and-tokens.md
    taken: notation alone changes nothing; OKLCH pays off when editing; HSL lightness is uneven; taper
      chroma near the gamut edge; hold hue with small art-directed moves; Oklab through neutrals, OKLCH
      with a stated hue path; clipping is not mapping; OKLCH L is not contrast; approved sources stay
      exact; the OKLCH master is never replaced by its hex fallback
    dropped: layer model, token file layout, DTCG and DESIGN.md serialization, fallback-first CSS, per-target
      gamut records, the regression checklist, and the worked hex-master repair (all for lps-system);
      CSS Lab D50 versus Oklab D65 and linear-light compositing (docs); the bundled-tool boundary (that
      script does not exist in the new repo)
  - path: references/color/semantic-and-data-palettes.md
    taken: status families (foreground, container, solid only when justified); status meaning survives
      without hue; domain semantics over universal red and green; choosing the scale from data meaning;
      per-scale build rules; missing is not zero or midpoint; midpoint must mean something; dark-theme
      re-evaluation of scales; chart selection by outline; redundant encodings and simulation as diagnostic
      only
    dropped: 'token namespaces and the property/role/variant/state model, gradient token families, class
      and interpolation records, legends, bivariate color, the handoff YAML, and worked examples: token
      mechanics for lps-system and chart construction for the data-viz merge group'
  - path: references/color/color-systems-and-standards.md
    taken: code, physical sample, numeric value, and digital encoding are different records; a nearest
      match is never an identity; no universal crosswalk between systems; two masters (physical and screen)
      kept side by side; finish, substrate, lighting, and effect finishes limit any flat value; source
      classes mapped onto vocab value_source_classes
    dropped: 'per-system notation details (RAL collections, NCS nuance and hue, Munsell H V/C), the ICC
      handoff chain, the full handoff record, and provider links: they belong to lzl-color and docs per
      tools/migration-map.yaml, and color.md reaches them only through lazuli color lookup'
  - path: references/fundamentals/color.md
    taken: 'requirement facts only: text and non-text contrast minimums, the large-text definition, unrounded
      ratios; the dark-theme checklist agrees with color.md'
    dropped: 'role table with a platform-system analogy, palette-building order, the advisory contrast-model
      note, gradient policy (kept as one line on gradients needing a job), and the ownership table: SKILL.md
      basics or boundary material'
  - path: assets/color-and-contrast-cheatsheet.md
    taken: the enhanced-level values (7:1, 4.5:1 large); everything else duplicated the files above
    dropped: calculator commands and computed example pairs (the script is not in the new repo), lookup
      routes, the decision-record template, failure list
  - path: references/design-systems/theming-and-dark-mode.md
    taken: order of re-decisions for a dark theme; high contrast is not a saturated dark theme; never
      opt out of forced colors globally; boundaries must not rely on background images
    dropped: 'preference precedence, first-paint handling, color-scheme and native controls, multi-brand
      architecture, mode delivery across formats: theming mechanics for lps-system'
  - path: references/color/color-spaces-and-management.md
    taken: clip versus gamut-map distinction; translucent colors are measured after compositing on every
      backdrop
    dropped: 'CSS color forms, light-dark(), color-mix(), encoded versus linear RGB, sampling ladder,
      canvas: implementation and docs material, nothing further belongs in color.md'
  - path: references/color/profiles-and-output-conditions.md
    taken: do not guess a print profile; ask the printer; keep the master and let the print workflow convert;
