- reference: lapis/references/layout.md
  sources:
  - path: references/layout/layout-decision-procedure.md
    taken: 'The nine steps in order and what each decides: inventory of real items with length ranges and states;
      priority by task and consequence, with an unresolved tie sent back to the brief; surface mode per screen with
      its layout emphasis and first question; reading order written before columns, with source, focus, and visual
      order agreeing; relation before container, the relation-structure-boundary table, and boundaries as alternatives
      rather than a ladder; the simplest archetype, combined only at a clear boundary; grid as coordination with
      shared alignment lines and a narrower reading measure; per-region responsive transformations with no content
      removed at a width; density set from the dial, then verification. Also: change composition only when the relation
      changes; modules only for real modules; repeated structure for repeated data.'
    dropped: 'The task-shape archetype table, the pricing worked example, the hero rules of thumb, and the quick
      decision matrix: archetype and section material for references/archetypes.md. The named government and vendor
      design-system conventions (product names), the deliverable template (replaced by the plan fields), and the
      pitfalls and cross-references (boilerplate).'
  - path: references/fundamentals/spacing-and-grids.md
