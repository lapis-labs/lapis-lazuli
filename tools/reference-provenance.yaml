  - 'Proposed decision changes, content left out because no plan field or check reads it: evidence-class and art-status discussion; study, trial, and discard record formats; haptics and sound; contribution and co-production governance (ownership, persistence, moderation); cultural and ritual pacing authority; point, line, and plane vocabulary. Each needs a field or a check before it can enter a generating reference.'
