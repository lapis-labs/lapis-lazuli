  - 'Plan fields were read in plan/schema.yaml: direction (concept, levers, dials, read.surface_mode), tokens.type.scale, tokens.surface.treatments (name and job required, where), tokens.shape.rule, tokens.motion.principles, layout.procedure fields, layout.sections, layout.signature, brief.constraints and brief.locales, claims.proposed.'
  - 'Rule readings were checked in rules.yaml, detectors.yaml, and the detector code: layout.unanchored-lever (lint/detectors/copy.py plan-anchored-text), type.flat-hierarchy and type.oversized-display (render_type.py type_hierarchy: oversized reads display-role runs only), layout.card-everything and layout.monotonous-spacing and layout.zigzag and layout.equal-siblings and layout.symmetry-excess (render_layout.py), surface.decorative-grid-texture and surface.glass-everywhere (render_visual.py surface_effects and the source-pattern detector), type.caps-prose (text-metrics with no role filter), type.costume-monospace (plan roles display, heading, body, ui through the lazuli database), layout.missing-signature (plan-missing in create mode; render derived.py marked element or plan signature text as not-verified), the behavior rules, and the rights rules through the asset ledger.'
  - 'The critic stages named in the reference (counterfactual test, world materials trace, vision check) were read in agents/critic.md.'
  verified_2026_10_02:
  - 'Read-only source drift comparison: all snapshot files unchanged. Lowercase alphanumeric plus Hangul token comparison, code blocks included, against every original Markdown file found no shared seven-token run.'
  - 'Length: 2664 words by wc -w including table punctuation and 2437 without table pipes, against about 2350 in the outline. Examples span a ferry timetable, a seed library, and a lighthouse museum; neither demonstration subject appears.'
  - 'The four example levers were run through the plan-anchored-text detector with their stated materials and none was reported.'
