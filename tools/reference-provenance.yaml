- reference: lps-system/references/theming.md
  sources:
  - path: references/design-systems/theming-and-dark-mode.md
    taken: 'A theme as a coherent reassignment of semantic roles; mode, brand, and preference kept apart;
      no dark flags, media queries, or literals inside components; the role-pair contract before values
      and no pairing inferred from names; only the roles the product uses; fixed primitives versus adaptive
      scales, never combined without deterministic tooling and never called primitives; the precedence
      contract; storing the setting, following system changes, never overriding an explicit choice; first-paint
      strategies, no palette animation on first resolution, no silenced hydration warnings; color-scheme
      for native controls; theme-color, selection, caret, autofill, native controls, and embedded content;
      the asset table, condensed; never inverting rasters; forced colors (boundaries not carried by background
      images, currentColor icons, no global opt-out, a product high-contrast theme supplements forced colors);
      what varies by brand and what stays shared; a brand needing different anatomy is an extension; named
      supported combinations instead of every combination; modes across DESIGN.md and the interchange
      format; keeping collection and mode identity across imports; the mode-safe component contract; the
      dark action retune worked example.'
    dropped: 'Snapshot note, when-to-consult, the dark-palette order of re-decisions (already in lapis/references/color.md),
      the example surface ladder CSS with a named brand and hex values, the utility-framework bridge row and
      the bundled export commands (product name; script absent), the two-brand account console worked example
