    dropped: The stance that keep-all is optional for Korean (the contract requires it), the worked HTML
      and CSS article, the diagnostic flow, QA specimen strings, and rendered-font inspection steps.
  - path: references/typography/paragraphs-and-reading.md
    taken: Setting measure by reading (narrow, widen, choose), leading depending on size, x-height, measure,
      and script, paragraph versus section spacing, more space above headings than below, indent or gap,
      no manual line breaks.
    dropped: 'The meaning-versus-typesetting passes, frontloaded headings, lists, quotations, links, footnotes,
      tables, long-form navigation, and the policy worked example: content design and layout topics owned
