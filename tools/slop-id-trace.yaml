    10:
      signal: Only one theme variable customized
      rules:
      - color.palette-swap-only
    11:
      signal: No dark-mode contrast check
      rules:
      - color.text-contrast
    12:
      signal: Hydration-unsafe time-dependent content
      rules:
      - code.locale-time-rendering
    13:
